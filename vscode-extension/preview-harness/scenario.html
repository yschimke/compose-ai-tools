<!doctype html>
<html lang="en" data-vscode-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Compose Preview — scenario</title>

        <!-- Match the live webview's chrome: codicons, the panel CSS, and the
             VS Code theme tokens it depends on. preview.css ships with the
             extension under `media/`; the harness loads it via a relative
             path so we never diverge from production. -->
        <link rel="stylesheet" href="../media/codicon.css" />
        <link rel="stylesheet" href="./vscode-theme.css" />
        <link rel="stylesheet" href="../media/preview.css" />

        <!-- The shim must run before preview.js loads, so getVsCodeApi()
             finds window.acquireVsCodeApi on its first call. -->
        <script src="./vscode-api.js"></script>
    </head>
    <body>
        <!-- Boot sequence:
             1. Fetch the fixture.
             2. Inject `<preview-app>` with its dataset already stamped, so
                Lit's `firstUpdated` reads the intended boot flags (without
                this, `data-collapse-variants` defaults to true and only the
                first variant of each function renders).
             3. Inject `preview.js`. The bundle's `customElements.define`
                upgrades the existing `<preview-app>` instance, which then
                runs `firstUpdated` and attaches the window-message listener.
             4. After the element's first render settles, replay each fixture
                message via `window.postMessage` exactly as VS Code does. -->
        <script type="module">
            const params = new URLSearchParams(location.search);
            const fixture = params.get("fixture") ?? "grid-default";
            const theme = params.get("theme") ?? "dark";
            document.documentElement.dataset.vscodeTheme = theme;

            const harness = (window.__composePreviewHarness ??= {});
            harness.fixture = fixture;
            harness.ready = false;

            async function loadScript(src) {
                return new Promise((res, rej) => {
                    const s = document.createElement("script");
                    s.src = src;
                    s.onload = res;
                    s.onerror = () => rej(new Error("failed to load " + src));
                    document.body.appendChild(s);
                });
            }

            async function run() {
                const res = await fetch(`./fixtures/${fixture}.json`, {
                    cache: "no-store",
                });
                if (!res.ok) {
                    document.body.textContent = `fixture not found: ${fixture}`;
                    return;
                }
                const data = await res.json();
                harness.fixtureData = data;

                const app = document.createElement("preview-app");
                for (const [k, v] of Object.entries(data.dataset ?? {})) {
                    app.dataset[k] = v;
                }
                document.body.appendChild(app);

                await loadScript("../media/webview/preview.js");
                await customElements.whenDefined("preview-app");
                await app.updateComplete;

                for (const msg of data.messages ?? []) {
                    window.postMessage(msg, "*");
                }
                // Simulate the preview daemon coming up. In a real
                // session VS Code posts `setInteractiveAvailability`
                // once the focused module's daemon is ready; the bundle
                // chip bar (and the focus toolbar's Interactive /
                // Recording buttons) gate on that signal. Without it
                // every chip paints disabled, so a fixture's chip-
                // activation action can't fire the toggle and the data
                // tab it would open never mounts — the snapshot then
                // hangs on the unreachable row click. Derive the module
                // id(s) from the replayed `setPreviews` so readiness
                // lands on the module the manifest declared; fall back
                // to a synthetic id for fixtures with no `moduleDir`.
                const readyModules = new Set();
                for (const msg of data.messages ?? []) {
                    if (msg?.command === "setPreviews" && msg.moduleDir) {
                        readyModules.add(msg.moduleDir);
                    }
                }
                if (readyModules.size === 0) {
                    readyModules.add("preview-harness");
                }
                for (const moduleId of readyModules) {
                    window.postMessage(
                        {
                            command: "setInteractiveAvailability",
                            moduleId,
                            ready: true,
                            interactiveSupported: true,
                        },
                        "*",
                    );
                }
                await settle();

                // After the manifest has rendered, replay user-style
                // interactions — clicking a card's focus button, a
                // bundle chip, a filter toolbar option, etc. Each
                // action targets the panel's light DOM by CSS
                // selector so fixtures don't have to know about the
                // controller graph behind the elements.
                for (const action of data.actions ?? []) {
                    await runAction(action);
                    await settle();
                }

                harness.ready = true;
            }

            async function settle() {
                // postMessage / click handlers post microtasks then
                // Lit re-renders on rAF. Two rAFs is enough for the
                // dispatcher's downstream paths to land DOM.
                await new Promise((r) => requestAnimationFrame(r));
                await new Promise((r) => requestAnimationFrame(r));
                const imgs = Array.from(
                    document.querySelectorAll(".preview-card img"),
                );
                await Promise.all(
                    imgs.map((img) =>
                        // `complete` is true once the browser has
                        // either decoded the bytes or given up
                        // (naturalWidth = 0 on error). Either way
                        // there is nothing left to wait on — gating
                        // on `naturalWidth > 0` would hang on cards
                        // whose `<img src="renders/foo.png">` 404s
                        // because the harness server doesn't ship
                        // those files.
                        img.complete
                            ? Promise.resolve()
                            : new Promise((r) => {
                                  img.addEventListener("load", r, {
                                      once: true,
                                  });
                                  img.addEventListener("error", r, {
                                      once: true,
                                  });
                              }),
                    ),
                );
                // Wait for any in-flight CSS animations (the `fadeIn`
                // on freshly-painted preview <img>s, chip / tab
                // transitions, etc.) to settle so the screenshot
                // isn't a mid-frame grab. Skip infinite animations
                // (the skeleton shimmer on cards that haven't
                // received an `updateImage` runs forever, and
                // `.finished` would never resolve).
                if (typeof document.getAnimations === "function") {
                    const finite = document.getAnimations().filter((a) => {
                        const t = a.effect?.getTiming?.();
                        return t && t.iterations !== Infinity;
                    });
                    await Promise.all(
                        finite.map((a) => a.finished.catch(() => {})),
                    );
                }
            }

            async function runAction(action) {
                if (action.click) {
                    const el = document.querySelector(action.click);
                    if (!el) {
                        throw new Error(
                            "click: selector matched no element: " +
                                action.click,
                        );
                    }
                    el.click();
                    return;
                }
                throw new Error("unknown action: " + JSON.stringify(action));
            }

            run().catch((err) => {
                console.error(err);
                document.body.textContent = String(err);
            });
        </script>
    </body>
</html>
