<!doctype html>
<html lang="en" data-vscode-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Compose Preview — scenario</title>

        <!-- Match the live webview's chrome: codicons, the panel CSS, and the
             VS Code theme tokens it depends on. preview.css ships with the
             extension under `media/`; the harness loads it via a relative
             path so we never diverge from production. -->
        <link rel="stylesheet" href="../media/codicon.css" />
        <link rel="stylesheet" href="./vscode-theme.css" />
        <link rel="stylesheet" href="../media/preview.css" />
        <!-- Extra per-fixture stylesheets (e.g. the font browser's
             media/fonts.css) are appended at boot from the fixture's
             `styles` array, so a non-preview app can bring its own CSS
             without this page hard-coding every panel's sheet. -->

        <!-- The shim must run before preview.js loads, so getVsCodeApi()
             finds window.acquireVsCodeApi on its first call. -->
        <script src="./vscode-api.js"></script>
    </head>
    <body>
        <!-- Boot sequence:
             1. Fetch the fixture.
             2. Inject `<preview-app>` with its dataset already stamped, so
                Lit's `firstUpdated` reads the intended boot flags (without
                this, `data-collapse-variants` defaults to true and only the
                first variant of each function renders).
             3. Inject `preview.js`. The bundle's `customElements.define`
                upgrades the existing `<preview-app>` instance, which then
                runs `firstUpdated` and attaches the window-message listener.
             4. After the element's first render settles, replay each fixture
                message via `window.postMessage` exactly as VS Code does. -->
        <script type="module">
            const params = new URLSearchParams(location.search);
            const fixture = params.get("fixture") ?? "grid-default";
            const theme = params.get("theme") ?? "dark";
            document.documentElement.dataset.vscodeTheme = theme;

            // When Playwright drives the page (`?driver=playwright`) it
            // boots the bundle here but replays the fixture's `actions`
            // itself via locators (auto-waiting, better failures) and
            // owns the screenshot/log read. The page stops at `booted`.
            // Opened any other way — the manual `index.html` iframes, a
            // hand-typed URL — the page runs the whole flow itself
            // (actions + settle) so the static preview still shows the
            // post-action state.
            const pwDriven = params.get("driver") === "playwright";

            const harness = (window.__composePreviewHarness ??= {});
            harness.fixture = fixture;
            harness.booted = false;
            harness.ready = false;
            // Exposed so the Playwright drive can flush DOM between
            // locator clicks without re-deriving the rAF/img settle.
            harness.settle = settle;

            async function loadScript(src) {
                return new Promise((res, rej) => {
                    const s = document.createElement("script");
                    s.src = src;
                    s.onload = res;
                    s.onerror = () => rej(new Error("failed to load " + src));
                    document.body.appendChild(s);
                });
            }

            async function run() {
                const res = await fetch(`./fixtures/${fixture}.json`, {
                    cache: "no-store",
                });
                if (!res.ok) {
                    document.body.textContent = `fixture not found: ${fixture}`;
                    return;
                }
                const data = await res.json();
                harness.fixtureData = data;

                // App/bundle/styles are fixture-driven so non-preview
                // panels (e.g. the Google Fonts browser's
                // `<font-browser-app>` from `fonts.js`) can be captured
                // through the same loop. Defaults keep every existing
                // preview-app fixture working untouched.
                const appTag = data.app ?? "preview-app";
                const bundle = data.bundle ?? "../media/webview/preview.js";
                // Await each fixture stylesheet before rendering — a
                // dynamically inserted <link> doesn't block this module
                // script, so without this the screenshot can race a
                // still-loading sheet (e.g. media/fonts.css) and capture
                // unstyled chrome. Resolve on error too so an offline /
                // 404 sheet doesn't hang the harness.
                await Promise.all(
                    (data.styles ?? []).map(
                        (href) =>
                            new Promise((res) => {
                                const link = document.createElement("link");
                                link.rel = "stylesheet";
                                link.href = href;
                                link.onload = res;
                                link.onerror = res;
                                document.head.appendChild(link);
                            }),
                    ),
                );

                const app = document.createElement(appTag);
                for (const [k, v] of Object.entries(data.dataset ?? {})) {
                    app.dataset[k] = v;
                }
                document.body.appendChild(app);

                await loadScript(bundle);
                await customElements.whenDefined(appTag);
                await app.updateComplete;

                for (const msg of data.messages ?? []) {
                    window.postMessage(msg, "*");
                }
                // Simulate the preview daemon coming up. In a real
                // session VS Code posts `setInteractiveAvailability`
                // once the focused module's daemon is ready; the bundle
                // chip bar (and the focus toolbar's Interactive /
                // Recording buttons) gate on that signal. Without it
                // every chip paints disabled, so a fixture's chip-
                // activation action can't fire the toggle and the data
                // tab it would open never mounts — the snapshot then
                // hangs on the unreachable row click. Derive the module
                // id(s) from the replayed `setPreviews` so readiness
                // lands on the module the manifest declared; fall back
                // to a synthetic id for fixtures with no `moduleDir`.
                const readyModules = new Set();
                for (const msg of data.messages ?? []) {
                    if (msg?.command === "setPreviews" && msg.moduleDir) {
                        readyModules.add(msg.moduleDir);
                    }
                }
                if (readyModules.size === 0) {
                    readyModules.add("preview-harness");
                }
                for (const moduleId of readyModules) {
                    window.postMessage(
                        {
                            command: "setInteractiveAvailability",
                            moduleId,
                            ready: true,
                            interactiveSupported: true,
                        },
                        "*",
                    );
                }
                await settle();

                // Bundle is up and the manifest has rendered. Under
                // Playwright this is the handoff point — the spec replays
                // `actions` via locators and captures from here.
                harness.booted = true;
                if (pwDriven) return;

                // Manual / iframe view: replay user-style interactions
                // ourselves — clicking a card's focus button, a bundle
                // chip, a filter toolbar option, etc. Each action targets
                // the panel's light DOM by CSS selector so fixtures don't
                // have to know about the controller graph behind the
                // elements.
                for (const action of data.actions ?? []) {
                    await runAction(action);
                    await settle();
                }

                // Optional fixed settle for surfaces the rAF/img settle
                // can't observe — e.g. the 3D `<spatial-view>` loads its
                // quad textures through three.js's own image loader, not
                // `.preview-card img`, so a WebGL fixture sets `settleMs`
                // to give those a beat to decode before the screenshot.
                if (data.settleMs) {
                    await new Promise((r) => setTimeout(r, data.settleMs));
                }

                harness.ready = true;
            }

            async function settle() {
                // postMessage / click handlers post microtasks then
                // Lit re-renders on rAF. Two rAFs is enough for the
                // dispatcher's downstream paths to land DOM.
                await new Promise((r) => requestAnimationFrame(r));
                await new Promise((r) => requestAnimationFrame(r));
                const imgs = Array.from(
                    document.querySelectorAll(".preview-card img"),
                );
                await Promise.all(
                    imgs.map((img) =>
                        // `complete` is true once the browser has
                        // either decoded the bytes or given up
                        // (naturalWidth = 0 on error). Either way
                        // there is nothing left to wait on — gating
                        // on `naturalWidth > 0` would hang on cards
                        // whose `<img src="renders/foo.png">` 404s
                        // because the harness server doesn't ship
                        // those files.
                        img.complete
                            ? Promise.resolve()
                            : new Promise((r) => {
                                  img.addEventListener("load", r, {
                                      once: true,
                                  });
                                  img.addEventListener("error", r, {
                                      once: true,
                                  });
                              }),
                    ),
                );
                // CSS-animation settling used to live here (await every
                // finite animation's `.finished`, skip infinite ones).
                // The snapshot spec now captures with Playwright's
                // `animations: "disabled"`, which freezes every animation
                // — finite and infinite — at capture, so there's nothing
                // left to wait on. The manual iframe view shows live
                // animation, which is fine for a human eyeballing it.
            }

            async function runAction(action) {
                if (action.click) {
                    const el = document.querySelector(action.click);
                    if (!el) {
                        throw new Error(
                            "click: selector matched no element: " +
                                action.click,
                        );
                    }
                    el.click();
                    return;
                }
                throw new Error("unknown action: " + JSON.stringify(action));
            }

            run().catch((err) => {
                console.error(err);
                document.body.textContent = String(err);
            });
        </script>
    </body>
</html>
