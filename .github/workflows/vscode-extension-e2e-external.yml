name: VS Code Extension E2E (external consumer)

# Companion to `vscode-extension-e2e.yml`. That workflow drives the
# extension against `:samples:cmp` / `:samples:wear`, both wired via
# `includeBuild("gradle-plugin")` — the dev-loop path. This workflow drives
# the extension against `yschimke/Confetti` — a public fork of
# joreilly/Confetti kept in lockstep with upstream that declares the
# `composeai.preview` alias on the tested modules (tracking `main`, override
# repo/ref via `EXTERNAL_REPO_URL` / `EXTERNAL_REPO_REF`), with the plugin
# resolved through the consumer's `gradle/libs.versions.toml` against the local
# SNAPSHOT just `publishToMavenLocal`'d. That closes the published-
# plugin-coordinate gap: the in-repo suite can't catch regressions where the
# plugin works fine via `includeBuild` but fails as a published artifact
# against a real KMP/AGP/Compose classpath.
#
# Cost: a cold run is multi-tens of minutes (Confetti's Apollo codegen and
# KMP target setup alone take 2-5 min before any compose-preview task
# runs). Not on PRs.
#
# Triggers:
#   workflow_dispatch — manual one-off runs (any branch). Bump the
#                       Confetti SHA or the plugin version here when
#                       investigating a regression.
#   push (main)       — runs on every merge to main so regressions in the
#                       published-plugin path surface against the commit
#                       that introduced them, not at the next cron tick.
#                       Mirrors how `vscode-extension-e2e.yml` is wired.
#   schedule          — weekly, Sundays 06:00 UTC. Picks up drift in
#                       Confetti's transitive deps + our own renderer
#                       compat with the latest published consumer code.

on:
  workflow_dispatch:
    inputs:
      confetti_ref:
        description: "Confetti git SHA / branch / tag (defaults to `main`; see setup-external-e2e.sh)"
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  # Push-to-main runs collapse onto a single in-flight slot keyed on the
  # branch — a newer commit cancels the in-flight run so only the latest
  # SHA is exercised. Manual dispatches and scheduled runs get their own
  # slot via run_id so they don't fight with each other or with the
  # push-driven flow.
  group: vscode-extension-e2e-external-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e-external:
    name: VS Code Extension E2E (Confetti, published plugin)
    runs-on: ubuntu-latest
    # 90 minutes ceiling — Confetti's cold configuration alone can be
    # 5-10 min on a fresh CI runner before any compose-preview task
    # touches the daemon. The mocha suite's own per-`it` ceiling
    # (`this.timeout(30 * 60_000)`) trips first on a wedge.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Same caches as vscode-extension-e2e.yml — the VS Code download is
      # the larger of the two, and on a cron-driven schedule the cache key
      # is usually a hit since the OS doesn't change.
      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-electron-${{ runner.os }}

      # Publish the plugin + every supporting module to mavenLocal so
      # the consumer's catalog resolves to *this* commit, not the
      # already-released coordinate Maven Central serves.
      #
      # The root `./gradlew publishToMavenLocal` fans out across every
      # *outer-build* module the `composeai.maven-publishing` convention
      # plugin applies to (preview-annotations, preview-data-api,
      # renderer-desktop, the data-* runtimes, etc.) — but `:gradle-plugin`
      # itself is wired into the outer build via `includeBuild("gradle-plugin")`,
      # and task-name fan-out does NOT cross composite-build boundaries.
      # So a plain `publishToMavenLocal` from the root leaves Maven Central
      # to serve the *released* plugin coordinate, against which the
      # consumer-resolved catalog rewrite — pointing at the about-to-publish
      # SNAPSHOT — can't resolve. The Confetti `composePreviewApplied`
      # warmup then fails with:
      #   Plugin [id: 'ee.schimke.composeai.preview', version: '<X>-SNAPSHOT']
      #     was not found in any of the following sources
      # Drive the included build's own `publishToMavenLocal` task explicitly
      # via `-p gradle-plugin` so its build script's fan-out
      # (`:preview-discovery` + `:daemon-launch-builder`) runs too.
      - name: Publish plugin to mavenLocal
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          ./gradlew -p gradle-plugin publishToMavenLocal --no-daemon

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      # Prepare the external workspace: clone Confetti at `main` (or the
      # `EXTERNAL_REPO_REF` workflow_dispatch override), rewrite its
      # catalog to point at the SNAPSHOT we just published, seed
      # local.properties with the runner's Android SDK path. Stdout is the
      # prepared workspace path — capture it and forward to the test runner.
      - name: Prepare external workspace (Confetti)
        id: prepare
        env:
          EXTERNAL_REPO_REF: ${{ inputs.confetti_ref }}
        run: |
          workspace=$(vscode-extension/scripts/setup-external-e2e.sh \
            "${RUNNER_TEMP}/compose-preview-external-e2e")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "[workflow] prepared external workspace at $workspace"

      - name: Run external-consumer e2e under xvfb
        working-directory: vscode-extension
        env:
          COMPOSE_PREVIEW_E2E_WORKSPACE: ${{ steps.prepare.outputs.workspace }}
        # `tee` so the bench-extraction step below has a file to grep, while
        # the live workflow log still gets the full stream for debugging.
        # `set -o pipefail` propagates a mocha failure through tee — without
        # it tee's success would mask the real exit code and the workflow
        # would go green on a broken suite.
        run: |
          set -o pipefail
          xvfb-run -a npm run test:e2e-external 2>&1 | tee "${RUNNER_TEMP}/e2e-external.log"

      # Extract the single-line `[bench] {...}` JSON record the suite emits
      # at end-of-`it` into a standalone artifact so a downstream comparator
      # (rolling median, threshold alert, gh-pages chart) can consume it
      # without parsing mocha's stdout. `if: always()` so a soft failure
      # still publishes whatever phases completed — useful when warm
      # finishes but the post-warm render times out.
      - name: Extract bench timings
        if: always()
        run: |
          log="${RUNNER_TEMP}/e2e-external.log"
          out="${RUNNER_TEMP}/bench-result.json"
          if [[ ! -f "$log" ]]; then
            echo "[bench-extract] no log file at $log — suite did not start"
            exit 0
          fi
          # Pick the last `[bench] ` line to handle a future multi-`it`
          # expansion gracefully; today there's exactly one. `|| true` so
          # a missing line on a soft failure doesn't break the workflow.
          line=$(grep -E '^\[bench\] ' "$log" | tail -n 1 || true)
          if [[ -z "$line" ]]; then
            echo "[bench-extract] no [bench] line in log — suite aborted before bench emit"
            exit 0
          fi
          printf '%s\n' "${line#\[bench\] }" > "$out"
          echo "[bench-extract] wrote $out:"
          cat "$out"

      - name: Upload bench result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-external-bench
          path: ${{ runner.temp }}/bench-result.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload renders + daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-external-renders
          path: |
            ${{ steps.prepare.outputs.workspace }}/androidApp/build/compose-previews/
            ${{ steps.prepare.outputs.workspace }}/shared/build/compose-previews/
            ${{ steps.prepare.outputs.workspace }}/wearApp/build/compose-previews/
            vscode-extension/.vscode-test/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
