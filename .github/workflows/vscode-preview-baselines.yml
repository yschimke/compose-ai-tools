name: VS Code Preview Baselines

# Mirrors the baseline path of `compose-preview.yml` but for the VS
# Code panel's `preview-harness` (every fixture × dark/light theme).
# Pushes the rendered PNGs + baselines.json to `vscode-preview/main`
# so the branch is browsable on GitHub and serves as the "before"
# state for `vscode-preview-comment.yml` on PRs.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/actions/vscode-preview-baselines/**'
      - '.github/actions/vscode-preview-comment/**'
      - '.github/actions/lib/vscode-preview-diff.py'
      - '.github/workflows/vscode-preview-baselines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-preview-baselines
  cancel-in-progress: true

jobs:
  update:
    name: Update vscode-preview/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The composite action pushes via an explicit token in the
          # remote URL (see `vscode-preview-baselines/action.yml`), so we
          # don't need the default git credentials persisted here.
          persist-credentials: false
      - uses: ./.github/actions/vscode-preview-baselines
