# End-to-end proof that every render lane of a live `compose-preview serve` honors
# a named-knob override. Boots a daemon-backed serve the same way preview.coo.ee
# runs (a Trusted --catalogs system live-rendered from its carried liveBundle) and
# drives it in Chromium via preview-harness/serve-lanes.spec.mjs: PNG re-render,
# SVG override text in the vector, the Live /ws/ WebSocket frame lane, and the
# in-browser Wasm tier — each asserted to actually change output when a knob flips.
#
# This closes the gap where the viewer's knob wiring was only checked structurally
# (ServeWebFixtureTest) and the /ws/ lane had no coverage at all — it's the guard
# that would have caught the compose/figma-svg SVG-override regression and the
# Caddy WebSocket break.
#
# Two jobs, one per render backend:
#   * `serve-lanes`         — the desktop CMP/Skiko daemon, live-rendering the fetched
#                             `compose-m3` catalog.
#   * `serve-lanes-android` — the Robolectric daemon, live-rendering a locally packed
#                             `:samples:android-live-lane` bundle whose manifest names an
#                             `Application` the render classpath doesn't carry (#2675 / #2669).
name: Serve Lanes E2E

on:
  push:
    branches: [main]
    paths:
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/serve/**"
      # ServeCommand owns openPlaygroundService, the daemon-opener wiring, and the ServeHttpServer
      # hookup — it lives one directory up from serve/**, so trigger on it explicitly.
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/ServeCommand.kt"
      - "daemon/**"
      - "render-session/**"
      - "render-session-subprocess/**"
      - "vscode-extension/preview-harness/serve-lanes.*"
      - "vscode-extension/preview-harness/serve-lanes-boot.sh"
      - "vscode-extension/preview-harness/serve-android-lane-boot.sh"
      # The playground e2e (editor → compile → first-frame → /pg live redemption).
      - "vscode-extension/preview-harness/playground.*"
      - "vscode-extension/preview-harness/playground-boot.sh"
      # The Android lane's fixture and the detached-render Application pin it guards.
      - "samples/android-live-lane/**"
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/AndroidBundleResources.kt"
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/AndroidBundleLaunch.kt"
      # A Robolectric bump is THE regression this lane exists to catch (#2669 rode 4.15 → 4.16),
      # and it lands entirely in the version catalog — `libs.robolectric`, consumed by
      # `daemon/android/build.gradle.kts`. Without this entry a bump-only PR matches nothing here
      # and merges without ever exercising the lane.
      - "gradle/libs.versions.toml"
      - ".github/workflows/serve-lanes-e2e.yml"
  pull_request:
    paths:
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/serve/**"
      # ServeCommand owns openPlaygroundService, the daemon-opener wiring, and the ServeHttpServer
      # hookup — it lives one directory up from serve/**, so trigger on it explicitly.
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/ServeCommand.kt"
      - "daemon/**"
      - "render-session/**"
      - "render-session-subprocess/**"
      - "vscode-extension/preview-harness/serve-lanes.*"
      - "vscode-extension/preview-harness/serve-lanes-boot.sh"
      - "vscode-extension/preview-harness/serve-android-lane-boot.sh"
      # The playground e2e (editor → compile → first-frame → /pg live redemption).
      - "vscode-extension/preview-harness/playground.*"
      - "vscode-extension/preview-harness/playground-boot.sh"
      # The Android lane's fixture and the detached-render Application pin it guards.
      - "samples/android-live-lane/**"
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/AndroidBundleResources.kt"
      - "cli/src/main/kotlin/ee/schimke/composeai/cli/AndroidBundleLaunch.kt"
      # A Robolectric bump is THE regression this lane exists to catch (#2669 rode 4.15 → 4.16),
      # and it lands entirely in the version catalog — `libs.robolectric`, consumed by
      # `daemon/android/build.gradle.kts`. Without this entry a bump-only PR matches nothing here
      # and merges without ever exercising the lane.
      - "gradle/libs.versions.toml"
      - ".github/workflows/serve-lanes-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-lanes-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serve-lanes:
    name: Serve render lanes honor overrides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The live render daemon (desktop Compose + Skia) renders headlessly through
      # a virtual X display routed to Mesa's software rasteriser — no GPU.
      - name: Install Xvfb + Mesa software GL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0

      - name: Build the CLI (installDist)
        shell: bash
        run: ./gradlew --no-daemon :cli:installDist --stacktrace

      - name: Install harness deps + Chromium
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Boot the daemon-backed serve (backgrounded; pid in serve-lanes.pid) and
      # export its URL. The script waits for /version + warms one render so the
      # spec's per-test budget isn't spent on cold-daemon warm-up.
      - name: Boot daemon-backed serve
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Capture into a var first (not inside echo) so a boot failure trips
          # `set -e` and fails THIS step with the boot log — instead of exporting an
          # empty SERVE_URL and surfacing later as a cryptic Playwright "Invalid URL".
          url="$(bash vscode-extension/preview-harness/serve-lanes-boot.sh)"
          echo "serve-lanes: SERVE_URL=$url"
          echo "SERVE_URL=$url" >> "$GITHUB_ENV"

      - name: Drive every render lane (Chromium)
        working-directory: vscode-extension
        shell: bash
        env:
          CI: "true"
          SERVE_SYSTEM: compose-m3
        run: npm run harness:serve-lanes

      - name: Tear down serve
        if: always()
        shell: bash
        run: |
          [ -f serve-lanes.pid ] && kill "$(cat serve-lanes.pid)" 2>/dev/null || true
          pkill -f 'MainKt serve' 2>/dev/null || true

      - name: Upload serve log + trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serve-lanes-artifacts
          path: |
            serve-lanes.log
            vscode-extension/preview-harness/test-results-serve-lanes/**
          if-no-files-found: warn

  # The Android/Robolectric half of the same proof (#2675). The job above only ever stood up the
  # desktop CMP/Skiko daemon, so the daemon behind every Android catalog on preview.coo.ee
  # (meshcore-mobile, confetti-mobile, confetti-wear) had no end-to-end CI at all — which is how
  # #2669 shipped: on Robolectric 4.16 the deprecated `SandboxHoldingRunner.buildGlobalConfig`
  # Application override stopped merging over the manifest, the daemon resolved the consumer's
  # `Application` at sandbox bootstrap, threw `ClassNotFoundException`, and every Android catalog
  # collapsed to baked PNGs. Fail-SOFT, so CI stayed green and only a manual repro caught it.
  #
  # This lane serves a locally packed bundle of `:samples:android-live-lane`, whose merged manifest
  # names an `Application` the render classpath doesn't carry — the exact reproducing shape. The boot
  # script fails the job unless the session registers LIVE *and* returns a real 200 render, so a
  # regression in the `android.app.Application` pin (or a Robolectric bump that changes config-merge
  # precedence again — #2671 took us to 4.17-beta-2) turns the silent degradation into a red build.
  serve-lanes-android:
    name: Android (Robolectric) serve lane honors overrides
    runs-on: ubuntu-latest
    # Robolectric sandbox bootstrap + the android-all-instrumented fetch dominate the cold render,
    # on top of a bundle pack that renders the sample first.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # No xvfb / Mesa here (unlike the desktop lane): Robolectric rasterises offscreen through its
      # own native graphics path. `android.jar` comes from the runner image's Android SDK
      # (ANDROID_HOME / ANDROID_SDK_ROOT), which the daemon launch resolves.
      - name: Build the CLI (installDist) + Android daemon sidecar
        shell: bash
        # `lib-daemon-android` ships as a standalone archive rather than inside the CLI dist (#1685),
        # so stage it and point the CLI at it via `-Dcomposeai.cli.libDaemonAndroidDir` (the boot
        # script sets that through JAVA_OPTS).
        run: ./gradlew --no-daemon :cli:installDist :cli:stageDaemonAndroidLibs --stacktrace

      - name: Pack the Android live-lane bundle
        shell: bash
        run: |
          cli/build/install/compose-preview/bin/compose-preview bundle pack \
            --module samples:android-live-lane \
            -o "$GITHUB_WORKSPACE/android-live-lane.png" --timeout 900

      - name: Install harness deps + Chromium
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Boots the daemon, signs the bundle with a throwaway key so it verifies Trusted (the live
      # gate), and hard-fails on the fail-soft shape — see the script header.
      - name: Boot Robolectric-daemon serve
        shell: bash
        env:
          SERVE_BUNDLE: android-live-lane.png
          LIB_DAEMON_ANDROID_DIR: cli/build/staged-daemon-android-libs
        run: |
          url="$(bash vscode-extension/preview-harness/serve-android-lane-boot.sh)"
          echo "serve-android-lane: SERVE_URL=$url"
          echo "SERVE_URL=$url" >> "$GITHUB_ENV"

      # Same spec as the desktop lane, pointed at the Android session: PNG re-render, SVG override
      # text, the Live /ws/ frame lane, and the viewer wiring. The Wasm test self-skips — an Android
      # session has no in-browser tier.
      - name: Drive every render lane (Chromium)
        working-directory: vscode-extension
        shell: bash
        env:
          CI: "true"
          SERVE_SYSTEM: androidlane
        run: npm run harness:serve-lanes

      - name: Tear down serve
        if: always()
        shell: bash
        run: |
          [ -f serve-android-lane.pid ] && kill "$(cat serve-android-lane.pid)" 2>/dev/null || true
          pkill -f 'MainKt serve' 2>/dev/null || true

      - name: Upload serve log + trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serve-lanes-android-artifacts
          path: |
            serve-android-lane.log
            vscode-extension/preview-harness/test-results-serve-lanes/**
          if-no-files-found: warn

  # The Kotlin playground, end to end (#3015). The two lanes above prove the *render* backends honor
  # knob overrides; this proves the *playground* itself: the browser editor compiles a user snippet on
  # the server (BTA), gets a first-frame still back, and the returned `/pg/<token>` capability redeems
  # into the ordinary live viewer. That whole chain — editor → `POST /api/1/compiler/run` → compile →
  # Android/Robolectric first frame → `/pg/` redemption → viewer — has only ever been unit-tested
  # against fakes; nothing exercised the real wiring in a browser until here.
  #
  # It reuses the Android/Robolectric backend (the default editor snippet declares an Android
  # `@Preview`), booting serve with `--playground-android-bundle` over a locally packed
  # `:samples:android-live-lane` — the same bundle the android lane packs. The playground lane compiles
  # and runs user-supplied code in-process, so it is refused under `--public`; the boot is token-gated
  # and the spec carries `?token=`.
  playground-e2e:
    name: Playground compiles + redeems a snippet end to end
    runs-on: ubuntu-latest
    # Same cost profile as the android lane: Robolectric sandbox bootstrap + the android-all fetch
    # dominate the cold render, and the compile POST blocks on that first-frame render before it
    # answers. Plus a bundle pack that renders the sample first.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # `lib-daemon-android` ships as a standalone archive rather than inside the CLI dist (#1685), so
      # stage it and point the CLI at it via `-Dcomposeai.cli.libDaemonAndroidDir` (the boot script
      # sets that through JAVA_OPTS). `android.jar` comes from the runner's Android SDK.
      - name: Build the CLI (installDist) + Android daemon sidecar
        shell: bash
        run: ./gradlew --no-daemon :cli:installDist :cli:stageDaemonAndroidLibs --stacktrace

      # The playground compiles user snippets against this bundle's classpath (not as a served
      # catalog). It's the same sample the android lane serves.
      - name: Pack the Android playground bundle
        shell: bash
        run: |
          cli/build/install/compose-preview/bin/compose-preview bundle pack \
            --module samples:android-live-lane \
            -o "$GITHUB_WORKSPACE/playground-lane.png" --timeout 900

      - name: Install harness deps + Chromium
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Boots serve with the playground lane enabled (token-gated) and fails the step unless the lane
      # actually came up ("playground enabled" in the log) — see the boot script header.
      - name: Boot playground serve
        shell: bash
        env:
          SERVE_BUNDLE: playground-lane.png
          LIB_DAEMON_ANDROID_DIR: cli/build/staged-daemon-android-libs
          SERVE_TOKEN: playground-e2e
        run: |
          url="$(bash vscode-extension/preview-harness/playground-boot.sh)"
          echo "playground: SERVE_URL=$url"
          echo "SERVE_URL=$url" >> "$GITHUB_ENV"

      - name: Drive the playground (Chromium)
        working-directory: vscode-extension
        shell: bash
        env:
          CI: "true"
          SERVE_TOKEN: playground-e2e
        run: npm run harness:playground

      # Surface the serve log INLINE in the job log on failure. The `onLog` reason a redemption
      # failure carries (`[playground live] …` — sidecar/android.jar missing, no previews, …) is
      # written to the serve stderr, which only reaches the uploaded artifact; echoing it here makes
      # a first-frame / redemption failure diagnosable straight from the job log.
      - name: Dump serve log on failure
        if: failure()
        shell: bash
        run: |
          echo "===== playground live/redeem reasons ====="
          # The per-render daemon output is extremely verbose, so a plain tail buries the one line
          # that matters (a redemption `[playground live] …` reason). Surface those first.
          grep -nE 'playground live|redeem|Unavailable|Live preview|no previews|backend=android|android\.jar|sidecar' \
            playground-lane.log || echo "(no redemption-reason lines matched)"
          echo "===== playground-lane.log (tail) ====="
          tail -120 playground-lane.log || echo "(no serve log)"

      - name: Tear down serve
        if: always()
        shell: bash
        run: |
          [ -f playground-lane.pid ] && kill "$(cat playground-lane.pid)" 2>/dev/null || true
          pkill -f 'MainKt serve' 2>/dev/null || true

      - name: Upload serve log + trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-e2e-artifacts
          path: |
            playground-lane.log
            vscode-extension/preview-harness/test-results-playground/**
          if-no-files-found: warn
