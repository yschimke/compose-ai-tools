name: Release

# Builds and publishes the CLI, MCP server, VS Code extension, and
# Gradle plugin + renderer-android for a given tag. Uploads the CLI / MCP /
# VSIX assets onto the GitHub Release (creating it if it doesn't
# exist yet). Maven coordinates ship to Maven Central only — we do not
# mirror to GitHub Packages, since Central is the supported consumer path.
#
# Entry points:
#   - workflow_call: called from release-please.yml after release-please
#     merges the release PR and creates the tag + Release. Primary path.
#   - workflow_dispatch: re-run the release build for an existing tag (e.g.
#     after a transient publish failure).
#   - push: tags (v*): escape hatch for manually-pushed tags.
#
# All three paths resolve to `TAG_NAME`, so downstream jobs don't care which
# fired. See docs/RELEASING.md.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.3.5).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v0.3.5. Must already exist.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Workflow-level default is read-only. Each job widens only what it needs:
# - release: contents: write (creates/updates the GitHub Release, uploads assets)
permissions:
  contents: read

# Both tag-push and workflow_call/dispatch for the same tag serialize through
# the same concurrency group, so a re-run can't race a fresh release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every job consumes TAG_NAME (never GITHUB_REF_NAME) so the steps work the
# same whether triggered by tag push or by workflow_call/dispatch. Templated
# once here; scripts read it via `$TAG_NAME` from the env, which keeps tag
# content out of shell arg positions.
env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # Run gradle publish AFTER the other builds succeed so we don't orphan a
  # published Maven Central artifact if the VSIX, CLI, or MCP build fails —
  # Central refuses to overwrite an already-published release version, so
  # a half-released version can't be quietly rebuilt. Gating on the other
  # build jobs also serves as the coordination point for the `release`
  # job: `release` only `needs` this job, so adding a builder here
  # transitively guarantees its artifacts are uploaded before `release`
  # downloads them. (Skill bundles live in yschimke/skills and ship from
  # that repo — they're no longer packaged here.)
  # `renderer-android` is published alongside the plugin so external consumers
  # that apply the plugin via Maven Central also get the Robolectric-based
  # Android renderer AAR — the plugin resolves it via matching version.
  # `preview-annotations` ships the `@ScrollingPreview` marker that Compose
  # apps add to their compileOnly classpath, so it must publish in lockstep.
  # `daemon-core` / `daemon-desktop` / `daemon-android` are pre-1.0 — published
  # alongside so embedders (Gradle plugin, future Maven/IntelliJ plugins,
  # third-party tooling) can consume the daemon by coordinate. See
  # docs/daemon/DESIGN.md § 17 for the publishing decision and § 19 for the
  # captureToImage fallback if Roborazzi's API ever does break binary compat.
  # `mcp` is published because `render-session-subprocess` and
  # `render-session-embedded-desktop` compile-time-reference its `DaemonClient`
  # + `SubprocessDaemonClientFactory` types; without it on Central, downstream
  # `SubprocessRenderSessions.open(...)` calls fail with a linkage error. The
  # standalone MCP server still ships as a `compose-preview-mcp-*.tar.gz`
  # GitHub Release asset (see `build-applications` below) — the Maven jar is
  # the library face of the same code.
  publish-gradle-plugin:
    # Gate the irreversible Maven Central publish on EVERY build job, including the per-OS viewer
    # matrix. The viewer uber jar used to build inside `build-applications` (so a viewer failure
    # already blocked publishing); now that it lives in `build-viewer-artifacts`, that job must gate
    # publishing too — otherwise a Linux/macOS/Windows viewer build that fails after CLI/MCP/VSIX
    # succeed could let Maven Central publishing run, leaving an unrebuildable partial release.
    needs: [build-applications, build-viewer-artifacts, build-vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        # Strip leading `v` from TAG_NAME, e.g. v0.1.0 → 0.1.0. $PLUGIN_VERSION
        # is inherited by every subsequent step in this job.
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Publish plugin, renderer-android, renderer-desktop, data-*, preview-annotations, daemon-*, mcp to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # See the comment in snapshot.yml's publish step: root-level abbreviation fans out
          # to every subproject applying `composeai.maven-publishing`; `:gradle-plugin` is an
          # includeBuild and needs an explicit address.
          ./gradlew \
            :gradle-plugin:publishAndReleaseToMavenCentral \
            publishAndReleaseToMavenCentral
      # Stage the same modules into Maven local and ship them as a build artifact.
      # The prebuilt preview-host image (preview-host-image.yml) downloads this and
      # warm-renders against it, so the image build resolves the plugin + runtime
      # modules from local jars INSTEAD of waiting on Maven Central propagation.
      # Same `publish*` task set, so the local repo carries exactly what Central got
      # (plugin marker + renderer-*/data-*/daemon-*/preview-annotations/mcp).
      - name: Stage published modules into Maven local for the prebuilt image
        run: |
          ./gradlew \
            :gradle-plugin:publishToMavenLocal \
            publishToMavenLocal
          # Tar just the `ee` tree we publish — never the rest of ~/.m2 (transitive
          # deps the image's Gradle cache resolves on its own).
          tar -czf maven-local-ee.tgz -C "${HOME}/.m2/repository" ee
      - name: Upload Maven local artifact for the prebuilt image
        uses: actions/upload-artifact@v7
        with:
          name: preview-host-maven
          path: maven-local-ee.tgz
          retention-days: 7

  # Build the runnable applications shipped on each GitHub Release: the CLI
  # (`compose-preview-*`), the standalone MCP server (`compose-preview-mcp-*`),
  # and the desktop bundle viewer (`compose-preview-viewer-*`). The CLI tarball
  # already implementation-bundles `:mcp`, so the standalone MCP archive is for
  # consumers who only want `compose-preview-mcp` on its own (e.g. wiring it
  # into an MCP client without dragging the CLI in). The viewer is a separate
  # Compose Desktop application that opens a packed `.png` bundle and renders
  # it live in a window; bigger than the CLI (ships its own Compose+Skiko
  # runtime) so it's a separate download.
  #
  # Each dist is uploaded as its own artifact so `actions/upload-artifact`'s
  # lowest-common-ancestor logic collapses to the single `*/build/distributions/`
  # dir, leaving the artifact contents flat. A previous attempt that listed
  # both `cli/build/distributions/...` and `mcp/build/distributions/...` under
  # one artifact pushed the LCA back to the workspace root, so the files
  # landed nested inside the artifact and silently fell off the shallow
  # upload glob in the `release` job (zero assets shipped on v0.10.2–v0.10.5).
  build-applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Build CLI and MCP distributions
        run: |
          ./gradlew \
            :cli:distZip :cli:distTar \
            :cli:packageAndroidDaemon \
            :mcp:distZip :mcp:distTar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: |
            cli/build/distributions/compose-preview-*.zip
            cli/build/distributions/compose-preview-*.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-dist
          path: |
            mcp/build/distributions/compose-preview-mcp-*.zip
            mcp/build/distributions/compose-preview-mcp-*.tar.gz
          retention-days: 1

  # Per-OS viewer artefacts (portable-bundles.md Tier 2.2). Both are built on a Linux/macOS/Windows
  # matrix because each carries the build host's Compose Desktop + Skiko native runtime, and jpackage
  # only emits the installer format native to the host:
  #   - the runnable uber jar (`compose-preview-viewer-<os>-<arch>-<ver>.jar`,
  #     `packageUberJarForCurrentOS`) — one self-contained file anyone with a JDK 17+ can
  #     `java -jar … bundle.png` with nothing unpacked;
  #   - the native installer (`.deb`/`.dmg`/`.msi`, `packageDistributionForCurrentOS`) — embeds a JDK
  #     runtime image, so a non-Java colleague installs and launches like any native app.
  # Installers are unsigned (no Apple/Authenticode certs in CI): recipients clear a Gatekeeper /
  # SmartScreen prompt on first launch, same as any unsigned desktop app.
  build-viewer-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bundle-viewer-linux
          - os: macos-latest
            artifact: bundle-viewer-macos
          - os: windows-latest
            artifact: bundle-viewer-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        shell: bash
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Build the uber jar and native installer for this OS
        shell: bash
        # On Windows the installer is an `.msi`, which Compose Multiplatform packages via the WiX
        # toolset. The Compose Gradle plugin registers its `downloadWix` / `unzipWix` tasks on the
        # ROOT project (`rootProject.tasks.findByName(...) ?: rootProject.tasks.register(...)`), and
        # `:bundle-viewer`'s `packageMsi` then reads `rootProject.tasks` / `rootProject.layout` at
        # configuration time. That cross-project access is forbidden by this repo's Isolated Projects
        # setting (`org.gradle.unsafe.isolated-projects=true`), and `configuration-cache.problems=fail`
        # turns it into a hard failure — but only on Windows, since `.deb`/`.dmg` need no WiX. It's a
        # plugin-internal access we can't satisfy from our build scripts, so disable Isolated Projects
        # for this packaging run on Windows only. Plain configuration cache stays on (the violation is
        # IP-specific, not a plain-CC problem), and the Linux/macOS legs keep the full IP gate.
        run: |
          ./gradlew \
            ${{ runner.os == 'Windows' && '-Dorg.gradle.unsafe.isolated-projects=false' || '' }} \
            :bundle-viewer:packageUberJarForCurrentOS \
            :bundle-viewer:packageDistributionForCurrentOS
      # Stage both artefacts into one flat dir before upload. `upload-artifact` derives the
      # artifact's internal root from the literal path prefix *before* the first wildcard; the
      # installer lives under a per-format subdir (`…/binaries/main/{deb,dmg,msi}/`), so uploading
      # that path directly would preserve the `<fmt>/` dir inside the artifact and, after the release
      # job's `merge-multiple` download, land the file at `artifacts/<fmt>/…` — which that job's flat
      # `artifacts/*.{deb,dmg,msi}` globs would miss (failing the `gh release` literal-glob
      # expansion). Copying both into a non-wildcard dir keeps the artifact contents flat. The uber
      # jar names carry the OS+arch (`-linux-x64`, `-macos-arm64`, `-windows-x64`), so the three
      # matrix legs never collide once merged.
      - name: Stage artefacts for upload
        shell: bash
        run: |
          mkdir -p staged-artifacts
          cp bundle-viewer/build/compose/jars/compose-preview-viewer-*.jar staged-artifacts/
          find bundle-viewer/build/compose/binaries/main \
            -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \) \
            -exec cp {} staged-artifacts/ \;
          ls -l staged-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: staged-artifacts/*
          if-no-files-found: error
          retention-days: 1

  build-vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      # Do not cache `npm` here: release builds produce artifacts that get
      # published, and a poisoned cache from an unrelated branch/run could
      # influence the installed dependency tree (zizmor: cache-poisoning).
      # `npm ci` on a clean runner is fast enough for a once-per-release job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Derive plugin version from tag
        # Strip leading `v` from TAG_NAME, e.g. v0.1.0 → 0.1.0. $PLUGIN_VERSION
        # is inherited by every subsequent step in this job — both the
        # `npm version` set below and the VSIX build, which threads
        # PLUGIN_VERSION through `scripts/generate-version.mjs` to bake the
        # release coordinate into the auto-inject init script.
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Set version
        working-directory: vscode-extension
        # Read tag from $TAG_NAME (from env, not templated into the script) so
        # the tag name — attacker-influenceable through git or the dispatch
        # input — can't inject arguments into `npm version`.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"
      - name: Build VSIX
        working-directory: vscode-extension
        run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 1

  # Native xr-composite binaries shipped on each GitHub Release — one per desktop
  # platform, each a `.tar.gz` of the binary + compiled materials. Built against
  # the pinned Filament SDK via the shared `build-xr-composite` composite action
  # (the same one the `xr-composite build` CI workflow uses). Unlike the JVM
  # artefacts these aren't published to Maven Central, and `release` (not
  # `publish-gradle-plugin`) is the only job that needs them — they're pure
  # GitHub Release assets. The `.tar.gz` naming carries platform + arch + version
  # so the three matrix legs never collide once merged into `artifacts/`, and the
  # `release` job's existing `artifacts/*.tar.gz` glob uploads them with no extra
  # wiring.
  build-xr-composite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: linux-x86_64
          - os: macos-14
            platform: mac
            asset: macos-arm64
          - os: windows-2022
            platform: windows
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        shell: bash
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-xr-composite
        with:
          platform: ${{ matrix.platform }}
      # Pack the staged dist/ (binary + materials/) into one versioned tarball.
      # `staged-artifacts/*` keeps the upload-artifact LCA at staged-artifacts/,
      # so after the release job's `merge-multiple` the `.tar.gz` lands flat under
      # `artifacts/` for the `artifacts/*.tar.gz` upload glob.
      - name: Package versioned tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-artifacts
          tar -C dist -czf \
            "staged-artifacts/xr-composite-${{ matrix.asset }}-${PLUGIN_VERSION}.tar.gz" .
          ls -l staged-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xr-composite-${{ matrix.asset }}
          path: staged-artifacts/*
          if-no-files-found: error
          retention-days: 1

  # Publish the prebuilt VSIX to both marketplaces. Runs alongside the
  # `release` job (not gating it) so a marketplace outage can't block the
  # `.vsix` landing on the GitHub Release. On workflow_dispatch re-runs for
  # an existing tag, "version already published" is treated as success so
  # reruns are idempotent. Secrets (VSCE_PAT, OVSX_PAT) are scoped per-step.
  publish-vscode-extension:
    needs: build-vscode-extension
    runs-on: ubuntu-latest
    # Non-fatal: a VSCE/Open VSX outage must not fail the workflow run. The two
    # publish steps already treat "already published" as success (idempotent
    # reruns), but a genuine marketplace outage still exits 1 — and since the
    # release is now drafted and `finalize-release` gates on this whole reusable
    # run succeeding, a failure here would skip finalization and strand the
    # release as a draft on the old version. The VSIX is attached to the GitHub
    # Release as a fallback, so tolerate the failure (it shows as a tolerated
    # job) and let the asset/Maven gates decide whether to publish.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Publish to VS Code Marketplace
        env:
          # vsce reads VSCE_PAT from env — keeps the token out of argv/logs.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -o pipefail
          vsix=$(ls dist/*.vsix)
          echo "Publishing $vsix to VS Code Marketplace"
          if ! output=$(npx --yes @vscode/vsce@^3 publish --packagePath "$vsix" 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qiE "already.*published|already exists"; then
              echo "Version already on VS Code Marketplace — treating as success."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"
      - name: Publish to Open VSX
        # Run even if the Marketplace step failed — the two registries are
        # independent, so a PAT/outage on one shouldn't block the other.
        if: ${{ !cancelled() }}
        env:
          # ovsx reads OVSX_PAT from env.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -o pipefail
          vsix=$(ls dist/*.vsix)
          echo "Publishing $vsix to Open VSX"
          if ! output=$(npx --yes ovsx@^0.10 publish "$vsix" 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qiE "already.*published|already exists"; then
              echo "Version already on Open VSX — treating as success."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"

  release:
    # The GitHub Release asset upload depends ONLY on the build jobs that produce the assets — it is
    # deliberately NOT gated on `publish-gradle-plugin`. The Maven Central publish is slow and
    # irreversible (Central won't overwrite a published version), so it's gated behind every build
    # job for safety; but the GitHub assets don't need to wait behind that publish. Listing the three
    # build jobs directly lets this job run in parallel with the Maven publish, so the `.zip`/`.tar.gz`
    # /`.jar`/installer/`.vsix` files (including the per-OS `xr-composite-*.tar.gz` binaries) land on the
    # Release as soon as the builds finish instead of after Central wraps up. The build jobs still gate
    # the Maven publish independently, so decoupling here doesn't weaken the irreversible-publish safety
    # gate. (xr-composite is in `release`'s needs but deliberately NOT in `publish-gradle-plugin`'s — the
    # native binaries are GitHub Release assets, not Maven artifacts.)
    needs: [build-applications, build-viewer-artifacts, build-vscode-extension, build-xr-composite]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the release, upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload or create GitHub Release
        # Each upstream upload-artifact step has a single common parent
        # directory in its `path:` list, so its LCA collapses to that dir and
        # the artifact contents are flat. After `merge-multiple: true`, every
        # CLI / MCP / uber-jar / native-installer / VSIX file lands directly
        # under `artifacts/`, so the shallow globs below are sufficient. The
        # per-OS installer matrix each emits a single `.deb`/`.dmg`/`.msi`, and
        # `release` `needs` the whole matrix, so all three are present here. If
        # you ever expand the dist set across two parents within a single
        # artifact, switch back to a `find artifacts -type f …` collector first.
        #
        # $TAG_NAME is read from env (not templated into the script), so the
        # tag name — attacker-influenceable through git or the dispatch input
        # — can't break out of the quotation and inject extra args.
        #
        # Idempotent: release-please has usually already created the Release
        # (with the CHANGELOG entry as the body) by the time this runs, so we
        # just upload assets onto it. Falls back to creating the Release for
        # tag-push / workflow_dispatch paths where it may not exist yet.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists — uploading assets."
            gh release upload "$TAG_NAME" \
              --clobber \
              artifacts/*.zip \
              artifacts/*.tar.gz \
              artifacts/*.jar \
              artifacts/*.deb \
              artifacts/*.dmg \
              artifacts/*.msi \
              artifacts/*.vsix
          else
            echo "Release $TAG_NAME does not exist — creating."
            gh release create "$TAG_NAME" \
              --title "compose-ai-tools ${TAG_NAME#v}" \
              --generate-notes \
              artifacts/*.zip \
              artifacts/*.tar.gz \
              artifacts/*.jar \
              artifacts/*.deb \
              artifacts/*.dmg \
              artifacts/*.msi \
              artifacts/*.vsix
          fi
