name: Release

# Builds and publishes the CLI, MCP server, VS Code extension, and
# Gradle plugin + renderer-android for a given tag. Uploads the CLI / MCP /
# VSIX assets onto the GitHub Release (creating it if it doesn't
# exist yet). Maven coordinates ship to Maven Central only — we do not
# mirror to GitHub Packages, since Central is the supported consumer path.
#
# Entry points:
#   - workflow_call: called from release-please.yml after release-please
#     merges the release PR and creates the tag + Release. Primary path.
#   - workflow_dispatch: re-run the release build for an existing tag (e.g.
#     after a transient publish failure).
#   - push: tags (v*): escape hatch for manually-pushed tags.
#
# All three paths resolve to `TAG_NAME`, so downstream jobs don't care which
# fired. See docs/RELEASING.md.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.3.5).'
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME: {required: true}
      MAVEN_CENTRAL_PASSWORD: {required: true}
      SIGNING_KEY: {required: true}
      SIGNING_KEY_ID: {required: true}
      SIGNING_KEY_PASSWORD: {required: true}
      VSCE_PAT: {required: false}
      OVSX_PAT: {required: false}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v0.3.5. Must already exist.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Workflow-level default is read-only. Each job widens only what it needs:
# - release: contents: write (creates/updates the GitHub Release, uploads assets)
permissions:
  contents: read

# Both tag-push and workflow_call/dispatch for the same tag serialize through
# the same concurrency group, so a re-run can't race a fresh release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every job consumes TAG_NAME (never GITHUB_REF_NAME) so the steps work the
# same whether triggered by tag push or by workflow_call/dispatch. Templated
# once here; scripts read it via `$TAG_NAME` from the env, which keeps tag
# content out of shell arg positions.
env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # Decides, per Maven version line, whether this release publishes to Central — and when a line
  # does not, which already-published version its artifacts keep.
  #
  # There are two lines: `data/*` and everything else. The root-level
  # `publishAndReleaseToMavenCentral` below used to upload all 94 publishing modules on every
  # release whether or not one of them changed — over v1.57.0..v1.84.0 that was 3,572 module
  # publications carrying 117 module-changes. Gating one undivided publish removed 21.1% of that;
  # splitting `data/` off, 58 modules that change on about a third of releases, takes it to 50.7%.
  # Central meters file count, release size and release count per organisation. Costing for this
  # split and the alternatives: docs/design/RELEASE_TRAINS.md § 5.
  #
  # Its own job because the guard needs full history (`fetch-depth: 0`) and the publish job does
  # not: deepening that checkout would slow every release down.
  #
  # ## `continue-on-error` is still the load-bearing line, and it is not a leftover
  #
  # It was here when this job only reported, because `release-please.yml` gates finalisation on
  # the RESULT of the whole `release.yml` call:
  #
  #     finalize-release:
  #       needs: [release-please, release]
  #       if: ... && needs.release.result == 'success'
  #
  # A workflow_call's result is the roll-up of every job inside it, so without this line a failure
  # here — a Maven Central blip while resolving the baseline, a git edge case — skips
  # `finalize-release` and leaves the GitHub Release a DRAFT: `/releases/latest` and every
  # `latest/download/…` URL keep serving the previous version. `release-draft-sweeper.yml` would
  # recover it within the hour, which is a backstop, not a reason to allow it.
  #
  # That reasoning survives this job becoming a GATE, because the gate is one-directional: every
  # consumer below tests `needed != 'false'`, so a job that dies without writing an answer
  # publishes and builds the CLI at its own version, exactly as if this job did not exist. The
  # only thing `continue-on-error` can now cost is an unnecessary publish. Removing it, so a
  # crashed guard failed the release instead, would trade that for a stranded draft — the worse
  # outcome by a wide margin, and the one this repository has been bitten by before.
  maven-publish-guard:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Per version line, because the publish is split in two: `data/*` versions separately from
      # everything else. 58 of the 94 published modules are on the data line and they change on
      # about a third of releases, which is where -50.7% of module-publications comes from.
      # docs/design/RELEASE_TRAINS.md § 5.
      core_needed: ${{ steps.guard.outputs.core_needed }}
      core_reason: ${{ steps.guard.outputs.core_reason }}
      data_needed: ${{ steps.guard.outputs.data_needed }}
      data_reason: ${{ steps.guard.outputs.data_reason }}
      # The version each line's artifacts carry in THIS release: the release's own version when
      # that line publishes, the last version it reached Central at when it does not.
      #
      # `maven_line` is the CORE line, and it is what `build-applications` bakes into the CLI as
      # MAVEN_LINE_VERSION — the plugin coordinate the CLI injects lives on that line. The data
      # line never needs a CLI-side pin: consumers reach it as a POM transitive of core, and
      # `data_line` is what makes those POMs name a version that exists.
      maven_line: ${{ steps.guard.outputs.core_line }}
      data_line: ${{ steps.guard.outputs.data_line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          # The guard diffs this tag against the last published version, so it needs the tags and
          # the history joining them. Anything shallower makes it fail open and report nothing
          # useful.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide each Maven version line
        id: guard
        # One loop, two lines. Each resolves its OWN baseline from Central — a train is
        # all-or-nothing, so one sentinel coordinate per train answers "what version is this line
        # actually at" — then diffs this tag against it, and lands on the version its artifacts
        # carry in this release.
        #
        # Baselines come from `maven-line-baseline.sh`, which picks the greatest version STRICTLY
        # BELOW this release rather than Central's `<latest>`: `maven-readiness.yml` has to reach
        # the same answer from a different workflow run AFTER the publish, and `<latest>` means
        # different things at those two moments.
        #
        # Everything here fails open, in both halves. An unresolvable baseline omits `--baseline`
        # entirely, which is one of the guard's own fail-open paths; and only an EXPLICIT `false`
        # freezes a line at its baseline. An empty verdict — the guard died before writing one —
        # publishes and takes this release's version, matching the gate on `publish-gradle-plugin`
        # exactly. The two must agree: a POM naming v(N-1) beside a publish of vN, or the reverse,
        # is a coordinate no consumer can resolve.
        run: |
          set -uo pipefail
          for train in core data; do
            case "${train}" in
              core) sentinel=renderer-desktop ;;
              data) sentinel=data-remotecompose-core ;;
            esac

            baseline=""
            latest="$(./.github/scripts/maven-line-baseline.sh --below "${TAG_NAME}" --artifact "${sentinel}")"
            if [ -n "${latest}" ] && git rev-parse --verify --quiet "v${latest}^{commit}" >/dev/null; then
              baseline="v${latest}"
              echo "${train}: last published at ${latest} (via ${sentinel})"
            else
              echo "${train}: no published baseline (got '${latest:-<none>}') — failing open."
            fi

            args=(--train "${train}" --head "${TAG_NAME}" --explain)
            if [ -n "${baseline}" ]; then
              args=(--baseline "${baseline}" "${args[@]}")
            fi
            verdict="$(./.github/scripts/maven-publish-needed.sh "${args[@]}")"
            printf '%s\n' "${verdict}"

            needed="$(printf '%s' "${verdict}" | sed -n 's/^needed=//p' | head -1)"
            reason="$(printf '%s' "${verdict}" | sed -n 's/^reason=//p' | head -1)"

            if [ "${needed}" = "false" ] && [ -n "${baseline}" ]; then
              line="${baseline#v}"
            else
              line="${TAG_NAME#v}"
            fi

            {
              echo "${train}_needed=${needed}"
              echo "${train}_reason=${reason}"
              echo "${train}_line=${line}"
              echo "${train}_baseline=${baseline}"
            } >> "$GITHUB_OUTPUT"
            echo "${train}: needed=${needed:-<none>} line=${line}"
          done
      - name: Report
        # Step outputs reach the shell through the environment, never through `${{ }}` inside the
        # script body — the reasons are free text and interpolating them would splice them into
        # the shell.
        env:
          CORE_NEEDED: ${{ steps.guard.outputs.core_needed }}
          CORE_REASON: ${{ steps.guard.outputs.core_reason }}
          CORE_LINE: ${{ steps.guard.outputs.core_line }}
          CORE_BASELINE: ${{ steps.guard.outputs.core_baseline }}
          DATA_NEEDED: ${{ steps.guard.outputs.data_needed }}
          DATA_REASON: ${{ steps.guard.outputs.data_reason }}
          DATA_LINE: ${{ steps.guard.outputs.data_line }}
          DATA_BASELINE: ${{ steps.guard.outputs.data_baseline }}
        run: |
          {
            echo "### Maven Central publish guard — ${TAG_NAME}"
            echo
            echo "| Train | Modules | Baseline | Publishing | Version | Reason |"
            echo "|---|---|---|---|---|---|"
            echo "| core | 36 | \`${CORE_BASELINE:-unresolved}\` | \`${CORE_NEEDED:-<no answer — publishing>}\` | \`${CORE_LINE}\` | ${CORE_REASON} |"
            echo "| data | 58 | \`${DATA_BASELINE:-unresolved}\` | \`${DATA_NEEDED:-<no answer — publishing>}\` | \`${DATA_LINE}\` | ${DATA_REASON} |"
            echo
            if [ "${CORE_NEEDED}" = "false" ] && [ "${DATA_NEEDED}" = "false" ]; then
              echo "**Nothing publishes to Central.** No published module on either line differs"
              echo "from what is already there, so this release would have uploaded 94 modules that"
              echo "no change could have altered."
            elif [ "${DATA_NEEDED}" = "false" ]; then
              echo "**Skipping the data line** — 58 modules, unchanged since \`${DATA_BASELINE}\`."
              echo "Core POMs published here name \`${DATA_LINE}\` for those coordinates, which is"
              echo "the version already on Central."
            elif [ "${CORE_NEEDED}" = "false" ]; then
              echo "**Skipping the core line** — 36 modules, unchanged since \`${CORE_BASELINE}\`."
            else
              echo "Publishing both lines."
            fi
            echo
            echo "The CLI shipped by this release resolves the plugin at \`${CORE_LINE}\`."
            echo "See \`docs/design/RELEASE_TRAINS.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Run gradle publish AFTER the other builds succeed so we don't orphan a
  # published Maven Central artifact if the VSIX, CLI, or MCP build fails —
  # Central refuses to overwrite an already-published release version, so
  # a half-released version can't be quietly rebuilt. Gating on the other
  # core build jobs protects that irreversible step. The `release` asset job
  # names its producers directly and therefore runs in parallel with this slow
  # Central publish. (Skill bundles live in yschimke/skills and ship from that
  # repo — they're no longer packaged here.)
  # `renderer-android` is published alongside the plugin so external consumers
  # that apply the plugin via Maven Central also get the Robolectric-based
  # Android renderer AAR — the plugin resolves it via matching version.
  # `preview-annotations` ships the `@ScrollingPreview` marker that Compose
  # apps add to their compileOnly classpath, so it must publish in lockstep.
  # `daemon-core` / `daemon-desktop` / `daemon-android` are pre-1.0 — published
  # alongside so embedders (Gradle plugin, future Maven/IntelliJ plugins,
  # third-party tooling) can consume the daemon by coordinate. See
  # docs/daemon/DESIGN.md § 17 for the publishing decision and § 19 for the
  # captureToImage fallback if Roborazzi's API ever does break binary compat.
  # `mcp` is NOT among them any more. The module moved to compose-preview-server
  # (#5176 — it needs an HTTP server to do its job, which is that repository's
  # layer), and `compose-preview mcp serve` execs the `compose-preview-mcp`
  # binary published from there. The `DaemonClient` +
  # `SubprocessDaemonClientFactory` types that made the jar load-bearing for
  # `render-session-subprocess` were lifted into `daemon-client` first (#3824),
  # which is published above and keeps that linkage intact.
  publish-gradle-plugin:
    # Gate the irreversible Maven Central publish on every core application build. The bundle viewer
    # remains buildable from source, but its per-OS packages are no longer core release artifacts.
    needs: [build-applications, maven-publish-guard]
    # …and on at least one version line actually having something to publish. `!= 'false'` rather
    # than `== 'true'`, deliberately: the guard is `continue-on-error`, so a job that crashed
    # leaves these outputs empty, and an empty answer must publish. Only an explicit `false` —
    # written after the guard has diffed that line's modules against the version it is already at
    # on Central — skips. `maven-publish-needed.sh` fails open on every uncertainty for the same
    # reason: publishing when we did not need to costs quota, while not publishing when we did
    # strips a version out from under consumers with no way back, since Central refuses a version
    # twice.
    #
    # `!cancelled()` first, so this does not hang on how a `continue-on-error` job reports itself
    # to `needs`. A guard that failed must still let the publish through — the whole gate is
    # "skip only on an explicit `false`" — and spelling that out here means the behaviour does not
    # rest on a subtlety of Actions' job-result semantics.
    if: >-
      ${{ !cancelled()
      && (needs.maven-publish-guard.outputs.core_needed != 'false'
          || needs.maven-publish-guard.outputs.data_needed != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        # Strip leading `v` from TAG_NAME, e.g. v0.1.0 → 0.1.0. $PLUGIN_VERSION
        # is inherited by every subsequent step in this job.
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Derive the data line's version
        # DATA_LINE_VERSION is what every `data/*` module publishes at, and — crucially — what
        # CORE POMs name for those coordinates even when the data line is NOT publishing. Set it
        # unconditionally: when data does publish it equals PLUGIN_VERSION and this is a no-op,
        # and when it does not, it is the only thing keeping `renderer-desktop`'s POM pointing at
        # a `data-*` version that exists.
        env:
          GUARD_DATA_LINE: ${{ needs.maven-publish-guard.outputs.data_line }}
        run: |
          set -uo pipefail
          # Empty means the guard never answered, and everything publishes at this release's
          # version — the same direction the `if:` above takes on an empty verdict.
          echo "DATA_LINE_VERSION=${GUARD_DATA_LINE:-${TAG_NAME#v}}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Publish plugin, renderer-android, renderer-desktop, data-*, preview-annotations, daemon-*, render-matrix to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        env:
          CORE_NEEDED: ${{ needs.maven-publish-guard.outputs.core_needed }}
          DATA_NEEDED: ${{ needs.maven-publish-guard.outputs.data_needed }}
        run: |
          set -uo pipefail
          # See the comment in snapshot.yml's publish step: root-level abbreviation fans out
          # to every subproject applying `composeai.maven-publishing`; `:gradle-plugin` is an
          # includeBuild and needs an explicit address.
          #
          # Name the tasks explicitly. A bare `./gradlew` is not a no-op that fails loudly —
          # there is no `defaultTasks` in this build, so it runs `help` and exits 0, and the
          # job goes green having published nothing. That is how v1.56.0 and v1.56.1 shipped
          # as public GitHub Releases with no artifacts on Central (#4845 deleted this task
          # list along with the `-x :rc-player-*` exclusions that used to follow it).
          #
          # BOTH lines publishing is still exactly that command, byte for byte. A split release
          # is the new case, and only then is the task list generated: the skipped line's modules
          # are already on Central at the version they carry, and Central refuses a version twice,
          # so re-uploading them fails the WHOLE deployment rather than just their part of it.
          # Keeping the common path on the command it has always run means the split cannot
          # regress an ordinary release.
          if [ "${CORE_NEEDED}" != "false" ] && [ "${DATA_NEEDED}" != "false" ]; then
            echo "Publishing both lines at ${PLUGIN_VERSION}."
            ./gradlew \
              :gradle-plugin:publishAndReleaseToMavenCentral \
              publishAndReleaseToMavenCentral
            exit $?
          fi

          if [ "${CORE_NEEDED}" != "false" ]; then train=core; else train=data; fi
          echo "Publishing the ${train} line only (core=${CORE_NEEDED:-<none>} data=${DATA_NEEDED:-<none>})."

          # `printPublishTasks` prints `<train>\t<task path>\t<dir>`. The mapping has to come from
          # Gradle: the guard enumerates modules by DIRECTORY and Gradle addresses them by PROJECT
          # PATH, and settings.gradle.kts deliberately decouples the two.
          mapfile -t tasks < <(
            ./gradlew printPublishTasks -Ptrain="${train}" --quiet --no-configuration-cache |
              awk -F'\t' '$2 ~ /publishAndReleaseToMavenCentral$/ { print $2 }'
          )
          # An empty list would make `./gradlew` run `help` and exit 0 — the v1.56.0 failure mode
          # again, a green job that published nothing. The guard said this line changed, so an
          # empty list is a broken enumeration, not an empty train.
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::printPublishTasks returned no tasks for the ${train} line"
            exit 1
          fi
          echo "${#tasks[@]} task(s) for the ${train} line."
          ./gradlew "${tasks[@]}"

  # The Remote Compose player stack used to be published from here — a macOS job for its Apple
  # klibs, plus an XCFramework job that rewrote `Package.swift` and cut a bare SwiftPM version tag.
  # All of it lives in yschimke/rc-players now, on the same version line: this repo published those
  # coordinates through 1.53.1, and that repository's manifest continues from there.

  # Build the runnable application shipped on each GitHub Release: the CLI
  # (`compose-preview-*`).
  #
  # The standalone MCP server used to ship beside it as `compose-preview-mcp-*`.
  # It is compose-preview-server's release asset now (#5176), and the CLI fetches
  # it on first use of `mcp serve` exactly as it fetches the preview server —
  # so nothing here builds or uploads it, and an agent host still points at
  # `compose-preview mcp serve`.
  #
  # The dist is uploaded as its own artifact so `actions/upload-artifact`'s
  # lowest-common-ancestor logic collapses to the single `cli/build/distributions/`
  # dir, leaving the artifact contents flat. A previous attempt that listed two
  # modules' distribution directories under one artifact pushed the LCA back to
  # the workspace root, so the files landed nested inside the artifact and
  # silently fell off the shallow upload glob in the `release` job (zero assets
  # shipped on v0.10.2–v0.10.5).
  build-applications:
    # The guard decides the version this CLI resolves the Gradle plugin at, and that is baked
    # into the binary at build time — so the CLI cannot be built before the verdict exists.
    needs: [maven-publish-guard]
    # …but it must never be blocked by one. This job produces every GitHub Release asset, and
    # `finalize-release` holds the release as a draft until they are all attached, so a guard
    # crash that stopped this job from running would strand the release over a question that
    # only affects Maven Central. An absent verdict leaves MAVEN_LINE_VERSION empty, which the
    # build reads as "use the CLI's own version" — and `publish-gradle-plugin` publishes on the
    # same absence, so the two still agree.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Build CLI distribution
        # MAVEN_LINE_VERSION is what `generateCliVersionResource` bakes into
        # `cli-version.properties`, and therefore the coordinate this CLI's auto-inject,
        # `init-script` and `doctor` hand to Gradle. It equals the release version on every
        # release that publishes; on one that does not, it names the last version that IS on
        # Central, so a skipped publish never sends a consumer at a coordinate that 404s.
        #
        # Empty means "not set" as far as the build script is concerned (it falls back to the
        # CLI's own version), which is the right behaviour if the guard job died without an
        # answer — that path also publishes, so the two agree. See cli/build.gradle.kts and the
        # MAVEN_LINE_VERSION KDoc in cli/src/main/kotlin/ee/schimke/composeai/cli/Version.kt.
        env:
          MAVEN_LINE_VERSION: ${{ needs.maven-publish-guard.outputs.maven_line }}
        run: |
          ./gradlew \
            :cli:distZip :cli:distTar \
            :cli:packageAndroidDaemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: |
            cli/build/distributions/compose-preview-*.zip
            cli/build/distributions/compose-preview-*.tar.gz
          retention-days: 1

  # `@yschimke/compose-design-map` — the design-map projection (`design-map/`), published to npm so
  # a downstream catalog repo can `npx` it at a pinned version.
  #
  # It has to be a package rather than a file someone fetches. The consumer is a catalog repo whose
  # `design-map.json` is COMMITTED and CI-checked, so the projection's version is an input to a
  # checked-in artifact: a floating fetch means the next change here turns that repo red for a
  # change nobody there made, and the failure reads as "your map is stale". m3-catalog was fetching
  # these two files from `main` over HTTPS for exactly that reason — no pin, no integrity, no
  # release note. A version on npm makes the bump a commit that regenerates the map in the same
  # diff.
  #
  # Dependency-free by design (no `npm ci` here, and none downstream either), which is what keeps
  # `npx --yes @yschimke/compose-design-map@X.Y.Z` a one-line step in someone else's CI.
  publish-design-map:
    runs-on: ubuntu-latest
    # Same posture the extension's publish job used before it moved out: a registry
    # outage must not strand the drafted
    # release, since `finalize-release` gates on this whole run succeeding. Unlike the VSIX there is
    # no GitHub Release asset to fall back on, so a tolerated failure here means the version simply
    # is not on npm — recover by RE-RUNNING THIS FAILED JOB in the original `release-please.yml`
    # run, which republishes idempotently (the step below skips a version that is already up).
    #
    # Not by re-dispatching release.yml for the tag: npm's Trusted Publisher matches the OIDC
    # token's ENTRY-POINT workflow, which is `release-please.yml` for the automatic chain and
    # `release.yml` for a dispatch — and npm allows only one binding per package. A dispatched
    # run therefore cannot authenticate to npm no matter how the tag resolves. Re-running the
    # job keeps the entry point (and the tag) exactly as they were. See docs/RELEASING.md.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      # The package tests are the only gate in front of an irreversible publish — npm refuses to
      # overwrite a published version, so a broken projection would have to be superseded rather
      # than fixed. They are dependency-free and take a second.
      - name: Test
        working-directory: design-map
        run: npm test
      - name: Set version from the tag
        working-directory: design-map
        # The committed version is a placeholder (0.0.0); the tag is the release coordinate, the
        # same arrangement the other build jobs use. Read from $TAG_NAME in the env rather
        # than templating it, so a tag name can't inject arguments into `npm version`.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"
      - name: Publish
        env:
          # Only a workflow_dispatch recovery builds a tag while the ref points elsewhere; there,
          # npm's provenance generator would attest a commit that did not produce the tarball. A
          # package with no attestation is a gap, one with a false attestation is a lie. The
          # workflow_call path runs on the release commit the tag names, so provenance stays on.
          # Belt and braces only: a dispatched run is not the entry point npm's Trusted Publisher
          # is bound to (see the job comment), so it fails to authenticate before provenance is
          # ever generated. Kept so the flag is right if the binding ever moves to this file.
          IS_RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: design-map
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@yschimke/compose-design-map@${version}" version >/dev/null 2>&1; then
            echo "skip @yschimke/compose-design-map@${version} (already published)"
            exit 0
          fi
          flags=(--access public)
          if [ "${IS_RECOVERY}" = "true" ]; then
            flags+=(--provenance=false)
            echo "recovery publish: provenance disabled (ref does not name the built tree)"
          fi
          npm publish "${flags[@]}"

  # The CMP/Wasm player bundle used to be published to npm from here
  # (`@yschimke/remote-compose-player-cmp`) and attached to this Release as `rc-player-wasm.zip`.
  # Both moved to yschimke/rc-players with the player itself. This repo consumes the published
  # bundle instead — `stageVendoredRcPlayerWasm` in the root build unpacks it, and the CLI stages it
  # into its install dist's `rc-player-wasm/` sidecar.

  release:
    # The GitHub Release asset upload depends ONLY on the build jobs that produce the assets — it is
    # deliberately NOT gated on `publish-gradle-plugin`. The Maven Central publish is slow and
    # irreversible (Central won't overwrite a published version), so it's gated behind every build
    # job for safety; but the GitHub assets don't need to wait behind that publish. Listing the asset
    # build jobs directly lets this job run in parallel with the Maven publish, so the CLI/MCP
    # archives land on the Release as soon as their builds finish instead of after Central wraps up.
    # The build jobs still gate the Maven publish independently, so decoupling here doesn't weaken
    # the irreversible-publish safety gate.
    #
    # The native `xr-composite` binaries used to be built here too, and `release` needed them — so a
    # transient Filament SDK fetch failure on the macOS or Windows leg skipped this job and the CLI,
    # MCP and wasm-player assets never reached the Release, for a component the release did not
    # touch. They now ship from yschimke/compose-preview-xr on its own cadence, consumed by the
    # `xr-composite` pin in the version catalog. See docs/RELEASING.md.
    needs: [build-applications]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the release, upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload or create GitHub Release
        # Each upstream upload-artifact step has a single common parent
        # directory in its `path:` list, so its LCA collapses to that dir and
        # the artifact contents are flat. After `merge-multiple: true`, every
        # CLI / MCP file lands directly under
        # `artifacts/`, so the shallow globs below are sufficient. If you ever
        # expand the dist set across two parents within a single artifact,
        # switch back to a `find artifacts -type f …` collector first.
        #
        # $TAG_NAME is read from env (not templated into the script), so the
        # tag name — attacker-influenceable through git or the dispatch input
        # — can't break out of the quotation and inject extra args.
        #
        # Idempotent: release-please has usually already created the Release
        # (with the CHANGELOG entry as the body) by the time this runs, so we
        # just upload assets onto it. Falls back to creating the Release for
        # tag-push / workflow_dispatch paths where it may not exist yet.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists — uploading assets."
            gh release upload "$TAG_NAME" \
              --clobber \
              artifacts/*.zip \
              artifacts/*.tar.gz
          else
            echo "Release $TAG_NAME does not exist — creating."
            gh release create "$TAG_NAME" \
              --title "compose-ai-tools ${TAG_NAME#v}" \
              --generate-notes \
              artifacts/*.zip \
              artifacts/*.tar.gz
          fi
