name: Release

# Builds and publishes the CLI, MCP server, VS Code extension, and
# Gradle plugin + renderer-android for a given tag. Uploads the CLI / MCP /
# VSIX assets onto the GitHub Release (creating it if it doesn't
# exist yet). Maven coordinates ship to Maven Central only — we do not
# mirror to GitHub Packages, since Central is the supported consumer path.
#
# Entry points:
#   - workflow_call: called from release-please.yml after release-please
#     merges the release PR and creates the tag + Release. Primary path.
#   - workflow_dispatch: re-run the release build for an existing tag (e.g.
#     after a transient publish failure).
#   - push: tags (v*): escape hatch for manually-pushed tags.
#
# All three paths resolve to `TAG_NAME`, so downstream jobs don't care which
# fired. See docs/RELEASING.md.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.3.5).'
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME: {required: true}
      MAVEN_CENTRAL_PASSWORD: {required: true}
      SIGNING_KEY: {required: true}
      SIGNING_KEY_ID: {required: true}
      SIGNING_KEY_PASSWORD: {required: true}
      VSCE_PAT: {required: false}
      OVSX_PAT: {required: false}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v0.3.5. Must already exist.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Workflow-level default is read-only. Each job widens only what it needs:
# - release: contents: write (creates/updates the GitHub Release, uploads assets)
permissions:
  contents: read

# Both tag-push and workflow_call/dispatch for the same tag serialize through
# the same concurrency group, so a re-run can't race a fresh release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every job consumes TAG_NAME (never GITHUB_REF_NAME) so the steps work the
# same whether triggered by tag push or by workflow_call/dispatch. Templated
# once here; scripts read it via `$TAG_NAME` from the env, which keeps tag
# content out of shell arg positions.
env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  # Run gradle publish AFTER the other builds succeed so we don't orphan a
  # published Maven Central artifact if the VSIX, CLI, or MCP build fails —
  # Central refuses to overwrite an already-published release version, so
  # a half-released version can't be quietly rebuilt. Gating on the other
  # core build jobs protects that irreversible step. The `release` asset job
  # names its producers directly and therefore runs in parallel with this slow
  # Central publish. (Skill bundles live in yschimke/skills and ship from that
  # repo — they're no longer packaged here.)
  # `renderer-android` is published alongside the plugin so external consumers
  # that apply the plugin via Maven Central also get the Robolectric-based
  # Android renderer AAR — the plugin resolves it via matching version.
  # `preview-annotations` ships the `@ScrollingPreview` marker that Compose
  # apps add to their compileOnly classpath, so it must publish in lockstep.
  # `daemon-core` / `daemon-desktop` / `daemon-android` are pre-1.0 — published
  # alongside so embedders (Gradle plugin, future Maven/IntelliJ plugins,
  # third-party tooling) can consume the daemon by coordinate. See
  # docs/daemon/DESIGN.md § 17 for the publishing decision and § 19 for the
  # captureToImage fallback if Roborazzi's API ever does break binary compat.
  # `mcp` is published because `render-session-subprocess` and
  # `render-session-embedded-desktop` compile-time-reference its `DaemonClient`
  # + `SubprocessDaemonClientFactory` types; without it on Central, downstream
  # `SubprocessRenderSessions.open(...)` calls fail with a linkage error. The
  # standalone MCP server still ships as a `compose-preview-mcp-*.tar.gz`
  # GitHub Release asset (see `build-applications` below) — the Maven jar is
  # the library face of the same code.
  publish-gradle-plugin:
    # Gate the irreversible Maven Central publish on every core application build. The bundle viewer
    # remains buildable from source, but its per-OS packages are no longer core release artifacts.
    needs: [build-applications, build-vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        # Strip leading `v` from TAG_NAME, e.g. v0.1.0 → 0.1.0. $PLUGIN_VERSION
        # is inherited by every subsequent step in this job.
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Publish plugin, renderer-android, renderer-desktop, data-*, preview-annotations, daemon-*, mcp to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # See the comment in snapshot.yml's publish step: root-level abbreviation fans out
          # to every subproject applying `composeai.maven-publishing`; `:gradle-plugin` is an
          # includeBuild and needs an explicit address.
          #
          # The four `:rc-player-*` modules are EXCLUDED here and published by `publish-player-stack`
          # on macOS instead. They declare `iosArm64`/`iosSimulatorArm64`, and Kotlin/Native cannot
          # build an Apple klib on Linux — leaving them in this fan-out either fails the release
          # while staging them or ships the stack without the iOS artifacts it advertises. The
          # exclusions and that job's task list are the same four modules; keep them in step.
          ./gradlew \
            :gradle-plugin:publishAndReleaseToMavenCentral \
            publishAndReleaseToMavenCentral \
            -x :rc-player-trace:publishAndReleaseToMavenCentral \
            -x :rc-player-protocol:publishAndReleaseToMavenCentral \
            -x :rc-player-runtime:publishAndReleaseToMavenCentral \
            -x :rc-player-compose:publishAndReleaseToMavenCentral

  # The `:rc-player-*` stack, published from macOS because its Apple targets can only be built there.
  #
  # `:rc-player-{trace,protocol,runtime,compose}` apply `composeai.maven-publishing` and declare
  # `iosArm64` + `iosSimulatorArm64` (see each module's build file and #4066). Kotlin/Native has no
  # Apple SDK or linker on Linux, so these publications cannot come out of the `ubuntu-latest`
  # aggregate above — which is why that job excludes exactly these four and this one names them.
  #
  # Separate Central deployment from `publish-gradle-plugin`'s, which is already true of
  # `:gradle-plugin` (a composite build). Same posture otherwise: gated on every build job, because
  # Central will not overwrite a published version.
  publish-player-stack:
    needs: [build-applications, build-vscode-extension]
    runs-on: macos-15
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      # `publish-xcframework` documents why: CMP 1.11's `ui-uikit` needs the iOS 26 SDK, and this
      # job links the same Apple targets.
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
      - name: Publish the rc-player stack to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./gradlew \
            :rc-player-trace:publishAndReleaseToMavenCentral \
            :rc-player-protocol:publishAndReleaseToMavenCentral \
            :rc-player-runtime:publishAndReleaseToMavenCentral \
            :rc-player-compose:publishAndReleaseToMavenCentral
  # Ship the iOS player as an XCFramework a Swift project can consume (#4068).
  #
  # Two artifacts, and the order between them is load-bearing. SPM's `binaryTarget` addresses a zip
  # by URL and pins it by SHA-256, so `Package.swift` can only be written *after* the asset it
  # describes exists. This job therefore: assembles and zips *the released source*, uploads the zip
  # to the Release, then rewrites `Package.swift` on `main` with that Release's URL and the checksum
  # of the exact bytes uploaded, and tags that commit `<version>`.
  #
  # The Swift tag is why this works at all. `Package.swift` at the `v<version>` tag necessarily
  # still points at the *previous* release — the file is committed before the asset exists — so a
  # consumer resolving `v<version>` would get the wrong binary. The Swift tag points at the commit
  # made after the upload, which is the first commit where the two agree. Consumers depend on it.
  #
  # It is a BARE `<version>` tag (`1.16.0`), not `swift/<version>`. SwiftPM only recognizes a tag as
  # a semantic version when the whole ref is `X.Y.Z` or `vX.Y.Z`; a `swift/1.16.0` ref is invisible
  # to `.package(..., from: "1.16.0")`, which is the only consumption syntax this repo documents. A
  # bare tag is resolvable and cannot collide with the `v<version>` release tag, and `release.yml`'s
  # own push trigger is `v*`, so tagging it here does not re-enter this workflow.
  #
  # The BUILD comes from `TAG_NAME`, not from `main`. `main` can advance between the tag being cut
  # and this job starting, and an XCFramework built from a newer `main` would be attached to — and
  # labelled with — the older release, disagreeing with the Maven artifacts and the source release
  # that `publish-gradle-plugin` builds from the same tag. Only the `Package.swift` commit touches
  # `main`, and it happens on a fresh checkout of `main` after the upload.
  #
  # macOS-only: `xcodebuild -create-xcframework` and the Kotlin/Native Apple linker both need it.
  # This is also the first time CI links a release framework at all — `ci.yml` only ever compiled
  # the iOS *test* targets — so treat a failure here as real rather than flaky, and see the Xcode
  # selection step, which exists because CMP 1.11's `ui-uikit` needs the iOS 26 SDK.
  publish-xcframework:
    needs: [build-applications, build-vscode-extension]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released source, so the binary matches the tag it is attached to. `main` is fetched
          # separately below, once the asset exists and `Package.swift` can describe it.
          ref: ${{ env.TAG_NAME }}
          persist-credentials: true
      - name: Derive version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
      - name: Assemble and package the XCFramework
        run: ./gradlew :rc-player-compose:rcPlayerXcframeworkChecksum
      - name: Upload the XCFramework to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" \
            rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip --clobber
      # Every step here is idempotent, because `workflow_dispatch` re-releasing an existing tag is a
      # documented recovery path (docs/RELEASING.md) and the second run finds the work already done:
      # `Package.swift` already describes this asset (the zip is built reproducibly, so the checksum
      # is the same bytes), and the Swift tag already exists. A re-run must be a no-op, not a
      # failure — the rewriter reports "already up to date" rather than exiting non-zero, the commit
      # is skipped when the tree is clean, and an existing tag pointing at the right commit is left
      # alone. A tag that exists but points somewhere ELSE is still a hard error: that means the
      # asset and the tag disagree, which is the one thing this scheme exists to prevent.
      - name: Point Package.swift at the uploaded asset and tag it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          checksum="$(cat rc-player/compose/build/distributions/RcComposePlayer.xcframework.zip.sha256)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/RcComposePlayer.xcframework.zip"

          # The build above ran against $TAG_NAME; the commit has to land on main.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -B release-package-swift FETCH_HEAD

          scripts/update-package-swift.sh "$url" "$checksum"
          if git diff --quiet -- Package.swift; then
            echo "Package.swift already points at ${TAG_NAME}'s asset; no commit needed"
          else
            git add Package.swift
            git commit -m "chore(release): point Package.swift at ${TAG_NAME}"
            git push origin HEAD:main
          fi

          # Bare `<version>`: the only shape SwiftPM resolves. See the job comment.
          swift_tag="${PLUGIN_VERSION}"
          head="$(git rev-parse HEAD)"
          # `--refs` drops the peeled `^{}` line, so a lightweight tag yields exactly one SHA.
          existing="$(git ls-remote --refs --tags origin "refs/tags/${swift_tag}" | cut -f1)"
          if [ -z "$existing" ]; then
            git tag "$swift_tag"
            git push origin "$swift_tag"
          elif [ "$existing" = "$head" ]; then
            echo "tag ${swift_tag} already points at ${head}"
          else
            echo "tag ${swift_tag} already exists at ${existing} but this release resolves to ${head}" >&2
            exit 1
          fi

  # Build the runnable applications shipped on each GitHub Release: the CLI
  # (`compose-preview-*`) and the standalone MCP server (`compose-preview-mcp-*`).
  # The CLI tarball already implementation-bundles `:mcp`, so the standalone MCP
  # archive is for consumers who only want `compose-preview-mcp` on its own (e.g.
  # wiring it into an MCP client without dragging the CLI in).
  #
  # Each dist is uploaded as its own artifact so `actions/upload-artifact`'s
  # lowest-common-ancestor logic collapses to the single `*/build/distributions/`
  # dir, leaving the artifact contents flat. A previous attempt that listed
  # both `cli/build/distributions/...` and `mcp/build/distributions/...` under
  # one artifact pushed the LCA back to the workspace root, so the files
  # landed nested inside the artifact and silently fell off the shallow
  # upload glob in the `release` job (zero assets shipped on v0.10.2–v0.10.5).
  build-applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Build CLI and MCP distributions
        run: |
          ./gradlew \
            :cli:distZip :cli:distTar \
            :cli:packageAndroidDaemon \
            :mcp:distZip :mcp:distTar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: |
            cli/build/distributions/compose-preview-*.zip
            cli/build/distributions/compose-preview-*.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-dist
          path: |
            mcp/build/distributions/compose-preview-mcp-*.zip
            mcp/build/distributions/compose-preview-mcp-*.tar.gz
          retention-days: 1

  build-vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      # Do not cache `npm` here: release builds produce artifacts that get
      # published, and a poisoned cache from an unrelated branch/run could
      # influence the installed dependency tree (zizmor: cache-poisoning).
      # `npm ci` on a clean runner is fast enough for a once-per-release job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Derive plugin version from tag
        # Strip leading `v` from TAG_NAME, e.g. v0.1.0 → 0.1.0. $PLUGIN_VERSION
        # is inherited by every subsequent step in this job — both the
        # `npm version` set below and the VSIX build, which threads
        # PLUGIN_VERSION through `scripts/generate-version.mjs` to bake the
        # release coordinate into the auto-inject init script.
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Set version
        working-directory: vscode-extension
        # Read tag from $TAG_NAME (from env, not templated into the script) so
        # the tag name — attacker-influenceable through git or the dispatch
        # input — can't inject arguments into `npm version`.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"
      - name: Build VSIX
        working-directory: vscode-extension
        run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 1

  # Native xr-composite binaries shipped on each GitHub Release — one per desktop
  # platform, each a `.tar.gz` of the binary + compiled materials. Built against
  # the pinned Filament SDK via the shared `build-xr-composite` composite action
  # (the same one the `xr-composite build` CI workflow uses). Unlike the JVM
  # artefacts these aren't published to Maven Central, and `release` (not
  # `publish-gradle-plugin`) is the only job that needs them — they're pure
  # GitHub Release assets. The `.tar.gz` naming carries platform + arch + version
  # so the three matrix legs never collide once merged into `artifacts/`, and the
  # `release` job's existing `artifacts/*.tar.gz` glob uploads them with no extra
  # wiring.
  build-xr-composite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: linux-x86_64
          - os: macos-14
            platform: mac
            asset: macos-arm64
          - os: windows-2022
            platform: windows
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Derive plugin version from tag
        shell: bash
        run: echo "PLUGIN_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-xr-composite
        with:
          platform: ${{ matrix.platform }}
      # Pack the staged dist/ (binary + materials/) into one versioned tarball.
      # `staged-artifacts/*` keeps the upload-artifact LCA at staged-artifacts/,
      # so after the release job's `merge-multiple` the `.tar.gz` lands flat under
      # `artifacts/` for the `artifacts/*.tar.gz` upload glob.
      - name: Package versioned tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-artifacts
          tar -C dist -czf \
            "staged-artifacts/xr-composite-${{ matrix.asset }}-${PLUGIN_VERSION}.tar.gz" .
          ls -l staged-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xr-composite-${{ matrix.asset }}
          path: staged-artifacts/*
          if-no-files-found: error
          retention-days: 1

  # Publish the prebuilt VSIX to both marketplaces. Runs alongside the
  # `release` job (not gating it) so a marketplace outage can't block the
  # `.vsix` landing on the GitHub Release. On workflow_dispatch re-runs for
  # an existing tag, "version already published" is treated as success so
  # reruns are idempotent. Secrets (VSCE_PAT, OVSX_PAT) are scoped per-step.
  publish-vscode-extension:
    needs: build-vscode-extension
    runs-on: ubuntu-latest
    # Non-fatal: a VSCE/Open VSX outage must not fail the workflow run. The two
    # publish steps already treat "already published" as success (idempotent
    # reruns), but a genuine marketplace outage still exits 1 — and since the
    # release is now drafted and `finalize-release` gates on this whole reusable
    # run succeeding, a failure here would skip finalization and strand the
    # release as a draft on the old version. The VSIX is attached to the GitHub
    # Release as a fallback, so tolerate the failure (it shows as a tolerated
    # job) and let the asset/Maven gates decide whether to publish.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Publish to VS Code Marketplace
        env:
          # vsce reads VSCE_PAT from env — keeps the token out of argv/logs.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -o pipefail
          vsix=$(ls dist/*.vsix)
          echo "Publishing $vsix to VS Code Marketplace"
          if ! output=$(npx --yes @vscode/vsce@^3 publish --packagePath "$vsix" 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qiE "already.*published|already exists"; then
              echo "Version already on VS Code Marketplace — treating as success."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"
      - name: Publish to Open VSX
        # Run even if the Marketplace step failed — the two registries are
        # independent, so a PAT/outage on one shouldn't block the other.
        if: ${{ !cancelled() }}
        env:
          # ovsx reads OVSX_PAT from env.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -o pipefail
          vsix=$(ls dist/*.vsix)
          echo "Publishing $vsix to Open VSX"
          if ! output=$(npx --yes ovsx@^0.10 publish "$vsix" 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qiE "already.*published|already exists"; then
              echo "Version already on Open VSX — treating as success."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"

  # `@yschimke/compose-design-map` — the design-map projection (`design-map/`), published to npm so
  # a downstream catalog repo can `npx` it at a pinned version.
  #
  # It has to be a package rather than a file someone fetches. The consumer is a catalog repo whose
  # `design-map.json` is COMMITTED and CI-checked, so the projection's version is an input to a
  # checked-in artifact: a floating fetch means the next change here turns that repo red for a
  # change nobody there made, and the failure reads as "your map is stale". m3-catalog was fetching
  # these two files from `main` over HTTPS for exactly that reason — no pin, no integrity, no
  # release note. A version on npm makes the bump a commit that regenerates the map in the same
  # diff.
  #
  # Dependency-free by design (no `npm ci` here, and none downstream either), which is what keeps
  # `npx --yes @yschimke/compose-design-map@X.Y.Z` a one-line step in someone else's CI.
  publish-design-map:
    runs-on: ubuntu-latest
    # Same posture as `publish-vscode-extension`: a registry outage must not strand the drafted
    # release, since `finalize-release` gates on this whole run succeeding. Unlike the VSIX there is
    # no GitHub Release asset to fall back on, so a tolerated failure here means the version simply
    # is not on npm — recover by RE-RUNNING THIS FAILED JOB in the original `release-please.yml`
    # run, which republishes idempotently (the step below skips a version that is already up).
    #
    # Not by re-dispatching release.yml for the tag: npm's Trusted Publisher matches the OIDC
    # token's ENTRY-POINT workflow, which is `release-please.yml` for the automatic chain and
    # `release.yml` for a dispatch — and npm allows only one binding per package. A dispatched
    # run therefore cannot authenticate to npm no matter how the tag resolves. Re-running the
    # job keeps the entry point (and the tag) exactly as they were. See docs/RELEASING.md.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      # The package tests are the only gate in front of an irreversible publish — npm refuses to
      # overwrite a published version, so a broken projection would have to be superseded rather
      # than fixed. They are dependency-free and take a second.
      - name: Test
        working-directory: design-map
        run: npm test
      - name: Set version from the tag
        working-directory: design-map
        # The committed version is a placeholder (0.0.0); the tag is the release coordinate, the
        # same arrangement `build-vscode-extension` uses. Read from $TAG_NAME in the env rather
        # than templating it, so a tag name can't inject arguments into `npm version`.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"
      - name: Publish
        env:
          # Only a workflow_dispatch recovery builds a tag while the ref points elsewhere; there,
          # npm's provenance generator would attest a commit that did not produce the tarball. A
          # package with no attestation is a gap, one with a false attestation is a lie. The
          # workflow_call path runs on the release commit the tag names, so provenance stays on.
          # Belt and braces only: a dispatched run is not the entry point npm's Trusted Publisher
          # is bound to (see the job comment), so it fails to authenticate before provenance is
          # ever generated. Kept so the flag is right if the binding ever moves to this file.
          IS_RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: design-map
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@yschimke/compose-design-map@${version}" version >/dev/null 2>&1; then
            echo "skip @yschimke/compose-design-map@${version} (already published)"
            exit 0
          fi
          flags=(--access public)
          if [ "${IS_RECOVERY}" = "true" ]; then
            flags+=(--provenance=false)
            echo "recovery publish: provenance disabled (ref does not name the built tree)"
          fi
          npm publish "${flags[@]}"

  # Publish the CMP/Wasm Remote Compose player bundle to npm (#4067), so a web page can embed it
  # without cloning this repo and running Gradle.
  #
  # Same posture as `publish-design-map` above, and for the same reasons — including the
  # `continue-on-error` and the "re-run this job, do not re-dispatch" recovery note, which is about
  # npm's Trusted Publisher binding to the entry-point workflow rather than about this package.
  #
  # `rcPlayerNpmPackage` only *stages* the directory; `npm` runs here and nowhere else. Keeping Node
  # out of the Gradle build is the constraint that made the CLI vendor a prebuilt JS player in the
  # first place (docs/design/RC_CMP_WASM_PLAYER.md), and it still holds.
  publish-wasm-player:
    needs: [build-applications, build-vscode-extension]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # `write`, not `read`: the last step calls `gh release upload`, which mutates the Release.
      # With `read` that step fails authorization, and because the job is `continue-on-error` the
      # release would quietly ship without the promised `rc-player-wasm.zip`.
      contents: write
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      # The size budget in `wasmPlayerDist` is the gate in front of an irreversible publish: npm
      # refuses to overwrite a version, so a bundle that ballooned would have to be superseded.
      - name: Stage the npm package
        run: ./gradlew :rc-player-wasm:rcPlayerNpmPackage
      - name: Set version from the tag
        working-directory: rc-player/wasm/build/npmPackage
        # The committed version is the 0.0.0 placeholder, as in `design-map`. Read from $TAG_NAME in
        # the env rather than templating it, so a tag name cannot inject arguments.
        run: npm version --no-git-tag-version --allow-same-version "${TAG_NAME#v}"
      - name: Publish
        env:
          IS_RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: rc-player/wasm/build/npmPackage
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@yschimke/remote-compose-player-cmp@${version}" version >/dev/null 2>&1; then
            echo "skip @yschimke/remote-compose-player-cmp@${version} (already published)"
            exit 0
          fi
          flags=(--access public)
          if [ "${IS_RECOVERY}" = "true" ]; then
            flags+=(--provenance=false)
            echo "recovery publish: provenance disabled (ref does not name the built tree)"
          fi
          npm publish "${flags[@]}"
      # Also attach the raw bundle to the Release, for a consumer who wants the files without npm.
      # Cheap, and it means a failed npm publish still leaves the release usable.
      #
      # `if: !cancelled()` is the whole point of the fallback. A step's implicit condition is
      # `success()`, and job-level `continue-on-error` only tolerates the *job* failing — it does
      # not un-skip later steps. Without this, the registry outage the fallback exists to cover is
      # exactly the case where the fallback never runs. The staging step may itself have failed, so
      # the bundle is uploaded only when it is actually there.
      - name: Attach the bundle to the Release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d rc-player/wasm/build/wasmDist ]; then
            echo "no staged bundle to attach (the dist step did not produce one)" >&2
            exit 0
          fi
          (cd rc-player/wasm/build && zip -qr rc-player-wasm.zip wasmDist)
          gh release upload "$TAG_NAME" rc-player/wasm/build/rc-player-wasm.zip --clobber

  release:
    # The GitHub Release asset upload depends ONLY on the build jobs that produce the assets — it is
    # deliberately NOT gated on `publish-gradle-plugin`. The Maven Central publish is slow and
    # irreversible (Central won't overwrite a published version), so it's gated behind every build
    # job for safety; but the GitHub assets don't need to wait behind that publish. Listing the asset
    # build jobs directly lets this job run in parallel with the Maven publish, so the CLI/MCP archives,
    # VSIX, and per-OS `xr-composite-*.tar.gz` binaries land on the Release as soon as their builds
    # finish instead of after Central wraps up. The build jobs still gate the Maven publish
    # independently, so decoupling here doesn't weaken the irreversible-publish safety gate.
    # (xr-composite is in `release`'s needs but deliberately NOT in `publish-gradle-plugin`'s — the
    # native binaries are GitHub Release assets, not Maven artifacts.)
    needs: [build-applications, build-vscode-extension, build-xr-composite]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the release, upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload or create GitHub Release
        # Each upstream upload-artifact step has a single common parent
        # directory in its `path:` list, so its LCA collapses to that dir and
        # the artifact contents are flat. After `merge-multiple: true`, every
        # CLI / MCP / VSIX / XR compositor file lands directly under
        # `artifacts/`, so the shallow globs below are sufficient. If you ever
        # expand the dist set across two parents within a single artifact,
        # switch back to a `find artifacts -type f …` collector first.
        #
        # $TAG_NAME is read from env (not templated into the script), so the
        # tag name — attacker-influenceable through git or the dispatch input
        # — can't break out of the quotation and inject extra args.
        #
        # Idempotent: release-please has usually already created the Release
        # (with the CHANGELOG entry as the body) by the time this runs, so we
        # just upload assets onto it. Falls back to creating the Release for
        # tag-push / workflow_dispatch paths where it may not exist yet.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists — uploading assets."
            gh release upload "$TAG_NAME" \
              --clobber \
              artifacts/*.zip \
              artifacts/*.tar.gz \
              artifacts/*.vsix
          else
            echo "Release $TAG_NAME does not exist — creating."
            gh release create "$TAG_NAME" \
              --title "compose-ai-tools ${TAG_NAME#v}" \
              --generate-notes \
              artifacts/*.zip \
              artifacts/*.tar.gz \
              artifacts/*.vsix
          fi
