name: VS Code Preview Comment

# Mirrors the comment path of `compose-preview.yml` (the active per-PR
# diff flow) but for the VS Code panel's `preview-harness`. Runs only when the PR touches
# files that can change the panel's rendered look (extension source,
# webview bundle, harness fixtures). Posts a sticky before/after
# comment using `vscode-preview/main` as the baseline branch and
# `vscode-preview/pr` as the per-PR captures branch — same shape as
# `compose-preview/main` / `compose-preview/pr`.

on:
  pull_request:
    paths:
      - 'vscode-extension/src/webview/**'
      - 'vscode-extension/media/**'
      - 'vscode-extension/preview-harness/**'
      - 'vscode-extension/esbuild.webview.mjs'
      - 'vscode-extension/tsconfig.webview.json'
      - 'vscode-extension/package.json'
      - 'vscode-extension/package-lock.json'
      - '.github/actions/vscode-preview-baselines/**'
      - '.github/actions/vscode-preview-comment/**'
      - '.github/actions/lib/vscode-preview-diff.py'
      - '.github/workflows/vscode-preview-comment.yml'
  # Manual re-run, for when the `pull_request` trigger is missed (it happens) and
  # the sticky comment is left describing an older head. `pr` is required in
  # practice: a dispatch carries no `pull_request` event, so without it the
  # comment step has no number to post to and 404s *after* doing all the capture
  # work — a red check that says nothing about the diff.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to post the comparison to'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Per-PR group so a fast-follow push cancels the in-flight diff for
  # the same PR but leaves other PRs alone — same shape as the
  # composable preview-comment flow.
  group: vscode-preview-comment-${{ github.event.pull_request.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare vscode-preview captures
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/vscode-preview-comment
        with:
          # Empty on a `pull_request` run, where the action falls back to the
          # event's own PR number.
          pr-number: ${{ inputs.pr }}
