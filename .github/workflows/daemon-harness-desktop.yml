name: Daemon Harness (desktop)

# End-to-end test harness for the preview daemon — see
# docs/daemon/TEST-HARNESS.md and docs/daemon/TODO.md § D-harness.v1.5.
# v1.5b runs both modes on every PR:
#   * `fake` — FakeDaemonMain + FakeHost; deterministic-failure coverage
#     plus the seven-scenario v1 catalogue. Does not link in Compose
#     Desktop / Skiko on the harness production classpath.
#   * `real` — the real `:renderer-desktop-daemon` `DaemonMain` driven by
#     the same scenarios via `RealDesktopHarnessLauncher`. Pixel-diffs
#     against the in-repo baselines under
#     `tools/daemon-harness/baselines/desktop/`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fake:
    name: Daemon Harness (desktop, fake host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run harness scenarios (fake)
        run: ./gradlew :tools:daemon-harness:test
      - name: Upload harness test results (fake)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-fake-test-results
          path: tools/daemon-harness/build/reports/tests/
      # On pixel-diff failure the test writes actual.png / expected.png /
      # diff.png under build/reports/daemon-harness/<scenario>/. Surface
      # them as a separate artefact so reviewers don't have to dig through
      # the test-results bundle.
      - name: Upload pixel-diff artefacts on failure (fake)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-fake-diffs
          path: tools/daemon-harness/build/reports/daemon-harness/

  real:
    name: Daemon Harness (desktop, real renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Skiko ships its native bundle inside the Compose Desktop classpath,
      # so we expect no system packages to be needed on ubuntu-latest. If
      # this job ever fails with `UnsatisfiedLinkError` for libfreetype /
      # libfontconfig, install them here:
      #
      #   - name: Install Skiko native deps
      #     run: |
      #       sudo apt-get update
      #       sudo apt-get install -y libfreetype6 libfontconfig1
      #
      # Track this in `docs/daemon/TODO.md` if it lands.
      - name: Run harness scenarios (real)
        run: ./gradlew :tools:daemon-harness:test -Pharness.host=real
      - name: Upload harness test results (real)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-real-test-results
          path: tools/daemon-harness/build/reports/tests/
      - name: Upload pixel-diff artefacts on failure (real)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-real-diffs
          path: tools/daemon-harness/build/reports/daemon-harness/
