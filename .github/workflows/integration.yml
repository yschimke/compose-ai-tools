name: Integration

# Integration tests that build the Gradle plugin + CLI, publish the plugin to
# mavenLocal, check out a handful of real-world Compose projects, and verify
# the plugin discovers and renders at least one preview without touching the
# consumer's source tree.
#
# The wiring relies on the CLI's bundled auto-inject init script — same body
# the `compose-preview` binary passes via `--init-script` on every Gradle
# invocation, materialised once per job via `compose-preview init-script
# --path` and threaded through each `./gradlew` call below. `--init-script`
# adds `ee.schimke.composeai.preview` to the buildscript classpath of every
# included project and applies it via `pluginManager.withPlugin(...)` for
# `com.android.application` / `com.android.library` / `org.jetbrains.compose`.
# `COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL=1` tells that script to look at the
# `~/.m2` snapshot the build-plugin job seeded.
#
# Buildscript-classpath injection (rather than the init script's own
# classpath) keeps the plugin's classes in the same classloader scope as the
# consumer's AGP, so reflective `getByType<AndroidComponentsExtension>()`
# lookups inside the plugin see matching Class identities.
#
# Each external-repo job runs independently (`fail-fast: false`) so one broken
# consumer does not mask regressions in the others.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/ci.yml"
      - ".github/workflows/integration.yml"
      - ".github/workflows/compose-preview.yml"
  workflow_dispatch:
  schedule:
    # Daily — catches drift when consumer repos bump AGP/Kotlin without us.
    # The `androidchka` matrix entry pairs with a live androidx-main checkout,
    # so daily cadence is what surfaces breakage from upstream androidx within
    # 24h instead of a week.
    - cron: "17 6 * * *"

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Integration jobs only read this repo's code and check out external public
# repos for testing. No writes required anywhere.
permissions:
  contents: read

env:
  PLUGIN_VERSION: 0.1.0-SNAPSHOT

jobs:
  build-plugin:
    name: Build plugin + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Publish plugin + renderer-android + data-* + daemon-* to mavenLocal
        # Both `gradle-plugin` and `renderer-android` are needed end-to-end:
        # the plugin resolves through the init script's buildscript classpath
        # injection from mavenLocal, and at render time it wires
        # `ee.schimke.composeai:renderer-android:<version>` into the consumer's
        # `composePreviewAndroidRenderer<Variant>` configuration.
        # Publishing only the plugin here would mean the render path silently
        # falls back to whatever's on the consumer's remote repos (or fails
        # resolution) — exactly the kind of release-vs-source drift these tests
        # are supposed to catch.
        #
        # `daemon-core` / `daemon-desktop` / `daemon-android` join the publish
        # so the new daemon round-trip step (further down the matrix) can
        # spawn a daemon JVM for an external-consumer module without falling
        # back to remote (where the SNAPSHOT version doesn't exist).
        #
        # Root-level abbreviation fans out to every subproject applying
        # `composeai.maven-publishing` (same pattern as snapshot.yml /
        # release.yml — see #766). `:gradle-plugin` is an `includeBuild` and
        # needs an explicit address. Without the abbreviation each new
        # publishable module (e.g. `:data-a11y-hierarchy-android`,
        # `:data-recomposition-connector`) had to be added by hand and the
        # render step silently fell through to the SNAPSHOT version on remote
        # when one was missed.
        run: |
          ./gradlew \
            :gradle-plugin:publishToMavenLocal \
            publishToMavenLocal \
            --stacktrace

      - name: Install CLI
        run: ./gradlew :cli:installDist --stacktrace

      - name: Bundle artifacts
        run: |
          set -euo pipefail
          mkdir -p bundle/m2 bundle/cli bundle/ci
          # Ship only our own group to keep the tarball small — the consumer
          # resolves every other dep from its own repositories.
          cp -R "$HOME/.m2/repository/ee" bundle/m2/
          cp -R cli/build/install/compose-preview/. bundle/cli/
          cp .github/ci/daemon-roundtrip.py bundle/ci/
          # Ship consumer patches (e.g. the adaptive-apps-samples XR
          # alpha14 upgrade) so the integration matrix can apply them to
          # the checked-out external repo before Gradle configures it.
          cp .github/ci/patches/*.patch bundle/ci/
          tar -czf compose-ai-bundle.tar.gz -C bundle .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-ai-bundle
          path: compose-ai-bundle.tar.gz
          retention-days: 7

  integration:
    name: ${{ matrix.name }}
    needs: build-plugin
    runs-on: ubuntu-latest
    # `continue-on-error: true` on a matrix entry makes that entry's failures
    # surface as warnings rather than blocking required-status checks on PRs.
    # Used by the `androidchka` cell — it pairs against a live `androidx-main`
    # checkout and is intentionally a daily *signal* of upstream drift, not a
    # gate on PR merges. Other cells default to `false` (blocking) when the
    # field is absent.
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wear-os-samples (ComposeStarter)
            slug: wear-os-samples
            repo: android/wear-os-samples
            ref: main
            workdir: ComposeStarter
            module: app
            # ComposeStarter enables isolated-projects + configuration-cache. The plugin used to
            # need `-Dorg.gradle.unsafe.isolated-projects=false -Dorg.gradle.isolated-projects
            # =false --no-configuration-cache` here because of `rootProject.findProject` walks +
            # `rootProject.layout` reads; both were removed in #1546's IP-cleanup pass (#1549
            # tracks the cross-project-metadata follow-up). Leave the field empty so this cell
            # exercises IP + CC end-to-end. Re-add specific opt-outs below (with a fresh comment
            # naming the regression) if the consumer's own build script surfaces an IP problem
            # we haven't seen before.
            extra_gradle_args: ""
            # Exercise the full render pipeline on at least one matrix entry
            # so the `renderer-android` AAR resolution + Robolectric launch
            # path is covered against the locally-published snapshot. The
            # other entries stay at discovery-only to keep the matrix fast.
            render: true
            # Also exercise the daemon end-to-end: spawn it via the launch
            # descriptor, render every preview, edit a source file, recompile,
            # render again, assert the PNGs were re-emitted. Catches
            # regressions in the daemon's Tier-3 invalidation + render queue
            # that the standalone `composePreviewRender` task can't see. See
            # .github/ci/daemon-roundtrip.py.
            daemon: true
          - name: wear-os-samples (WearTilesKotlin)
            slug: wear-tiles
            repo: android/wear-os-samples
            ref: main
            workdir: WearTilesKotlin
            module: app
            extra_gradle_args: ""
            # Render in addition to discover — WearTilesKotlin uses an older
            # Compose BOM than our renderer, which previously exposed a latent
            # transitive-dep issue (activity-compose 1.13 → navigationevent
            # resources not merged into the consumer's `apk-for-local-test.ap_`,
            # crashing Robolectric at Activity bootstrap with
            # `NoClassDefFoundError: androidx/navigationevent/R$id`). Discovery
            # never exercises that path; only composePreviewRender does. Keep this
            # entry rendering so the regression doesn't come back silently.
            render: true
            # Tiles-specific: fail the job unless at least one rendered preview
            # is of `kind: TILE`. Catches the case where discovery + rendering
            # both succeed but the tile path (`TilePreviewComposable` →
            # `TileRenderer.inflateAsync`) silently regressed to zero coverage
            # — e.g. if `@androidx.wear.tiles.tooling.preview.Preview` stopped
            # being recognized during discovery.
            require_tile_render: true
          # Confetti: dropped for now. :androidApp has @Preview functions but
          # discovery returned 0 (same bug we see in PeopleInSpace — track as a
          # follow-up). Render also fails on a :common:car KMP variant
          # ambiguity when resolving debugRuntimeClasspath. Re-add once both
          # are fixed.
          - name: androidify
            slug: androidify
            repo: android/androidify
            ref: main
            workdir: .
            module: app
            # No opt-outs after #1546's IP-cleanup pass (#1549 tracks the cross-project-metadata
            # follow-up). Re-add specific flags here (with a fresh comment naming the regression)
            # if the consumer's build surfaces a new CC / IP gap.
            extra_gradle_args: ""
            # Firebase Crashlytics + Google Services need a real
            # google-services.json that we don't ship. Comment the aliases
            # and the CrashlyticsExtension configure block out.
            pre_gradle_script: |
              python3 - <<'PY'
              import re
              from pathlib import Path
              p = Path("app/build.gradle.kts")
              t = p.read_text()
              # Only the Gradle-side Firebase integration needs disabling (those
              # plugins require google-services.json at configure time). The
              # runtime firebase.crashlytics library stays — CrashlyticsTree.kt
              # won't compile without it, and runtime Firebase calls just no-op
              # when not initialized.
              for line in (
                  "alias(libs.plugins.google.services)",
                  "alias(libs.plugins.crashlytics)",
                  "import com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsExtension",
              ):
                  t = t.replace(line, f"// {line} // disabled for integration CI")
              t = re.sub(
                  r"[ \t]*configure<CrashlyticsExtension>\s*\{[^}]*\}\s*\n",
                  "\n",
                  t,
              )
              p.write_text(t)
              print(f"patched {p}")
              PY
          - name: "nowinandroid (flavored app + library modules — #1546)"
            slug: nowinandroid
            repo: android/nowinandroid
            ref: main
            workdir: .
            # `:app` declares productFlavors `demo` / `prod` with build types
            # `debug` / `release`, so its variants are `demoDebug`, `prodDebug`,
            # `demoRelease`, `prodRelease` — no plain `debug`. `:app-nia-catalog`
            # is flavorless (`debug` / `release`). The build-type suffix
            # fallback added in #1546 is what makes `:app` register its
            # `composePreview*` tasks under the default `composePreview.variant
            # = debug` — without that, this entry would surface "Discovery ran
            # but every module reported zero previews" because the flavored
            # `:app` is skipped at the variant filter and `:app-nia-catalog`
            # alone has zero `@Preview` functions.
            #
            # Discovery-only (no `render: true`): nowinandroid has ~80 modules
            # and a render fan-out would dominate the matrix wall time. The
            # discovery path is what proves the variant-matching fix; render
            # coverage stays on the `wear-os-samples` cells.
            module: app
            # Firebase Crashlytics shape mirrors the `androidify` entry — same
            # plugin aliases, same `configure<CrashlyticsExtension>` block.
            # Library modules (`core:*`, `feature:*`) don't reach for Firebase
            # so only `app/build.gradle.kts` needs patching.
            pre_gradle_script: |
              python3 - <<'PY'
              import re
              from pathlib import Path
              p = Path("app/build.gradle.kts")
              if not p.exists():
                  raise SystemExit(f"expected build script not found: {p}")
              t = p.read_text()
              # Match the aliases nowinandroid declares as of `main`:
              # `gms` (the Google Services plugin alias used in libs.versions.toml)
              # and `firebase.crashlytics`. The defensive list also covers the
              # `google.services` alias androidify uses so the same script can
              # be reused if upstream renames.
              for line in (
                  "alias(libs.plugins.gms)",
                  "alias(libs.plugins.google.services)",
                  "alias(libs.plugins.firebase.crashlytics)",
                  "import com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsExtension",
              ):
                  t = t.replace(line, f"// {line} // disabled for integration CI")
              t = re.sub(
                  r"[ \t]*configure<CrashlyticsExtension>\s*\{[^}]*\}\s*\n",
                  "\n",
                  t,
              )
              p.write_text(t)
              print(f"patched {p}")
              PY
            # No opt-outs after #1546's IP-cleanup pass (#1549 tracks the cross-project-metadata
            # follow-up). Re-add specific flags here (with a fresh comment naming the regression)
            # if the consumer's build surfaces a new CC / IP gap.
            extra_gradle_args: ""
          - name: homeassistant-remotecompose
            slug: homeassistant-remotecompose
            repo: yschimke/homeassistant-remotecompose
            ref: main
            workdir: .
            # 17-module KMP-ish project (`:ha-model` / `:ha-client` shared
            # cores, `:rc-*` RemoteCompose layers, `:previews` fixture
            # module, `:demo-app`, `:app` / `:wear` / `:tv` flavor modules)
            # — broad discovery surface. The `:demo-app` cell exists because
            # of the 0-previews strictness bug (the dependency-jar filter
            # dropped every jar carrying `@Preview`); that's now a WARN-level
            # diagnostic in PreviewDiscovery rather than a hard failure, so
            # the workflow-wide ≥1 floor across `:previews` / `:app` / etc.
            # is the right gate here.
            module: ":demo-app"
            extra_gradle_args: ""
          - name: cadence (:composeApp)
            slug: cadence
            repo: yschimke/cadence
            ref: main
            workdir: .
            # `:composeApp` is `com.android.application` with the CMP plugins
            # also applied. Discovery-only — adds coverage of an external
            # consumer that already uses our plugin in anger.
            module: ":composeApp"
            # The build script applies `play.publisher` and a Play signing
            # config; both need credentials we don't ship. Comment them out
            # before Gradle reads the script.
            pre_gradle_script: |
              python3 - <<'PY'
              import re
              from pathlib import Path
              p = Path("composeApp/build.gradle.kts")
              if not p.exists():
                  raise SystemExit(f"expected build script not found: {p}")
              t = p.read_text()
              for line in (
                  "alias(libs.plugins.playPublisher)",
                  # `ReleaseStatus` is referenced only from the stripped
                  # `play { ... }` block below; leaving the import in place
                  # makes the Kotlin script fail to compile with an
                  # unresolved reference before discovery runs.
                  "import com.github.triplet.gradle.androidpublisher.ReleaseStatus",
              ):
                  t = t.replace(line, f"// {line} // disabled for integration CI")
              # `play { ... }` configure block has no creds in CI. Strip it
              # rather than try to materialise a service-account JSON.
              t = re.sub(
                  r"[ \t]*play\s*\{[^}]*\}\s*\n",
                  "\n",
                  t,
              )
              p.write_text(t)
              print(f"patched {p}")
              PY
            # Non-blocking initially: this is a freshly-added external
            # consumer and we want a turn or two of green/red signal before
            # flipping it to a hard gate.
            continue_on_error: true
            extra_gradle_args: ""
          - name: meshcore-mobile (:app)
            slug: meshcore-mobile
            repo: yschimke/meshcore-mobile
            ref: main
            workdir: .
            # KMP project with a dedicated Android `:app` module — most
            # `@Preview` functions live under `app/src/main/kotlin/.../ui/`
            # and `app/src/main/kotlin/.../widget/` (with a `@PreviewWrapper`
            # extension for the widget rendering path, which is what makes
            # this cell more than a duplicate of the other Android matrix
            # entries).
            module: ":app"
            # Non-blocking initially while we shake out any KMP-shape gotchas
            # the existing matrix entries don't already cover.
            continue_on_error: true
            extra_gradle_args: ""
          - name: adaptive-apps-samples (AdaptiveJetStream — XR spatial Compose)
            slug: jetstream-xr
            repo: android/adaptive-apps-samples
            ref: main
            workdir: AdaptiveJetStream
            module: ":jetstream"
            # AdaptiveJetStream's Hilt-generated Java targets source release 21,
            # so its `:jetstream:hiltJavaCompileDebug` fails on the matrix-default
            # JDK 17 with `error: invalid source release: 21`. Build this entry on
            # JDK 21 (mirrors the Samples-SDK21 lane). The compose-ai preview
            # daemon's own 17 toolchain is still resolved from the runner's
            # preinstalled JDKs via Gradle toolchain detection, so render still works.
            java_version: "21"
            # Upstream tracks androidx.xr.compose 1.0.0-alpha07, whose
            # `ApplicationSubspace` / `MovePolicy` / `SpatialConfiguration`
            # APIs were removed or deprecated by alpha14 — the version our XR
            # render path compiles against. Apply the in-repo alpha14 upgrade
            # patch to the freshly-checked-out tree before Gradle configures
            # the build (see "Apply consumer patch" step below).
            #
            # Idempotent by design: the apply step runs `git apply
            # --reverse --check` first, so once the same upgrade lands in
            # `android/adaptive-apps-samples@main` the patch is detected as
            # already-present and skipped rather than failing on a no-op. If
            # upstream instead drifts such that the patch no longer applies,
            # the step fails loudly so we re-cut it against the new baseline.
            patch_file: adaptive-apps-samples-xr-alpha14.patch
            # :jetstream carries 12 device-targeted previews via custom
            # multi-preview annotations (@PhonePreview/@TvPreview/etc.), so
            # discovery has real coverage. Render end-to-end too — this entry
            # exists to prove the renderer-android pipeline survives a real XR
            # Compose app once it's on the alpha14 baseline.
            render: true
            extra_gradle_args: ""
          # PeopleInSpace is a KMP project — the :app module is a thin Android
          # wrapper with no @Preview functions; all Compose UI lives in the
          # :common KMP module. Targeting :common needs KMP-Android-target
          # handling we don't have yet. Re-add once the plugin supports KMP
          # Android source sets cleanly.
          # androidchka entry temporarily disabled — re-enable by uncommenting.
          # The androidx-main pairing was firing too noisily on daily drift and
          # we need to stabilise the rest of the integration matrix first.
          # - name: androidchka (compose:material3 samples)
          #   slug: androidchka-material3
          #   repo: yschimke/androidchka
          #   ref: main
          #   workdir: .
          #   # Non-blocking on PRs: this entry pairs with a live `androidx-main`
          #   # checkout, so a failure here means *upstream* AndroidX shipped a
          #   # break — not that the PR did anything wrong. The daily cron is
          #   # still what surfaces the drift; we just don't want it gating
          #   # unrelated PR merges.
          #   continue_on_error: true
          #   # Daily drift sentinel against upstream androidx. androidchka
          #   # is a Gradle workspace that selectively builds a handful of
          #   # androidx modules from a sibling `androidx/androidx` checkout
          #   # (wired via a symlink at `androidx/` inside the workspace).
          #   # `local.properties` — written by the "Write local.properties"
          #   # step below — picks the source modules; everything else
          #   # resolves from the pinned androidx.dev snapshot. The cron at
          #   # the top of this workflow is what makes this catch
          #   # androidx-main breakage within 24h.
          #   secondary_repo: androidx/androidx
          #   secondary_ref: androidx-main
          #   secondary_path: androidx-src
          #   # Blob-filtered partial clone keeps the runner checkout under
          #   # ~1 GB; the working copy fetches file blobs on demand as
          #   # Gradle resolves them.
          #   secondary_filter: "blob:none"
          #   # androidchka's symlink shipped in-tree points at a developer's
          #   # own AndroidX checkout (relative path with no meaning in CI).
          #   # Replace it with an absolute symlink to the runner's
          #   # androidx-src checkout. See "Wire androidx symlink" below.
          #   wire_androidx_symlink: true
          #   # Activate just the material3 samples module — small enough to
          #   # configure quickly, but real `@Preview` coverage. Add more
          #   # sources here as the integration matures.
          #   local_properties: |
          #     androidx.sources=:compose:material3:material3:samples
          #     androidx.recursiveProjectDiscovery=main,samples
          #   module: ":compose:material3:material3:samples"
          #   extra_gradle_args: --no-configuration-cache
          #   # Exercise the CLI binary end-to-end rather than just the
          #   # Gradle path. See "CLI: list previews" / "CLI: render previews"
          #   # below.
          #   use_cli: true
          #   render: true
          #   # androidx-main + androidchka's build-logic require JDK 21.
          #   # The other matrix entries stay on the workflow-default 17.
          #   java_version: "21"
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: external
          persist-credentials: false

      - name: Checkout ${{ matrix.secondary_repo }} (secondary)
        if: matrix.secondary_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.secondary_repo }}
          ref: ${{ matrix.secondary_ref }}
          path: ${{ matrix.secondary_path }}
          filter: ${{ matrix.secondary_filter }}
          persist-credentials: false

      - name: Wire androidx symlink in androidchka workspace
        if: matrix.wire_androidx_symlink
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/${{ matrix.secondary_path }}"
          link="external/${{ matrix.workdir }}/androidx"
          # Drop the in-tree placeholder symlink (or directory) and replace
          # it with an absolute symlink to the secondary checkout.
          rm -rf "$link"
          ln -s "$target" "$link"
          ls -ld "$link"

      - name: Write local.properties for ${{ matrix.name }}
        if: matrix.local_properties != ''
        working-directory: external/${{ matrix.workdir }}
        env:
          LOCAL_PROPERTIES: ${{ matrix.local_properties }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          echo "--- local.properties ---"
          cat local.properties

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          # Matrix entries can override (e.g. androidchka needs 21 for
          # androidx-main); everyone else gets the 17 default.
          java-version: ${{ matrix.java_version || '17' }}

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compose-ai-bundle
          path: .

      - name: Install plugin and CLI
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf compose-ai-bundle.tar.gz -C bundle

          # Seed mavenLocal with the freshly-built plugin.
          mkdir -p "$HOME/.m2/repository"
          cp -R bundle/m2/. "$HOME/.m2/repository/"

          # Put the CLI on $PATH.
          chmod +x bundle/cli/bin/compose-preview
          echo "$GITHUB_WORKSPACE/bundle/cli/bin" >> "$GITHUB_PATH"

      - name: Materialise the bundled auto-inject init script
        env:
          # Tell the rendered init script to look at the snapshot we just
          # seeded into ~/.m2 in addition to the public plugin/Maven Central
          # repos. The flag has no effect on releases (mavenCentral has the
          # tagged version), but is mandatory for SNAPSHOT-driven CI.
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
        run: |
          set -euo pipefail
          init_script="$(compose-preview init-script --path)"
          echo "Materialised init script at: $init_script"
          echo "COMPOSE_AI_INIT_SCRIPT=$init_script" >> "$GITHUB_ENV"

      - name: Sanity check CLI
        run: compose-preview help

      - name: Make external gradlew executable
        working-directory: external/${{ matrix.workdir }}
        run: chmod +x ./gradlew

      - name: Apply consumer patch (idempotent)
        if: matrix.patch_file != ''
        # Runs from the external checkout root so the patch's
        # repo-root-relative paths (e.g. AdaptiveJetStream/jetstream/...)
        # line up with `git apply -p1`. The bundle was extracted into
        # $GITHUB_WORKSPACE/bundle by the "Install plugin and CLI" step.
        working-directory: external
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/bundle/ci/${{ matrix.patch_file }}"
          if [ ! -f "$patch" ]; then
            echo "::error::patch file not found in bundle: $patch"
            exit 1
          fi
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "${{ matrix.patch_file }} is already applied upstream — skipping."
          elif git apply --check "$patch" 2>/dev/null; then
            git apply "$patch"
            echo "Applied ${{ matrix.patch_file }}."
          else
            echo "::error::${{ matrix.patch_file }} does not apply cleanly against ${{ matrix.repo }}@${{ matrix.ref }} (upstream likely drifted). Re-cut the patch against the new baseline."
            exit 1
          fi

      - name: Repo-specific pre-Gradle patches
        if: matrix.pre_gradle_script != ''
        working-directory: external/${{ matrix.workdir }}
        run: ${{ matrix.pre_gradle_script }}

      - name: Discover previews via Gradle
        if: ${{ !matrix.use_cli }}
        working-directory: external/${{ matrix.workdir }}
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # Unqualified task name runs composePreviewDiscover in every subproject
          # the init script applied the plugin to (i.e. every Android /
          # Compose-multiplatform module).
          ./gradlew --init-script "$COMPOSE_AI_INIT_SCRIPT" composePreviewDiscover \
            ${{ matrix.extra_gradle_args }} \
            --stacktrace

      - name: CLI — list previews (${{ matrix.module }})
        if: matrix.use_cli
        working-directory: external/${{ matrix.workdir }}
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # `compose-preview list` auto-injects the same init script via the
          # Tooling API and drives composePreviewDiscover under the hood, so this
          # exercises the CLI binary's end-to-end pipeline (not just the
          # Gradle path used by the other matrix entries).
          compose-preview list --module "${{ matrix.module }}"

      - name: Verify previews.json was produced
        working-directory: external/${{ matrix.workdir }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find . -path '*/build/compose-previews/previews.json' -not -path '*/external/build/*' 2>/dev/null)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No previews.json produced anywhere in the tree."
            exit 1
          fi
          total=0
          for m in "${manifests[@]}"; do
            n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('previews', [])))" "$m")
            echo "  $m → $n preview(s)"
            total=$((total + n))
          done
          echo "Total discovered: $total preview(s) across ${#manifests[@]} module(s)"
          if [ "$total" -lt 1 ]; then
            echo "::error::Discovery ran but every module reported zero previews."
            exit 1
          fi

      - name: Render previews via Gradle
        if: ${{ matrix.render && !matrix.use_cli }}
        working-directory: external/${{ matrix.workdir }}
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # composePreviewRender depends on composePreviewDiscover, so we get both in one
          # invocation. This is the step that exercises renderer-android AAR
          # resolution from mavenLocal — the artifact path external consumers
          # hit at runtime.
          ./gradlew --init-script "$COMPOSE_AI_INIT_SCRIPT" composePreviewRender \
            ${{ matrix.extra_gradle_args }} \
            --stacktrace

      - name: CLI — render previews (${{ matrix.module }})
        if: ${{ matrix.render && matrix.use_cli }}
        working-directory: external/${{ matrix.workdir }}
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # `compose-preview render` drives composePreviewRender end-to-end via
          # the Tooling API, including renderer-android AAR resolution from
          # the mavenLocal snapshot we seeded earlier.
          compose-preview render --module "${{ matrix.module }}"

      - name: Verify PNGs were produced
        if: matrix.render
        working-directory: external/${{ matrix.workdir }}
        run: |
          set -euo pipefail
          mapfile -t pngs < <(find . -path '*/build/compose-previews/renders/*.png' -not -path '*/external/build/*' 2>/dev/null)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::composePreviewRender ran but no PNG files were produced."
            mapfile -t sidecars < <(find . -path '*/build/compose-previews/renders/*.error.json' -not -path '*/external/build/*' 2>/dev/null)
            if [ "${#sidecars[@]}" -gt 0 ]; then
              echo "Render error sidecars:"
              printf '  %s\n' "${sidecars[@]}"
            fi
            exit 1
          fi
          echo "Rendered ${#pngs[@]} PNG file(s):"
          printf '  %s\n' "${pngs[@]}"

      - name: Configure daemon in consumer build
        if: matrix.daemon
        working-directory: external/${{ matrix.workdir }}
        run: |
          set -euo pipefail
          # Append the stable composePreview.daemon block to the matrix module's build.gradle(.kts)
          # so composePreviewDaemonStart writes `enabled: true` into the launch descriptor.
          # Idempotent for the CI-injected block, but still overrides a consumer block that
          # explicitly sets enabled = false.
          python3 - <<'PY'
          from pathlib import Path
          import os
          module = os.environ["MATRIX_MODULE"]
          # Find the most likely build script for that module: top-level <module>/build.gradle.kts
          # (most apps), then fall back to top-level build.gradle. ComposeStarter has app/build.gradle.kts.
          candidates = [
              Path(module) / "build.gradle.kts",
              Path(module) / "build.gradle",
          ]
          for p in candidates:
              if not p.exists():
                  continue
              text = p.read_text()
              suffix = "\n\ncomposePreview {\n  daemon {\n    enabled = true\n  }\n}\n"
              if suffix.strip() in text:
                  print(f"daemon enable block already present in {p}")
                  break
              p.write_text(text + suffix)
              print(f"appended daemon enable block to {p}")
              break
          else:
              raise SystemExit(f"no build script found for module {module}")
          PY
        env:
          MATRIX_MODULE: ${{ matrix.module }}

      - name: Emit daemon launch descriptor (composePreviewDaemonStart)
        if: matrix.daemon
        working-directory: external/${{ matrix.workdir }}
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # Writes <module>/build/compose-previews/daemon-launch.json (the JSON the
          # VS Code extension reads to spawn the daemon JVM directly).
          ./gradlew --init-script "$COMPOSE_AI_INIT_SCRIPT" composePreviewDaemonStart \
            ${{ matrix.extra_gradle_args }} \
            --stacktrace

      - name: Daemon round-trip (spawn → render → edit → re-render)
        if: matrix.daemon
        working-directory: external/${{ matrix.workdir }}
        env:
          # The recompile step inside daemon-roundtrip.py runs `./gradlew
          # compileDebugKotlin` — and the previous "Configure daemon in
          # consumer build" step appended a `composePreview { daemon { ... } }`
          # extension block to the consumer's build script. That block can
          # only be evaluated when our plugin is applied, so the recompile
          # invocation has to carry `--init-script "$COMPOSE_AI_INIT_SCRIPT"`
          # too (threaded through `--gradle-args` below).
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          descriptor=$(find . -path '*/build/compose-previews/daemon-launch.json' \
            -not -path '*/external/build/*' | head -1)
          if [ -z "$descriptor" ]; then
            echo "::error::No daemon-launch.json produced by composePreviewDaemonStart."
            exit 1
          fi
          manifest=$(find . -path '*/build/compose-previews/previews.json' \
            -not -path '*/external/build/*' | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::No previews.json produced — composePreviewDiscover must run before this step."
            exit 1
          fi
          # Resolve module Gradle path from the descriptor (modulePath field) so the script
          # doesn't have to re-derive it from the matrix.
          module_id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['modulePath'])" "$descriptor")
          echo "Driving daemon for module $module_id"
          echo "  descriptor: $descriptor"
          echo "  manifest:   $manifest"
          python3 "$GITHUB_WORKSPACE/bundle/ci/daemon-roundtrip.py" \
            --descriptor "$descriptor" \
            --manifest "$manifest" \
            --workspace-root "$(pwd)" \
            --module-id "$module_id" \
            --gradle-recompile-cwd "$(pwd)" \
            --gradle-args "--init-script $COMPOSE_AI_INIT_SCRIPT ${{ matrix.extra_gradle_args }}"

      - name: Upload daemon launch descriptor
        if: always() && matrix.daemon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-launch-${{ matrix.slug }}
          path: external/**/build/compose-previews/daemon-launch.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify at least one TILE preview was rendered
        if: matrix.render && matrix.require_tile_render
        working-directory: external/${{ matrix.workdir }}
        run: |
          set -euo pipefail
          # Walk every module's previews.json, count entries with `kind: TILE`
          # that also have a corresponding PNG on disk. Tiles-only matrix
          # entries (like WearTilesKotlin) must produce at least one such
          # preview, otherwise a silent regression in the tile discovery or
          # TileRenderer.inflateAsync path would pass unnoticed.
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          total_tiles = 0
          for manifest in Path('.').rglob('build/compose-previews/previews.json'):
              if 'external/build' in str(manifest):
                  continue
              data = json.loads(manifest.read_text())
              renders_dir = manifest.parent / 'renders'
              for p in data.get('previews', []):
                  if p.get('params', {}).get('kind') != 'TILE':
                      continue
                  png = renders_dir / Path(p.get('renderOutput', '')).name
                  if png.exists():
                      total_tiles += 1
                      print(f"  tile rendered: {png}")
          print(f"Total TILE previews rendered: {total_tiles}")
          if total_tiles == 0:
              print("::error::require_tile_render=true but zero TILE-kind previews were rendered end-to-end.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload previews.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previews-${{ matrix.slug }}
          path: external/**/build/compose-previews/previews.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload rendered PNGs
        if: always() && matrix.render
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renders-${{ matrix.slug }}
          path: |
            external/**/build/compose-previews/renders/*.png
            external/**/build/compose-previews/renders/*.error.json
          if-no-files-found: warn
          retention-days: 7

  agp8-min:
    # Floor-coverage job for AGP 8.x consumers. Uses the in-repo fixture under
    # `.github/ci/fixtures/agp8-min/` (Gradle 8.13 + AGP 8.13.0 + Kotlin 2.0.21
    # + compileSdk 36) so we exercise the bottom of our publicly-supported
    # consumer envelope on every push, without cloning a 2 GB external repo.
    # Distinct from the `integration` matrix above because it skips the
    # external-checkout / pre-Gradle-patch dance entirely — the fixture is
    # already shaped exactly the way we want it. The plugin still rides in
    # via the same init script, so the auto-apply path is exercised here too.
    name: agp8-min (Gradle 8.13)
    needs: build-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for the fixture)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          # JDK 17 — the realistic toolchain for an AGP 8.x consumer. The
          # fixture's `compileSdk = 36` would normally trip Robolectric
          # 4.16.1's `DefaultSdkProvider.verifySupportedSdk` (it refuses to
          # synthesize a SDK 36 sandbox on JDK 17 — see
          # docs/SDK_COMPATIBILITY.md row 2). The fixture works around that
          # by pinning `composePreview.sdkVersion = 35` (the documented
          # JDK-17 rescue path, row 4), so Robolectric stays inside JDK
          # 17's window while AGP still gets the `compileSdk = 36` that
          # renderer-android's `minCompileSdk` requires.
          java-version: 17

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compose-ai-bundle
          path: .

      - name: Install plugin and CLI
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf compose-ai-bundle.tar.gz -C bundle
          mkdir -p "$HOME/.m2/repository"
          cp -R bundle/m2/. "$HOME/.m2/repository/"
          chmod +x bundle/cli/bin/compose-preview
          echo "$GITHUB_WORKSPACE/bundle/cli/bin" >> "$GITHUB_PATH"

      - name: Materialise the bundled auto-inject init script
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
        run: |
          set -euo pipefail
          init_script="$(compose-preview init-script --path)"
          echo "Materialised init script at: $init_script"
          echo "COMPOSE_AI_INIT_SCRIPT=$init_script" >> "$GITHUB_ENV"

      - name: Stage fixture outside the source tree
        # Copying out of the checkout keeps the fixture's `build/` and
        # `.gradle/` directories from polluting `git status` if a developer
        # runs the same workflow locally with `act`.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          cp -R .github/ci/fixtures/agp8-min/. "$RUNNER_TEMP/fixture/"
          chmod +x "$RUNNER_TEMP/fixture/gradlew"

      # ── Three-phase BOM-floor test ────────────────────────────────────
      # The committed fixture pins `compose-bom` to 2026.05.00 (matches
      # `compose-bom-stable` in `gradle/libs.versions.toml` — what
      # `:samples:android` uses) and the preview source references
      # `androidx.compose.material3.VerticalDragHandle`, a material3 1.4.0
      # composable. To prove the BOM floor is real AND that
      # `compose-preview doctor` explains it, we:
      #   1. Downgrade the staged fixture's BOM to 2024.12.01 (material3
      #      1.3.1, no `VerticalDragHandle`).
      #   2. Run `composePreviewRender` and assert it FAILS — `compileDebugKotlin`
      #      errors out on the unresolved `VerticalDragHandle` import.
      #      Same failure shape a real consumer hits when their source
      #      reaches for a new Compose API ahead of their BOM.
      #   3. Run `compose-preview doctor --json` and assert
      #      `env.compose-bom-version` fires as `warning` — the doctor's
      #      pre-flight catches the too-old BOM before any compile attempt.
      #   4. Bump the staged BOM back to 2026.05.00, clear stale outputs,
      #      re-run `composePreviewRender`. Expect a clean PNG.
      # Any drift in either direction (BOM floor moves, M3 1.4 features
      # land elsewhere, or doctor stops surfacing the check) flips red.
      - name: Phase 1 — downgrade staged fixture BOM below the material3 1.4 line
        env:
          OLD_BOM: "2024.12.01"
        run: |
          set -euo pipefail
          fixture_build="$RUNNER_TEMP/fixture/app/build.gradle.kts"
          # Single anchored substitution so we don't accidentally rewrite an
          # unrelated `androidx.compose:compose-bom:*` reference if the
          # fixture grows.
          sed -i -E "s|(\"androidx\.compose:compose-bom:)[^\"]+(\")|\\1${OLD_BOM}\\2|" "$fixture_build"
          echo "--- patched compose-bom line ---"
          grep "compose-bom" "$fixture_build"

      - name: Phase 1 — composePreviewRender must FAIL on the too-old BOM
        working-directory: ${{ runner.temp }}/fixture
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          set +e
          ./gradlew --init-script "$COMPOSE_AI_INIT_SCRIPT" composePreviewRender \
            --no-configuration-cache --stacktrace
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::composePreviewRender unexpectedly succeeded against compose-bom 2024.12.01. Previews.kt imports androidx.compose.material3.VerticalDragHandle (material3 1.4.0); 2024.12.01 ships material3 1.3.1 without it, so compileDebugKotlin should fail. Either the BOM mapping changed (move the Phase 1 pin lower) or the preview no longer references a post-1.3 API (pick a fresher one)."
            exit 1
          fi
          echo "composePreviewRender failed as expected (exit code $rc); proceeding to doctor."

      - name: Phase 2 — compose-preview doctor must surface env.compose-bom-version
        working-directory: ${{ runner.temp }}/fixture
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          # `compose-preview doctor --json` runs the CLI's pre-flight checks
          # (including the BOM grep against `build.gradle.kts`) and then
          # falls through to the Gradle `composePreviewDoctor` task. The
          # `env.compose-bom-version` check fires when any declared
          # `compose-bom` is below the renderer floor (2025.01.00) — that's
          # the user-facing diagnostic we want this job to guarantee.
          compose-preview doctor --json --project "$RUNNER_TEMP/fixture" \
            > "$RUNNER_TEMP/doctor.json" || true
          echo "--- doctor.json ---"
          cat "$RUNNER_TEMP/doctor.json"
          echo "--- assertion ---"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          checks = report.get("checks", [])
          target = next(
              (c for c in checks if c.get("id") == "env.compose-bom-version"),
              None,
          )
          if target is None:
              ids = [c.get("id") for c in checks]
              print(
                  "::error::doctor did not surface an `env.compose-bom-version` check. "
                  f"Checks present: {ids}"
              )
              sys.exit(1)
          if target.get("status") != "warning":
              print(
                  "::error::env.compose-bom-version fired but status is "
                  f"{target.get('status')!r}, expected 'warning'. Check: {target}"
              )
              sys.exit(1)
          print(f"env.compose-bom-version → {target.get('status')}")
          print(f"  message: {target.get('message')}")
          remediation = target.get("remediation") or {}
          if remediation:
              print(f"  summary: {remediation.get('summary')}")
              for cmd in remediation.get("commands", []):
                  print(f"  fix:     {cmd}")
          PY

      - name: Phase 3 — bump staged fixture BOM back to the committed pin
        env:
          NEW_BOM: "2026.05.00"
        run: |
          set -euo pipefail
          fixture_build="$RUNNER_TEMP/fixture/app/build.gradle.kts"
          sed -i -E "s|(\"androidx\.compose:compose-bom:)[^\"]+(\")|\\1${NEW_BOM}\\2|" "$fixture_build"
          echo "--- patched compose-bom line ---"
          grep "compose-bom" "$fixture_build"
          # Drop the failed-render artifacts so the PNG-presence check below
          # can't pick up stale `*.error.json` sidecars from phase 1.
          rm -rf "$RUNNER_TEMP/fixture/app/build/compose-previews"

      - name: Phase 3 — composePreviewRender must PASS at renderer floor
        working-directory: ${{ runner.temp }}/fixture
        env:
          COMPOSE_PREVIEW_INIT_USE_MAVEN_LOCAL: "1"
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          # composePreviewRender depends on composePreviewDiscover, so this single task
          # call covers both the discovery path and the renderer-android AAR
          # resolution from the mavenLocal snapshot seeded earlier. This is
          # the "oldest AGP × Kotlin together" floor-coverage cell (Gradle
          # 8.13 + AGP 8.13.0 + Kotlin 2.0.21 + JDK 17 + compose-bom 2026.05.00).
          ./gradlew --init-script "$COMPOSE_AI_INIT_SCRIPT" composePreviewRender \
            --no-configuration-cache --stacktrace

      - name: Verify previews.json was produced
        working-directory: ${{ runner.temp }}/fixture
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find . -path '*/build/compose-previews/previews.json' 2>/dev/null)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No previews.json produced anywhere in the tree."
            exit 1
          fi
          total=0
          for m in "${manifests[@]}"; do
            n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('previews', [])))" "$m")
            echo "  $m → $n preview(s)"
            total=$((total + n))
          done
          echo "Total discovered: $total preview(s) across ${#manifests[@]} module(s)"
          if [ "$total" -lt 1 ]; then
            echo "::error::Discovery ran but every module reported zero previews."
            exit 1
          fi

      - name: Verify PNGs were produced
        working-directory: ${{ runner.temp }}/fixture
        run: |
          set -euo pipefail
          mapfile -t pngs < <(find . -path '*/build/compose-previews/renders/*.png' 2>/dev/null)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::composePreviewRender ran but no PNG files were produced."
            mapfile -t sidecars < <(find . -path '*/build/compose-previews/renders/*.error.json' 2>/dev/null)
            if [ "${#sidecars[@]}" -gt 0 ]; then
              echo "Render error sidecars:"
              printf '  %s\n' "${sidecars[@]}"
            fi
            exit 1
          fi
          echo "Rendered ${#pngs[@]} PNG file(s):"
          printf '  %s\n' "${pngs[@]}"

      - name: Upload doctor.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doctor-agp8-min
          path: ${{ runner.temp }}/doctor.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload previews.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previews-agp8-min
          path: ${{ runner.temp }}/fixture/**/build/compose-previews/previews.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload rendered PNGs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renders-agp8-min
          path: |
            ${{ runner.temp }}/fixture/**/build/compose-previews/renders/*.png
            ${{ runner.temp }}/fixture/**/build/compose-previews/renders/*.error.json
          if-no-files-found: warn
          retention-days: 7
