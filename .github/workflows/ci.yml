  build-cli:
    name: Build CLI
    needs: changes
    if: ${{ needs.changes.outputs.build_cli == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Release builds no longer package the per-OS bundle-viewer binaries. Compile
      # and test its source here so removing that packaging matrix does not also
      # remove the viewer's only automated coverage.
      - name: Build CLI and bundle viewer
        run: ./gradlew :cli:build :bundle-viewer:build

  # End-to-end gate for the XR composite still: build the native xr-composite binary, then run
  # the xr-spatial sample's full render so composePreviewRenderXr writes scene.json + panel
  # textures and composePreviewCompositeXr bakes composite.png from them — headless, no GPU.
  # This is otherwise only exercised by hand, so without a gate the binary↔plugin contract
  # (CLI flags, sanitised composite path, the optional capture in previews.json) can silently
  # rot. The graceful no-binary path is covered by the plugin unit/functional tests.
  render-xr-composite:
    name: Render XR composite (sample)
    # Heavy (builds the native clang compositor + Xvfb render, ~6 min). Drift
    # detector, not a PR gate — runs on push-to-main + nightly, skipped on PRs
    # (a skipped required check counts as passing for branch protection).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Build the compositor (clang + libc++ against the pinned Filament SDK) and its compiled
      # materials into dist/ — the same composite action the build/release workflows use.
      - uses: ./.github/actions/build-xr-composite
        with:
          platform: linux
      # The prebuilt Filament Linux backend is GLX-only, so headless rendering needs a virtual
      # X display (Xvfb) routed to Mesa's llvmpipe software rasteriser — no GPU required.
      - name: Install Xvfb + Mesa software GL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      # Run the whole render under Xvfb (so DISPLAY is set) with --no-daemon (so the composite
      # task's subprocess inherits the software-GL env from this step rather than a stale daemon).
      - name: Render xr-spatial sample (bake composite)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            ./gradlew --no-daemon :samples:xr-spatial:composePreviewRenderAll \
              -PcomposePreview.xrCompositeBinary="$PWD/dist/xr-composite" \
              -PcomposePreview.xrCompositeMaterials="$PWD/dist/materials" \
              --stacktrace
      - name: Assert composite baked + referenced in the manifest
        shell: bash
        run: |
          set -euo pipefail
          base=samples/xr-spatial/build/compose-previews
          png="$(find "$base/renders" -name composite.png -print -quit)"
          if [ -z "$png" ] || [ ! -s "$png" ]; then
            echo "::error::no non-empty composite.png under $base/renders"
            find "$base/renders" -maxdepth 2 -type f | sort || true
            exit 1
          fi
          file "$png" | grep -q 'PNG image data' || { echo "::error::$png is not a PNG"; exit 1; }
          grep -q 'composite.png' "$base/previews.json" \
            || { echo "::error::previews.json has no composite capture"; exit 1; }
          echo "OK: baked $png ($(du -h "$png" | cut -f1)), referenced in previews.json"
      # Capture the 3D spatial webview fed by the REAL composePreviewRenderXr
      # output (scene.json + harvested compose-spatial-semantics.json + panel
      # textures) — the true end-to-end spatial-view capture, as opposed to the
      # committed `spatial-rich` proxy the vscode-preview-comment bot diffs. The
      # generator + its shape are unit-tested (spatialXrRealGen.test.ts); this
      # step exercises the live path and uploads the rendered PNG for inspection.
      # Best-effort: a missing scene or a webview hiccup never fails this job.
      - name: Capture spatial webview from the real XR render
        if: always()
        # Inspection-only artifact: a flaky npm ci / Chromium / snapshot must
        # never fail the XR composite gate. `if: always()` only controls whether
        # the step runs — `continue-on-error` is what keeps its failure non-fatal.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          base=samples/xr-spatial/build/compose-previews/renders
          scene="$(find "$base" -name scene.json -print -quit 2>/dev/null || true)"
          if [ -z "$scene" ]; then
            echo "no scene.json under $base — skipping spatial webview capture"
            exit 0
          fi
          renderdir="$(dirname "$scene")"
          echo "Capturing spatial webview from $renderdir"
          # Stage the real render's scene + textures where the harness static
          # server resolves them (rooted at the extension dir → /spatial-fixtures/).
          dest=vscode-extension/spatial-fixtures/spatial-xr-real
          rm -rf "$dest" && mkdir -p "$dest"
          cp "$renderdir"/*.png "$dest"/ 2>/dev/null || true
          cp "$renderdir"/scene.json "$dest"/ 2>/dev/null || true
          cp "$renderdir"/compose-spatial-semantics.json "$dest"/ 2>/dev/null || true
          # Generate the harness fixture from the real render dir.
          node vscode-extension/preview-harness/fixtures/spatial-xr-real.gen.mjs \
            --render-dir "$renderdir" \
            --texture-base /spatial-fixtures/spatial-xr-real/ \
            > vscode-extension/preview-harness/fixtures/spatial-xr-real.json
          # Render just this fixture under Chromium → preview-harness/out/.
          ( cd vscode-extension
            npm ci
            npx playwright install --with-deps chromium
            HARNESS_FIXTURE=spatial-xr-real npm run harness:snapshot )
      - name: Upload spatial webview render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spatial-xr-real-render
          path: vscode-extension/preview-harness/out/spatial-xr-real.*.png
          if-no-files-found: warn
      # Exercise the long-lived server path (--serve): initialize -> render -> xr/updatePanels over
      # JSON-RPC stdio, asserting streamFrame notifications arrive and a per-frame panel update
      # actually changes the rendered image. Reuses the dist/ binary + materials and the committed
      # spatial-scene fixture.
      - name: Smoke-test the render server (--serve)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            python3 renderers/xr-composite/test/serve_smoke.py \
              "$PWD/dist/xr-composite" "$PWD/dist/materials" \
              "$PWD/vscode-extension/preview-harness/fixtures/spatial-scene"
      # Exercise the JVM client (:renderer-xr-client) against the real native server: unit tests
      # plus the XR_COMPOSITE_BIN-gated XrRenderServerIntegrationTest, which spawns the dist binary
      # and asserts a per-frame panel update changes the image. Mirrors the python smoke from Kotlin.
      - name: Integration-test the JVM client against the native server
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          XR_COMPOSITE_BIN: ${{ github.workspace }}/dist/xr-composite
          XR_COMPOSITE_MATERIALS: ${{ github.workspace }}/dist/materials
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            ./gradlew --no-daemon :renderer-xr-client:test --stacktrace
      - name: Upload XR composite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xr-spatial-composite
          path: samples/xr-spatial/build/compose-previews/renders/**/composite.png
          if-no-files-found: warn

  spatial-scene-codegen:
    name: SpatialScene codegen up to date
    needs: changes
    if: ${{ needs.changes.outputs.spatial_scene == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The Kotlin / TypeScript / C++ SpatialScene mirrors are generated from
      # schema/spatial-scene.schema.json. Fail if a committed mirror drifts from the schema.
      - name: Check generated mirrors match the schema
        run: node scripts/codegen/gen-spatial-scene.mjs --check

  bundle-render:
    name: Bundle Render E2E
    # Heavy E2E (~7 min, cold-starts Compose Desktop per preview). Drift
    # detector — runs on push-to-main + nightly, skipped on PRs (skipped
    # required check == passing).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # End-to-end: pack a bundle from a synthetic Compose Desktop project, then re-render it
      # outside of any Gradle project by spawning the actual CLI binary against the packed PNG.
      # The aggregate task pre-publishes the plugin to mavenLocal (so the synthetic project's
      # `id("ee.schimke.composeai.preview") version "<v>"` resolves) and builds the CLI install
      # dist (so the `bundle render` subprocess has its `lib-renderer/` companion). Opt-in via
      # `-Pbundle.render.e2e=true` because the test cold-starts Compose Desktop per preview.
      #
      # Split into two phases to dodge a parallel-execution race: the gradle-plugin functionalTest
      # task (in the included build) can start before `:cli:installDist` finishes copying the
      # CLI's lib jars, so the test's first `compose-preview` subprocess crashes with
      # `NoClassDefFoundError` against a half-populated lib dir. Pre-building the install dir
      # serialises the two and is otherwise no-op (the second run sees up-to-date inputs).
      - name: Pre-build CLI install + publish plugin
        run: ./gradlew :cli:installDist :gradle-plugin:publishToMavenLocal --stacktrace
      - name: Bundle render e2e
        run: ./gradlew functionalTestWithBundleRender -Pbundle.render.e2e=true --stacktrace
      - name: Upload functionalTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-render-functional-test-reports
          path: gradle-plugin/build/reports/tests/functionalTest/

  android-bundle-daemon-e2e:
    name: Android Bundle Daemon E2E
    # Heavy E2E (~9 min, cold-starts a daemon JVM per bundle). Drift detector —
    # runs on push-to-main + nightly, skipped on PRs (skipped required check ==
    # passing).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # End-to-end for the Android path of `bundle daemon`: pack real-sample bundles (Wear tile +
      # Remote Compose IR, plus classic Compose previews), then spawn the actual CLI binary against
      # each and render protolayout / remotecompose / classic previews to PNG via the Robolectric
      # daemon. Guards (1) the Android daemon runtime being staged by `:cli:stageDaemonAndroidLibs`
      # (post-#1685 it ships as a standalone archive, not inside the CLI dist; the test points the
      # CLI at the staged dir via `-Dcomposeai.cli.libDaemonAndroidDir`) and (2)
      # `BundleDaemonCommand.composeDaemonClasspath` putting the carried IR-replay libs on the
      # daemon `-cp` (else replay dies with NoClassDefFoundError). The ubuntu-latest image ships an
      # Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT) which the daemon launch resolves android.jar
      # from. Opt-in via `-Pbundle.daemon.android.e2e=true` — cold-starts a daemon JVM per bundle.
      #
      # Split into two phases for the same parallel-execution race the desktop bundle-render job
      # documents: the included-build functionalTest can start before `:cli:installDist` finishes
      # populating the lib dirs. Pre-building serialises the two (and is otherwise no-op).
      #
      # Render the samples FIRST, in their own invocation, exactly as the desktop bundle-render job
      # does (preview-bundle-ascii.yml): `composePreviewBundle` deliberately does NOT depend on
      # `composePreviewRender` (packing without a render is a valid stub-cover flow) — it only
      # `mustRunAfter`s it. So the IR sidecars (`<stem>.tilelayout`/`.tileresources`/`.rc`) the
      # render step writes beside each PNG have to already exist on disk before the bundle task's
      # first execution to be baked into `intermediateRepresentations`. Without this step the packed
      # bundles carry no IR and every preview falls back to classic, so the protolayout/remotecompose
      # assertions below can never pass. `composePreviewBundle` tracks the renders dir as an input
      # (`renderFiles`), so the fresh renders are picked up — no `--rerun-tasks` needed.
      # `missingRenders=warn` rather than the default `fail`: these samples render here for the first
      # time, and the E2E only needs at least one protolayout + one remotecompose IR to land — a
      # single stubborn preview shouldn't fail the whole job (its `.error.json` still surfaces).
      - name: Render sample previews (captures Wear tile + Remote Compose IR sidecars)
        run: >-
          ./gradlew
          :samples:wear:composePreviewRenderAll
          :samples:remotecompose:composePreviewRenderAll
          -PcomposePreview.missingRenders=warn
          --stacktrace
      - name: Pre-build CLI install + sample bundles + publish plugin
        run: >-
          ./gradlew :cli:installDist
          :cli:stageDaemonAndroidLibs
          :samples:wear:composePreviewBundle
          :samples:remotecompose:composePreviewBundle
          :gradle-plugin:publishToMavenLocal --stacktrace
      - name: Android bundle daemon e2e
        run: ./gradlew functionalTestWithAndroidBundleDaemon -Pbundle.daemon.android.e2e=true --stacktrace
      - name: Upload functionalTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-bundle-daemon-functional-test-reports
          path: gradle-plugin/build/reports/tests/functionalTest/

  agent-audit-samples:
    name: Agent Audit Samples
    # Longest single job (~12 min; one external-fetched audit script). Drift
    # detector — runs on push-to-main + nightly, skipped on PRs (skipped
    # required check == passing).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Fetch agent audit script from yschimke/skills
        # The script lives in the sibling skills repo since it's part of the
        # compose-preview-review skill bundle; fetch the pinned ref so CI
        # exercises the same harness the skill ships. Drop it at the same
        # 3-deep path the script expects (Path(__file__).parents[3] == repo
        # root) so SAMPLE/OUT/CLI resolve to the workspace checkout.
        run: |
          mkdir -p skills/compose-preview-review/scripts
          curl -fsSL -o skills/compose-preview-review/scripts/run-agent-audit-samples.py \
            "https://raw.githubusercontent.com/yschimke/skills/main/skills/compose-preview-review/scripts/run-agent-audit-samples.py"
      - name: Run agent audit sample scripts
        run: python3 skills/compose-preview-review/scripts/run-agent-audit-samples.py
      - name: Upload agent audit outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-audit-sample-outputs
          path: build/agent-audit-samples/

  # Pure-stdlib unittest for the script that drives `preview-baselines` and
  # `preview-comment` actions. Lives here because the script is JSON-shape-
  # coupled to the CLI — running it on every PR catches contract breaks
  # (e.g. PR #76 bare-list → envelope) before they hit a real PR.
  actions-tests:
    name: Actions Script Tests
    needs: changes
    if: ${{ needs.changes.outputs.actions_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run compare-previews tests
        run: python3 .github/actions/lib/test_compare_previews.py -v
      - name: Run vscode-preview-diff tests
        run: python3 .github/actions/lib/test_vscode_preview_diff.py -v
      - name: Run a11y-report tests
        run: python3 .github/actions/lib/test_a11y_report.py -v
      - name: Run notification-previews tests
        run: python3 .github/actions/lib/test_notification_previews.py -v
      - name: Run xr-gallery tests
        run: python3 .github/actions/lib/test_xr_gallery.py -v
      - name: Run apply skew-guard tests
        run: python3 .github/actions/apply/test_check_skew.py -v
      - name: Run post-comment tests
        run: python3 .github/actions/apply/test_post_comment.py -v
      - name: Run apply change-scope tests
        run: python3 .github/actions/apply/test_compute_scope.py -v
      - name: Run change-scope classifier tests
        run: python3 .github/ci/test_change_scope.py -v
      - name: Run per-job path-scope classifier tests
        run: python3 .github/ci/test_path_scope.py -v
      # The AdaptiveJetStream XR cell renders the sample's Subspaces with OUR compose-testing
      # against ITS compose. A version skew there fails only on main (the XR step is skipped on
      # PRs) and only at runtime, with a message that points nowhere near the cause.
      - name: Run consumer XR version-skew guard
        run: python3 .github/ci/check_consumer_xr_version.py
      - name: Run affected Gradle test-scope tests
        run: python3 .github/ci/test_affected_gradle_tests.py -v
      - name: Run scoped findings filter tests
        run: python3 .github/actions/apply/test_filter_findings_scope.py -v
      # Guards the path→system mapping that decides which design-artifacts delivery
      # branches a merge to main regenerates. A false negative there strands a
      # published catalog on stale renders without any signal.
      - name: Run design-artifacts scope tests
        run: scripts/design-artifacts/test-scope-systems.sh
      # Covers the workflow step wrapped around that mapping — the force-all input
      # the release chain depends on, and the compare-endpoint 300-file cap. Both
      # fail silently in production (a delivery branch just stops regenerating).
      - name: Run design-artifacts scope-step tests
        run: scripts/design-artifacts/test-scope-step.sh
      # Guards the preview-host image's baked font cache. Its failure mode is silent: a wrong
      # cache filename or a skipped stage-2 range query leaves faces the renderer never finds, so
      # the live daemon quietly falls back to Roboto and drifts from the baked catalog PNGs again.
      - name: Run preview-image font-prewarm tests
        run: deploy/image/test-prewarm-fonts.sh
      - name: Run daemon round-trip transport tests
        run: python3 .github/ci/test_daemon_roundtrip.py -v
      # The android-all cache-key script DELETES ~200 MB coordinate directories
      # on the integration runners, so "only drops what it says it drops" — and
      # "the key moves iff the retained set moves" — are gated, not eyeballed.
      - name: Run android-all cache-key tests
        run: python3 .github/ci/test_android_all_cache_key.py -v
      # The deploy image's .env migrations edit an operator's live config on an
      # already-deployed box, so the "leaves a custom catalog list alone" cases
      # are worth a gate rather than a manual check.
      - name: Run deploy .env migration tests
        run: ./deploy/image/test-env-migrations.sh
      # The seed-config reconcile POSTs to a live server's admin API during publish, so its
      # ordering (trust before catalogs) and payload-shape rules are gated rather than eyeballed —
      # a dropped `listed: false` or `group` silently moves a card on the front page.
      - name: Run publish-config reconcile tests
        run: ./.github/scripts/test-publish-config-to-box.sh

  # The design-artifacts driver's own `node --test` suite, including the browser tests that drive the
  # built Remote Compose player bundle (`cli/src/main/resources/rc-player/bundle.js`) in headless
  # Chromium. Those tests existed but nothing ran them, which is how a player bug that renders a
  # whole document as a blank canvas reached a published catalog unnoticed (#2930): the pixels are
  # the only signal — the document parses and warns about nothing — and the weekly render is the
  # only place anyone was looking. They self-skip when playwright or a browser is unavailable, so
  # the browser install is what makes them actually assert.
  design-artifacts-driver-tests:
    name: Design Artifacts Driver Tests
    needs: changes
    if: ${{ needs.changes.outputs.design_artifacts == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install driver dependencies
        working-directory: scripts/design-artifacts
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/design-artifacts
        run: npx playwright install --with-deps chromium
      - name: Run driver tests
        working-directory: scripts/design-artifacts
        run: npm test

  # VS Code extension tests — both the existing in-process Mocha suite and
  # the @vscode/test-electron integration tests. The latter download a
  # headless VS Code into ~/.vscode-test/, install the local fake
  # vscjava.vscode-gradle stub so our extensionDependency check passes, and
  # run the extension against a fixture workspace. xvfb is needed because
  # VS Code expects a display even in headless mode.
  vscode-extension-tests:
    name: VS Code Extension Tests
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Path filter at STEP level, not a trigger `paths:` filter: this is a
      # required check, so a `paths:`-filtered workflow that didn't run would
      # leave it stuck pending and block the merge. Instead the job always runs
      # (so the required check always reports), and the npm steps below only
      # execute when the PR touches the extension. The TS unit/integration tests
      # can't be affected by anything outside `vscode-extension/`, so skipping
      # them on unrelated PRs is safe. Pushes to main + the nightly run always
      # execute the full suite.
      - name: Detect vscode-extension changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Fail open: any problem computing the diff -> run the full suite.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if ! changed=$(git diff --name-only "$BASE_SHA" "$MERGE_SHA" 2>/dev/null); then
            echo "::warning::Could not diff against base; running VS Code Extension Tests to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^vscode-extension/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No vscode-extension/** changes in this PR — skipping the npm build/test steps (this required check still reports)."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        with:
          node-version: 20
      - name: Install dependencies
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        working-directory: vscode-extension
        run: npm ci
      - name: Compile
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        working-directory: vscode-extension
        run: npm run compile
      - name: Run unit tests
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        working-directory: vscode-extension
        run: npm test
      - name: Run integration tests (xvfb)
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:electron
