  actions-tests:
    name: Actions Script Tests
    needs: changes
    if: ${{ needs.changes.outputs.actions_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The perceptual-diff libraries the image comparisons need. Without them
      # `test_compare_previews.py` still exits 0 — it SKIPS every class that
      # opens a PNG, which was five of them (the AA-flake filter, the
      # high-contrast pass, the resource tolerance, the animated-frame walk, the
      # transparent-backdrop pass). So the suite that decides what the diff bot
      # reports was green here without ever running its own image logic. Pinned
      # to what the production actions install, and NOT tolerant of a failed
      # install the way those are: a fallback is right for a diff that can
      # degrade to strict bytes, and wrong for the tests that prove the diff.
      # `PerceptualLibrariesTest` fails the suite if this step is ever dropped.
      # Pinned to the RELEASE this build compiles against, not the contracts repo's default
      # branch. The gate compares a source file there against bytecode resolved from
      # `composeai-contracts` in the catalog; an unpinned checkout compares the two whenever
      # those diverge, which passes a writer change matching newer source but incompatible with
      # the reader actually on the classpath, and fails unrelated pull requests when external
      # `main` moves.
      - id: contracts-ref
        name: Resolve the pinned contracts release
        run: |
          set -euo pipefail
          version=$(sed -n 's/^composeai-contracts = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read composeai-contracts from gradle/libs.versions.toml"
            exit 1
          fi
          echo "ref=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-preview-contracts
          ref: ${{ steps.contracts-ref.outputs.ref }}
          persist-credentials: false
          path: .compose-preview-contracts
          fetch-depth: 1
      - name: Install perceptual-diff libraries
        run: python3 -m pip install --quiet 'pixelmatch==0.4.0' 'Pillow>=10'
      - name: Run compare-previews tests
        run: python3 .github/actions/lib/test_compare_previews.py -v
      - name: Run a11y-report tests
        run: python3 .github/actions/lib/test_a11y_report.py -v
      - name: Run notification-previews tests
        run: python3 .github/actions/lib/test_notification_previews.py -v
      - name: Run xr-gallery tests
        run: python3 .github/actions/lib/test_xr_gallery.py -v
      - name: Run install version-resolver tests
        run: python3 .github/actions/install/test_resolve_version.py -v
      - name: Run install plugin-readiness tests
        run: python3 .github/actions/install/test_plugin_readiness.py -v
      - name: Run apply skew-guard tests
        run: python3 .github/actions/apply/test_check_skew.py -v
      - name: Run baseline-selection tests
        run: python3 .github/actions/apply/test_select_baseline.py -v
      - name: Run post-comment tests
        run: python3 .github/actions/apply/test_post_comment.py -v
      - name: Run apply change-scope tests
        run: python3 .github/actions/apply/test_compute_scope.py -v
      - name: Run change-scope classifier tests
        run: python3 .github/ci/test_change_scope.py -v
      - name: Run per-job path-scope classifier tests
        run: python3 .github/ci/test_path_scope.py -v
      # The preview-server split's two committed instruments (issue #3824) — the serve <-> cli
      # symbol ratchet and the coupling gate — were removed with `cli/serve` itself (#4732). The
      # boundary they measured is now a Maven coordinate, which cannot be crossed in either
      # direction, so there is nothing left for a source scanner to classify.
      # `daemon-launch.json` is written by the gradle plugin and subprocess writer, and read by the
      # daemon JVM and CLI doctor. Their Kotlin copies carry comments asking a human to keep them in
      # sync; this is the gate that makes those comments enforceable. The VS Code consumer owns its
      # separate check against the schema metadata published by the plugin release it pins.
      - name: Run daemon-launch schema gate tests
        env:
          COMPOSE_PREVIEW_CONTRACTS_ROOT: ${{ github.workspace }}/.compose-preview-contracts
        run: |
          set -euo pipefail
          out=$(python3 scripts/test_check_daemon_launch_schema.py -v 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # A skipped cross-repo test reports the same green as a passing one. The JVM reader lives
          # in the contracts repository, so a failed checkout has to be loud.
          if grep -q "skipped" <<<"$out"; then
            echo "::error::cross-repo schema tests SKIPPED — COMPOSE_PREVIEW_CONTRACTS_ROOT did not resolve"
            exit 1
          fi
      # The AdaptiveJetStream XR cell renders the sample's Subspaces with OUR compose-testing
      # against ITS compose. A version skew there fails only on main (the XR step is skipped on
      # PRs) and only at runtime, with a message that points nowhere near the cause.
      - name: Run consumer XR version-skew guard
        run: python3 .github/ci/check_consumer_xr_version.py
      - name: Run affected Gradle test-scope tests
        run: python3 .github/ci/test_affected_gradle_tests.py -v
      - name: Run scoped findings filter tests
        run: python3 .github/actions/apply/test_filter_findings_scope.py -v
      # The two publish helpers every delivery branch goes through. Both own a push-race retry
      # loop against a shared branch, and both fail in the shape that is hardest to notice — a
      # skipped or clobbered file on a branch nothing else validates. `test-push-branch.sh` shipped
      # with no CI step at all, so it had been running nowhere.
      - name: Run push-branch helper tests
        run: bash .github/actions/apply/lib/test-push-branch.sh
      - name: Run push-history helper tests
        run: bash .github/actions/apply/lib/test-push-history.sh
      # Guards the path→system mapping that decides which design-artifacts delivery
      # branches a merge to main regenerates. A false negative there strands a
      # published catalog on stale renders without any signal.
      - name: Run design-artifacts scope tests
        run: scripts/design-artifacts/test-scope-systems.sh
      # Covers the workflow step wrapped around that mapping — the force-all input
      # the release chain depends on, and the compare-endpoint 300-file cap. Both
      # fail silently in production (a delivery branch just stops regenerating).
      - name: Run design-artifacts scope-step tests
        run: scripts/design-artifacts/test-scope-step.sh
      # The `Package.swift` rewriter self-test moved to yschimke/rc-players with the iOS framework
      # it describes.
      - name: Run snapshot-version tests
        run: scripts/snapshot-version.sh --self-test
      # The reusable catalog workflow and preview-host images share this installer. It must keep
      # the pre-Noto generic families while supplying broad missing-glyph coverage.
      - name: Run Linux font-fallback installer tests
        run: scripts/test-install-linux-font-fallbacks.sh
      # Guards which JDKs the cloud bootstrap treats as "already here". Getting this wrong is not
      # a slow build, it is a dead session: the script downloads from Adoptium, and a sandbox that
      # gates github.com per repository 403s that fetch — on a box that already had the JDK.
      - name: Run cloud JDK setup tests
        run: scripts/test-setup-cloud-jdk.sh

      - name: Run daemon round-trip transport tests
        run: python3 .github/ci/test_daemon_roundtrip.py -v
      # The android-all cache-key script DELETES ~200 MB coordinate directories
      # on the integration runners, so "only drops what it says it drops" — and
      # "the key moves iff the retained set moves" — are gated, not eyeballed.
      - name: Run android-all cache-key tests
        run: python3 .github/ci/test_android_all_cache_key.py -v

      # The seed-config reconcile POSTs to a live server's admin API during publish, so its
      # ordering (trust before catalogs) and payload-shape rules are gated rather than eyeballed —
      # a dropped `listed: false` or `group` silently moves a card on the front page.
      - name: Run publish-config reconcile tests
        run: ./.github/scripts/test-publish-config-to-box.sh
      # The release milestone comments only ever run during a release, where a mistake is either
      # invisible (nothing posted) or lands on the wrong PR. The stubbed test pins the targeting
      # rule and the update-don't-duplicate behaviour so neither has to be discovered live.
      - name: Run release milestone comment tests
        run: ./.github/scripts/test-comment-release-milestone.sh
      # The release-PR race guard only ever executes in the minutes around a release, and both of
      # its failure directions are quiet: too lax and a duplicate `chore(main): release X.Y.Z` PR
      # appears mid-release, too strict and the release PR silently stops updating at all.
      - name: Run release PR race guard tests
        run: ./.github/scripts/test-release-pr-race-guard.sh
      - name: Run PR run reaper tests
        run: node --test .github/scripts/reap-pr-runs.test.mjs
      # The Figma reference column cuts a node out of a repo's committed page
      # cache. Its rasteriser is an optional dependency this job doesn't
      # install (those tests self-skip); what runs here is everything that
      # could put the WRONG node in front of a reviewer — which element the
      # slice takes, which ancestors come with it, which variant ref a preview
      # pairs with.
      - name: Run figma-reference tests
        run: node --test .github/actions/lib/figma-reference/index.test.mjs
      - name: Run consumer contract notice tests
        run: python3 .github/ci/test_consumer_contract_notice.py -v
      # The export-driver pin decides which revision of this repo other people's CI
      # executes, and it is rewritten unattended after each release. Both failure
      # modes are quiet: sites drifting apart means two jobs in one run render with
      # different drivers, and a pin the rewrite regex no longer matches freezes
      # silently while the release workflow still reports success.
      - name: Check the design-artifacts driver pin
        run: .github/scripts/refresh-driver-pin.sh --check
      - name: Run driver-pin refresh tests
        run: ./.github/scripts/test-refresh-driver-pin.sh

  # The design-artifacts driver's own `node --test` suite, including the browser tests that drive the
  # built Remote Compose player bundle (`third_party/remote-compose-player/dist/bundle.js`) in headless
  # Chromium. Those tests existed but nothing ran them, which is how a player bug that renders a
  # whole document as a blank canvas reached a published catalog unnoticed (#2930): the pixels are
  # the only signal — the document parses and warns about nothing — and the weekly render is the
  # only place anyone was looking. They self-skip when playwright or a browser is unavailable, so
  # the browser install is what makes them actually assert.
  design-artifacts-driver-tests:
    name: Design Artifacts Driver Tests
    needs: changes
    if: ${{ needs.changes.outputs.design_artifacts == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Four mirrors this suite checks now live in the preview server's repository (#4732): the
      # scorer's `tuning.ts`, `ServeRcFonts.FACES` and its staging wiring, and the viewer's
      # `format-compare.js`. Each test SKIPS without a checkout, and a silent skip is the failure
      # mode this repository already refuses elsewhere (see the daemon-launch schema step in
      # Actions Script Tests, which errors on the word "skipped"), so CI supplies one — the same
      # arrangement the contracts and VS Code readers get.
      #
      # PINNED to the release `:cli` actually consumes, read from the version catalog, not the
      # server's head. `v2.0.0` is the tree the published `compose-preview-serve:2.0.0` was built
      # from, so the mirror compares against the artifact on the classpath. Against head, a change
      # merged there but not yet released would fail this PR for a drift that does not exist yet.
      #
      # FETCHED, not checked out, and only the four files the mirrors read. `actions/checkout` of
      # another repository at a ref that comes from `gradle/libs.versions.toml` is a ref a fork's
      # pull request can edit, in a job that then populates the npm and Playwright caches — which
      # CodeQL rates high as "cache poisoning via execution of untrusted code", correctly: the
      # first shape of this step earned three of those alerts. Downloading four text files that
      # are only ever `readFileSync`-d removes the premise rather than suppressing the finding.
      # Nothing from that repository is executed here, and the worst a rewritten catalog line can
      # do is point the mirrors at a different published tag, which fails loudly.
      - name: Fetch the pinned preview-server mirror sources
        run: |
          set -euo pipefail
          version=$(sed -n 's/^composeai-preview-serve = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read composeai-preview-serve from gradle/libs.versions.toml"
            exit 1
          fi
          base="https://raw.githubusercontent.com/yschimke/compose-preview-server/v$version"
          # Each path is the other half of a mirror asserted in scripts/design-artifacts. Adding a
          # mirror means adding its file here, or the test self-skips and the guard below fires.
          for rel in \
            "server/src/main/kotlin/ee/schimke/composeai/cli/serve/ServeRcFonts.kt" \
            "server/build.gradle.kts" \
            "server/src/main/resources/ee/schimke/composeai/cli/serve/assets/format-compare.js" \
            "serve-web/src/scorer/tuning.ts"; do
            mkdir -p ".compose-preview-server/$(dirname "$rel")"
            curl -fsSL --retry 3 -o ".compose-preview-server/$rel" "$base/$rel"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # First, and before the two-minute install below: `design-map/` is a
      # PUBLISHED package (@yschimke/compose-design-map) with no dependencies at
      # all, so its suite is a second of runtime and a regression there ships to
      # a downstream repo's committed design-map.json rather than staying here.
      - name: Run design-map package tests
        working-directory: design-map
        run: npm test
      - name: Install driver dependencies
        working-directory: scripts/design-artifacts
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/design-artifacts
        run: npx playwright install --with-deps chromium

      # The vendored TypeScript player's bundle. It used to be a committed file in this checkout;
      # it is resolved from yschimke/rc-players now, so it has to be staged before the browser
      # tests that load it can assert anything.
      #
      # A hard failure, with no tolerated case, for the same reason as the Wasm bundle above: the
      # artifact ships from rc-players 1.55.0 onwards, so the only remaining way staging can fail is
      # one that should redden the job. `RC_PLAYER_JS_BUNDLE_REQUIRE=1` is unconditional now — the
      # bundle is always there, so the driver's self-skips must always be failures.
      #
      # This is the one Gradle invocation in an otherwise Node-only job, which is why the JDK is set
      # up here rather than at the top: it is needed for this step alone, and a reader looking at
      # the job should see the two together.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Stage the vendored player bundle
        run: ./gradlew stageVendoredRcPlayerJs
      - name: Require the player bundle
        run: echo "RC_PLAYER_JS_BUNDLE_REQUIRE=1" >> "$GITHUB_ENV"

      - name: Run driver tests
        working-directory: scripts/design-artifacts
        env:
          COMPOSE_PREVIEW_SERVER_ROOT: ${{ github.workspace }}/.compose-preview-server
        run: |
          set -euo pipefail
          out=$(npm test 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # The cross-repo mirrors above self-skip when the checkout is missing, and a skip reports
          # the same green as a pass. The checkout is supplied, so a skip here means it did not
          # resolve — which must be loud, not silently green. Matched on the mirrors' own skip
          # reason rather than on a skip COUNT: this suite has ~29 legitimate skips from other
          # causes (browser-gated cases), so a count check would either never fire or always fire.
          if grep -q "no compose-preview-server checkout" <<<"$out"; then
            echo "::error::cross-repo mirror tests SKIPPED — COMPOSE_PREVIEW_SERVER_ROOT did not resolve"
            exit 1
          fi

  # VS Code extension tests — both the existing in-process Mocha suite and
  # the @vscode/test-electron integration tests. The latter download a
  # headless VS Code into ~/.vscode-test/, install the local fake
  # vscjava.vscode-gradle stub so our extensionDependency check passes, and
  # run the extension against a fixture workspace. xvfb is needed because
  # VS Code expects a display even in headless mode.
  # The `xr-composite` pin is the entire interface to the compositor now that it lives in
  # yschimke/compose-preview-xr: the CLI and the Gradle plugin both resolve the binary from that
  # one catalog entry, and nothing here builds it. So the pin naming a release that does not
  # exist — or one missing a platform tarball — is the whole failure mode, and it is a silent
  # one: a 404 on download is a graceful skip, so the render still succeeds, just without a
  # composite. Deliberately NOT behind a `changes` path filter: a gate that can be scheduled away
  # is not a gate, and this one costs a second.
  xr-composite-pin:
    name: XR Composite Pin
    if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pin gate tests
        run: python3 .github/ci/test_check_xr_composite_pin.py -v
      - name: Run renderer pin gate tests
        run: python3 .github/ci/test_check_xr_renderer_pin.py -v
      - name: Check the pin resolves to a complete release
        env:
          # Authenticated so the releases API answers from a shared runner IP rather than
          # rate-limiting. A rate-limit is not a verdict on the pin, so the gate would warn and
          # pass — which is correct but useless. Read-only; the token needs nothing else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/ci/check_xr_composite_pin.py
      - name: Check the renderer pin resolves on Maven Central
        run: python3 .github/ci/check_xr_renderer_pin.py

  # `cli/serve-wasm` and compose-preview-server's `wasm-ui` are the same Compose/Wasm frontend
  # compiled twice — each repository against its own M3 catalog, which is why neither can consume
  # the other's artifact. The duplication is accepted; drifting silently is not. It already happened
  # once: upstream fixed #4821 and this copy kept drawing an unpressed button labelled "Pressed"
  # inside the CLI's bundled `preview-ui/`, while `serve` ran the fixed server. Offline and costs a
  # second, so like the pin gate above it is deliberately NOT behind a path filter — a gate that a
  # path filter can skip is not a gate.
  serve-wasm-fork:
    name: Serve-Wasm Fork Drift
    if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run fork gate tests
        run: python3 .github/ci/test_check_serve_wasm_fork.py -v
      - name: Check cli/serve-wasm matches the pinned upstream wasm-ui
        run: python3 .github/ci/check_serve_wasm_fork.py

  consumer-contract-notice:
    name: Consumer Contract Notice
    # Informational only — see the script's docstring for why this must not gate. It is a
    # separate job rather than a step on an existing one so its permissions stay minimal and
    # a failure to comment can never be mistaken for a contract problem.
    if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect contract surfaces and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fail open: a diff we cannot compute must not look like "no contracts touched".
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if ! changed=$(git diff --name-only "$BASE_SHA" "$MERGE_SHA" 2>/dev/null); then
            echo "::warning::could not diff against the base; skipping the consumer contract notice."
            exit 0
          fi

          body=$(printf '%s\n' "$changed" | python3 .github/ci/consumer-contract-notice.py -)
          MARKER="<!-- consumer-contract-notice -->"
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ "$body" = "NO_CONTRACT_SURFACES" ]; then
            # Nothing to say. Patch an existing notice to reflect that rather than leaving a
            # stale one describing surfaces a later push removed from the diff; never post a
            # fresh "nothing to report" comment.
            if [ -n "$COMMENT_ID" ]; then
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH \
                -f body="${MARKER}"$'\n'"## Contract surfaces this PR reaches"$'\n\n'"None as of $(git rev-parse --short "$MERGE_SHA"). An earlier revision of this PR touched one; it no longer does."
            fi
            echo "no contract surfaces touched"
            exit 0
          fi

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
