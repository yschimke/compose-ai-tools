name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full run. The heavy "anti-bit-rot" jobs below (full sample renders,
  # XR composite render, the two bundle E2Es, agent-audit-samples) are drift
  # detectors that rarely
  # fail on an ordinary code PR but cost 6–12 min each and dominate the PR
  # critical path. They're gated off `pull_request` (see the per-job `if:`s) and
  # instead run here nightly + on every push to main (i.e. immediately
  # post-merge), so a regression is still caught within minutes of landing
  # without making every PR wait on them.
  schedule:
    - cron: "23 4 * * *"
  # Manual full run, including the nightly-only drift detectors above.
  workflow_dispatch:

# Workflow-level default: minimum viable scope. Individual jobs can widen if
# they need it (none here do — all jobs are read-only builds + artifact upload,
# which only needs `contents: read`).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded verification is worthless, so cancel it — on main as well as on
  # PRs. This is only safe because CI no longer writes the BuildFetch remote
  # cache: `buildfetch-cache` below takes `ro-token` only, so these runs keep
  # their local build cache (`ON_CI` stays false) and are cheap to throw away.
  # Cache writes live in gradle-cache-seed.yml, which runs uncancelled in its
  # own concurrency group precisely so this one can stay disposable.
  cancel-in-progress: true

# Release-please PRs only bump the version manifest / CHANGELOG / version
# strings in docs — no source or build inputs change, so the full build+test
# suite is pure waste on them and forced an admin bypass to land. Each job
# below is gated to skip those PRs. A skipped job still reports its check (as
# "skipped"), which branch protection treats as passing — so the required
# checks go green instantly with no bypass.
#
# The guard requires BOTH the `release-please--*` head branch AND the PR author
# being the release bot (`github-actions[bot]`). The branch name alone is
# contributor-controlled: a human or fork PR from a branch named
# `release-please--…` could otherwise skip CI and abuse "skipped == passing" to
# land source changes uninspected. The author can't be spoofed, so pairing the
# two closes that bypass. (If release-please is ever switched to a GitHub App
# token, update the login here to the app's `<name>[bot]`.)
#
# The guard intentionally lives at job level (not a `branches` filter on the
# trigger): a workflow that never triggers would leave the required check stuck
# pending forever. On push events `github.head_ref` is empty and
# `github.event.pull_request` is null, so pushes to main always run the full
# suite.
jobs:
  # Deliberately the cheapest job in the workflow: checkout + a path classifier,
  # a few seconds. Every other job is `needs: changes`, and GitHub does not even
  # create — let alone queue — a dependent job until its dependency finishes, so
  # whatever runs here is paid twice: once as runner time, and again as queue
  # time added to all ~12 downstream jobs. Resolving the affected Gradle tests
  # (a full `./.github/actions/setup` + a Gradle model query, ~4 min) used to sit
  # in this job and blocked all of them, though only Module Unit Tests consumes
  # the result. It now runs as a step inside `module-unit-tests` itself, which
  # already has the checkout and the Gradle cache warm — so it costs that job ~2 min
  # and costs no other job anything. Keep this job cheap: anything added here delays
  # the entire workflow.
  changes:
    name: Determine CI scope
    runs-on: ubuntu-latest
    outputs:
      plugin_tests: ${{ steps.scope.outputs.plugin_tests }}
      renderer_android_tests: ${{ steps.scope.outputs.renderer_android_tests }}
      rc_player_tests: ${{ steps.scope.outputs.rc_player_tests }}
      module_unit_tests: ${{ steps.scope.outputs.module_unit_tests }}
      functional_tests: ${{ steps.scope.outputs.functional_tests }}
      build_samples: ${{ steps.scope.outputs.build_samples }}
      build_cli: ${{ steps.scope.outputs.build_cli }}
      spatial_scene: ${{ steps.scope.outputs.spatial_scene }}
      actions_tests: ${{ steps.scope.outputs.actions_tests }}
      design_artifacts: ${{ steps.scope.outputs.design_artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          python3 .github/ci/path-scope.py \
            --config .github/ci/ci-paths.json >> "$GITHUB_OUTPUT"

  # Split out of `changes` so its ~4 min of Gradle model resolution stops
  # sitting on the critical path of every other job (see the note on `changes`).
  # Only Module Unit Tests reads `tasks`, and that job runs `needs:` on both, so
  # the chain is one job deeper for it alone while the other ~11 start as soon
  # as the cheap classifier lands.
  #
  # PRs only, and that restriction is the whole point. Only a PR narrows the
  # suite; on push and schedule the answer is unconditionally `full`. Since
  # `path-scope.py` enables every group on non-PR events, gating this job on
  # `module_unit_tests` alone would schedule it on EVERY push to `main` purely
  # to echo a constant — and because Module Unit Tests `needs:` it, that job
  # could not enter the runner queue until this one had queued and finished
  # too. On a saturated queue that is another 40-70 min in front of post-merge
  # module coverage: the exact cost this split exists to remove. Non-PR events
  # skip the job and the consumer defaults to `full` directly.
  plugin-tests:
    name: Plugin Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.plugin_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run unit tests
        run: ./gradlew :gradle-plugin:test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: gradle-plugin/build/reports/tests/

  renderer-android-tests:
    # `:renderer-android:test` is documented in docs/AGENT_GUIDE.md but had no CI leg, so its suite —
    # including `WearScrollSvgGrowthTest`'s drift guard over the committed
    # `serve-wear-scroll-long-capsule.html` page fixture — could only fail on someone's laptop.
    # That guard is what stops `serve-preview-diff` screenshotting a stale capsule after a
    # figma-svg export change, so it has to run on PRs, where the export changes land.
    name: Renderer Android Unit Tests
    needs: changes
    # `pull_request` only. `:renderer-android` is in the root build (settings.gradle.kts),
    # so `module-unit-tests`' `full` branch — the one every non-PR event takes — already runs
    # `:renderer-android:test`, which for an Android library depends on `testDebugUnitTest`.
    # On push this job was a 3.7-min re-run of work happening in parallel two jobs over.
    # It stays on PRs, where `module-unit-tests` is scoped to affected modules and may not
    # reach `:renderer-android` at all.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.renderer_android_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run unit tests
        run: ./gradlew :renderer-android:testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-android-unit-test-results
          path: |
            renderers/android/build/reports/tests/

  # Every affected module's unit tests on PRs; the full fan-out on main/nightly.
  #
  # The named jobs around this one cover a handful of modules by task path
  # (`:renderer-android`, `:gradle-plugin`, `:cli` via its `build`, …). That left **66 modules
  # with `src/test/kotlin` whose tests no workflow ever invoked** — including
  # `data/layoutinspector/{core,connector}`, which is where the `compose/figma-svg` export model
  # and every one of its regression tests live, and both daemon backends, which is where the
  # end-to-end preview fixtures live. Fixtures were being written for issues #2853 / #2615 and
  # merged without ever running anywhere, which is a large part of why those issues kept
  # reopening against releases that were supposed to have fixed them.
  #
  # On PRs the change classifier maps files to Gradle projects and expands the
  # reverse dependency closure, then invokes only those projects' `test` tasks.
  # Root build wiring, unknown paths, graph errors, and every non-PR event fail
  # open to the historical root-level `test` fan-out. The render-heavy sample
  # modules below stay excluded in either mode.
  #
  # `--continue` so one failing module reports every other module's result in the same run instead
  # of masking them — the point of the job is to know the true state, not to stop at the first red.
  module-unit-tests:
    name: Module Unit Tests
    needs: changes
    # The two scopes are resolved from different configs and can disagree. `path-scope.py`
    # fails OPEN on a path it doesn't recognise (turning every group on, this job included),
    # while `affected-gradle-tests.py` reads `gradle-test-scope.json`, where e.g. `.github/**`
    # is ignored — so a PR touching only such a path enables the job with `tasks=none`. That
    # used to reach `gradlew none` and die ("Task 'none' not found"); the `none` branch of the
    # run step below absorbs it as a no-op, which is why the job `if` no longer has to.
    #
    # `!cancelled()` is required, not decoration: it keeps the job alive when an upstream is
    # skipped rather than failed, which would otherwise silently delete post-merge and nightly
    # module coverage. The explicit `needs.changes.result == 'success'` restores the failure
    # propagation that `!cancelled()` switches off.
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && needs.changes.outputs.module_unit_tests == 'true'
          && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Resolved here rather than in a `needs:` job. As a separate job this cost a
      # second checkout, a second Gradle setup and — because a `needs:` edge is a full
      # scheduling round-trip — a fresh spell in the runner queue, measured at a p90 of
      # ~20 min under merge-burst contention, to hand 17 min of tests a one-line output.
      # `module-unit-tests` already has the checkout and the cache warm, so the resolver
      # is ~2 min of work that now overlaps nothing instead of gating everything.
      - name: Fetch the PR base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
      - name: Resolve affected Gradle tests
        id: test-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          tasks=$(python3 .github/ci/affected-gradle-tests.py)
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - name: Run affected module tests (full suite off PRs)
        env:
          # Non-PR events skip the resolver step above, so default to the full suite here.
          TEST_TASKS: ${{ github.event_name == 'pull_request' && steps.test-scope.outputs.tasks || 'full' }}
        run: |
          if [ "$TEST_TASKS" = full ]; then
            # `checkKotlinAbi` unqualified, so Gradle runs it in every project that HAS it — the
            # 24 modules with `abiValidation()` — and simply does not match the rest. The scoped
            # branch below gets the same gate per affected project from the resolver.
            #
            # It belongs on this branch too, not just that one: `full` is what every non-PR event
            # uses (push to main, the nightly cron) and what a PR touching a global path such as
            # `gradle/libs.versions.toml` resolves to. Without it, an ABI-changing edit that also
            # trips a global path skips the gate entirely — which is how the gate ends up existing
            # without running, the exact failure this was added to stop.
            #
            # `jvmTest` and `desktopTest` alongside `test`, for the same reason and by the same
            # mechanism as `checkKotlinAbi`: unqualified, so Gradle runs each in every project
            # that HAS it and does not match the rest.
            #
            # `test` alone was a single-platform assumption. A Kotlin Multiplatform module names
            # its JVM tests `jvmTest` — or `desktopTest`, when the target is declared
            # `jvm("desktop")` — and registers no `test` task, so six modules' JVM suites were
            # absent from a run that calls itself full. This is the branch every non-PR event
            # takes (push to main, the nightly cron) and the one a global-path PR resolves to,
            # so it is where the gap mattered most and was least visible.
            ./gradlew test jvmTest desktopTest checkKotlinAbi --continue \
              -x :samples:android:test \
              -x :samples:android-alpha:test \
              -x :samples:android-library:test \
              -x :samples:remotecompose:test \
              -x :samples:wear:test \
              -x :samples:wear-widget:test \
              -x :samples:xr-glimmer:test
          elif [ -z "$TEST_TASKS" ] || [ "$TEST_TASKS" = none ]; then
            # The job `if` normally keeps this branch unreached; it's here so a future skew
            # between the two scope configs is a no-op run, never a `gradlew none` failure.
            echo "No affected module test tasks — nothing to run."
          else
            read -r -a tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}" --continue
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  # The CMP/Wasm player's first-frame timing and readiness contract — browser-scheduling properties,
  # so they cannot be asserted anywhere the player is not actually loaded in Chromium. Separate from the driver's
  # `node --test` job because it needs a built `wasmPlayerDist` that job has no Gradle to produce —
  # left there the test would self-skip forever, which is exactly the "nothing ran them" hole the
  # driver job comment describes. Ubuntu, not the macOS player job: frame pacing is per-platform, and
  # ubuntu is where the design-artifacts render lane measures the budgets this guards.
  rc-cmp-wasm-frame-pacing:
    name: CMP/Wasm Frame Pacing
    needs: changes
    if: ${{ needs.changes.outputs.rc_player_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # The PUBLISHED bundle, not one built from source: the player lives in yschimke/rc-players
      # now, and what this repo ships in the CLI's `rc-player-wasm/` sidecar is exactly these bytes.
      #
      # A hard failure, with no tolerated case. There was one while `rc-player-wasm-dist` had never
      # published: the step proved the artifact was merely absent before letting the guards below
      # skip, and re-armed itself the moment staging first succeeded. rc-players 1.55.0 carries the
      # artifact, so the escape hatch has nothing left to tolerate — and a staging failure now means
      # an outage or a regression, which must redden the job rather than disarm the assertions.
      - name: Stage the published Wasm player distribution
        run: ./gradlew stageVendoredRcPlayerWasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install driver dependencies
        working-directory: scripts/design-artifacts
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/design-artifacts
        run: npx playwright install --with-deps chromium
      # `RC_CMP_WASM_REQUIRE` turns the test's self-skips into failures. Without it a missing
      # distribution, a missing playwright, or a browser that will not launch all leave this job
      # green having asserted nothing — which is the hole this job exists to close. Unconditional
      # now: staging above is a hard failure, so by the time this step runs the distribution is
      # always present and a skip can only mean the environment is broken.
      - name: Run the browser-level player guards
        working-directory: scripts/design-artifacts
        env:
          RC_CMP_WASM_REQUIRE: "1"
          RC_CMP_WASM_DIST: ${{ github.workspace }}/build/vendored-rc-player-wasm
        run: node --test rc-cmp-wasm-*.test.mjs

  # The CMP/Wasm parity job that used to sit here compared a base-revision player build against
  # this PR's, to answer "does this player change make any real document render worse?". The player
  # moved to yschimke/rc-players, so on this repo the two revisions are always identical bytes and
  # the question cannot be asked here any more. It belongs on the repo that can change the answer.
  #
  # What this repo still guards is the consumer side: `rc-cmp-wasm-frame-pacing` above runs the
  # browser-level player guards against the PUBLISHED bundle, which is what the CLI actually ships.

  functional-tests:
    name: Plugin Functional Tests
    needs: changes
    if: ${{ needs.changes.outputs.functional_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run functional tests
        run: ./gradlew :gradle-plugin:functionalTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-test-results
          path: gradle-plugin/build/reports/tests/

  build-samples:
    # Keep the required PR check to the smallest representative cross-platform
    # slice. The expensive render/pixel suites live in build-samples-full below
    # and run immediately after merge (plus nightly), where they still catch
    # drift without extending the PR critical path.
    # Keep the historical check name because branch protection requires it.
    name: Build Samples
    needs: changes
    if: ${{ needs.changes.outputs.build_samples == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Build CMP sample and discover previews
        run: ./gradlew :samples:cmp:composePreviewDiscover
      - name: Build Android sample and discover previews
        run: ./gradlew :samples:android:composePreviewDiscover
      # Full render for the screenshot-test sample — the interesting behaviour
      # isn't discovery (which `:samples:android` also exercises) but rendering
      # class-member @Previews co-applied with `com.android.compose.screenshot`.
      # Regressions in `PreviewRenderStrategy.resolveReceiver` or in the
      # screenshotTest classpath wiring surface only at render time, so
      # `composePreviewDiscover` alone would pass even when broken.
      - name: Render Android screenshot-test sample previews
        run: ./gradlew :samples:android-screenshot-test:composePreviewRenderAll
      # Studio-parity gate. `-Pandroid.experimental.enableScreenshotTest=true` materialises the
      # `screenshotTest` source set, so this leg renders the `StudioParityMatrix` fixtures too and
      # `StudioParityTest` diffs them against the committed Layoutlib references — the same engine
      # Android Studio's preview pane uses. Without the flag the source set doesn't exist and the
      # test skips itself, which would silently retire the gate.
      - name: Diff renders against Android Studio (Layoutlib) references
        run: |
          ./gradlew -Pandroid.experimental.enableScreenshotTest=true \
            :samples:android-screenshot-test:testDebugUnitTest --tests "*StudioParityTest*"
      # Proof the gate above actually COMPARED something, independent of how it was invoked.
      #
      # `StudioParityTest` also fails when it is told it is required and finds no renders, but that
      # signal is derived from the `-P` flag on the line above — so dropping that flag would turn
      # the requirement off and the gate back into a green skip, which is the exact regression the
      # in-test check reads as if it prevented. This step consults neither the flag nor Gradle: it
      # looks at the side-by-side composites the gate writes per compared fixture, which exist only
      # if a Layoutlib reference and one of our renders were actually put next to each other.
      - name: Assert the Studio-parity gate compared something
        run: |
          set -euo pipefail
          dir=samples/android-screenshot-test/build/studio-parity
          # The directory is absent, not empty, when the gate never ran — and under `set -euo
          # pipefail` a `find` over a missing path kills the step at the assignment, before the
          # message below can explain what happened. Check for the directory first so the failure
          # arrives with its reason attached.
          if [ -d "$dir" ]; then
            count=$(find "$dir" -name '*.png' | wc -l)
          else
            count=0
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::The Studio-parity gate compared no fixtures. It did not run — check that" \
              "-Pandroid.experimental.enableScreenshotTest=true is still on the step above and that" \
              "composePreviewRenderAll rendered the StudioParityMatrix fixtures. Do not delete this" \
              "step to go green: it is the only check that our renders still match Android Studio."
            exit 1
          fi
          echo "Studio-parity gate compared ${count} fixture(s)."
      - name: Upload Studio-parity side-by-sides
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-parity-side-by-sides
          path: samples/android-screenshot-test/build/studio-parity/
          if-no-files-found: warn
      - name: Upload preview manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
