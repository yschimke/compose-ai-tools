name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full run. The heavy "anti-bit-rot" jobs below (full sample renders,
  # XR composite render, the two bundle E2Es, agent-audit-samples) are drift
  # detectors that rarely
  # fail on an ordinary code PR but cost 6–12 min each and dominate the PR
  # critical path. They're gated off `pull_request` (see the per-job `if:`s) and
  # instead run here nightly + on every push to main (i.e. immediately
  # post-merge), so a regression is still caught within minutes of landing
  # without making every PR wait on them.
  schedule:
    - cron: "23 4 * * *"

# Workflow-level default: minimum viable scope. Individual jobs can widen if
# they need it (none here do — all jobs are read-only builds + artifact upload,
# which only needs `contents: read`).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release-please PRs only bump the version manifest / CHANGELOG / version
# strings in docs — no source or build inputs change, so the full build+test
# suite is pure waste on them and forced an admin bypass to land. Each job
# below is gated to skip those PRs. A skipped job still reports its check (as
# "skipped"), which branch protection treats as passing — so the required
# checks go green instantly with no bypass.
#
# The guard requires BOTH the `release-please--*` head branch AND the PR author
# being the release bot (`github-actions[bot]`). The branch name alone is
# contributor-controlled: a human or fork PR from a branch named
# `release-please--…` could otherwise skip CI and abuse "skipped == passing" to
# land source changes uninspected. The author can't be spoofed, so pairing the
# two closes that bypass. (If release-please is ever switched to a GitHub App
# token, update the login here to the app's `<name>[bot]`.)
#
# The guard intentionally lives at job level (not a `branches` filter on the
# trigger): a workflow that never triggers would leave the required check stuck
# pending forever. On push events `github.head_ref` is empty and
# `github.event.pull_request` is null, so pushes to main always run the full
# suite.
jobs:
  changes:
    name: Determine CI scope
    runs-on: ubuntu-latest
    outputs:
      plugin_tests: ${{ steps.scope.outputs.plugin_tests }}
      renderer_android_tests: ${{ steps.scope.outputs.renderer_android_tests }}
      rc_player_tests: ${{ steps.scope.outputs.rc_player_tests }}
      module_unit_tests: ${{ steps.scope.outputs.module_unit_tests }}
      module_test_tasks: ${{ steps.test-scope.outputs.tasks }}
      functional_tests: ${{ steps.scope.outputs.functional_tests }}
      build_samples: ${{ steps.scope.outputs.build_samples }}
      build_cli: ${{ steps.scope.outputs.build_cli }}
      spatial_scene: ${{ steps.scope.outputs.spatial_scene }}
      actions_tests: ${{ steps.scope.outputs.actions_tests }}
      design_artifacts: ${{ steps.scope.outputs.design_artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          python3 .github/ci/path-scope.py \
            --config .github/ci/ci-paths.json >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        if: github.event_name == 'pull_request' && steps.scope.outputs.module_unit_tests == 'true'
      - name: Resolve affected Gradle tests
        id: test-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_MODULE_TESTS: ${{ steps.scope.outputs.module_unit_tests }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            tasks=full
          elif [ "$RUN_MODULE_TESTS" != "true" ]; then
            tasks=none
          else
            tasks=$(python3 .github/ci/affected-gradle-tests.py)
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  plugin-tests:
    name: Plugin Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.plugin_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run unit tests
        run: ./gradlew :gradle-plugin:test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: gradle-plugin/build/reports/tests/

  renderer-android-tests:
    # `:renderer-android:test` is documented in docs/AGENTS.md but had no CI leg, so its suite —
    # including `WearScrollSvgGrowthTest`'s drift guard over the committed
    # `serve-wear-scroll-long-capsule.html` page fixture — could only fail on someone's laptop.
    # That guard is what stops `vscode-preview-diff` screenshotting a stale capsule after a
    # figma-svg export change, so it has to run on PRs, where the export changes land.
    name: Renderer Android Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.renderer_android_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run unit tests
        run: ./gradlew :renderer-android:testDebugUnitTest
      # `RcFigmaSvgExportTest` pins what a Remote Compose document exports as through each player —
      # the only coverage of that path anywhere. It rides along here rather than in its own job
      # because it asserts on the same `compose/figma-svg` producers the renderer tests above cover,
      # so a change that breaks one usually breaks the other and they're worth failing together.
      # This module is otherwise unreferenced by CI: every test task in this workflow is invoked
      # per-module by name, there is no aggregate `check`, so without this line the test would run
      # only on someone's laptop.
      - name: Run RC figma-svg export tests
        run: ./gradlew :third-party-rc-embedded-player:testDebugUnitTest
      # `:third-party-rc-embedded-player-jvm` was in the same position the note above describes, only
      # worse: not merely untested by CI but entirely unreferenced, so neither its tests nor even its
      # *compile* ran anywhere but a laptop. That module is the whole claim that the shared player
      # sources are platform-neutral — a file that isn't really neutral is supposed to fail to build
      # there — and a claim nothing on CI evaluates is not a claim.
      #
      # `check`, not `test`: compiling is half the point, and the module's ktfmt legs come along.
      # It rides in this job because it shares the sources with the leg above, so the two fail
      # together when a shared file changes.
      # Two things `DesktopTextPlatformTest` needs from the host, both usually already there.
      #
      # A loadable GL library: skiko's native library links one even for the raster-only drawing the
      # test does. The runner image normally carries libglvnd already — the jobs in this repo that
      # need *real* GL install the drivers (`libgl1-mesa-dri`, `libglx-mesa0`) on top of it.
      #
      # A CJK face: `fallsBackToAFaceThatHasTheGlyphs` asserts that text the Latin default cannot
      # render falls back to a face that can, which needs such a face to exist. It skips itself
      # otherwise, and a skipped discriminator is not much use — it is one of the two tests standing
      # between this seam and silently unshaped, un-fallen-back text.
      - name: Ensure fonts and a GL library for skiko
        run: |
          packages=""
          if ! ldconfig -p | grep -q 'libGL\.so\.1'; then packages="$packages libgl1"; fi
          # `fc-match` always answers, so compare the family it lands on: a CJK request resolving to
          # DejaVu means nothing on this host actually has the glyphs.
          if ! fc-match --format='%{family}' 'WenQuanYi Zen Hei' 2>/dev/null | grep -qi 'wenquanyi\|noto sans cjk\|droid sans fallback'; then
            packages="$packages fonts-wqy-zenhei"
          fi
          if [ -n "$packages" ]; then
            echo "installing:$packages"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $packages
            fc-cache -f > /dev/null
          fi
      - name: Run desktop (jvm) player tests
        run: ./gradlew :third-party-rc-embedded-player-jvm:check
      # `DesktopTextPlatformTest` skips its whole class when skiko's natives cannot load, and a skip
      # still reports green — so a runner image that quietly dropped libGL would turn the jvm text
      # seam's only verification into eighteen no-ops without failing anything. This turns that into a
      # build failure. It reads the JUnit XML rather than grepping stderr because the counts are
      # unambiguous.
      #
      # The bar is "did the class run", not "did every test run": individual tests may legitimately
      # skip on a host that lacks a font they need, and failing on that would make the build hostage
      # to the runner image's font list. A skip count is still printed, because a *rising* one is
      # worth noticing even when it isn't fatal.
      - name: Fail if the skiko text tests did not execute
        run: |
          set -euo pipefail
          xml='third_party/rc-embedded-player-jvm/build/test-results/test/TEST-ee.schimke.composeai.rcembedded.jvm.DesktopTextPlatformTest.xml'
          if [ ! -f "$xml" ]; then
            echo "::error::$xml is missing — DesktopTextPlatformTest did not run at all."
            exit 1
          fi
          # Attributes are on one <testsuite> line; take the first match so a nested one can't fool it.
          tests=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | tr -dc 0-9)
          skipped=$(grep -o 'skipped="[0-9]*"' "$xml" | head -1 | tr -dc 0-9)
          echo "DesktopTextPlatformTest: ${tests} tests, ${skipped} skipped"
          if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ge "${tests:-0}" ]; then
            echo "::error::The skiko text seam tests did not execute (tests=${tests}," \
                 "skipped=${skipped}) — the whole class skipped, which means skiko's natives failed" \
                 "to load. This runner needs a GL library (libgl1 on Ubuntu). See" \
                 "DesktopTextPlatformTest's KDoc."
            exit 1
          fi
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::warning::${skipped} of ${tests} skiko text tests skipped — a host-capability" \
                 "skip (a missing font), not a failure, but check it is the one you expect."
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-android-unit-test-results
          path: |
            renderers/android/build/reports/tests/
            third_party/rc-embedded-player/build/reports/tests/
            third_party/rc-embedded-player-jvm/build/reports/tests/

  # Every affected module's unit tests on PRs; the full fan-out on main/nightly.
  #
  # The named jobs around this one cover a handful of modules by task path
  # (`:renderer-android`, `:gradle-plugin`, `:cli` via its `build`, …). That left **66 modules
  # with `src/test/kotlin` whose tests no workflow ever invoked** — including
  # `data/layoutinspector/{core,connector}`, which is where the `compose/figma-svg` export model
  # and every one of its regression tests live, and both daemon backends, which is where the
  # end-to-end preview fixtures live. Fixtures were being written for issues #2853 / #2615 and
  # merged without ever running anywhere, which is a large part of why those issues kept
  # reopening against releases that were supposed to have fixed them.
  #
  # On PRs the change classifier maps files to Gradle projects and expands the
  # reverse dependency closure, then invokes only those projects' `test` tasks.
  # Root build wiring, unknown paths, graph errors, and every non-PR event fail
  # open to the historical root-level `test` fan-out. The render-heavy sample
  # modules below stay excluded in either mode.
  #
  # `--continue` so one failing module reports every other module's result in the same run instead
  # of masking them — the point of the job is to know the true state, not to stop at the first red.
  module-unit-tests:
    name: Module Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.module_unit_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run affected module tests (full suite off PRs)
        env:
          TEST_TASKS: ${{ needs.changes.outputs.module_test_tasks }}
        run: |
          if [ "$TEST_TASKS" = full ]; then
            ./gradlew test --continue \
              -x :samples:android:test \
              -x :samples:android-alpha:test \
              -x :samples:android-library:test \
              -x :samples:design-catalog-remote-m3:test \
              -x :samples:remotecompose:test \
              -x :samples:wear:test \
              -x :samples:wear-widget:test \
              -x :samples:xr-glimmer:test \
              -x :samples:xr-spatial:test
          else
            read -r -a tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}" --continue
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  rc-player-tests:
    name: CMP Remote Compose Player
    needs: changes
    if: ${{ needs.changes.outputs.rc_player_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run shared, Wasm, and iOS player tests
        run: |
          ./gradlew \
            :rc-player-protocol:allTests \
            :rc-player-runtime:allTests \
            :rc-player-compose:allTests \
            :rc-player-compat-tests:test \
            :rc-player-wasm:wasmPlayerTestDist \
            :rc-player-protocol:compileTestKotlinIosArm64 \
            :rc-player-protocol:compileTestKotlinIosSimulatorArm64 \
            :rc-player-protocol:compileTestKotlinIosX64 \
            :rc-player-runtime:compileTestKotlinIosArm64 \
            :rc-player-runtime:compileTestKotlinIosSimulatorArm64 \
            :rc-player-runtime:compileTestKotlinIosX64 \
            :rc-player-compose:compileTestKotlinIosArm64 \
            :rc-player-compose:compileTestKotlinIosSimulatorArm64 \
            :rc-player-compose:compileTestKotlinIosX64
          ./gradlew :cli:test --tests ee.schimke.composeai.cli.serve.ServeWebTest
          ./gradlew ktfmtCheck
      - name: Upload player test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-player-test-reports
          path: |
            rc-player/**/build/reports/tests/**
            rc-player/**/build/test-results/**
          retention-days: 7

  functional-tests:
    name: Plugin Functional Tests
    needs: changes
    if: ${{ needs.changes.outputs.functional_tests == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Run functional tests
        run: ./gradlew :gradle-plugin:functionalTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-test-results
          path: gradle-plugin/build/reports/tests/

  build-samples:
    # Keep the required PR check to the smallest representative cross-platform
    # slice. The expensive render/pixel suites live in build-samples-full below
    # and run immediately after merge (plus nightly), where they still catch
    # drift without extending the PR critical path.
    # Keep the historical check name because branch protection requires it.
    name: Build Samples
    needs: changes
    if: ${{ needs.changes.outputs.build_samples == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          # Only resolve the write token on trusted main-branch push builds — on a pull_request
          # this expression (evaluated from the base ci.yml, not the PR head) yields '' so the
          # write token is never placed in a PR job's environment.
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Build CMP sample and discover previews
        run: ./gradlew :samples:cmp:composePreviewDiscover
      - name: Build Android sample and discover previews
        run: ./gradlew :samples:android:composePreviewDiscover
      # Full render for the screenshot-test sample — the interesting behaviour
      # isn't discovery (which `:samples:android` also exercises) but rendering
      # class-member @Previews co-applied with `com.android.compose.screenshot`.
      # Regressions in `PreviewRenderStrategy.resolveReceiver` or in the
      # screenshotTest classpath wiring surface only at render time, so
      # `composePreviewDiscover` alone would pass even when broken.
      - name: Render Android screenshot-test sample previews
        run: ./gradlew :samples:android-screenshot-test:composePreviewRenderAll
      # Studio-parity gate. `-Pandroid.experimental.enableScreenshotTest=true` materialises the
      # `screenshotTest` source set, so this leg renders the `StudioParityMatrix` fixtures too and
      # `StudioParityTest` diffs them against the committed Layoutlib references — the same engine
      # Android Studio's preview pane uses. Without the flag the source set doesn't exist and the
      # test skips itself, which would silently retire the gate.
      - name: Diff renders against Android Studio (Layoutlib) references
        run: |
          ./gradlew -Pandroid.experimental.enableScreenshotTest=true \
            :samples:android-screenshot-test:testDebugUnitTest --tests "*StudioParityTest*"
      - name: Upload Studio-parity side-by-sides
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-parity-side-by-sides
          path: samples/android-screenshot-test/build/studio-parity/
          if-no-files-found: warn
      - name: Upload preview manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-manifests
          path: |
            samples/android/build/compose-previews/previews.json
            samples/android-screenshot-test/build/compose-previews/previews.json
            samples/cmp/build/compose-previews/previews.json
      - name: Upload screenshot-test renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-android-screenshot-test-renders
          path: samples/android-screenshot-test/build/compose-previews/renders/

  build-samples-full:
    name: Build Samples (full render suite)
    # These render-heavy checks are valuable anti-bit-rot coverage, but they
    # duplicate the representative Android/CMP build performed by the required
    # smoke job and routinely make Build Samples the slowest CI leg. Run them
    # on main and nightly instead. Because this is a distinct, new check name it
    # is not part of the existing branch-protection required-check set.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Daemon-bench smoke (issue #1586). The full latency benches
      # (benchPreviewLatency / benchCompileStages) are deliberately slow and run on the
      # reference machine — see .github/workflows/daemon-bench.yml. Here we only render
      # the five trivial previews in each bench module so they can't bit-rot: a cheap
      # proof the modules build, discovery wires up, and the renderer path is intact on
      # both the Android (Robolectric) and desktop (Compose-Desktop) targets.
      - name: Render daemon-bench samples (smoke)
        run: |
          ./gradlew \
            :samples:android-daemon-bench:composePreviewRender \
            :samples:desktop-daemon-bench:composePreviewRender
      # samples/wear's pixel-scan tests (`LongScrollPreviewPixelTest`) gate
      # the stitched Wear long-preview output against known flake
      # signatures — ghost peek-pill rows, scaled-card seam ghosts,
      # incomplete EdgeButton reveal. The test task `dependsOn
      # composePreviewRenderAll` in samples/wear/build.gradle.kts, so this single
      # invocation both renders and asserts.
      - name: Render + pixel-test Wear sample previews
        run: ./gradlew :samples:wear:testDebugUnitTest
      # Exercise the Android XML resource preview pipeline against
      # samples/android. Discovery + renderer together; the rendered set
