name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level default: minimum viable scope. Individual jobs can widen if
# they need it (none here do — all jobs are read-only builds + artifact upload,
# which only needs `contents: read`).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    name: Plugin Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run unit tests
        run: ./gradlew :gradle-plugin:test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: gradle-plugin/build/reports/tests/

  functional-tests:
    name: Plugin Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run functional tests
        run: ./gradlew :gradle-plugin:functionalTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-test-results
          path: gradle-plugin/build/reports/tests/

  build-samples:
    name: Build Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build CMP sample and discover previews
        run: ./gradlew :samples:cmp:composePreviewDiscover
      - name: Build Android sample and discover previews
        run: ./gradlew :samples:android:composePreviewDiscover
      # Full render for the screenshot-test sample — the interesting behaviour
      # isn't discovery (which `:samples:android` also exercises) but rendering
      # class-member @Previews co-applied with `com.android.compose.screenshot`.
      # Regressions in `PreviewRenderStrategy.resolveReceiver` or in the
      # screenshotTest classpath wiring surface only at render time, so
      # `composePreviewDiscover` alone would pass even when broken.
      - name: Render Android screenshot-test sample previews
        run: ./gradlew :samples:android-screenshot-test:composePreviewRenderAll
      # Daemon-bench smoke (issue #1586). The full latency benches
      # (benchPreviewLatency / benchCompileStages) are deliberately slow and run on the
      # reference machine — see .github/workflows/daemon-bench.yml. Here we only render
      # the five trivial previews in each bench module so they can't bit-rot: a cheap
      # proof the modules build, discovery wires up, and the renderer path is intact on
      # both the Android (Robolectric) and desktop (Compose-Desktop) targets.
      - name: Render daemon-bench samples (smoke)
        run: |
          ./gradlew \
            :samples:android-daemon-bench:composePreviewRender \
            :samples:desktop-daemon-bench:composePreviewRender
      # samples/wear's pixel-scan tests (`LongScrollPreviewPixelTest`) gate
      # the stitched Wear long-preview output against known flake
      # signatures — ghost peek-pill rows, scaled-card seam ghosts,
      # incomplete EdgeButton reveal. The test task `dependsOn
      # composePreviewRenderAll` in samples/wear/build.gradle.kts, so this single
      # invocation both renders and asserts.
      - name: Render + pixel-test Wear sample previews
        run: ./gradlew :samples:wear:testDebugUnitTest
      # Exercise the Android XML resource preview pipeline against
      # samples/android. Discovery + renderer together; the rendered set
      # (6 vector PNGs + 8 adaptive-icon PNGs + 1 AVD GIF) and the
      # AndroidManifest icon-reference index land under
      # `build/compose-previews/{resources.json,renders/resources/}`.
      - name: Render Android resource previews
        run: ./gradlew :samples:android:composePreviewRenderAndroidResources
      - name: Upload preview manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-manifests
          path: |
            samples/android/build/compose-previews/previews.json
            samples/android/build/compose-previews/resources.json
            samples/android-screenshot-test/build/compose-previews/previews.json
            samples/cmp/build/compose-previews/previews.json
      - name: Upload Android resource renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-android-resource-renders
          path: samples/android/build/compose-previews/renders/resources/
      - name: Upload screenshot-test renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-android-screenshot-test-renders
          path: samples/android-screenshot-test/build/compose-previews/renders/
      - name: Upload Wear sample renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-wear-renders
          path: samples/wear/build/compose-previews/renders/
      - name: Upload Wear sample test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-wear-test-results
          path: samples/wear/build/reports/tests/

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build CLI
        run: ./gradlew :cli:build

  # End-to-end gate for the XR composite still: build the native xr-composite binary, then run
  # the xr-spatial sample's full render so composePreviewRenderXr writes scene.json + panel
  # textures and composePreviewCompositeXr bakes composite.png from them — headless, no GPU.
  # This is otherwise only exercised by hand, so without a gate the binary↔plugin contract
  # (CLI flags, sanitised composite path, the optional capture in previews.json) can silently
  # rot. The graceful no-binary path is covered by the plugin unit/functional tests.
  render-xr-composite:
    name: Render XR composite (sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build the compositor (clang + libc++ against the pinned Filament SDK) and its compiled
      # materials into dist/ — the same composite action the build/release workflows use.
      - uses: ./.github/actions/build-xr-composite
        with:
          platform: linux
      # The prebuilt Filament Linux backend is GLX-only, so headless rendering needs a virtual
      # X display (Xvfb) routed to Mesa's llvmpipe software rasteriser — no GPU required.
      - name: Install Xvfb + Mesa software GL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      # Run the whole render under Xvfb (so DISPLAY is set) with --no-daemon (so the composite
      # task's subprocess inherits the software-GL env from this step rather than a stale daemon).
      - name: Render xr-spatial sample (bake composite)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            ./gradlew --no-daemon :samples:xr-spatial:composePreviewRenderAll \
              -PcomposePreview.xrCompositeBinary="$PWD/dist/xr-composite" \
              -PcomposePreview.xrCompositeMaterials="$PWD/dist/materials" \
              --stacktrace
      - name: Assert composite baked + referenced in the manifest
        shell: bash
        run: |
          set -euo pipefail
          base=samples/xr-spatial/build/compose-previews
          png="$(find "$base/renders" -name composite.png -print -quit)"
          if [ -z "$png" ] || [ ! -s "$png" ]; then
            echo "::error::no non-empty composite.png under $base/renders"
            find "$base/renders" -maxdepth 2 -type f | sort || true
            exit 1
          fi
          file "$png" | grep -q 'PNG image data' || { echo "::error::$png is not a PNG"; exit 1; }
          grep -q 'composite.png' "$base/previews.json" \
            || { echo "::error::previews.json has no composite capture"; exit 1; }
          echo "OK: baked $png ($(du -h "$png" | cut -f1)), referenced in previews.json"
      # Exercise the long-lived server path (--serve): initialize -> render -> xr/updatePanels over
      # JSON-RPC stdio, asserting streamFrame notifications arrive and a per-frame panel update
      # actually changes the rendered image. Reuses the dist/ binary + materials and the committed
      # spatial-scene fixture.
      - name: Smoke-test the render server (--serve)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            python3 renderers/xr-composite/test/serve_smoke.py \
              "$PWD/dist/xr-composite" "$PWD/dist/materials" \
              "$PWD/vscode-extension/preview-harness/fixtures/spatial-scene"
      # Exercise the JVM client (:renderer-xr-client) against the real native server: unit tests
      # plus the XR_COMPOSITE_BIN-gated XrRenderServerIntegrationTest, which spawns the dist binary
      # and asserts a per-frame panel update changes the image. Mirrors the python smoke from Kotlin.
      - name: Integration-test the JVM client against the native server
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          XR_COMPOSITE_BIN: ${{ github.workspace }}/dist/xr-composite
          XR_COMPOSITE_MATERIALS: ${{ github.workspace }}/dist/materials
        run: |
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            ./gradlew --no-daemon :renderer-xr-client:test --stacktrace
      - name: Upload XR composite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xr-spatial-composite
          path: samples/xr-spatial/build/compose-previews/renders/**/composite.png
          if-no-files-found: warn

  spatial-scene-codegen:
    name: SpatialScene codegen up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      # The Kotlin / TypeScript / C++ SpatialScene mirrors are generated from
      # schema/spatial-scene.schema.json. Fail if a committed mirror drifts from the schema.
      - name: Check generated mirrors match the schema
        run: node scripts/codegen/gen-spatial-scene.mjs --check

  bundle-render:
    name: Bundle Render E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # End-to-end: pack a bundle from a synthetic Compose Desktop project, then re-render it
      # outside of any Gradle project by spawning the actual CLI binary against the packed PNG.
      # The aggregate task pre-publishes the plugin to mavenLocal (so the synthetic project's
      # `id("ee.schimke.composeai.preview") version "<v>"` resolves) and builds the CLI install
      # dist (so the `bundle render` subprocess has its `lib-renderer/` companion). Opt-in via
      # `-Pbundle.render.e2e=true` because the test cold-starts Compose Desktop per preview.
      #
      # Split into two phases to dodge a parallel-execution race: the gradle-plugin functionalTest
      # task (in the included build) can start before `:cli:installDist` finishes copying the
      # CLI's lib jars, so the test's first `compose-preview` subprocess crashes with
      # `NoClassDefFoundError` against a half-populated lib dir. Pre-building the install dir
      # serialises the two and is otherwise no-op (the second run sees up-to-date inputs).
      - name: Pre-build CLI install + publish plugin
        run: ./gradlew :cli:installDist :gradle-plugin:publishToMavenLocal --stacktrace
      - name: Bundle render e2e
        run: ./gradlew functionalTestWithBundleRender -Pbundle.render.e2e=true --stacktrace
      - name: Upload functionalTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-render-functional-test-reports
          path: gradle-plugin/build/reports/tests/functionalTest/

  android-bundle-daemon-e2e:
    name: Android Bundle Daemon E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # End-to-end for the Android path of `bundle daemon`: pack real-sample bundles (Wear tile +
      # Remote Compose IR, plus classic Compose previews), then spawn the actual CLI binary against
      # each and render protolayout / remotecompose / classic previews to PNG via the Robolectric
      # daemon. Guards (1) the Android daemon runtime being staged by `:cli:stageDaemonAndroidLibs`
      # (post-#1685 it ships as a standalone archive, not inside the CLI dist; the test points the
      # CLI at the staged dir via `-Dcomposeai.cli.libDaemonAndroidDir`) and (2)
      # `BundleDaemonCommand.composeDaemonClasspath` putting the carried IR-replay libs on the
      # daemon `-cp` (else replay dies with NoClassDefFoundError). The ubuntu-latest image ships an
      # Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT) which the daemon launch resolves android.jar
      # from. Opt-in via `-Pbundle.daemon.android.e2e=true` — cold-starts a daemon JVM per bundle.
      #
      # Split into two phases for the same parallel-execution race the desktop bundle-render job
      # documents: the included-build functionalTest can start before `:cli:installDist` finishes
      # populating the lib dirs. Pre-building serialises the two (and is otherwise no-op).
      #
      # Render the samples FIRST, in their own invocation, exactly as the desktop bundle-render job
      # does (preview-bundle-ascii.yml): `composePreviewBundle` deliberately does NOT depend on
      # `composePreviewRender` (packing without a render is a valid stub-cover flow) — it only
      # `mustRunAfter`s it. So the IR sidecars (`<stem>.tilelayout`/`.tileresources`/`.rcdoc`) the
      # render step writes beside each PNG have to already exist on disk before the bundle task's
      # first execution to be baked into `intermediateRepresentations`. Without this step the packed
      # bundles carry no IR and every preview falls back to classic, so the protolayout/remotecompose
      # assertions below can never pass. `composePreviewBundle` tracks the renders dir as an input
      # (`renderFiles`), so the fresh renders are picked up — no `--rerun-tasks` needed.
      # `missingRenders=warn` rather than the default `fail`: these samples render here for the first
      # time, and the E2E only needs at least one protolayout + one remotecompose IR to land — a
      # single stubborn preview shouldn't fail the whole job (its `.error.json` still surfaces).
      - name: Render sample previews (captures Wear tile + Remote Compose IR sidecars)
        run: >-
          ./gradlew
          :samples:wear:composePreviewRenderAll
          :samples:remotecompose:composePreviewRenderAll
          -PcomposePreview.missingRenders=warn
          --stacktrace
      - name: Pre-build CLI install + sample bundles + publish plugin
        run: >-
          ./gradlew :cli:installDist
          :cli:stageDaemonAndroidLibs
          :samples:wear:composePreviewBundle
          :samples:remotecompose:composePreviewBundle
          :gradle-plugin:publishToMavenLocal --stacktrace
      - name: Android bundle daemon e2e
        run: ./gradlew functionalTestWithAndroidBundleDaemon -Pbundle.daemon.android.e2e=true --stacktrace
      - name: Upload functionalTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-bundle-daemon-functional-test-reports
          path: gradle-plugin/build/reports/tests/functionalTest/

  agent-audit-samples:
    name: Agent Audit Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fetch agent audit script from yschimke/skills
        # The script lives in the sibling skills repo since it's part of the
        # compose-preview-review skill bundle; fetch the pinned ref so CI
        # exercises the same harness the skill ships. Drop it at the same
        # 3-deep path the script expects (Path(__file__).parents[3] == repo
        # root) so SAMPLE/OUT/CLI resolve to the workspace checkout.
        run: |
          mkdir -p skills/compose-preview-review/scripts
          curl -fsSL -o skills/compose-preview-review/scripts/run-agent-audit-samples.py \
            "https://raw.githubusercontent.com/yschimke/skills/main/skills/compose-preview-review/scripts/run-agent-audit-samples.py"
      - name: Run agent audit sample scripts
        run: python3 skills/compose-preview-review/scripts/run-agent-audit-samples.py
      - name: Upload agent audit outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-audit-sample-outputs
          path: build/agent-audit-samples/

  # Pure-stdlib unittest for the script that drives `preview-baselines` and
  # `preview-comment` actions. Lives here because the script is JSON-shape-
  # coupled to the CLI — running it on every PR catches contract breaks
  # (e.g. PR #76 bare-list → envelope) before they hit a real PR.
  actions-tests:
    name: Actions Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run compare-previews tests
        run: python3 .github/actions/lib/test_compare_previews.py -v
      - name: Run vscode-preview-diff tests
        run: python3 .github/actions/lib/test_vscode_preview_diff.py -v
      - name: Run a11y-report tests
        run: python3 .github/actions/lib/test_a11y_report.py -v
      - name: Run notification-previews tests
        run: python3 .github/actions/lib/test_notification_previews.py -v
      - name: Run xr-gallery tests
        run: python3 .github/actions/lib/test_xr_gallery.py -v

  # VS Code extension tests — both the existing in-process Mocha suite and
  # the @vscode/test-electron integration tests. The latter download a
  # headless VS Code into ~/.vscode-test/, install the local fake
  # vscjava.vscode-gradle stub so our extensionDependency check passes, and
  # run the extension against a fixture workspace. xvfb is needed because
  # VS Code expects a display even in headless mode.
  vscode-extension-tests:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Compile
        working-directory: vscode-extension
        run: npm run compile
      - name: Run unit tests
        working-directory: vscode-extension
        run: npm test
      - name: Run integration tests (xvfb)
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:electron
