name: Release PR

# Keeps a "chore(main): release X.Y.Z" pull request up to date based on
# conventional-commit history since the last tag. When that PR is merged,
# release-please creates the tag + GitHub Release, then this workflow calls
# release.yml to build and publish the three artifacts onto that Release.
#
# One button: merging the release PR triggers the full publish. No manual
# tag push, no dispatch step. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags + GitHub Releases
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      # The `clients` component (mobile + wear apps) is a separate manifest package, so its
      # outputs are path-prefixed (`clients--…`). It releases on its own `clients-v*` tag,
      # independent of the root `v*` line above.
      clients_release_created: ${{ steps.rp.outputs['clients--release_created'] }}
      clients_tag_name: ${{ steps.rp.outputs['clients--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # When the release PR is merged, release-please creates the tag and
          # an empty GitHub Release (populated with the CHANGELOG entry as the
          # body). The `release` job below then uploads CLI + VSIX assets to
          # that Release. We used to skip this and tag manually, but chaining
          # within a single workflow run sidesteps the GITHUB_TOKEN-doesn't-
          # trigger-workflows limitation that motivated the manual step.

  # Build and publish the artifacts whenever release-please actually cuts a
  # release. Skipped on "just updating the release PR" runs.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Inherit secrets so the called workflow can reach MAVEN_CENTRAL_* and
    # SIGNING_*. `secrets: inherit` passes every secret the caller can see.
    secrets: inherit
    permissions:
      contents: write   # needed by the called workflow's `release` job

  # Publish the prebuilt preview-host image (deploy/image) for the released CLI.
  # Same workflow_call chaining as `release`: a bot-created release won't fire
  # preview-host-image.yml's own `on: release` trigger. `needs: release` so the
  # CLI tarball the image downloads is already uploaded to the Release.
  preview-host-image:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/preview-host-image.yml
    with:
      cli_version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Build + publish the mobile / wear client apps when the `clients` component is released.
  # Same GITHUB_TOKEN-doesn't-trigger-workflows reason as above: invoked via workflow_call rather
  # than relying on the `clients-v*` tag push.
  release-clients:
    needs: release-please
    if: needs.release-please.outputs.clients_release_created == 'true'
    uses: ./.github/workflows/clients-release.yml
    with:
      tag: ${{ needs.release-please.outputs.clients_tag_name }}
    secrets: inherit
    permissions:
      contents: write
