name: Release PR

# Keeps a "chore(main): release X.Y.Z" pull request up to date based on
# conventional-commit history since the last tag. When that PR is merged,
# release-please creates the tag + GitHub Release, then this workflow calls
# release.yml to build and publish the three artifacts onto that Release.
#
# One button: merging the release PR triggers the full publish. No manual
# tag push, no dispatch step. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags + GitHub Releases
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      # The `clients` component (mobile + wear apps) is a SEPARATE release train with
      # its own config + manifest file (clients-release-please-*.json), driven by the
      # `rp_clients` step below. Keeping it in its own manifest is deliberate: the root
      # and clients versions used to share one `.release-please-manifest.json`, so an
      # open release PR on one line went CONFLICTING every time the other line released
      # (adjacent JSON lines release-please can't 3-way-merge). Separate files never
      # collide. Its outputs stay path-prefixed (`clients--…`) and it releases on its
      # own `clients-v*` tag, independent of the root `v*` line above.
      clients_release_created: ${{ steps.rp_clients.outputs['clients--release_created'] }}
      clients_tag_name: ${{ steps.rp_clients.outputs['clients--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # When the release PR is merged, release-please creates a DRAFT GitHub
          # Release (config `"draft": true`), populated with the CHANGELOG entry
          # as the body. The `release` job below uploads CLI + VSIX assets onto
          # that draft; `finalize-release` un-drafts it once every required asset
          # is verified present, so `/releases/latest` + `latest/download/…` never
          # point at a version whose tarball hasn't uploaded yet (the "release not
          # found" install race). Chaining within one run also sidesteps the
          # GITHUB_TOKEN-doesn't-trigger-workflows limitation.

      # The clients (mobile + wear) release train — its own config + manifest so its
      # version never shares a file with the root line (see the `outputs` note above).
      # Non-draft, so GitHub writes the `clients-v*` tag itself on publish; no
      # tag-ensure step needed. Runs as a second step in the same job: the two trains
      # touch disjoint components/branches, so they don't interfere.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp_clients
        with:
          config-file: clients-release-please-config.json
          manifest-file: clients-release-please-manifest.json

      # A *draft* GitHub Release does NOT create its git tag — GitHub only writes
      # the tag ref when the release is published. But the downstream build jobs
      # (release.yml, preview-host-image.yml) check out `ref: <tag>`, so create
      # the tag now, at the release PR's merge commit. Idempotent: skips if the
      # ref already exists (e.g. a re-run, or a future non-draft release-please).
      #
      # `!cancelled()` (not the default success-only gate) is deliberate and hard-won:
      # the release-please-action step cuts the draft (sets `release_created=true`)
      # and THEN builds the next candidate PR in the same step — and that second
      # half can crash (`Error adding to tree`) *after* the release is already cut.
      # With a plain `if: …release_created == 'true'`, that crash skips this step,
      # so the tag is never written; the manifest then names a version with no tag,
      # which wedges every later release-please run into re-listing all history and
      # failing again. Running whenever a release was actually cut — even if the rp
      # step later failed — guarantees the tag exists and breaks that trap. This is
      # exactly what stranded 0.16.34 (draft, untagged) until it was fixed by hand.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists — leaving it."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${SHA}"
            echo "created tag ${TAG} at ${SHA}."
          fi

  # Build and publish the artifacts whenever release-please actually cuts a
  # release. Skipped on "just updating the release PR" runs.
  #
  # `!cancelled() && …release_created == 'true'` rather than a plain output check:
  # the release-please job can report `release_created=true` (draft cut) and STILL
  # end in failure if the rp step crashes while building the next candidate PR (see
  # the tag-ensure step). We want the artifact build to proceed whenever a release
  # was genuinely cut, so a post-cut crash doesn't strand the release unpublished.
  release:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Inherit secrets so the called workflow can reach MAVEN_CENTRAL_* and
    # SIGNING_*. `secrets: inherit` passes every secret the caller can see.
    secrets: inherit
    permissions:
      contents: write   # needed by the called workflow's `release` job

  # Flip the draft Release to published once every required artifact is verified
  # present — the gate that makes a release atomic from a consumer's view.
  # `needs: release` so the whole release.yml run (asset upload + the irreversible
  # Maven Central publish) is done first. Two checks:
  #   1. Required GitHub Release assets are attached (HARD gate — a missing CLI
  #      tarball is exactly the "release not found" install failure, so we refuse
  #      to publish and leave the draft for a human / re-run).
  #   2. Maven Central is serving the published plugin (ADVISORY — the publish
  #      task already succeeded, so propagation is eventual; we poll, then publish
  #      anyway with a warning rather than wedge the release on CDN lag).
  # Only then `gh release edit --draft=false --latest`, so `/releases/latest` and
  # `latest/download/…` flip atomically to a fully-populated release.
  # The `!cancelled()` override tolerates a post-cut crash in the `release-please`
  # JOB — but it must NOT tolerate a failed `release`. `release.yml` decouples the
  # GitHub asset upload from the Maven Central publish, so `release` can fail with
  # the required assets already attached (Maven publish failed). Finalizing then
  # would un-draft a release whose Gradle plugin/runtime never actually published.
  # So require `needs.release.result == 'success'` explicitly: skip release-please's
  # failure, but never release's.
  finalize-release:
    needs: [release-please, release]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # un-draft + mark latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Verify required GitHub Release assets are present
        run: |
          set -euo pipefail
          V="${TAG#v}"
          required=(
            "compose-preview-${V}.tar.gz"
            "compose-preview-${V}.zip"
            "compose-preview-mcp-${V}.tar.gz"
            "compose-preview-${V}.vsix"
            "compose-preview-android-daemon-${V}.zip"
          )
          mapfile -t have < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          printf 'assets on %s:\n' "$TAG"; printf '  %s\n' "${have[@]}"
          missing=0
          for a in "${required[@]}"; do
            printf '%s\n' "${have[@]}" | grep -qxF "$a" \
              || { echo "::error::missing required asset $a"; missing=1; }
          done
          [ "$missing" -eq 0 ] \
            || { echo "::error::$TAG missing required assets — leaving it as a draft"; exit 1; }
      - name: Wait for Maven Central to serve the published plugin (advisory)
        run: |
          set -u
          V="${TAG#v}"
          pom="https://repo1.maven.org/maven2/ee/schimke/composeai/preview/ee.schimke.composeai.preview.gradle.plugin/${V}/ee.schimke.composeai.preview.gradle.plugin-${V}.pom"
          for i in $(seq 1 20); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$pom" 2>/dev/null || echo 000)
            if [ "$code" = 200 ]; then
              echo "plugin ${V} is live on Maven Central."
              exit 0
            fi
            echo "waiting for Maven Central to serve plugin ${V} (attempt ${i}/20, http ${code})…"
            sleep 60
          done
          echo "::warning::plugin ${V} not visible on Maven Central after ~20 min — publishing the GitHub release anyway (the publish task already succeeded; Central propagation is eventual)."
      - name: Publish the release (un-draft + mark latest)
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG."

  # Publish the prebuilt preview-host image (deploy/image) for the released CLI.
  # Same workflow_call chaining as `release`: a bot-created release won't fire
  # preview-host-image.yml's own `on: release` trigger. `needs: finalize-release`
  # because the image pulls the CLI tarball from the PUBLIC
  # `releases/download/<tag>/…` URL, which 404s while the release is still a
  # draft — so it must run only after finalize un-drafts it (which also makes its
  # tarball-resolvable poll resolve immediately instead of riding out the upload).
  # Same scoping as finalize: tolerate release-please's post-cut crash, but require
  # `release` AND `finalize-release` to have actually succeeded — this job pulls the
  # CLI tarball from the now-PUBLISHED release, which only exists if finalize ran.
  preview-host-image:
    needs: [release-please, release, finalize-release]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && needs.release.result == 'success' && needs.finalize-release.result == 'success' }}
    uses: ./.github/workflows/preview-host-image.yml
    with:
      cli_version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Build + publish the mobile / wear client apps when the `clients` component is released.
  # Same GITHUB_TOKEN-doesn't-trigger-workflows reason as above: invoked via workflow_call rather
  # than relying on the `clients-v*` tag push.
  release-clients:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.clients_release_created == 'true' }}
    uses: ./.github/workflows/clients-release.yml
    with:
      tag: ${{ needs.release-please.outputs.clients_tag_name }}
    secrets: inherit
    permissions:
      contents: write

  # Regenerate the design-artifacts/<system> delivery branches for the just-released
  # runtime. The published sticker bundles pin the RELEASED preview-runtime coordinates
  # (`composeaiReleasedRuntimeVersion` in gradle.properties, which the merged release PR
  # just bumped to this version), so they go stale the instant a release cuts — this
  # rebuilds them from the new version instead of waiting for the Monday cron or a manual
  # dispatch. Same workflow_call chaining as `release` / `preview-host-image`: a
  # GITHUB_TOKEN dispatch wouldn't start design-artifacts' run.
  #
  # Gated exactly like `reconcile-release-pr`: only after `finalize-release` succeeded, so
  # the release is published AND its runtime cleared finalize's Maven Central wait — then
  # design-artifacts' own "Wait for released preview-runtimes on Maven Central" step
  # resolves immediately instead of polling. Root train only: the design catalogs track
  # the root CLI/runtime version, not the `clients` train.
  regenerate-design-artifacts:
    needs: [release-please, finalize-release]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && needs.finalize-release.result == 'success' }}
    uses: ./.github/workflows/design-artifacts.yml
    secrets: inherit
    permissions:
      contents: write   # force-push the design-artifacts/<system> delivery branches

  # Reconcile the "next release" PR after a release fully publishes.
  #
  # The `release-please` job above opens the next release PR in the SAME run that
  # cuts the release — but at that moment the just-cut version is invisible to
  # release-please: it's a *draft* GitHub Release (config `"draft": true`), which
  # carries no git tag, and the tag is only written by the later "Ensure the
  # release tag exists" step. So release-please falls back to the PREVIOUS
  # published release as its baseline, re-lists the just-released commits, and
  # opens a phantom next-version PR (e.g. a spurious 0.17.0 with duplicated notes)
  # that only clears on the next release-please run.
  #
  # This job IS that next run: it fires after finalize-release (so both the tag
  # and the now-published release exist), re-runs release-please with the same
  # config, sees the correct baseline, and closes the phantom PR automatically.
  # It cannot cut a release itself — the merged release PR is already labelled
  # `autorelease: tagged`, so there is nothing pending to release and no
  # downstream chain fires (no loop). If genuinely new commits landed while the
  # release was publishing, it opens the correct next PR instead of the phantom.
  reconcile-release-pr:
    needs: [release-please, finalize-release]
    # Tolerate release-please's post-cut crash, but only reconcile once the release
    # actually finalized (tag + published) — otherwise the re-run hits the same
    # unanchored-manifest wedge it's meant to clear.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && needs.finalize-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # update the release branch
      pull-requests: write   # close/open the next release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
