name: Samples-SDK21 (JDK 21)

# Build/render the `samples/sdk21/*` subtree. These modules pull in tooling whose
# Gradle plugin jars are compiled to Java 21 bytecode and therefore can't
# load on this repo's default JDK 17 build daemon (see
# `gradle/gradle-daemon-jvm.properties`, pinned to `toolchainVersion=17`).
#
# Rather than bump the daemon JVM repo-wide and force every contributor onto
# JDK 21, the daemon pin stays at 17 and `settings.gradle.kts` skips the
# `samples:sdk21:*` projects when `JavaVersion.current() < 21`. This workflow:
#
#   1. Installs JDK 21 on the runner.
#   2. Rewrites `gradle/gradle-daemon-jvm.properties` (in-place on the
#      runner's checkout — never committed) so the daemon launches on 21.
#   3. Invokes the render task, which now sees `:samples:sdk21:*` in the
#      project tree and pulls in Metro's compiler plugin without complaint.

on:
  push:
    branches: [main]
    paths:
      - 'samples/sdk21/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/samples-sdk21.yml'
  pull_request:
    branches: [main]
    paths:
      - 'samples/sdk21/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/samples-sdk21.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render samples/sdk21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Bump daemon JVM criteria to 21 (ephemeral, runner-only)
        run: echo "toolchainVersion=21" > gradle/gradle-daemon-jvm.properties

      - name: Render :samples:sdk21:android-metro-viewmodel
        run: ./gradlew :samples:sdk21:android-metro-viewmodel:composePreviewRenderAll

      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-sdk21-android-metro-viewmodel-renders
          path: samples/sdk21/android-metro-viewmodel/build/compose-previews/renders/
