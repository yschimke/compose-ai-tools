name: SDK Compatibility Matrix

# Nightly sweep over (JDK × compileSdk × targetSdk × minSdk × sdkVersion override) for the
# synthetic `:samples:sdk-matrix` module. Documents which SDK combinations render cleanly under
# auto-detection, which need the `composePreview.sdkVersion` override knob, and which are
# expected-to-fail (e.g. JDK 17 cannot render at Robolectric SDK 36). Drives
# `docs/SDK_COMPATIBILITY.md`.
#
# Matrix scope and filtering rationale (see also docs/SDK_COMPATIBILITY.md):
# - compileSdk ∈ {35, 36, 37}. Below 35 is non-sensical for any active app (Play Store new-app
#   floor since Aug 2025); above 37 isn't shipping today.
# - targetSdk ≤ compileSdk (AGP rule).
# - minSdk ∈ {24, 36}. Issue #1248's `PackageParser: Requires newer sdk version` is gated by
#   minSdk; the matrix spans low-floor (typical) and tightly-targeting consumers.
# - JDK ∈ {17, 21}. Robolectric SDK 36 requires JDK 21+
#   (`DefaultSdkProvider.verifySupportedSdk`); the matrix's whole reason to sweep two JDKs is
#   to surface that constraint.
# - sdkVersion override ∈ {auto, 35}. `auto` exercises the plugin's auto-detect path; `35` is
#   the rescue override consumers on JDK 17 reach for when their compileSdk is 36+.

on:
  schedule:
    # 04:17 UTC daily — offset from the other crons in this repo to avoid
    # piling onto the same runner pool.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: sdk-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- JDK 17, auto-detect -----
          # Baseline: compileSdk=35 lands within Robolectric's JDK 17 ceiling, renders cleanly.
          - { label: "jdk17 / compileSdk=35 / target=35 / min=24 / auto", jdk: "17", compileSdk: 35, targetSdk: 35, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # JDK 17 + compileSdk=36 auto-detect: the plugin's clamp is JDK-aware
          # (GenerateRobolectricPropertiesTask.resolveSdk → MAX_SUPPORTED_SDK_BELOW_JAVA_21). On
          # JDK 17 the effective ceiling is 35, so a compileSdk=36 consumer renders at sdk=35 with
          # a "needs JDK 21+ to render … clamping the Robolectric sandbox to 35" warning instead of
          # failing at sandbox bootstrap. minSdk=24 parses cleanly against the framework-35 APK.
          # (Was expect:fail before the JDK-aware clamp landed; the matrix surfaced that drift.)
          - { label: "jdk17 / compileSdk=36 / target=36 / min=24 / auto", jdk: "17", compileSdk: 36, targetSdk: 36, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # JDK 17 + compileSdk=37 auto-detect clamps the same way: ceiling = min(jar=37, JDK17=35)
          # = 35, so it renders at sdk=35 (the warning notes the APK may still fail if <uses-sdk>
          # is newer — here minSdk=24 is fine). Same JDK-aware-clamp improvement as the row above.
          - { label: "jdk17 / compileSdk=37 / target=37 / min=24 / auto (clamp)", jdk: "17", compileSdk: 37, targetSdk: 37, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # ----- JDK 17, sdkVersion=35 override -----
          # The rescue path consumers on JDK 17 + compileSdk=36 take. APK's minSdk=24 parses
          # cleanly against the SDK 35 framework Robolectric synthesizes.
          - { label: "jdk17 / compileSdk=36 / target=36 / min=24 / override=35", jdk: "17", compileSdk: 36, targetSdk: 36, minSdk: 24, sdkVersion: "35", robolectric: "", maxSupportedSdk: "", expect: pass }
          # The original #1248 shape: override pins Robolectric to SDK 35, but the APK's
          # `<uses-sdk minSdkVersion="36">` is newer than the runtime framework, so
          # PackageParser refuses. Documented failure, not a regression.
          - { label: "jdk17 / compileSdk=36 / target=36 / min=36 / override=35", jdk: "17", compileSdk: 36, targetSdk: 36, minSdk: 36, sdkVersion: "35", robolectric: "", maxSupportedSdk: "", expect: fail }
          # ----- JDK 21, auto-detect -----
          # Parity sanity check at the bottom of the range.
          - { label: "jdk21 / compileSdk=35 / target=35 / min=24 / auto", jdk: "21", compileSdk: 35, targetSdk: 35, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # JDK 21 unlocks Robolectric SDK 36 — auto-detect picks sdk=36 and renders.
          - { label: "jdk21 / compileSdk=36 / target=36 / min=24 / auto", jdk: "21", compileSdk: 36, targetSdk: 36, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # The #1248 case JDK 21 fixes outright: minSdk=36 matches the runtime framework.
          - { label: "jdk21 / compileSdk=36 / target=36 / min=36 / auto", jdk: "21", compileSdk: 36, targetSdk: 36, minSdk: 36, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # JDK 21 + compileSdk=37: Robolectric 4.17 ships the API 37 jar and the plugin's
          # espresso-core 3.7.0 floor keeps `InputManager.getInstance()` (removed in 37) off the
          # input path, so auto-detect picks sdk=37 with no clamp. minSdk=36 parses too.
          - { label: "jdk21 / compileSdk=37 / target=37 / min=24 / auto", jdk: "21", compileSdk: 37, targetSdk: 37, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          - { label: "jdk21 / compileSdk=37 / target=37 / min=36 / auto", jdk: "21", compileSdk: 37, targetSdk: 37, minSdk: 36, sdkVersion: "", robolectric: "", maxSupportedSdk: "", expect: pass }
          # The same SDK 37 render split over two generated shard classes, two previews each, so the
          # pixel check covers consecutive previews under the shards' own runner (#6229, #6230).
          - { label: "jdk21 / compileSdk=37 / target=37 / min=24 / auto / shards=2", jdk: "21", compileSdk: 37, targetSdk: 37, minSdk: 24, sdkVersion: "", robolectric: "", maxSupportedSdk: "", shards: "2", expect: pass }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}

      - name: Render :samples:sdk-matrix
        id: render
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
        run: |
          set +e
          sdk_version_arg=""
          if [ -n "${{ matrix.sdkVersion }}" ]; then
            sdk_version_arg="-Pcomposeai.matrix.sdkVersion=${{ matrix.sdkVersion }}"
          fi
          robolectric_arg=""
          if [ -n "${{ matrix.robolectric }}" ]; then
            robolectric_arg="-Pcomposeai.matrix.robolectricVersion=${{ matrix.robolectric }}"
          fi
          max_supported_arg=""
          if [ -n "${{ matrix.maxSupportedSdk }}" ]; then
            max_supported_arg="-Pcomposeai.matrix.maxSupportedSdk=${{ matrix.maxSupportedSdk }}"
          fi
          shards_arg=""
          if [ -n "${{ matrix.shards }}" ]; then
            shards_arg="-Pcomposeai.matrix.shards=${{ matrix.shards }}"
          fi
          ./gradlew :samples:sdk-matrix:composePreviewRenderAll \
            -Pcomposeai.matrix.compileSdk=${{ matrix.compileSdk }} \
            -Pcomposeai.matrix.targetSdk=${{ matrix.targetSdk }} \
            -Pcomposeai.matrix.minSdk=${{ matrix.minSdk }} \
            -Pcomposeai.matrix.jvmToolchain=${{ matrix.jdk }} \
            $sdk_version_arg \
            $robolectric_arg \
            $max_supported_arg \
            $shards_arg \
            --stacktrace 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          # A green render is not enough: on SDK 37 every preview after the first once came back a
          # uniform #FAFAFA frame with no error (#6229). Read the batch previews back and fail the
          # cell unless each drew its own colour.
          if [ "$exit_code" -eq 0 ]; then
            python3 scripts/sdk_matrix_pixel_check.py samples/sdk-matrix/build/compose-previews/renders 2>&1 | tee -a build.log
            exit_code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "outcome=pass" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=fail" >> "$GITHUB_OUTPUT"
            # Pull the most useful one-liner out of the build log so the aggregated report can
            # explain each red cell without forcing the reader to download artifacts. Priority
            # order: a Robolectric/PackageParser/Java-version line beats a generic
            # `Execution failed` line, which beats falling back to "see build.log". The pattern
            # set covers the four documented failure shapes (#1248 PackageParser, JDK 21
            # requirement, missing SDK jar, plus a generic Gradle exception fallback).
            # Include both the pre-API-37-jar `UnknownSdk` failure and the current snapshot's
            # incomplete InputManager shadow so expected-reason gates capture the actual upstream
            # limitation instead of falling through to Gradle's generic failure summary.
            reason=$(grep -m1 -E \
              "Requires newer sdk version|Android SDK [0-9]+ requires Java|API level [0-9]+ is not available|UnsupportedOperationException|Could not resolve all files|UnknownSdk|InputManager\.getInstance|composeai.matrix|sdk-matrix pixel check" \
              build.log | head -c 400 || true)
            if [ -z "$reason" ]; then
              reason=$(grep -m1 -E "^.*[Ff]ailed|FAILURE: " build.log | head -c 400 || true)
            fi
            if [ -z "$reason" ]; then
              reason="see build.log artifact"
            fi
            # `$GITHUB_OUTPUT` is line-delimited; escape any newlines / pipes in the matched
            # message so it survives a single `output=` line.
            reason_one_line=$(printf '%s' "$reason" | tr '\n' ' ' | tr -s ' ' | sed 's/|/\\|/g')
            echo "reason=$reason_one_line" >> "$GITHUB_OUTPUT"
          fi
          # The step itself exits 0 so the aggregator sees every cell. Pass/fail is recorded
          # in the cell JSON; the aggregator flags rows where `outcome != expected`.
          exit 0

      - name: Record cell result
        env:
          LABEL: ${{ matrix.label }}
          JDK: ${{ matrix.jdk }}
          COMPILE_SDK: ${{ matrix.compileSdk }}
          TARGET_SDK: ${{ matrix.targetSdk }}
          MIN_SDK: ${{ matrix.minSdk }}
          SDK_VERSION: ${{ matrix.sdkVersion }}
          ROBOLECTRIC: ${{ matrix.robolectric }}
          MAX_SUPPORTED_SDK: ${{ matrix.maxSupportedSdk }}
          EXPECT: ${{ matrix.expect }}
          EXPECTED_REASON: ${{ matrix.expectedReason }}
          OUTCOME: ${{ steps.render.outputs.outcome }}
          EXIT_CODE: ${{ steps.render.outputs.exit_code }}
          REASON: ${{ steps.render.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p cell-results
          slug=$(printf '%s' "$LABEL" | tr -c '[:alnum:]' '-' | tr -s '-' | sed 's/^-//;s/-$//')
          python3 - "$slug" <<'PY'
          import json, os, sys
          slug = sys.argv[1]
          row = {
            "label": os.environ["LABEL"],
            "jdk": os.environ["JDK"],
            "compileSdk": int(os.environ["COMPILE_SDK"]),
            "targetSdk": int(os.environ["TARGET_SDK"]),
            "minSdk": int(os.environ["MIN_SDK"]),
            "sdkVersion": os.environ["SDK_VERSION"] or None,
            "robolectric": os.environ["ROBOLECTRIC"] or None,
            "maxSupportedSdk": int(os.environ["MAX_SUPPORTED_SDK"]) if os.environ["MAX_SUPPORTED_SDK"] else None,
            "expected": os.environ["EXPECT"],
            "expectedReason": os.environ.get("EXPECTED_REASON") or None,
            "outcome": os.environ["OUTCOME"],
            "exitCode": int(os.environ["EXIT_CODE"]),
            "reason": os.environ.get("REASON") or None,
          }
          with open(f"cell-results/{slug}.json", "w") as f:
            json.dump(row, f)
          PY

      - name: Upload cell result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-matrix-cell-${{ strategy.job-index }}
          path: |
            cell-results/*.json
            samples/sdk-matrix/build/compose-previews/renders/*.png
            samples/sdk-matrix/build/generated/composeai/robolectric/**/robolectric.properties
            build.log

  aggregate:
    name: Aggregate matrix results
    runs-on: ubuntu-latest
    needs: matrix
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download cell results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cell-results
          pattern: sdk-matrix-cell-*
          merge-multiple: true

      - name: Render results table
        id: report
        run: |
          set -euo pipefail
          python3 scripts/sdk_matrix_report.py \
            --cells cell-results \
            --out matrix-report.md
          echo "## SDK Compatibility Matrix (run $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
          cat matrix-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any cell drifted from expectations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          drift = []
          for p in sorted(Path("cell-results").rglob("*.json")):
            row = json.load(open(p))
            label = row["label"]
            if row["outcome"] != row["expected"]:
              drift.append(f"{label} (expected {row['expected']}, got {row['outcome']})")
              continue
            # Reason gating: when a cell carries `expectedReason`, the captured failure message
            # must contain that substring (case-insensitive). Without this an unrelated breakage
            # (Sonatype outage, classpath wiring regression) on an `expect: fail` cell would
            # silently pass drift — losing the upstream-watch signal. Per Codex review on #1270.
            expected_reason = row.get("expectedReason")
            if row["outcome"] == "fail" and expected_reason:
              captured = (row.get("reason") or "").lower()
              if expected_reason.lower() not in captured:
                drift.append(
                  f"{label} (failed for the wrong reason — expected `{expected_reason}` "
                  f"in the captured message)"
                )
          if drift:
            print("Drift detected:", file=sys.stderr)
            for d in drift:
              print(f" - {d}", file=sys.stderr)
            sys.exit(1)
          print("All cells matched expectations.")
          PY

      - name: Upload aggregated report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-matrix-report
          path: matrix-report.md
