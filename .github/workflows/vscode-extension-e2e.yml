name: VS Code Extension E2E

# End-to-end test that drives the VS Code extension against a real Gradle
# build of `:samples:cmp` (locally-built plugin via `includeBuild`). The
# fast `vscode-extension-tests` job in ci.yml stubs Gradle out with a
# RecordingGradleApi; this job swaps in a real one (`RealGradleApi`) so
# the loop is exercised plugin-end-to-extension-end.
#
# Not on every PR: cold composePreviewRenderAll on `:samples:cmp` is multi-minute
# and the prototype is more flake-prone than the stub-driven path.
#
# Triggers:
#   push (main)       — runs in parallel with CI / Integration so e2e
#                       results land on the commit alongside everything
#                       else. The previous workflow_run + gate setup
#                       silently gated *every* run to a 1-14s skip
#                       (workflow_run conclusion races, see git history)
#                       and CMP went unverified for ~60 commits.
#   workflow_dispatch — manual one-off runs (any branch), e.g. to
#                       reproduce a regression on a feature branch.
#   pull_request      — runs the full sharded set when the extension or
#                       its real Gradle/rendering fixtures change.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'vscode-extension/**'
      - 'gradle-plugin/**'
      - 'common/**'
      - 'daemon/**'
      - 'renderers/**'
      - 'runtimes/**'
      - 'data/**'
      - 'third_party/**'
      - 'api/preview-annotations/**'
      - 'api/preview-data-api/**'
      - 'samples/cmp/**'
      - 'samples/android/**'
      - 'samples/wear/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/actions/setup/**'
      - '.github/workflows/vscode-extension-e2e.yml'

permissions:
  contents: read

concurrency:
  # One in-flight e2e per ref, NOT per run. The group used to include
  # `github.run_id`, which is unique per run — so the group was unique per run
  # and nothing was ever deduplicated. At a high merge rate that stacked
  # several full five-shard runs on `main` at once (four concurrently, aged
  # 80+ min, observed 2026-08-08), each holding five runner slots to verify a
  # commit already superseded by the time a runner freed up. Keying on the ref
  # lets a newer commit cancel the run it replaces.
  #
  # `workflow_dispatch` keeps a per-run slot and stays uncancellable: a manual
  # one-off (reproducing a regression on a branch) is deliberate work that
  # ordinary push/PR traffic on the same ref must not kill.
  group: vscode-extension-e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  e2e:
    name: VS Code Extension E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cmp-smoke
            files: e2e.test.js
            grep: ''
          - shard: cached-preload
            files: e2eCachedPreloadOnSwitch.test.js
            grep: ''
          - shard: interactive-a-d
            files: e2eInteractive.test.js
            grep: ' [A-D]\. '
          - shard: interactive-e-g
            files: e2eInteractive.test.js
            grep: ' [E-G]\. '
          # These suites intentionally share one host: e2eA11y warms the
          # Wear daemon and e2eBundleChain reuses that state.
          - shard: wear
            files: e2eA11y.test.js,e2eBundleChain.test.js
            grep: ''
    # Per-shard ceiling. The complete suite is deliberately split because
    # its serial worst case exceeds an hour; each shard remains bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Cache the @vscode/test-electron VS Code download so subsequent runs
      # don't re-fetch the ~150MB stable build.
      - name: Cache VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-electron-${{ runner.os }}

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      # Compile up front so the e2e launcher (which also runs `npm run
      # compile`) finds an already-warm tsc and so any compile failures
      # surface before xvfb spins up.
      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Run e2e tests under xvfb
        working-directory: vscode-extension
        env:
          COMPOSE_PREVIEW_E2E_FILES: ${{ matrix.files }}
          COMPOSE_PREVIEW_E2E_GREP: ${{ matrix.grep }}
        run: xvfb-run -a npm run test:e2e

      - name: Upload renders on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-renders-${{ matrix.shard }}
          path: |
            samples/cmp/build/compose-previews/
            samples/android/build/compose-previews/
            samples/wear/build/compose-previews/
            vscode-extension/.vscode-test/user-data/logs/
          if-no-files-found: ignore
          retention-days: 7
