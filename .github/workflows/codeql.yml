name: CodeQL

# Advanced-setup CodeQL, matching the languages Default Setup previously
# auto-detected (java-kotlin, javascript-typescript, actions).
#
# Why advanced setup at all: Default Setup's autobuild injects Gradle init
# scripts (`setup-proxy.gradle`, `semmleTempDir/init.gradle`) that call
# `allprojects { repositories { ... } }` and `allprojects { tasks... }`,
# both rejected by this repo's strict config (`configuration-cache=true`
# with `problems=fail`, plus `isolated-projects=true`). For java-kotlin we
# run Gradle ourselves with those flags disabled, scoped to the scan only.
# The other languages use `build-mode: none` — Kotlin isn't supported in
# `none` mode but JS/TS and Actions are.
#
# Switch the repo from Default to Advanced setup in
# Settings → Code security → Code scanning for this workflow to take effect.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-peak.
    - cron: '27 7 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The java-kotlin extractor lags the Kotlin release train: this repo builds
    # with Kotlin 2.4.0, but CodeQL only supports versions below 2.3.30, so the
    # compile step fails with "Kotlin version too new" (a CodeQL configuration
    # error, not a code defect). Don't let that block CI. Scoped to java-kotlin
    # only — JS/TS and Actions analysis still gate as normal, and once the
    # extractor catches up to 2.4.0 the Kotlin job goes green again with no
    # further change. Revisit / remove this once CodeQL supports Kotlin 2.4.0.
    continue-on-error: ${{ matrix.language == 'java-kotlin' }}
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK + Gradle
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Excludes vendored third-party assets (e.g. the CMP Wasm catalog's
          # pinned js-joda bundle) from analysis — not our source to fix.
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL traces the Kotlin/Java compiler to build its database, so we
      # need a real compile — but with configuration-cache and isolated-projects
      # disabled, because CodeQL's injected init scripts violate both.
      # `--no-build-cache` is required: without it the remote Gradle cache
      # serves `compileKotlin*` as FROM-CACHE, no compiler process runs, and
      # CodeQL's tracer sees no source (failing with "no source code seen").
      # `compileKotlin` covers all Kotlin source sets across the multi-module
      # build via task-name matching in subprojects.
      - name: Compile Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew compileKotlin compileDebugKotlin compileReleaseKotlin \
            --no-configuration-cache \
            --no-build-cache \
            -Dorg.gradle.unsafe.isolated-projects=false \
            --continue

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
