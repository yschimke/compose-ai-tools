name: Publish snapshot

# Publish a -SNAPSHOT build to the Maven Central snapshots repo
# (https://central.sonatype.com/repository/maven-snapshots/) on every push to
# main. The vanniktech plugin routes `-SNAPSHOT` versions to that URL
# automatically; snapshots are unsigned.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suffix:
        description: >-
          Optional version suffix inserted before -SNAPSHOT. Leave blank to use
          the plain next-patch snapshot on main, or a ref+SHA suffix on branches.
        required: false
        type: string

concurrency:
  group: snapshot-${{ github.ref }}-${{ inputs.suffix || 'auto' }}
  cancel-in-progress: true

# Snapshot publish only reads repo contents; auth for Central is via
# env-based credentials, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # The snapshot coordinate, computed ONCE and handed to both publishers.
  #
  # Sharing `scripts/snapshot-version.sh` was not enough: each job does its own full-depth checkout
  # and its own `git describe`, so they see whatever tags exist at their own start time. Both this
  # workflow and release-please fire on a release-PR merge to `main`, and a `v*` tag created between
  # the two checkouts would have one job computing from the previous tag and the other from the new
  # one — publishing half the stack under a coordinate nothing resolves. One job, one answer.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need tags to compute the next snapshot version.
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Compute snapshot version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_SUFFIX: ${{ inputs.suffix || '' }}
        run: scripts/snapshot-version.sh

  publish-snapshot:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publish -SNAPSHOT to Maven Central snapshots
        env:
          PLUGIN_VERSION: ${{ needs.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # Root-level `publishToMavenCentral` (no `:` prefix) fans out to every subproject that
          # registered the task — i.e. every module applying the `composeai.maven-publishing`
          # convention plugin. `:gradle-plugin` is an `includeBuild` (composite build), so root
          # abbreviation doesn't reach it; address it explicitly. This avoids the hand-curated
          # publish list that previously drifted out of sync (PR #724 added
          # `:data-a11y-hierarchy-android` here but missed adding it to this list, leaving
          # consumers' `renderer-android` POM resolution broken at snapshot time).
          #
          # The four `:rc-player-*` modules are excluded and published by `publish-player-snapshot`
          # on macOS: they declare `iosArm64`/`iosSimulatorArm64`, which Kotlin/Native cannot build
          # on Linux. Same split as `release.yml`; keep the two exclusion lists in step.
          ./gradlew :gradle-plugin:publishToMavenCentral publishToMavenCentral \
            -x :rc-player-trace:publishToMavenCentral \
            -x :rc-player-protocol:publishToMavenCentral \
            -x :rc-player-runtime:publishToMavenCentral \
            -x :rc-player-compose:publishToMavenCentral
          # Note: `--no-configuration-cache` is incompatible with
          # `org.gradle.unsafe.isolated-projects=true` set in gradle.properties
          # (Gradle fails with "Configuration Cache cannot be disabled when
          # Isolated Projects is enabled"). Vanniktech's publish tasks work
          # with config-cache, so just let it run normally.

  # The `:rc-player-*` stack, snapshotted from macOS for the same reason `release.yml` publishes it
  # there: its Apple klibs only build on a Mac. Kept as its own job rather than moving the whole
  # snapshot to macOS, so the ordinary Linux publish stays on the cheaper, already-proven runner.
  publish-player-snapshot:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # See `release.yml`'s `publish-xcframework`: CMP 1.11's `ui-uikit` needs the iOS 26 SDK.
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this image; Compose Multiplatform's iOS targets need its SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
      - name: Publish the rc-player stack -SNAPSHOT
        env:
          PLUGIN_VERSION: ${{ needs.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./gradlew \
            :rc-player-trace:publishToMavenCentral \
            :rc-player-protocol:publishToMavenCentral \
            :rc-player-runtime:publishToMavenCentral \
            :rc-player-compose:publishToMavenCentral
