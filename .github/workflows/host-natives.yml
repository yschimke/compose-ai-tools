name: Host Natives

# Builds the host (desktop) native libraries the simulator loads in place of an APK's Android-only
# ones, on real Linux and macOS runners, and verifies them against Robolectric's native runtime on
# the architecture each targets. Each library is a recipe, `host-natives/<recipe>/`: today
# androidx.graphics:graphics-path's, and Filament's filament-jni (Linux only).
#
# Each recipe releases on its own line, keyed by the LIBRARY's version, not this repository's:
# `host-natives-<recipe>-<version>` (`host-natives/build.sh release-tag <recipe>`), a prerelease never
# marked latest, so the CLI installers, the install action and `/releases/latest` never see it. A
# push to main publishes every recipe whose tag is not out yet and skips the rest, so an unchanged
# recipe is never republished, and a compose-ai-tools release builds none of this. Publishing then
# opens a PR adding the builds to `host-natives/index.json`, which is what `compose-preview launch`
# reads. See docs/RELEASING.md, "The host-natives binaries".

on:
  pull_request:
    branches: [main]
    paths:
      - 'host-natives/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/host-natives.yml'
  push:
    branches: [main]
    paths:
      - 'host-natives/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/host-natives.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `index.json` is what `compose-preview launch` reads at run time, from main: every archive it
  # names must download, match its sha256 and carry the library it says it does.
  index:
    name: Index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the index tooling
        run: python3 host-natives/test_index.py -v
      - name: Check every build in the index
        run: python3 host-natives/index.py check --online

  build:
    name: Build ${{ matrix.recipe }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Linux builds against an old glibc, so the library loads on any host from that one on:
    # ubuntu-latest's own glibc versions symbols as new as itself (sqrtf@GLIBC_2.43 from Ubuntu
    # 26.04), and a library built there loads nowhere older. manylinux_2_28 is PyPA's maintained
    # image for exactly this (glibc 2.28, a current gcc-toolset, binutils and curl preinstalled);
    # Debian 11, tried first, has had its security archive retired. build.sh enforces the floor.
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: graphics-path
            runner: ubuntu-latest
            platform: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            timeout: 15
          # One universal (arm64 + x86_64) dylib, built with Apple's toolchain.
          - recipe: graphics-path
            runner: macos-latest
            platform: macos-universal
            container: ''
            timeout: 15
          # All of Filament, from source: most of the time is its material compiler's SPIR-V tools.
          - recipe: filament
            runner: ubuntu-latest
            platform: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            timeout: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For <jni.h>.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Filament builds with clang (its supported compiler) against the gcc-toolset libstdc++ that
      # manylinux_2_28 puts on PATH, which clang does not find by itself; CMake and Ninja come from
      # PyPI, as manylinux's own tools do. The EGL headers are glvnd's.
      - name: Install the Filament toolchain
        if: matrix.recipe == 'filament'
        run: |
          dnf install -y -q clang libglvnd-devel
          pipx install cmake
          pipx install ninja
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          # Unused while compiling (it matters when linking), which spirv-cross's -Werror rejects.
          gcc_root="$(dirname "$(dirname "$(command -v gcc)")")"
          echo "gcc-toolset at $gcc_root ($(gcc -dumpversion))"
          toolchain="--gcc-toolchain=$gcc_root -Wno-unused-command-line-argument"
          echo "CFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "LDFLAGS=$toolchain" >> "$GITHUB_ENV"

      - name: Build
        env:
          RECIPE: ${{ matrix.recipe }}
        run: host-natives/build.sh "$RECIPE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-natives-${{ matrix.platform }}-${{ matrix.recipe }}
          path: host-natives/build/dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.platform }} on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          # Each slice of the universal dylib, on its own architecture.
          - runner: macos-latest
            platform: macos-universal
          - runner: macos-15-intel
            platform: macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-natives-${{ matrix.platform }}-graphics-path
          path: host-natives/build/dist

      - name: Unpack
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dir="host-natives/build/graphics-path/$PLATFORM"
          mkdir -p "$dir"
          tar -xzf host-natives/build/dist/host-natives-graphics-path-*-"$PLATFORM".tar.gz -C "$dir"
          cat "$dir/host-natives.properties"

      - name: Verify against Robolectric
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./gradlew -p host-natives/verify verifyHostNatives -PhostNativesDir="$PWD/host-natives/build/graphics-path/$PLATFORM"

  # filament-jni rendering onto a Surface in Robolectric, on Mesa's software OpenGL (llvmpipe):
  # the runner has no GPU, and that is the setup most hosts running the simulator headless have.
  verify-filament:
    name: Verify filament linux-x86_64
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-natives-linux-x86_64-filament
          path: host-natives/build/dist

      - name: Unpack
        run: |
          dir="host-natives/build/filament/linux-x86_64"
          mkdir -p "$dir"
          tar -xzf host-natives/build/dist/host-natives-filament-*-linux-x86_64.tar.gz -C "$dir"
          cat "$dir/host-natives.properties"

      - name: Verify against Robolectric
        run: ./gradlew -p host-natives/verify verifyFilament -PfilamentDir="$PWD/host-natives/build/filament/linux-x86_64"

  publish:
    name: Publish
    needs: [verify, verify-filament]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-natives-*
          path: dist
          merge-multiple: true

      # One release per recipe and library version. A tag that exists is skipped, never replaced:
      # consumers cache builds by sha256, and an unchanged recipe has nothing new to say.
      - name: Publish new recipe versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p published
          for recipe in $(host-natives/build.sh recipes); do
            tag="$(host-natives/build.sh release-tag "$recipe")"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already published; skipping $recipe"
              continue
            fi
            version="$(sed -n 's/^version=//p' "host-natives/$recipe/recipe.properties")"
            library="$(sed -n 's/^library=//p' "host-natives/$recipe/recipe.properties")"
            commit="$(sed -n 's/^commit=//p' "host-natives/$recipe/recipe.properties")"
            repository="$(sed -n 's/^repository=//p' "host-natives/$recipe/recipe.properties")"
            files=(dist/host-natives-"$recipe"-"$version"-*.tar.gz)
            rm -rf sums && mkdir sums
            (cd dist && sha256sum "${files[@]#dist/}" > ../sums/SHA256SUMS && cat ../sums/SHA256SUMS)
            {
              echo "Host build of \`lib$library\` from $repository@$commit, built and verified by \`host-natives.yml\` at $GITHUB_SHA, for $recipe $version."
              echo
              echo "Not a compose-ai-tools release. \`compose-preview launch\` finds it through \`host-natives/index.json\` once its index PR merges; see docs/RELEASING.md."
            } > notes.md
            gh release create "$tag" "${files[@]}" sums/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "host-natives $recipe $version" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
            cp "${files[@]}" published/
          done

      # Publishing ships nothing by itself: launch finds builds through index.json on main. So add
      # the new releases to it, as a PR to review like any other index change.
      - name: Open the index pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 host-natives/index.py add-release --dist published | tee added.txt
          if [ -z "$(git status --porcelain host-natives/index.json)" ]; then
            echo "index.json is up to date"
            exit 0
          fi
          # agent/ is the house branch prefix, and it is CI-enforced: see AGENTS.md.
          branch="agent/host-natives-index-${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add host-natives/index.json
          git commit -q -m "chore: add new host-natives releases to the index"
          git push -u origin "$branch"
          {
            echo "Adds the host-natives builds just published to \`host-natives/index.json\`, which \`compose-preview launch\` reads from main:"
            echo
            sed 's/^/- /' added.txt
            echo
            echo "Opened by the publish job of \`host-natives.yml\`."
          } > body.md
          url="$(gh pr create --title "chore: add new host-natives releases to the index" \
            --body-file body.md --base main --head "$branch")"
          # GitHub holds the `pull_request` runs of a PR opened with GITHUB_TOKEN for approval
          # (they end `action_required`), so its required checks would never report. Dispatch them
          # on the PR's branch, as release-please.yml does for the release PR: each reports its
          # check on the branch head. release_pr_checks leaves out ci.yml's nightly drift jobs.
          number="${url##*/}"
          gh workflow run ci.yml --ref "$branch" -f release_pr_checks=true
          gh workflow run pr-title.yml --ref "$branch" -f pr="$number"
          gh workflow run no-agent-attribution.yml --ref "$branch" -f pr="$number"
          gh workflow run host-natives.yml --ref "$branch"
          # Lands once those checks pass: every archive it adds was checked online (its sha256 and the
          # library inside it), and nothing ships until it merges.
          gh pr merge "$number" --auto --squash
