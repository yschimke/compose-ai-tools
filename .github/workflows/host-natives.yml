name: Host Natives

# Builds the host (desktop) native libraries the simulator loads in place of an APK's Android-only
# ones, on real Linux and macOS runners, and verifies them against Robolectric's native runtime on
# the architecture each targets. Each library is a recipe, `host-natives/<recipe>/`: today
# androidx.graphics:graphics-path's, Filament's filament-jni (on macOS over ANGLE, which its build
# compiles from source), and rive-android's librive-android (Linux; Rive's Canvas renderer).
#
# Each recipe releases on its own line, keyed by the LIBRARY's version, not this repository's:
# `host-natives-<recipe>-<version>` (`host-natives/build.sh release-tag <recipe>`), a prerelease never
# marked latest, so the CLI installers, the install action and `/releases/latest` never see it. A
# push to main publishes every recipe whose tag is not out yet and skips the rest, so an unchanged
# recipe is never republished, and a compose-ai-tools release builds none of this. Publishing then
# opens a PR adding the builds to `host-natives/index.json`, which is what `compose-preview launch`
# reads. See docs/RELEASING.md, "The host-natives binaries".

on:
  pull_request:
    branches: [main]
    paths:
      - 'host-natives/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/host-natives.yml'
  push:
    branches: [main]
    paths:
      - 'host-natives/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/host-natives.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `index.json` is what `compose-preview launch` reads at run time, from main: every archive it
  # names must download, match its sha256 and carry the library it says it does.
  index:
    name: Index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the index tooling
        run: python3 host-natives/test_index.py -v
      - name: Check every build in the index
        run: python3 host-natives/index.py check --online

  build:
    name: Build ${{ matrix.recipe }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Linux builds against an old glibc, so the library loads on any host from that one on:
    # ubuntu-latest's own glibc versions symbols as new as itself (sqrtf@GLIBC_2.43 from Ubuntu
    # 26.04), and a library built there loads nowhere older. manylinux_2_28 is PyPA's maintained
    # image for exactly this (glibc 2.28, a current gcc-toolset, binutils and curl preinstalled);
    # Debian 11, tried first, has had its security archive retired. build.sh enforces the floor.
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: graphics-path
            runner: ubuntu-latest
            platform: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            timeout: 15
          # One universal (arm64 + x86_64) dylib, built with Apple's toolchain.
          - recipe: graphics-path
            runner: macos-latest
            platform: macos-universal
            container: ''
            timeout: 15
          # All of Filament, from source: most of the time is its material compiler's SPIR-V tools.
          - recipe: filament
            runner: ubuntu-latest
            platform: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            timeout: 120
          # Plus ANGLE (OpenGL ES over Metal) from source, twice (arm64, x86_64): about an hour
          # more when its cache is cold.
          - recipe: filament
            runner: macos-latest
            platform: macos-universal
            container: ''
            timeout: 240
          # The Rive C++ runtime (HarfBuzz, Luau, miniaudio and the rest) and rive-android's JNI layer.
          - recipe: rive
            runner: ubuntu-latest
            platform: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For <jni.h>.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Filament builds with clang (its supported compiler) against the gcc-toolset libstdc++ that
      # manylinux_2_28 puts on PATH, which clang does not find by itself; CMake and Ninja come from
      # PyPI, as manylinux's own tools do. The EGL headers are glvnd's.
      - name: Install the Filament toolchain
        if: matrix.recipe == 'filament' && runner.os == 'Linux'
        run: |
          dnf install -y -q clang libglvnd-devel
          pipx install cmake
          pipx install ninja
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          # Unused while compiling (it matters when linking), which spirv-cross's -Werror rejects.
          gcc_root="$(dirname "$(dirname "$(command -v gcc)")")"
          echo "gcc-toolset at $gcc_root ($(gcc -dumpversion))"
          toolchain="--gcc-toolchain=$gcc_root -Wno-unused-command-line-argument"
          echo "CFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "LDFLAGS=$toolchain" >> "$GITHUB_ENV"

      # Ninja for Filament and ANGLE, and llvm-objcopy (LLVM) to rename the JNI entry points the
      # host layer wraps; Xcode has no objcopy.
      - name: Install the Filament toolchain (macOS)
        if: matrix.recipe == 'filament' && runner.os == 'macOS'
        run: |
          brew install ninja llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "angle=$(sed -n 's/^angle_commit=//p' host-natives/filament/recipe.properties)" >> "$GITHUB_OUTPUT"
        id: mac-toolchain

      # ANGLE takes about an hour to sync and build, and changes only with its pinned commit.
      - name: Cache ANGLE
        if: matrix.recipe == 'filament' && runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: host-natives/build/filament/angle
          key: angle-macos-${{ steps.mac-toolchain.outputs.angle }}-${{ hashFiles('host-natives/filament/host/build-angle.sh') }}

      # Rive builds with clang through its own premake (bootstrapped from source by build.sh), with
      # Ninja; glslang and SPIRV-Tools' spirv-opt compile the runtime's Vulkan shaders.
      # manylinux_2_28's repositories have neither, so glslang is built here at a pinned release,
      # with the SPIRV-Tools and SPIRV-Headers commits its known_good.json pins (which installs
      # spirv-opt too). As for Filament, clang needs pointing at gcc-toolset's libstdc++ (build.sh
      # hands CFLAGS and CXXFLAGS to premake's compilers).
      - name: Install the Rive toolchain
        if: matrix.recipe == 'rive'
        env:
          GLSLANG_TAG: 16.6.0
          GLSLANG_COMMIT: e1b562a8bed273a02f30b59b66a5d499793cede5
        run: |
          # libuuid-devel: premake's bootstrap includes <uuid/uuid.h>.
          dnf install -y -q clang libuuid-devel
          pipx install ninja
          pipx install cmake
          git clone -q --depth 1 --branch "$GLSLANG_TAG" https://github.com/KhronosGroup/glslang /tmp/glslang
          test "$(git -C /tmp/glslang rev-parse HEAD)" = "$GLSLANG_COMMIT"
          (cd /tmp/glslang && python3 update_glslang_sources.py)
          cmake -G Ninja -S /tmp/glslang -B /tmp/glslang/build -DCMAKE_BUILD_TYPE=Release \
            -DGLSLANG_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          ninja -C /tmp/glslang/build install
          glslangValidator --version | head -1
          command -v spirv-opt
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          gcc_root="$(dirname "$(dirname "$(command -v gcc)")")"
          toolchain="--gcc-toolchain=$gcc_root -Wno-unused-command-line-argument"
          echo "CFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$toolchain" >> "$GITHUB_ENV"
          echo "LDFLAGS=$toolchain" >> "$GITHUB_ENV"

      - name: Build
        env:
          RECIPE: ${{ matrix.recipe }}
        run: host-natives/build.sh "$RECIPE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-natives-${{ matrix.platform }}-${{ matrix.recipe }}
          path: host-natives/build/dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.platform }} on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          # Each slice of the universal dylib, on its own architecture.
          - runner: macos-latest
            platform: macos-universal
          - runner: macos-15-intel
            platform: macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-natives-${{ matrix.platform }}-graphics-path
          path: host-natives/build/dist

      - name: Unpack
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dir="host-natives/build/graphics-path/$PLATFORM"
          mkdir -p "$dir"
          tar -xzf host-natives/build/dist/host-natives-graphics-path-*-"$PLATFORM".tar.gz -C "$dir"
          cat "$dir/host-natives.properties"

      - name: Verify against Robolectric
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./gradlew -p host-natives/verify verifyHostNatives -PhostNativesDir="$PWD/host-natives/build/graphics-path/$PLATFORM"

  # filament-jni rendering onto a Surface in Robolectric, on Mesa's software OpenGL (llvmpipe):
  # the runner has no GPU, and that is the setup most hosts running the simulator headless have.
  verify-filament:
    name: Verify filament ${{ matrix.platform }} on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          # Each slice of the universal dylib, on its own architecture, over ANGLE on Metal.
          - runner: macos-latest
            platform: macos-universal
          - runner: macos-15-intel
            platform: macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgles2 libgl1 libegl-mesa0 libgl1-mesa-dri

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-natives-${{ matrix.platform }}-filament
          path: host-natives/build/dist

      - name: Unpack
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dir="host-natives/build/filament/$PLATFORM"
          mkdir -p "$dir"
          tar -xzf host-natives/build/dist/host-natives-filament-*-"$PLATFORM".tar.gz -C "$dir"
          cat "$dir/host-natives.properties"

      - name: Verify against Robolectric
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./gradlew -p host-natives/verify verifyFilament -PfilamentDir="$PWD/host-natives/build/filament/$PLATFORM"

  # librive-android in the simulator, end to end: samples/rive's RiveAnimationViews, drawn by Rive's
  # Canvas renderer into the simulator's TextureViews, each checked for a frame
  # (.github/scripts/simulator_smoke.py --check rive). The index here is the checkout's with this
  # build added and its file already in the CLI's cache, so nothing is fetched from a release that
  # does not exist yet.
  verify-rive:
    name: Verify rive linux-x86_64 in the simulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rive's Compose API renders with the host's OpenGL ES (host/HostEgl.cpp): Mesa's
      # surfaceless EGL and llvmpipe, as verify-filament.
      - name: Install Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgles2 libgl1 libegl-mesa0 libgl1-mesa-dri

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-natives-linux-x86_64-rive
          path: dist

      - name: Index and cache the build
        run: |
          set -euo pipefail
          python3 host-natives/index.py add-release --dist dist
          archive="$(ls dist/host-natives-rive-*-linux-x86_64.tar.gz)"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          files="$RUNNER_TEMP/cache/composeai/host-natives/files/$sha/linux-x86_64"
          mkdir -p "$files"
          tar -xzf "$archive" -C "$files" ./librive-android.so
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          echo "COMPOSE_PREVIEW_HOST_NATIVES_INDEX=$PWD/host-natives/index.json" >> "$GITHUB_ENV"

      - name: Build the CLI and samples/rive
        run: ./gradlew :cli:installDist :samples:rive:assembleDebug

      - name: Rive in the simulator
        run: >-
          python3 .github/scripts/simulator_smoke.py
          --cli cli/build/install/compose-preview/bin/compose-preview
          --apk samples/rive/build/outputs/apk/debug/rive-debug.apk
          --check rive --java "$JAVA_HOME" --out build/simulator-smoke

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rive-simulator
          path: build/simulator-smoke
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: [verify, verify-filament, verify-rive]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-natives-*
          path: dist
          merge-multiple: true

      # One release per recipe and library version. A tag that exists is skipped, never replaced:
      # consumers cache builds by sha256, and an unchanged recipe has nothing new to say.
      - name: Publish new recipe versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p published
          for recipe in $(host-natives/build.sh recipes); do
            tag="$(host-natives/build.sh release-tag "$recipe")"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already published; skipping $recipe"
              continue
            fi
            version="$(sed -n 's/^version=//p' "host-natives/$recipe/recipe.properties")"
            library="$(sed -n 's/^library=//p' "host-natives/$recipe/recipe.properties")"
            commit="$(sed -n 's/^commit=//p' "host-natives/$recipe/recipe.properties")"
            repository="$(sed -n 's/^repository=//p' "host-natives/$recipe/recipe.properties")"
            files=(dist/host-natives-"$recipe"-"$version"-*.tar.gz)
            rm -rf sums && mkdir sums
            (cd dist && sha256sum "${files[@]#dist/}" > ../sums/SHA256SUMS && cat ../sums/SHA256SUMS)
            {
              echo "Host build of \`lib$library\` from $repository@$commit, built and verified by \`host-natives.yml\` at $GITHUB_SHA, for $recipe $version."
              echo
              echo "Not a compose-ai-tools release. \`compose-preview launch\` finds it through \`host-natives/index.json\` once its index PR merges; see docs/RELEASING.md."
            } > notes.md
            gh release create "$tag" "${files[@]}" sums/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "host-natives $recipe $version" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
            cp "${files[@]}" published/
          done

      # Publishing ships nothing by itself: launch finds builds through index.json on main. So add
      # the new releases to it, as a PR to review like any other index change.
      - name: Open the index pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 host-natives/index.py add-release --dist published | tee added.txt
          if [ -z "$(git status --porcelain host-natives/index.json)" ]; then
            echo "index.json is up to date"
            exit 0
          fi
          # agent/ is the house branch prefix, and it is CI-enforced: see AGENTS.md.
          branch="agent/host-natives-index-${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add host-natives/index.json
          git commit -q -m "chore: add new host-natives releases to the index"
          git push -u origin "$branch"
          {
            echo "Adds the host-natives builds just published to \`host-natives/index.json\`, which \`compose-preview launch\` reads from main:"
            echo
            sed 's/^/- /' added.txt
            echo
            echo "Opened by the publish job of \`host-natives.yml\`."
          } > body.md
          url="$(gh pr create --title "chore: add new host-natives releases to the index" \
            --body-file body.md --base main --head "$branch")"
          # GitHub holds the `pull_request` runs of a PR opened with GITHUB_TOKEN for approval
          # (they end `action_required`), so its required checks would never report. Dispatch them
          # on the PR's branch, as release-please.yml does for the release PR: each reports its
          # check on the branch head. release_pr_checks leaves out ci.yml's nightly drift jobs.
          number="${url##*/}"
          gh workflow run ci.yml --ref "$branch" -f release_pr_checks=true
          gh workflow run pr-title.yml --ref "$branch" -f pr="$number"
          gh workflow run no-agent-attribution.yml --ref "$branch" -f pr="$number"
          gh workflow run host-natives.yml --ref "$branch"
          # Lands once those checks pass: every archive it adds was checked online (its sha256 and the
          # library inside it), and nothing ships until it merges.
          gh pr merge "$number" --auto --squash
