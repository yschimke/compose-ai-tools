name: Release client apps

# Builds + publishes the mobile / wear session-viewer apps (`:clients:mobile`,
# `:clients:wear`). Modeled on yschimke/homeassistant-remotecompose's release-build.yml:
# signing comes from env (keystore decoded from a base64 secret), Gradle Play Publisher pushes the
# AAB to the Play internal track, and the APKs/AABs are attached to the GitHub release.
#
# Triggered by a `clients-v*` tag, manual dispatch, or workflow_call (so a release-please job can
# invoke it). It is intentionally separate from `release.yml` (the CLI/library release) and
# `release-please.yml` — the client apps version independently from the published Gradle artifacts.

on:
  push:
    tags: ['clients-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. clients-v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build (e.g. clients-v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clients-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Required secrets (all optional — each gates its own step, so the job still assembles unsigned
# APKs without any of them):
#   SIGNING_KEYSTORE             base64 of the upload keystore (.jks)
#   COMPOSEAI_KEYSTORE_PASSWORD  keystore password
#   COMPOSEAI_KEY_ALIAS          key alias inside the keystore
#   COMPOSEAI_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON    Play service-account JSON; presence gates the Play upload
jobs:
  release:
    name: Build & publish client apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      HAS_SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE != '' }}
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'

      - name: Decode signing keystore
        if: env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/upload.jks"
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$keystore"
          echo "COMPOSEAI_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assemble release APKs
        env:
          COMPOSEAI_KEYSTORE_PASSWORD: ${{ secrets.COMPOSEAI_KEYSTORE_PASSWORD }}
          COMPOSEAI_KEY_ALIAS: ${{ secrets.COMPOSEAI_KEY_ALIAS }}
          COMPOSEAI_KEY_PASSWORD: ${{ secrets.COMPOSEAI_KEY_PASSWORD }}
        run: ./gradlew :clients:mobile:assembleRelease :clients:wear:assembleRelease --stacktrace

      - name: Assemble release bundles (Play)
        if: env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          COMPOSEAI_KEYSTORE_PASSWORD: ${{ secrets.COMPOSEAI_KEYSTORE_PASSWORD }}
          COMPOSEAI_KEY_ALIAS: ${{ secrets.COMPOSEAI_KEY_ALIAS }}
          COMPOSEAI_KEY_PASSWORD: ${{ secrets.COMPOSEAI_KEY_PASSWORD }}
        run: ./gradlew :clients:mobile:bundleRelease :clients:wear:bundleRelease --stacktrace

      - name: Publish to Play (internal track, draft)
        if: env.HAS_PLAY_CREDENTIALS == 'true' && env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          COMPOSEAI_KEYSTORE_PASSWORD: ${{ secrets.COMPOSEAI_KEYSTORE_PASSWORD }}
          COMPOSEAI_KEY_ALIAS: ${{ secrets.COMPOSEAI_KEY_ALIAS }}
          COMPOSEAI_KEY_PASSWORD: ${{ secrets.COMPOSEAI_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew :clients:mobile:publishBundle :clients:wear:publishBundle --stacktrace

      - name: Release publish summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Client apps release status"
            echo
            echo "- Tag: ${TAG_NAME}"
            echo "- Signing keystore configured: ${HAS_SIGNING_KEYSTORE}"
            echo "- Play credentials configured: ${HAS_PLAY_CREDENTIALS}"
            if [[ "${HAS_SIGNING_KEYSTORE}" == "true" && "${HAS_PLAY_CREDENTIALS}" == "true" ]]; then
              echo "- Play publish: attempted (internal track, draft) for :clients:mobile + :clients:wear"
            else
              echo "- Play publish: skipped (release secrets not fully configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          mkdir -p _release
          version="${TAG_NAME#clients-v}"
          shopt -s nullglob
          for f in clients/mobile/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" .apk); suffix=""
            case "$name" in *-unsigned) suffix="-unsigned" ;; esac
            cp "$f" "_release/composeai-session-viewer-${version}${suffix}.apk"
          done
          for f in clients/mobile/build/outputs/bundle/release/*.aab; do
            cp "$f" "_release/composeai-session-viewer-${version}.aab"
          done
          for f in clients/wear/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" .apk); suffix=""
            case "$name" in *-unsigned) suffix="-unsigned" ;; esac
            cp "$f" "_release/composeai-session-viewer-wear-${version}${suffix}.apk"
          done
          for f in clients/wear/build/outputs/bundle/release/*.aab; do
            cp "$f" "_release/composeai-session-viewer-wear-${version}.aab"
          done
          ls -la _release/
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            _release/*.apk
            _release/*.aab

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: clients-release-${{ steps.stage.outputs.version }}
          path: _release/
