name: Compose Preview Publish

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  compose:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-preview-handoff-compose
          path: _compose_preview_handoff_compose
          run-id: ${{ github.event.workflow_run.id }}
      - id: pr
        run: echo "number=$(cat _compose_preview_handoff_compose/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/apply
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          handoff-dir: _compose_preview_handoff_compose
          artifact-repository: yschimke/compose-ai-tools-out
          artifacts-token: ${{ secrets.COMPOSE_M3_ARTIFACTS_TOKEN }}
          rerun-checkbox: 'true'
  a11y:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-preview-handoff-a11y
          path: _compose_preview_handoff_a11y
          run-id: ${{ github.event.workflow_run.id }}
      - id: pr
        run: echo "number=$(cat _compose_preview_handoff_a11y/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/apply
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          handoff-dir: _compose_preview_handoff_a11y
          artifact-repository: yschimke/compose-ai-tools-out
          artifacts-token: ${{ secrets.COMPOSE_M3_ARTIFACTS_TOKEN }}
