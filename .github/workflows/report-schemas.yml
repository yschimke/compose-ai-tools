name: Report Schemas

on:
  pull_request:
    branches: [main]
  # Verification of the merge result, replacing `push: [main]` (#5063). A
  # merge-queue run tests the tree GitHub is about to fast-forward `main` to,
  # so the push it produces needs no second run of the same suite — and unlike
  # that push run, it is not cancelled by the next merge landing four minutes
  # later.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine report-schema scope
    runs-on: ubuntu-latest
    outputs:
      validate: ${{ steps.scope.outputs.validate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          python3 .github/ci/path-scope.py \
            --config .github/ci/report-schema-paths.json >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: ${{ needs.changes.outputs.validate == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    name: Validate published report schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Validate report payloads against schemas
        run: node scripts/validate-report-schemas.mjs
