name: Publish parity issue index

on:
  workflow_call:
    inputs:
      system:
        description: Catalog slug; publishes to design-artifacts/<system>.
        required: true
        type: string
      repositories:
        description: JSON array of owner/name repositories whose issues carry locator blocks.
        required: true
        type: string
      artifact-repository:
        description: Repository that owns design-artifacts/<system>. Empty means the caller repository.
        default: ''
        type: string
      driver-ref:
        description: compose-ai-tools ref providing the producer and push helper.
        default: main
        type: string
    secrets:
      artifacts_token:
        description: Optional Contents-write token for artifact-repository.
        required: false
      ISSUES_TOKEN:
        description: Optional token with Issues read access to every configured repository.
        required: false
  workflow_dispatch:
    inputs:
      system:
        required: true
        type: string
      repositories:
        description: JSON array of owner/name repositories.
        required: true
        type: string
      artifact-repository:
        description: Repository that owns design-artifacts/<system>. Empty means the caller repository.
        default: ''
        type: string
      driver-ref:
        default: main
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ inputs.artifact-repository || github.repository }}-${{ inputs.system }}-parity-issues
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue-index driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: ${{ inputs.driver-ref }}
          path: compose-ai-tools
          persist-credentials: false

      - name: Generate parity/issues.json
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN || github.token }}
          REPOSITORIES: ${{ inputs.repositories }}
        run: |
          set -euo pipefail
          mkdir -p out
          args=()
          while IFS= read -r repo; do
            args+=(--repo "$repo")
          done < <(jq -er '.[]' <<<"$REPOSITORIES")
          # The driver runs from the published `@design-parity/export-driver` package at the version
          # the checked-out pin file names. A `driver-ref` older than that line still carries its own
          # copy of the script, so fall back to it rather than failing an older caller.
          pin=compose-ai-tools/.github/design-artifacts-driver-pin.txt
          version=$(sed -nE 's/^export-driver=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$pin" 2>/dev/null | head -n1 || true)
          if [ -n "$version" ]; then
            driver="$RUNNER_TEMP/export-driver"
            mkdir -p "$driver"
            tarball=$(npm pack "@design-parity/export-driver@${version}" --pack-destination "$RUNNER_TEMP" | tail -n1)
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$driver" --strip-components=1
          else
            driver=compose-ai-tools/scripts/design-artifacts
          fi
          node "$driver/emit-parity-issues.mjs" \
            --out out "${args[@]}"

      - name: Publish the one-path delta
        env:
          TARGET_BRANCH: design-artifacts/${{ inputs.system }}
          REPO: ${{ inputs.artifact-repository || github.repository }}
          GITHUB_TOKEN_INLINE: ${{ secrets.artifacts_token || github.token }}
          MSG: "chore(parity): refresh ${{ inputs.system }} issue index"
          DELTA_ON_TIP_PATHS: parity/issues.json
          SKIP_IF_UNCHANGED: 1
        run: |
          set -euo pipefail
          cd out
          bash "$GITHUB_WORKSPACE/compose-ai-tools/.github/actions/apply/lib/push-branch.sh"
