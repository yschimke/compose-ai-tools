name: Design Artifacts (reusable)

# Reusable design-catalog publish pipeline, callable from any repo that owns a
# `catalog.spec.json` + a renderable `@Preview` module. Collapses the ~200-line
# per-repo copy of this job into a `uses:` call:
#
#   jobs:
#     publish:
#       # Guard against forks pushing a branch into your repo:
#       if: ${{ github.repository == 'you/your-repo' }}
#       permissions:
#         contents: write
#       uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@main
#       with:
#         system: your-system
#         spec: catalog.spec.json
#         module: ':app' # omit (or set modules: all) to publish every preview-enabled module
#       secrets: inherit   # optional; only needed for buildfetch-ro-token
#
# The pipeline: install the released compose-preview CLI → validate the spec
# (fast, build-free) → render the module(s) with `bundle pack --with-semantics` →
# join to the spec with generate-design-catalog.mjs → force-push the importable
# bundle to `design-artifacts/<system>`, which the public preview server
# (preview.coo.ee) serves at /<system>/.
#
# That last step is a SEPARATE JOB (`publish-catalog`), and deliberately so. Every
# job that runs the rendered project's Gradle holds `contents: read`; only the
# publish job, which runs none of it, can write. The rendered catalog crosses the
# boundary as an artifact. That split is what lets a caller render with nothing but
# read access — see `upstream-repository` for the case that needs it.
#
# Bespoke lanes some catalogs add (e.g. compose-m3's re-theme fold-in, a Wasm
# tier) are intentionally out of scope — a caller that needs them keeps its own
# workflow. This covers single-module (± one extra module) catalogs and repository-wide static or
# multi-live-bundle catalogs spanning every preview-enabled module.

on:
  workflow_call:
    inputs:
      system:
        description: 'Catalog slug; the delivery branch is design-artifacts/<system>.'
        required: true
        type: string
      spec:
        description: 'Path to catalog.spec.json in the caller repo.'
        required: true
        type: string
      module:
        description: 'Gradle module path to render (e.g. ":app"). Omit to discover and publish every module with the preview plugin applied.'
        required: false
        type: string
        default: ''
      variant:
        description: >
          Android variant the preview plugin attaches its tasks to, forwarded to the CLI as
          `--variant` (which becomes `-PcomposePreview.variant=<name>` on every Gradle
          invocation). Omit for the plugin's own default of `debug`, which is right for any
          module without product flavors.

          Needed when a module HAS flavors, because there is then no plain `debug` variant and
          the flavor picked for you may not be the one that builds. home-assistant/android is
          the case in point: its `app/src/screenshotTest/` source set is flavor-agnostic but
          references a symbol that exists only in the `full` flavor, so `minimalDebug` fails to
          compile before a preview is rendered, while `fullDebug` is fine.
        required: false
        type: string
        default: ''
      modules:
        description: 'Set to "all" to discover and publish every preview-enabled Gradle module. Equivalent to omitting module; other values are rejected.'
        required: false
        type: string
        default: ''
      # CodeQL reports "Checkout of untrusted code in a privileged context" (critical)
      # against the `actions/checkout` steps that consume this input and `driver-ref`
      # below. In THIS repo it is a false positive — dismissed, not fixed — and the
      # reasoning is worth keeping so the next reader doesn't re-derive it:
      #
      #  - The rule treats a `workflow_run` trigger as privileged, because it usually
      #    fires from a PR-triggered run whose head is untrusted. The one privileged
      #    caller here is post-release-design-artifacts.yml → design-artifacts.yml,
      #    and it hangs off release-please.yml, which runs only on `push` to `main`
      #    and `workflow_dispatch`. No `pull_request`/`pull_request_target` anywhere
      #    in that chain, so nothing a non-writer controls can start it.
      #  - The rule treats a reusable workflow's inputs as attacker-controlled, because
      #    a caller may pass anything. Both call sites in design-artifacts.yml pass
      #    literals only and never set `ref` or `driver-ref`, so the checkouts resolve
      #    to the default branch and the literal `main` respectively.
      #
      # An EXTERNAL caller is a different question: this workflow is meant to be called
      # from other repos, and there the ref a caller passes is that repo's business —
      # if you wire it into a privileged trigger, pass a ref you control, never one
      # derived from PR head/branch/title. Re-check the first bullet before adding any
      # new trigger to a caller in this repo.
      ref:
        description: 'Git ref of the CALLING repo to check out and render (branch, tag or SHA). Empty ⇒ the ref that triggered the caller — the normal push/PR case. Set this when the trigger cannot imply the right ref: a `schedule` run only fires for a workflow on the default branch and checks out that branch, so a catalog living on a side branch (e.g. `previews`) needs `ref: previews` here or the render finds no catalog.spec.json (issue #2963).'
        required: false
        type: string
        default: ''
      extra-module:
        description: 'Optional second module folded in via --extra-renders (previews override same-named functions in the primary render).'
        required: false
        type: string
        default: ''
      cli-version:
        description: 'compose-preview CLI version for the install action: a literal version, "latest", or "catalog".'
        required: false
        type: string
        default: 'latest'
      catalog-key:
        description: 'When cli-version=catalog, the [versions] key to read from the Gradle version catalog.'
        required: false
        type: string
        default: 'composePreviewPlugin'
      catalog-path:
        description: 'When cli-version=catalog, the version-catalog path.'
        required: false
        type: string
        default: 'gradle/libs.versions.toml'
      # Same CodeQL "privileged checkout" note as `ref` above — the default is a
      # literal and no caller in this repo overrides it.
      driver-ref:
        description: 'Deprecated compatibility input. The privileged export driver revision is decided by this workflow — the immutable release commit in .github/design-artifacts-driver-pin.txt for external callers, the caller commit for compose-ai-tools itself — and caller-supplied refs are ignored.'
        required: false
        type: string
        default: 'main'
      desktop-render:
        description: 'Set true for a CMP desktop (Skiko) render — installs Mesa software GL + fonts and runs the render under xvfb. Leave false for an Android/Robolectric render (SDK is preinstalled on ubuntu-latest).'
        required: false
        type: boolean
        default: false
      allow-incomplete:
        description: 'Publish even if some previews fail to render or lack semantics (use for the first run while tuning the spec).'
        required: false
        type: boolean
        default: false
      live-rerender-source:
        description: 'When true, record source:{repo,ref,module} in catalog.json so a trusted, toolchain-equipped serve box can live-rerender. Inert on the public desktop-only server.'
        required: false
        type: boolean
        default: true
      publish-live-bundle:
        description: 'Carry the executable primary render bundle onto the branch under bundle/ and record liveBundle:{path,file} in catalog.json, so a serve box that bakes the matching (Android/desktop) daemon re-renders the previews live instead of replaying baked PNGs.'
        required: false
        type: boolean
        default: false
      defer-figma-svg:
        description: 'Generate pure editable compose/figma-svg vectors on demand through the trusted live daemon instead of publishing one static SVG per rendered variant. Hybrid vectors with raster crops remain static. The capture still produces transient vectors for catalog validation, then strips them from the executable delivery bundle. DEFAULTS ON: publishing one static SVG per variant is the second-largest thing a delivery branch carries, and every one of them is rewritten whenever an otherwise identical render packs in a different order. Meaningless without a daemon to regenerate them, so it is ignored (with a notice) when publish-live-bundle is false rather than failing the run — set it false to keep publishing static vectors from a live catalog.'
        required: false
        type: boolean
        default: true
      embed-deps:
        description: 'Pass --embed-deps to bundle pack so reachable third-party jars are carried inside the bundle under libs/ instead of referenced as Maven coordinates. Needed with publish-live-bundle when the module depends on artifacts the serve box cannot resolve from Maven Central (e.g. JitPack-only deps): without it the live daemon fails to build its classpath and the catalog silently falls back to baked PNGs (livebundle-unavailable). Larger bundle; leave off when every dep is on Central.'
        required: false
        type: boolean
        default: false
      split-per-preview:
        description: 'After generate, split the render into one addressable bundle per preview under bundle/previews/<id>, for the serve host per-preview live lane. The extra module (if any) is split --view-only unless extra-split-mode says otherwise. Live modes require publish-live-bundle (see split-mode).'
        required: false
        type: boolean
        default: false
      split-mode:
        description: "Per-preview split mode when split-per-preview is set: 'auto' (the default — renders as 'full', and FAILS the publish, naming both options with the measured numbers, once the repeated shared carriage crosses half the split output; a small catalog never sees it), 'full' (self-contained, and a deliberate acceptance of the N× carriage at any size), 'full-shared-classpath' (app.jar once in bundle/res, server-hydrated, live lane intact), or 'view-only' (baked, no classpath). Live modes require publish-live-bundle."
        required: false
        type: string
        default: 'auto'
      extra-split-mode:
        description: "Per-preview split mode for the extra-module render: 'view-only' (the default — its previews are pixels-only, with no live lane) or 'full' (the extra bundle is split per preview WITH its re-render classpath, self-contained, and the driver aliases its extra-ONLY functions to daemon ids so the viewer offers real overrides on them instead of the 'Pre-rendered snapshot' note). 'full' requires publish-live-bundle and split-per-preview. Functions the extra bundle OVERRIDES rather than adds stay baked-only either way — the primary daemon would draw them differently."
        required: false
        type: string
        default: 'view-only'
      cli-source:
        description: "How to obtain the compose-preview CLI: 'released' installs it via the install action (the default; what external consumers use), or 'build' builds it from the checked-out compose-ai-tools (driver-ref) with ./gradlew :cli:installDist — for compose-ai-tools' own catalogs, which must publish HEAD's renderer output, not a released one."
        required: false
        type: string
        default: 'released'
      publish:
        description: 'Force-push out/ to design-artifacts/<system>. Set false to hand the generated bundle off (via upload-out) to a follow-up job that post-processes it — e.g. folding in an extra re-themed section — before publishing.'
        required: false
        type: boolean
        default: true
      upload-out:
        description: 'Upload the generated out/ directory as an artifact (<system>-catalog-out) so a downstream job can download, post-process, and publish it. Independent of `publish`.'
        required: false
        type: boolean
        default: false
      rc-embedded-lane:
        description: "Add both Android embedded-player lanes to rc-compare.html: the vendored/local-patch player and the upstream player published in androidx.compose.remote:remote-player-compose. The Robolectric harness that renders them is a test task in yschimke/rc-players, which this workflow checks out — pinned to the `rcplayers` version compose-ai-tools consumes — when either embedded lane is on. Opt-in rather than default: the checkout, an extra JDK and two Gradle runs are minutes a caller who does not want the columns should not pay. Entirely skipped for a catalog that ships no ir/*.rc, and fail-soft — a harness that cannot run drops its column rather than the publish."
        required: false
        type: boolean
        default: false
      rc-embedded-jvm-lane:
        description: "Add the cmp-jvm desktop-player lane to rc-compare.html — one extra compact column (render + folded diff) rendering the bundle's ir/*.rc through the vendored JVM player (Compose Desktop / Skiko, offscreen). Its harness is a test task in yschimke/rc-players, checked out and pinned exactly as rc-embedded-lane describes; the step installs libGL + xvfb for it. Opt-in and fail-soft for the same reasons. Entirely skipped for a catalog that ships no ir/*.rc."
        required: false
        type: boolean
        default: false
      rc-cmp-wasm-lane:
        description: "Add the required CMP/Wasm player lane to rc-compare.html. When enabled, its distribution must build and every ir/*.rc must render unless named in rc-cmp-wasm-allowlist. Evidence is uploaded before a failed gate stops publication. No-op for a catalog that ships no ir/*.rc. Stays OFF by default — unlike the two embedded lanes, this one is a gate rather than enrichment: a document the Wasm player cannot draw, or one that misses the first-frame budgets, fails the step and the catalog does not publish. Opt in per catalog once you know what its documents do in that player."
        required: false
        type: boolean
        default: false
      rc-cmp-wasm-allowlist:
        description: 'Optional caller-repo-relative JSON file containing temporary CMP/Wasm exceptions. Every entry requires id, reason, and a non-expired YYYY-MM-DD expires date.'
        required: false
        type: string
        default: ''
      rc-cmp-wasm-max-cold-first-frame-ms:
        description: 'Maximum cold CMP/Wasm navigation-to-painted-ready time. The strict lane fails above it.'
        required: false
        type: number
        default: 10000
      rc-cmp-wasm-max-warm-first-frame-ms:
        description: 'Maximum cached CMP/Wasm navigation-to-painted-ready time. The strict lane fails above it.'
        required: false
        type: number
        default: 5000
      stage-font-globs:
        description: 'Whitespace-separated repo-relative globs of font files (.ttf/.otf) to stage into fontconfig BEFORE rendering — for a desktop (Skiko) render that must resolve glyphs (CJK/Arabic/…) from a bundled face rather than a system fallback. Empty ⇒ no staging.'
        required: false
        type: string
        default: ''
      figma-contents-only:
        description: >
          Whether published Figma references include only the mapped node. Set false to include
          overlapping layers, such as a component-sheet background. Defaults true, matching Figma.
        required: false
        type: boolean
        default: true
      reference-cache-branch:
        description: >
          Branch holding the design-parity reference cache (`design-parity/reference`, maintained by
          design-parity-import-reusable.yml). When set, the reference lane reads each node's
          STRUCTURE from it instead of asking `/v1/files/:key/nodes`, which is the same JSON that
          endpoint returns — the import wrote it from exactly that response.

          Worth setting because this lane runs on every push while the kit moves rarely, and the
          Figma limiter is per TOKEN: it is shared with the parity runs, the import, and the sibling
          catalog. This lane was the last one still spending it unguarded.

          PIXELS ARE UNAFFECTED. The cache also holds a resolution-free `image.svg`, but the exports
          here are PNG at a per-record density and the `match` score baked into the manifest is
          computed from those pixels — rasterising the SVG locally would move every score. So images
          keep coming from Figma's own renderer, and this input only removes the structure calls.

          A miss is not an error: the node falls through to the API exactly as it did before, so an
          absent or partial cache costs requests, never coverage.
        required: false
        type: string
        default: ''
      reference-backdrop:
        description: >
          Publish each design reference on the ground its sticker was drawn on, as a hex colour
          (e.g. '#000000'). Empty (the default) leaves references transparent, which is right
          wherever the kit's own cells carry a background. Set it for a catalog whose previews
          declare `showBackground` and whose design nodes do not — a dark-first Wear sheet is the
          case: the scorer crops both sides to their content box, so a node export of a clock strip
          on transparency is enlarged to the size of a watch face before it is compared with one,
          and the row reports the missing ground instead of the component. Applied only to stickers
          whose alpha channel is the whole frame or the inscribed device disc; a transparent
          component sticker is left alone and counted in the step's summary.

          Needs a driver that carries the flag. An EXTERNAL caller runs the release-pinned driver
          from design-artifacts-driver-pin.txt, not this repo's main, so this input takes effect
          only once a release has moved that pin past the commit adding it (compose-ai-tools' own
          catalogs get it immediately). Setting it against an older driver publishes unchanged
          references and says so with a warning rather than failing the catalog's render.
        required: false
        type: string
        default: ''
      fold-artifact:
        description: 'Name of an artifact (uploaded by a prior caller job) holding a pre-built render bundle to fold in as its own top-level section AFTER generate — e.g. a re-themed sibling catalog. Empty ⇒ no fold-in. Requires fold-bundle, fold-spec, fold-section.'
        required: false
        type: string
        default: ''
      fold-bundle:
        description: 'Path (within the downloaded fold-artifact) to the render bundle .png to build the folded section from.'
        required: false
        type: string
        default: ''
      fold-spec:
        description: 'Path to the catalog.spec.json describing the folded bundle (may live under the checked-out compose-ai-tools/, e.g. compose-ai-tools/samples/design-catalog-m3/catalog.spec.json).'
        required: false
        type: string
        default: ''
      fold-section:
        description: 'Top-level section/tab name for the folded-in catalog.'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Repo-relative directory holding the Gradle build to render, for a monorepo whose samples are SEPARATE builds (compose-samples: JetNews/, Jetcaster/, … each with their own gradlew, and no build at the repo root). Empty ⇒ the repo root. `spec` stays repo-root-relative either way.'
        required: false
        type: string
        default: ''
      upstream-repository:
        description: |
          IMPORT MODE. An `owner/repo` to render INSTEAD of the calling repository — a third-party
          Compose project the caller wants previews for without forking it or asking it to change.
          Empty (the default) renders the caller's own checkout, which is every existing caller.

          The upstream project is checked out into `upstream/` alongside the caller's checkout, and
          the render runs there; `working-directory`, if also set, is interpreted relative to it, so
          a monorepo upstream still resolves. `spec` stays CALLER-relative — the catalog spec
          describing an imported project belongs to whoever imported it, not to the project.

          SECURITY: the upstream tree is fetched with plain `git`, with no credential helper and no
          token — a public clone needs none, and an untrusted fetch should be handed no secret. The
          jobs that then run that project's Gradle hold `contents: read` and nothing more, because
          publishing lives in its own job (`publish-catalog`) that runs none of it. And this
          executes code from a repository the caller named, so import mode REFUSES to publish. Setting this with `publish: true` fails the run at its first step: the render and
          the force-push would share one job, one workspace and one `GH_TOKEN`, and a build that can
          write the workspace can rewrite the push step out from under it. Import callers pass
          `publish: false` with `upload-out: true` and publish from a separate job that runs none of
          the imported code — yschimke/compose-preview-imports is the worked example.
        required: false
        type: string
        default: ''
      upstream-ref:
        description: 'Branch, tag or SHA of upstream-repository to render. Empty ⇒ its default branch, resolved to one immutable SHA before any shard checks it out. Ignored unless upstream-repository is set.'
        required: false
        type: string
        default: ''
      upstream-java-version:
        description: >-
          Extra JDK to install for an imported project whose Gradle toolchain asks for one this
          runner does not have — a major version like `24`. Empty ⇒ only the JDK 21 every render
          uses. Ignored unless upstream-repository is set.

          A third-party build picks its own toolchain and we do not get to choose it: joreilly's
          ClimateTraceKMP requests 24, so `:composeApp:compileAndroidMain` could not even have its
          dependencies resolved on a runner holding 21 alone ("Cannot find a Java installation …
          matching {languageVersion=24}. Toolchain download repositories have not been
          configured."). Naming the version here installs it ALONGSIDE 21 and points Gradle's
          toolchain detection at it; JAVA_HOME stays 21, which is what the CLI itself runs on.

          Deliberately an explicit version rather than turning on toolchain auto-provisioning: an
          import is somebody else's build, and letting it download an arbitrary JDK mid-render is a
          larger grant than letting it name one this workflow then installs.
        required: false
        type: string
        default: ''
      design-map-command:
        description: >-
          Shell command that projects THIS system's `design-map.json` into the caller repo root,
          run once before every step that reads it. Same input name and semantics as design-parity's
          reusable workflow, and for the same reason: a repo publishing TWO catalogs from two modules
          has one map PATH and two systems needing different maps, so without this the second system
          is scored against the first one's map — every entry dangles and coverage publishes as 0%.
          `system`, `spec` and `module` already vary per call; the map is the fourth thing that does.
          Empty ⇒ the committed map is used as-is, which is right for the single-catalog repos that
          are the common case.
        required: false
        type: string
        default: ''
      preview-annotations:
        description: 'Whitespace-separated multipreview annotation names to teach the build-free spec pre-flight (e.g. "WearPreviewDevices WearPreviewFontScales"). Required whenever the previews are annotated with a multipreview declared in ANOTHER module — the source scan cannot see it, so the pre-flight reports "discovered 0 @Preview function(s)" and fails every entry. Wear catalogs always need this.'
        required: false
        type: string
        default: ''
      exclude-preview-ids:
        description: 'IMPORT MODE ONLY. Extra comma-separated preview-id glob patterns to leave unrendered, appended to the ones this workflow always applies. For the preview an import cannot render standalone — one wanting a CompositionLocal, a Hilt entry point or a process-wide singleton that only the host application installs — where the alternative is failing the whole run over a handful of them. Name the ids rather than reaching for allow-incomplete: this leaves every OTHER render failure fatal, so a real regression still stops the run.'
        required: false
        type: string
        default: ''
      stub-google-services-packages:
        description: 'IMPORT MODE ONLY. Comma-separated Android applicationIds to write a stub google-services.json for, into the rendered module of the throwaway checkout. For an upstream that applies the Google Services plugin unconditionally but does not commit the file, where the build cannot configure at all without one. These must be the EXACT applicationId of each variant, suffixes included: the plugin does no prefix fallback, so naming only the base package fails with "No matching client found for package name". Empty (the default) writes nothing.'
        required: false
        type: string
        default: ''
      commit-user-name:
        description: 'Author/committer name for the generated delivery-branch commit.'
        required: false
        type: string
        default: 'github-actions[bot]'
      commit-user-email:
        description: 'Author/committer email for the generated delivery-branch commit.'
        required: false
        type: string
        default: '41898282+github-actions[bot]@users.noreply.github.com'
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout.'
        required: false
        type: number
        default: 60
      render-shards:
        description: >
          Split the PRIMARY render across this many parallel jobs. 1 (the default) keeps the
          single-job pipeline byte for byte — no extra jobs, no artifacts, no merge.

          Above 1, each shard runs the same `bundle pack` with an
          `--exclude-preview-id-file` naming every preview that is not its share, which leaves the
          excluded previews listed in the bundle without a baked PNG. The file transport keeps a
          large generated exclusion set out of argv. The shards therefore emit structurally
          identical bundles differing only in which `previews/<id>.*` slots are filled, and
          `compose-preview bundle merge` unions them back into the bundle one serial render would
          have produced. Every shard derives its own partition from its own
          `compose-preview list --json` (deterministic: the id list is sorted, then round-robined),
          so there is no serial discover-then-fan-out prefix — and the merge cross-checks the
          shards' plans before trusting them, then checks the merged bundle back against those
          plans so a shard that lost work fails the run instead of publishing a thinner catalog on
          a green tick (m3-catalog#15).

          What this buys, and what it does not: only the MARGINAL cost divides. Re-measured on
          m3-catalog after #3548 (issue #3559), a single-job render is
          `render_seconds ≈ 100 + 0.39s × previews`, and a shard's own fixed cost — job prefix, its
          own discovery, the render step's Gradle prologue — is ~150 s, plus a ~85 s merge tail.
          The marginal term collapsed 6.5x (2.55s → 0.39s per preview) while the fixed term did not
          move, so the useful range moved DOWN, not up: at ~1150 previews sharding buys ~3 min of
          wall clock for three extra runners, and 1 is the right answer. It starts paying again
          around 3000 previews and is necessary near 6000, where the serial render meets a 2400s
          `render-timeout`. Measure before raising this; do not budget from the pre-#3548
          `3.7 + 2.15s × previews` model, which is wrong in both terms.

          Reach for `modePriority` first where a catalog can: deferral makes the work smaller, which
          sharding then divides. The two compose.

          The extra module (`extra-module`) is NOT sharded — it is a supplement, small by
          construction, and it renders in the generate job as before.
        required: false
        type: number
        default: 1
      render-timeout:
        description: >
          Seconds `bundle pack` may spend rendering, per module. This is the INNER timeout on the
          render itself, not the job timeout above — a catalog can sit well inside `timeout-minutes`
          and still be killed here, and the failure reads as a bare "Build timed out after 600s"
          well before the publish step it never reached.

          Scales with the number of previews, so a catalog that fans a component out over a variant
          matrix outgrows the default long before it outgrows the job. Raise it rather than thinning
          coverage; the alternative lever is spec-side render priority (`priority: "deferred"` /
          `modePriority`), which needs a live path.
        required: false
        type: number
        default: 600
    secrets:
      buildfetch_ro_token:
        description: 'Optional read-only BuildFetch Gradle remote-cache token, to pull cached task outputs instead of building cold.'
        required: false
      figma_token:
        description: >-
          Optional read-only Figma personal access token (`file_content:read`). Two consumers, both
          read-only: rendering `figma:<fileKey>/<nodeId>` entries in the calling repo''s
          design-map.json into published design references. It is NOT used by the design-page lane
          — a repo imports its own pages on its own cadence and commits the result, so publishing
          them needs no credential at all. Absent, reference entries are skipped with a warning;
          everything else still publishes.
        required: false

permissions: {}

# Workflow-call inputs are attacker-controllable strings. Shell steps consume
# them through environment variables so expression expansion cannot alter shell
# syntax; quoting in the scripts below then treats every value as data.
env:
  INPUT_CATALOG_KEY: ${{ inputs.catalog-key }}
  INPUT_CATALOG_PATH: ${{ inputs.catalog-path }}
  INPUT_MODULE: ${{ inputs.module }}
  INPUT_VARIANT: ${{ inputs.variant }}
  INPUT_MODULES: ${{ inputs.modules }}
  INPUT_EXTRA_MODULE: ${{ inputs.extra-module }}
  INPUT_RENDER_SHARDS: ${{ inputs.render-shards }}
  INPUT_DESKTOP_RENDER: ${{ inputs.desktop-render }}
  INPUT_EMBED_DEPS: ${{ inputs.embed-deps }}
  INPUT_RENDER_TIMEOUT: ${{ inputs.render-timeout }}
  INPUT_SPEC: ${{ inputs.spec }}
  # Where the rendered Gradle BUILD sits in the checkout. The plugin records each project's
  # directory relative to its own `rootDir`, which for a separate-build monorepo is the sample's
  # root — so the catalog step lifts those to repository-relative paths with this.
  #
  # Deliberately NOT the upstream-prefixed [RENDER_DIR] in import mode: these paths become source
  # links back to the project the previews came from, and they must be relative to THAT
  # repository's root. Prefixing them with the `upstream/` checkout directory would point every
  # link at a path that exists only inside a runner that has since been destroyed.
  INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
  # The directory the render commands actually run in. Normally the caller's checkout (`.`, or its
  # `working-directory` for a separate-build monorepo); in import mode the upstream checkout under
  # `upstream/`, with `working-directory` applied INSIDE it. Computed once here because seven steps
  # ask the same question and answering it seven times is how they drift apart.
  RENDER_DIR: ${{ inputs.upstream-repository != '' && (inputs.working-directory != '' && format('upstream/{0}', inputs.working-directory) || 'upstream') || (inputs.working-directory || '.') }}
  # An IMPORT renders composables, never the app. Activity and app-tour previews are synthesised
  # from the merged manifest (`activity__<Activity>`, `apptour__<tour>`) rather than authored, and
  # rendering one LAUNCHES the app: Robolectric instantiates the manifest `Application` and runs its
  # `onCreate`, so the project's whole DI graph, and whatever that constructs, executes. For a
  # first-party catalog that is the point — the launcher activity's capture is the app's hero image.
  # For a third-party project it runs far more of an unvouched-for build than drawing a composable
  # does, and it captures the app's own screen rather than the components the catalog exists to show.
  #
  # PeopleInSpace is the worked example: both authored @Preview functions rendered clean while the
  # activity tour died in `initKoin()` with KoinApplicationAlreadyStartedException.
  #
  # Empty for a first-party run, so those keep rendering activities exactly as before.
  #
  # This is workflow-level, not step-level, because it must reach EVERY render: the primary module,
  # every later module of a `modules: all` sweep, and each shard of a sharded render. It is
  # deliberately separate from the per-mode exclusions, which belong to the primary module alone.
  # The trust step's program, defined ONCE here and used by both the sharded and unsharded lanes.
  #
  # It lives in the workflow rather than in scripts/design-artifacts/ deliberately. That directory
  # is the export DRIVER, executed at the commit named by .github/design-artifacts-driver-pin.txt —
  # an immutable, release-blessed revision, which is the boundary that pin exists for. A brand-new
  # script there is therefore invisible to a run until the pin is bumped after a release, which is
  # exactly how the first cut of this failed: `python3: can't open file .../trust-preview-plugin.py`
  # (the pin was still on 1.63.0). This is workflow logic, not driver logic, and a caller already
  # pins the workflow by referencing it.
  TRUST_PREVIEW_PLUGIN_PY: |
    #!/usr/bin/env python3
    """Trust the compose-preview plugin in an imported project's dependency verification metadata.

    An imported project may harden its build against precisely what an import does: resolve a plugin it
    has never heard of. mullvad/mullvadvpn-app ships ``gradle/verification-metadata.xml`` with
    ``<verify-metadata>true</verify-metadata>``, so every artifact needs a checksum and the auto-injected
    preview plugin has none. The render dies during configuration, before a single preview is discovered
    (yschimke/compose-preview-imports#30)::

        > Dependency verification failed for configuration 'classpath'
          3 artifacts failed verification: ee.schimke.composeai.preview.gradle.plugin-...pom ...

    Rendering with ``--dependency-verification=lenient`` was considered and rejected FIRST TIME
    ROUND, when the failure was three artifacts of ours: making verification non-fatal for every
    artifact in the build, to get two of ours through, was the wrong trade. Appending ``<trust>``
    entries left every dependency the project actually declares strictly verified.

    THAT REASONING NO LONGER HOLDS, and the step that runs this now sets lenient as well. Once the
    plugin's own coordinates were trusted, mullvad failed on 109 artifacts that are NOT ours at all —
    androidx.activity, org.jetbrains.compose, the project's own declared dependencies — resolved
    through ``:lib:model:detachedConfiguration1``, a configuration the RENDER creates. The project
    has no checksums for it because it never resolves it, so no amount of trusting our coordinates
    can reach it; the only surgical alternative is trusting a hundred-odd third-party groups by hand
    and re-trusting them at every upstream bump. So lenient it is, for imports only.

    This program is kept because it is still the narrower statement of intent — our coordinates are
    named, so a reader of the log sees what the import is the reason for — and because it costs
    nothing. It is no longer what makes a verified project render.

    This edits a THROWAWAY checkout, discarded with the CI job. It is never run against a repository
    anyone keeps.
    """

    from __future__ import annotations

    import re
    import sys

    # Both groups are required, and that is not obvious: the plugin is injected by its MARKER
    # coordinate (ee.schimke.composeai.preview:...gradle.plugin), whose POM resolves the implementation
    # from a different group entirely. Trusting the marker alone leaves the implementation unverifiable
    # and the build still fails.
    # Our own two groups, plus the groups our plugin DRAGS IN. The first mullvad run proved the
    # distinction: with only the first two trusted, verification still failed on nine artifacts,
    # none of them ours —
    #
    #   asm-9.10.1.jar (org.ow2.asm), classgraph-4.8.194.jar (io.github.classgraph),
    #   kotlin-metadata-jvm-2.4.10.jar (org.jetbrains.kotlin), okhttp / okhttp-jvm
    #   (com.squareup.okhttp3), okio / okio-jvm (com.squareup.okio)
    #
    # — the preview plugin's transitive closure, which the imported project has no checksums for
    # because it never asked for them. They are as much "the coordinates we are the reason for" as
    # the plugin itself.
    #
    # Trusted by GROUP rather than by exact version on purpose: a version list rots at every plugin
    # bump and fails closed in a way that is tedious to chase, and this edit lives for one render of
    # a throwaway clone and goes nowhere else. The cost, stated plainly: for that one run the
    # imported project also stops verifying ITS OWN uses of these groups — Kotlin and okio in
    # particular are ones it certainly uses. That is the trade being made, deliberately.
    #
    # If a future plugin dependency arrives from a group not listed here, the render fails with the
    # same "N artifacts failed verification" list, which names exactly what to add.
    GROUPS = (
        "ee.schimke.composeai.preview",
        "ee.schimke.composeai",
        "org.ow2.asm",
        "io.github.classgraph",
        "org.jetbrains.kotlin",
        "com.squareup.okhttp3",
        "com.squareup.okio",
    )

    TRUST_TAG = re.compile(r"<trust\b[^>]*>")
    ATTR = re.compile(r"""\b([A-Za-z]+)\s*=\s*["']([^"']*)["']""")


    def trusts_group_unconstrained(text: str, group: str) -> bool:
        """True only for an entry that trusts the whole group with no further constraint.

        Gradle ANDs the group/name/version/file constraints on a ``<trust>``, so
        ``<trust group="ee.schimke.composeai" name="something-else"/>`` trusts one artifact and says
        nothing about ours. Treating that as coverage would skip the append and leave the import failing
        verification anyway (PR #4990 review).
        """
        for tag in TRUST_TAG.findall(text):
            attrs = dict(ATTR.findall(tag))
            if attrs.get("group") == group and set(attrs) == {"group"}:
                return True
        return False


    def add_trust_entries(text: str, groups=GROUPS) -> tuple[str, list[str]]:
        """Return the metadata with any missing group-wide trust entries added, and which were added."""
        missing = [g for g in groups if not trusts_group_unconstrained(text, g)]
        if not missing:
            return text, []

        entries = "".join('         <trust group="%s"/>\n' % g for g in missing)

        if "</trusted-artifacts>" in text:
            return re.sub(r"[ \t]*</trusted-artifacts>", entries + "      </trusted-artifacts>", text, count=1), missing
        if "</configuration>" in text:
            block = "      <trusted-artifacts>\n" + entries + "      </trusted-artifacts>\n   </configuration>"
            return re.sub(r"[ \t]*</configuration>", block, text, count=1), missing
        # A file with neither is not a verification file we understand. Failing here is better than
        # rendering with the hardening silently unaddressed.
        raise SystemExit("::error::%s has no <trusted-artifacts> or <configuration> to extend" % PATH_HINT)


    PATH_HINT = "verification metadata"


    def main(argv: list[str]) -> int:
        global PATH_HINT
        if len(argv) != 2:
            raise SystemExit("usage: trust-preview-plugin.py <path-to-verification-metadata.xml>")
        path = PATH_HINT = argv[1]

        with open(path, encoding="utf-8") as handle:
            text = handle.read()

        updated, added = add_trust_entries(text)
        if not added:
            print("upstream already trusts the preview plugin coordinates — left as is")
            return 0

        with open(path, "w", encoding="utf-8") as handle:
            handle.write(updated)
        print("trusted in the throwaway checkout: " + ", ".join(added))
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv))
  # An imported project may LOCK its buildscript classpath (bitwarden/android does, with
  # lockAllConfigurations() and LockMode.STRICT), in which case it rejects every module its lock
  # state does not name — including the preview plugin auto-inject adds, so the render dies during
  # configuration before discovery runs (yschimke/compose-preview-imports#30).
  #
  # --write-locks is Gradle's own answer: the lock state is REGENERATED to describe what actually
  # resolved, rather than the injected module being smuggled past validation. Under STRICT mode it
  # is also the only thing that works — deleting the lockfile makes a strict build fail, not relax.
  #
  # Set only in import mode, and read from the environment rather than inferred from a lockfile,
  # because it rewrites files in the checkout. Here that checkout is a throwaway clone discarded
  # with the job; a developer's working tree is never rewritten because we noticed they lock.
  # A build with no locking resolves this to a no-op.
  COMPOSE_PREVIEW_WRITE_LOCKS: ${{ inputs.upstream-repository != '' && '1' || '' }}
  # The two patterns this workflow always applies in import mode, plus whatever the import itself
  # named. The always-on pair drops the synthetic app-launching previews; the caller's half is for
  # the preview that cannot render outside its host application — a missing CompositionLocal, a Hilt
  # entry point, a singleton already installed — which without this fails the ENTIRE run for want of
  # one render out of fifty-six (bitwarden's BitwardenBasicDialog_preview was exactly that).
  #
  # Appended rather than replacing, so an import that names its own ids does not silently lose the
  # app-launching guard. The comma is the delimiter both consumers below already split on, and an
  # empty caller input leaves the value byte-identical to what it was before this existed.
  IMPORT_EXCLUDE_PREVIEW_IDS: ${{ inputs.upstream-repository != '' && (inputs.exclude-preview-ids != '' && format('activity__*,apptour__*,{0}', inputs.exclude-preview-ids) || 'activity__*,apptour__*') || '' }}
  INPUT_LIVE_RERENDER_SOURCE: ${{ inputs.live-rerender-source }}
  INPUT_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
  INPUT_PUBLISH_LIVE_BUNDLE: ${{ inputs.publish-live-bundle }}
  INPUT_DEFER_FIGMA_SVG: ${{ inputs.defer-figma-svg }}
  INPUT_EXTRA_SPLIT_MODE: ${{ inputs.extra-split-mode }}
  INPUT_SPLIT_PER_PREVIEW: ${{ inputs.split-per-preview }}
  INPUT_SPLIT_MODE: ${{ inputs.split-mode }}
  INPUT_RC_CMP_WASM_LANE: ${{ inputs.rc-cmp-wasm-lane }}
  INPUT_RC_CMP_WASM_COLD_MS: ${{ inputs.rc-cmp-wasm-max-cold-first-frame-ms }}
  INPUT_RC_CMP_WASM_WARM_MS: ${{ inputs.rc-cmp-wasm-max-warm-first-frame-ms }}
  INPUT_RC_EMBEDDED_LANE: ${{ inputs.rc-embedded-lane }}
  INPUT_RC_EMBEDDED_JVM_LANE: ${{ inputs.rc-embedded-jvm-lane }}
  INPUT_SYSTEM: ${{ inputs.system }}
  INPUT_COMMIT_USER_NAME: ${{ inputs.commit-user-name }}
  INPUT_COMMIT_USER_EMAIL: ${{ inputs.commit-user-email }}
  SOURCE_REPOSITORY: ${{ github.repository }}
  SOURCE_REF_NAME: ${{ github.ref_name }}

  # Which revision of compose-ai-tools' `scripts/design-artifacts/` this privileged
  # workflow executes is resolved per-run by the "Resolve the export-driver
  # revision" step before each driver checkout. Two answers, because the callers
  # are in two different trust positions and were being served the wrong one:
  #
  #  * EXTERNAL callers get the immutable release commit recorded in
  #    `.github/design-artifacts-driver-pin.txt`. A caller repo must not be able to
  #    steer this workflow at a `refs/pull/*` revision of ours, which can carry
  #    fork code. That constraint is what the pin is for and it is unchanged.
  #
  #  * compose-ai-tools ITSELF gets the commit the caller run is on. Its own
  #    catalogs are supposed to publish HEAD's output — `cli-source: build` exists
  #    precisely to render against HEAD's renderer — but the driver beside that CLI
  #    came from the pin, so HEAD's renderer was being driven by a release-old
  #    driver. A fix merged to `main` therefore did NOT reach our own delivery
  #    branches until a release cut AND someone hand-bumped the pin: #4103 fixed a
  #    missing import, and the very push that landed it still failed in `generate`
  #    (run 32018634738) until #4106 moved the pin. That round trip is the friction
  #    issue #4107 is about, and this is the half of it that should never have
  #    existed. `github.repository` is the CALLER's repo and is not caller-settable,
  #    so an external repo cannot opt into this branch; design-artifacts.yml (the
  #    only in-repo caller) runs on schedule / dispatch / push-to-main /
  #    workflow_call-from-release — no `pull_request` anywhere in the chain, so
  #    `github.sha` is always a revision a repo writer put there.
  DRIVER_PIN_REPO: yschimke/compose-ai-tools
  DRIVER_PIN_PATH: .github/design-artifacts-driver-pin.txt
  # Where the Android and cmp-jvm player harnesses live since the player stack was extracted, and
  # the tag checked out for them. Only the two embedded lanes check this out, and only when a caller
  # opts into them.
  #
  # BOTH are literals, for the same reason `DRIVER_PIN_REPO` is one — see the long note above, and
  # then one more. A variable `repository:` hands this job's `github.token` to whatever host serves
  # the request; a variable `ref:` is worse, because what lands is executed moments later by
  # `./gradlew` with that token in the environment. CodeQL calls that "checkout of untrusted code in
  # a privileged context" and rates it critical, and it is right to whatever the computation's
  # inputs happen to be today: this workflow is called by repositories it does not control, so it
  # cannot lean on each caller's own fork guard. It was a step output until #5006 review.
  #
  # The pin is not a second source of truth for the player version — the step below fails the lanes
  # if it drifts from `rcplayers` in `gradle/libs.versions.toml`, which is what this repo CONSUMES
  # the same players at. Renovate keeps the two in step (`.github/renovate.json`).
  RC_PLAYERS_REPO: yschimke/rc-players
  # renovate: datasource=github-tags depName=yschimke/rc-players
  RC_PLAYERS_PIN: v1.56.0

jobs:
  # Resolve, ONCE PER RUN, which compose-ai-tools commit this run's export driver
  # comes from. Every job that checks the driver out reads this job's output, so a
  # sharded run cannot straddle two drivers.
  #
  # That is the whole reason this is a job and not a step. While the revision was a
  # literal in this file it was automatically consistent — GitHub resolves a
  # reusable workflow once per run. Reading the pin at runtime reintroduced a
  # window: `render-shard` reads it before rendering and `generate` would read it
  # again after every shard finished, ~20 minutes later, so a pin bump landing in
  # between would merge shard bundles written by the OLD driver with a NEW driver's
  # merge/verify/export scripts. Automating the bump makes that window likelier to
  # be hit, not less. Resolving once closes it.
  #
  # See the DRIVER_PIN_* env above for the trust argument. In short: an external
  # caller gets the immutable release commit recorded in the pin file, this repo's
  # own runs get the commit the run is on, and `github.repository` is the CALLER's
  # repo and is not settable by a caller, so nobody can opt into the second branch.
  #
  # The pin is READ from the pin file rather than written into this workflow
  # because `GITHUB_TOKEN` cannot push changes under `.github/workflows/` — there
  # is no `workflows` scope a `permissions:` block can request — so a pin living
  # here could not be refreshed by the release automation at all. It is read from
  # `main`, which is exactly what the documented `@main` usage wants and is a
  # known limitation for a caller that pinned this workflow to a tag — see the
  # `driver` job for why that cannot currently be closed. Nothing from the pin
  # file is executed; it names a commit, and the commit is what gets checked out.
  driver:
    name: ${{ inputs.system }} · driver
    # The caller's runner, like every other job here. Hardcoding ubuntu-latest
    # would queue forever (or be rejected) for a caller on self-hosted labels —
    # and because every checkout job now needs this one, it would take the whole
    # pipeline down with it rather than just itself.
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.driver.outputs.ref }}
      upstream-sha: ${{ steps.upstream.outputs.sha }}
    steps:
      # IMPORT MODE is a refusal, not a warning. Rendering a caller-named third-party repository and
      # force-pushing a branch cannot happen in one job: `generate` runs the imported project's
      # Gradle and then runs the publish step with a contents-write `GH_TOKEN`, in the same workspace
      # — so a build that can write files can rewrite `push-branch.sh`, or append to `GITHUB_ENV`,
      # and have the later step run it with that token. Documentation cannot hold that boundary, so
      # the combination is rejected here, in the job every other job depends on, before any of the
      # imported project is fetched.
      #
      # The supported shape is `publish: false` + `upload-out: true`, with the caller publishing the
      # artifact from a job that runs none of the imported code.
      - name: Refuse to publish from an import
        if: ${{ inputs.upstream-repository != '' && inputs.publish }}
        run: |
          echo "::error::import mode (upstream-repository) cannot be combined with publish: true." \
            "Rendering a third-party repository and force-pushing share one job, one workspace and" \
            "one token, so the imported build could rewrite the publish step. Pass publish: false" \
            "with upload-out: true and publish from a separate job."
          exit 1

      # Sharding an import is refused rather than half-supported. The shard planner partitions
      # EVERY discovered preview, synthetic activity and app-tour ids included, and writes them into
      # `shard-plan.json`; the render then drops them by id. The two disagree, and both ways of
      # disagreeing are bad: a shard handed only synthetic ids excludes its whole set, which
      # `excludePreviewIds` throws on rather than rendering nothing, and any other shard leaves a
      # planned preview with no artifact, which `verify-shard-renders.mjs` rejects at merge.
      #
      # Teaching the planner the import exclusions would fix it properly. Until then this is a
      # combination that cannot produce a correct catalog, so it fails fast and says why instead of
      # failing later somewhere less legible. No import needs it today: `import.yml` renders one
      # project at the default `render-shards: 1`, and these projects are far too small to shard.
      - name: Refuse to sharded-render an import
        if: ${{ inputs.upstream-repository != '' && inputs.render-shards > 1 }}
        run: |
          echo "::error::import mode (upstream-repository) cannot be combined with render-shards > 1." \
            "The shard planner would assign the synthetic activity/app-tour previews that import" \
            "mode then excludes at render time, so a shard either excludes its entire set or leaves" \
            "a planned preview unrendered and fails partition verification. Use render-shards: 1."
          exit 1

      # Resolve the upstream ref to ONE immutable commit for the whole run. A branch is a moving
      # target: with render-shards > 1 each shard checks out independently and `generate` again after
      # them, so a push landing mid-run would bake previews from two different revisions into one
      # bundle — and if the preview ids happen to match, partition verification passes and the
      # mismatch ships. Same argument, and same fix, as the driver pin resolved just below.
      - name: Resolve the upstream revision
        id: upstream
        if: ${{ inputs.upstream-repository != '' }}
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_REF: ${{ inputs.upstream-ref }}
        run: |
          set -euo pipefail
          # No credential: import mode is for public repositories, and `ls-remote` against one needs
          # none. A private upstream is a caller-supplied-token feature this does not yet have.
          if [ -n "${UPSTREAM_REF}" ]; then
            sha=$(git -c credential.helper= ls-remote \
              "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              "refs/heads/${UPSTREAM_REF}" "refs/tags/${UPSTREAM_REF}" | head -n1 | cut -f1)
            # A 40-hex `upstream-ref` is already immutable and will not appear in ls-remote output.
            if [ -z "$sha" ] && printf '%s' "${UPSTREAM_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
              sha="${UPSTREAM_REF}"
            fi
          else
            sha=$(git -c credential.helper= ls-remote \
              "https://github.com/${UPSTREAM_REPOSITORY}.git" HEAD | cut -f1)
          fi
          [ -n "$sha" ] || {
            echo "::error::could not resolve ${UPSTREAM_REPOSITORY}@${UPSTREAM_REF:-HEAD}"
            exit 1
          }
          echo "::notice::importing ${UPSTREAM_REPOSITORY} at ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Typo'd modes used to be discovered by the `else` branch of the split step — after the render
      # — where an unknown value silently meant `full`. Every job needs this one, so rejecting it
      # here costs seconds and gates the whole pipeline.
      - name: Validate split-mode
        run: |
          set -euo pipefail
          case "$INPUT_SPLIT_MODE" in
            auto|full|full-shared-classpath|view-only) ;;
            *)
              echo "::error title=split-mode::unknown split-mode '$INPUT_SPLIT_MODE' — use auto, full, full-shared-classpath or view-only."
              exit 1
              ;;
          esac
          case "$INPUT_EXTRA_SPLIT_MODE" in
            full|view-only) ;;
            *)
              echo "::error title=extra-split-mode::unknown extra-split-mode '$INPUT_EXTRA_SPLIT_MODE' — use full or view-only."
              exit 1
              ;;
          esac

      - id: driver
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          PIN_REF: main
        run: |
          set -euo pipefail
          if [ "${CALLER}" = "${DRIVER_PIN_REPO}" ]; then
            ref="${CALLER_SHA}"
            echo "caller is ${DRIVER_PIN_REPO}; driving with the run's own commit ${ref}"
          else
            # KNOWN LIMITATION, and it is deliberate rather than overlooked: the
            # pin is read from `main`, so a caller that pinned THIS WORKFLOW to a
            # tag or SHA still tracks the newest pin instead of the one frozen at
            # their revision. Before the pin became a data file it was a literal
            # in this file and such a caller was fully reproducible, so this is a
            # real (if narrow) regression for them.
            #
            # There is no supported way to close it. A reusable workflow cannot
            # learn its OWN revision from the `github` context: `workflow_sha` and
            # `workflow_ref` describe the ENTRY-POINT workflow — the caller's file
            # in the caller's repo — and `job_workflow_sha`, which does name this
            # file, exists only as an OIDC token claim. Reaching it would mean
            # requesting an id-token, which every caller would have to grant
            # `id-token: write` for; widening the permissions contract of a
            # workflow other repos call, to serve callers who are not using it
            # that way, is the worse trade. (An earlier revision of this PR read
            # `github.job_workflow_sha` from the context directly — it silently
            # evaluates to the empty string, so it always fell back here anyway.)
            #
            # The documented usage is `@main` (see the block at the top of this
            # file and docs/design/DESIGN_CATALOGS.md), which this serves exactly.
            # If a pinned caller ever needs frozen driver semantics, the way to
            # give it to them is a `v*`-tag-constrained input naming the ref to
            # read the pin from — constrained so a caller still cannot point it at
            # a refs/pull/* revision.
            ref=$(curl -fsSL \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github.raw" \
                    "${GITHUB_API_URL}/repos/${DRIVER_PIN_REPO}/contents/${DRIVER_PIN_PATH}?ref=${PIN_REF}" \
                  | sed -nE 's/^sha=([0-9a-f]{40})$/\1/p' | head -n1)
            echo "external caller; pin read at ${PIN_REF}; driving with ${ref:-<none>}"
          fi
          # Fail closed: an empty or malformed value must never reach `checkout`,
          # where it would silently resolve to the default branch.
          printf '%s' "${ref}" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error::could not resolve a 40-hex export-driver commit (got '${ref}')"
            exit 1
          }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Export driver: \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Sharded render (render-shards > 1) ──────────────────────────────────────────────────────
  # Two jobs that do not exist at all in the default single-shard pipeline. `shard-matrix` only
  # turns the count into a matrix (Actions has no range expression); `render-shard` is the render,
  # fanned out. Both are skipped when render-shards is 1, and `generate` renders inline exactly as
  # it always has.
  shard-matrix:
    name: ${{ inputs.system }} · plan
    if: ${{ inputs.render-shards > 1 && inputs.module != '' && inputs.modules != 'all' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # No checkout, no Gradle: this is `[1, 2, …, N]` and nothing else. The real partition is
      # computed inside each shard from its own discovery, which is what keeps the fan-out free of a
      # serial "discover once, then start the shards" prefix — that prefix would cost a full Gradle
      # configure + compile + discover (~87 s measured) before any shard began, which is the same
      # fixed cost each shard pays anyway.
      - name: Build the shard matrix
        id: plan
        env:
          SHARDS: ${{ inputs.render-shards }}
        run: |
          set -euo pipefail
          echo "matrix=[$(seq -s, 1 "$SHARDS")]" >> "$GITHUB_OUTPUT"

      # The merge runs LAST, after every shard has spent its several minutes — so a CLI that predates
      # `bundle merge` would fail with "Unknown bundle subcommand" having burned the whole fan-out.
      # That is not a hypothetical: the documented default is `cli-source: released`, and
      # `cli-version: catalog` pins the CLI to the applied plugin version, which for any catalog that
      # has not bumped its pin is a release older than this feature. So probe it here, once, before
      # anything expensive starts.
      #
      # Only for the released path. `cli-source: build` builds the CLI from the `driver-ref`
      # checkout, which is the same checkout the merge step builds from, so a probe would mean
      # building it twice; a `driver-ref` old enough to lack the subcommand is a compose-ai-tools
      # internal misconfiguration, not a consumer-facing pin.
      - name: Set up JDK 21
        if: ${{ inputs.cli-source == 'released' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # `cli-version: catalog` reads the pin out of the caller's version catalog, so the checkout is
      # needed for the install action to resolve it.
      - name: Check out the calling repo
        if: ${{ inputs.cli-source == 'released' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install compose-preview CLI
        if: ${{ inputs.cli-source == 'released' }}
        # Security boundary: this privileged reusable workflow must not execute
        # a movable action ref. Dependabot/manual upgrades should update this SHA.
        # This is an ORDINARY action pin, in the same category as the
        # `actions/checkout` SHAs — it deliberately does NOT track releases. It
        # used to be bumped in lockstep with the export-driver pin, which is what
        # made a driver fix look like a five-line change; the driver revision is
        # now resolved separately (see DRIVER_PIN_* at the top of this file) and
        # this ref only needs to move when the install action itself changes.
        uses: yschimke/compose-ai-tools/.github/actions/install@b3faa210939f1ec59f01f63731b6b29a99c26c5c # v1.46.2
        with:
          version: ${{ inputs.cli-version }}
          catalog-key: ${{ inputs.catalog-key }}
          catalog-path: ${{ inputs.catalog-path }}
          github-token: ${{ github.token }}

      # Three capabilities, one probe, because a CLI can have one without the others and each
      # failure mode is silent in its own way:
      #
      #  - `bundle merge` reassembles the shard bundles. Without it the fan-out runs to completion
      #    and dies at the last step, having burned every shard's ~20 minutes.
      #  - `=<id>` anchored exclusions (#3561) are what make a generated exclusion list safe. Without
      #    them `--exclude-preview-id` falls back to substring matching, and since ids are
      #    hierarchical each shard also deletes the variants of every id it excluded — m3-catalog
      #    captured 267 of 1095 assigned previews that way, on a GREEN run. An old CLI here does not
      #    fail; it silently publishes a three-quarters-empty catalog, which is strictly worse than
      #    refusing to start, hence the hard error rather than a warning.
      #  - `--exclude-preview-id-file` keeps a generated exclusion set out of argv. Without it a
      #    large catalog fails with E2BIG before compose-preview or Gradle can start (#4911).
      - name: Check the CLI can shard and merge
        if: ${{ inputs.cli-source == 'released' }}
        run: |
          set -euo pipefail
          version="$(compose-preview --version | head -1)"
          help="$(compose-preview bundle help 2>&1 || true)"
          if ! grep -q 'bundle merge' <<<"$help"; then
            echo "::error title=CLI too old for render-shards::${version} has no 'compose-preview bundle merge', which the sharded render needs to reassemble the shard bundles. Raise cli-version (or, with cli-version: catalog, the $INPUT_CATALOG_KEY pin in $INPUT_CATALOG_PATH) to a release that carries it, or set render-shards: 1."
            exit 1
          fi
          if ! grep -q '=<id>' <<<"$help"; then
            echo "::error title=CLI too old for render-shards::${version} has no '=<id>' anchored --exclude-preview-id matching, so each shard's exclusion list would also drop the variants of every id it excludes — the shards would publish a fraction of the catalog without failing. Raise cli-version (or, with cli-version: catalog, the $INPUT_CATALOG_KEY pin in $INPUT_CATALOG_PATH) to a release that carries it, or set render-shards: 1."
            exit 1
          fi
          if ! grep -q -- '--exclude-preview-id-file' <<<"$help"; then
            echo "::error title=CLI too old for render-shards::${version} has no '--exclude-preview-id-file', so a large shard exclusion set cannot be passed without exceeding the runner's argv limit. Raise cli-version (or, with cli-version: catalog, the $INPUT_CATALOG_KEY pin in $INPUT_CATALOG_PATH) to a release that carries it, or set render-shards: 1."
            exit 1
          fi
          echo "✓ $version supports 'bundle merge', anchored '=<id>' exclusions, and file-based exclusion transport."

  render-shard:
    name: ${{ inputs.system }} · shard ${{ matrix.shard }}/${{ inputs.render-shards }}
    if: ${{ inputs.render-shards > 1 && inputs.module != '' && inputs.modules != 'all' }}
    needs: [driver, shard-matrix]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      # A shard that dies takes the run with it: the merge needs every partition, so letting the
      # siblings burn another 20 minutes to produce an unpublishable bundle helps nobody.
      fail-fast: true
      matrix:
        # The `|| '[1]'` is inert insurance: a skipped `shard-matrix` (render-shards at its default)
        # leaves the output empty, and `strategy` is expanded early enough that a bare `fromJSON('')`
        # can fail the workflow rather than skip the job. The fallback is never rendered — the `if`
        # above is false in exactly the case that produces it.
        shard: ${{ fromJSON(needs.shard-matrix.outputs.matrix || '[1]') }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Withheld in import mode. `secrets: inherit` is the documented way to supply this, and the
      # imported project's own build scripts and plugins run in this job — handing them a caller
      # credential would let any of them read it straight out of the environment. A remote cache
      # miss is the whole cost.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ inputs.upstream-repository == '' && secrets.buildfetch_ro_token || '' }}
    steps:
      - name: Check out the calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # IMPORT MODE: the third-party project this run renders. Deliberately AFTER the caller's
      # checkout (which owns the workspace root) and into a subdirectory, so the caller's spec and
      # the imported sources never share a tree. `persist-credentials: false` keeps the job's token,
      # if its caller gave it one, out of the imported checkout's git config.
      # Fetched with plain git rather than `actions/checkout`, deliberately and for two reasons.
      #
      # The first is that `actions/checkout` sends a credential. Its `token:` input defaults to the
      # job's `github.token`, so pointing it at `repository:` hands that token to whatever host
      # serves the request. Nothing here should present a credential to a third-party repository:
      # imports are public, a public clone needs no authentication, and the correct number of
      # secrets to expose to an untrusted fetch is zero. `git clone` with no helper configured sends
      # nothing, which is what this does.
      #
      # The second is that a variable `repository:` on `actions/checkout` is exactly CodeQL's
      # "checkout of untrusted code in a privileged context" pattern, and here it would not be a
      # false positive — the whole feature is fetching code from a repository the caller named. The
      # honest response is to remove the credential the rule is warning about rather than to dismiss
      # the alert.
      #
      # Fetched by the SHA the driver resolved once, never the caller's moving ref: see that job.
      # `--depth 1` of one commit; nothing in the imported history is read.
      - name: Fetch the upstream project
        if: ${{ inputs.upstream-repository != '' }}
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_SHA: ${{ needs.driver.outputs.upstream-sha }}
        run: |
          set -euo pipefail
          # Belt and braces: the driver already resolved and validated this, but the value reaches a
          # command line here, so it is re-checked at the point of use.
          printf '%s' "${UPSTREAM_SHA}" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::upstream sha '${UPSTREAM_SHA}' is not a commit"; exit 1; }
          printf '%s' "${UPSTREAM_REPOSITORY}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || {
            echo "::error::'${UPSTREAM_REPOSITORY}' is not an owner/repo"; exit 1; }
          rm -rf upstream
          mkdir upstream
          cd upstream
          git init --quiet
          # -c credential.helper=: with an empty value clears any inherited helper, so this fetch
          # cannot pick up a token from the runner's git config.
          git -c credential.helper= remote add origin \
            "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -c credential.helper= fetch --depth 1 --quiet origin "${UPSTREAM_SHA}"
          git checkout --quiet FETCH_HEAD

      # An imported project may harden its build against precisely what an import does: resolve a
      # plugin it has never heard of. Where it ships dependency verification metadata, the
      # auto-injected preview plugin has no checksum in it and the render dies during configuration
      # (yschimke/compose-preview-imports#30). Two things happen to the THROWAWAY checkout here: the
      # plugin's own groups are trusted, and verification is set to lenient. The second is what
      # actually makes such a project render — see TRUST_PREVIEW_PLUGIN_PY, which records why the
      # first was thought sufficient and what disproved it.
      # An upstream that applies the Google Services plugin but does not commit
      # google-services.json cannot CONFIGURE without one — home-assistant/android's
      # AndroidApplicationConventionPlugin applies it to every application module, and contributors
      # bring their own file, so :app dies on `processMinimalDebugGoogleServices` before a preview
      # is discovered. The stub is written into the THROWAWAY checkout, never committed anywhere,
      # and carries no real project: a zeroed project number and a placeholder key.
      #
      # The packages are declared by the caller rather than derived, because they have to be the
      # EXACT applicationId of the variant being rendered, suffixes and all. Verified against a real
      # AGP build rather than assumed: a stub naming only the base package fails with
      #
      #   > No matching client found for package name 'io.example.probe.minimal.debug'
      #
      # so there is no prefix fallback to lean on, and nothing here can guess a flavour suffix a
      # convention plugin three repositories away decided on.
      - name: Stub google-services.json in the upstream checkout
        if: ${{ inputs.upstream-repository != '' && inputs.stub-google-services-packages != '' }}
        env:
          PACKAGES: ${{ inputs.stub-google-services-packages }}
        run: |
          set -euo pipefail
          # BOTH have to be checked, not just INPUT_MODULE. The generate job enters repository-wide
          # discovery on `inputs.module == '' || inputs.modules == 'all'`, so a caller passing
          # `module: ':app'` AND `modules: all` renders every module while this step, seeing a
          # non-empty INPUT_MODULE, would stub only `app` — and a second application module needing
          # Google Services would fail with no stub, from a step that had claimed to refuse exactly
          # this case.
          if [ -z "${INPUT_MODULE:-}" ] || [ "${INPUT_MODULES:-}" = "all" ]; then
            echo "::error title=stub-google-services-packages needs one module::The stub is written" \
              "into the rendered module's directory, which an all-module import does not name." \
              "Split the import so it renders one module, or drop the stub."
            exit 1
          fi
          # `:app` -> `app`, `:modules:services:compose` -> `modules/services/compose` — but ONLY
          # when the project sits where its path says. Gradle lets a settings file put it anywhere:
          #
          #     project(":app").projectDir = file("android-app")
          #
          # and compose-ai-tools' own settings.gradle.kts does this in several places, so it is not
          # a hypothetical. Deriving blindly would either reject a real module as nonexistent or —
          # worse — write the file into a directory that happens to exist and is not the project,
          # leaving the Google Services task still failing with the stub sitting somewhere it never
          # looks. So the settings file gets the first word, and the derived path is the fallback.
          derived="$(printf '%s' "${INPUT_MODULE#:}" | tr ':' '/')"
          remapped="$(
            cat "${RENDER_DIR}"/settings.gradle "${RENDER_DIR}"/settings.gradle.kts 2>/dev/null |
              sed -n "s|.*project(['\"]${INPUT_MODULE}['\"])\.projectDir[[:space:]]*=[[:space:]]*[Ff]ile(['\"]\([^'\"]*\)['\"]).*|\1|p" |
              head -1
          )" || true
          if [ -n "$remapped" ]; then
            echo "settings remaps ${INPUT_MODULE} to ${remapped} — using that, not ${derived}"
            derived="$remapped"
          fi
          module_dir="${RENDER_DIR}/${derived}"
          target="${module_dir}/google-services.json"
          if [ -f "$target" ]; then
            echo "upstream commits its own ${target#"$RENDER_DIR/"} — left as is"
            exit 0
          fi
          test -d "$module_dir" || {
            echo "::error::${module_dir} does not exist; is ${INPUT_MODULE} the module being rendered?"
            exit 1
          }
          PACKAGES="$PACKAGES" TARGET="$target" python3 - <<'PY'
          import json, os

          packages = [p for p in os.environ["PACKAGES"].split(",") if p]
          doc = {
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "compose-preview-import-stub",
                  "storage_bucket": "compose-preview-import-stub.appspot.com",
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:%032x" % i,
                          "android_client_info": {"package_name": p},
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                  }
                  for i, p in enumerate(packages)
              ],
              "configuration_version": "1",
          }
          with open(os.environ["TARGET"], "w", encoding="utf-8") as handle:
              json.dump(doc, handle, indent=2)
              handle.write("\n")
          print("stubbed google-services.json for: " + ", ".join(packages))
          PY

      # Isolated Projects and auto-inject cannot coexist, and that is not a bug to work around here
      # — AutoInject.kt says so in as many words: the init script configures every project through
      # `allprojects { buildscript { … } }`, which IP forbids outright, and there is no IP-safe
      # init-script mechanism that puts an AGP-aware plugin on each project's buildscript
      # classloader. thunderbird/thunderbird-android sets it, and the render dies during discovery
      # with 206 projects skipped:
      #
      #   Project ':' cannot access 'Project.buildscript' functionality on subprojects
      #   via 'allprojects'
      #
      # AutoInject's own warning names the remedy — turn IP off for compose-preview runs — and in
      # import mode we hold a throwaway clone, so we can simply take it. Unconditional rather than
      # conditional on the upstream setting it: writing `false` where nothing set it is a no-op,
      # and detection logic that can be wrong is worse than a line that cannot be.
      #
      # `org.gradle.configuration-cache.parallel` is deliberately left alone. It is documented as
      # needing IP, so the obvious worry is that turning IP off breaks a build carrying both — but
      # a probe with configuration-cache=true, parallel=true and IP=false runs clean; Gradle simply
      # ignores the parallel request. Touching a second property to fix a problem that does not
      # exist would be the riskier change.
      # `working-directory` names a Gradle build nested inside the upstream repository, and the CLI
      # finds "the project" by walking UP from its cwd until it sees a `gradlew`
      # (`findGradleProjectRoot`). A nested build that ships its own wrapper is therefore found
      # correctly — mullvad/mullvadvpn-app's `android/` has one. thunderbird-android's `components/`
      # does NOT: it is a complete build (its own `settings.gradle.kts`, `rootProject.name =
      # "components"`) that borrows the repository root's wrapper. The walk-up sailed past it and
      # rendered the REPOSITORY ROOT build instead, which is a different build entirely:
      #
      #   Module ':ui:bolt' not found or does not apply the compose-ai-tools plugin.
      #   206 project(s) failed to configure during discovery and were skipped
      #     :: InvalidUserCodeException: Project ':' cannot access 'Project.buildscript' …
      #     :app-k9mail: … :app-thunderbird: … :backend:imap: …
      #
      # — the root build's 206 projects, under the root build's `isolated-projects=true`, none of
      # them the three in `components`. Both symptoms are downstream of running the wrong build, so
      # neither the Isolated Projects step below nor an exclusion list could have fixed it.
      #
      # Copying the nearest ancestor's wrapper into the throwaway checkout stops the walk at the
      # build the import actually named. `gradle-wrapper.properties` is the half that matters to the
      # Tooling API (it is what pins the distribution); `gradlew` is the half that matters to the
      # CLI's search. Both are copied, so the nested build resolves the same Gradle the repository
      # would have used — this is not a version choice being made here.
      #
      # Deliberately confined to a directory that is a build root in its own right: without a
      # settings file the walk-up is the CORRECT behaviour (an ordinary subproject renders from its
      # parent build), and planting a wrapper there would break it.
      - name: Give a nested upstream build its own Gradle wrapper
        if: ${{ inputs.upstream-repository != '' && inputs.working-directory != '' }}
        run: |
          set -euo pipefail
          if [ ! -f "${RENDER_DIR}/settings.gradle" ] && [ ! -f "${RENDER_DIR}/settings.gradle.kts" ]; then
            echo "${RENDER_DIR} is not a Gradle build root — the walk-up to the enclosing build is correct"
            exit 0
          fi
          if [ -f "${RENDER_DIR}/gradlew" ]; then
            echo "${RENDER_DIR} ships its own wrapper — nothing to do"
            exit 0
          fi
          # Walk up from the nested build, stopping at the upstream checkout root. `upstream` is
          # where the fetch step put it, so this cannot wander into the calling repository.
          dir=$(dirname "${RENDER_DIR}")
          found=""
          while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
            if [ -f "$dir/gradlew" ] && [ -f "$dir/gradle/wrapper/gradle-wrapper.properties" ]; then
              found="$dir"
              break
            fi
            if [ "$dir" = "upstream" ]; then
              break
            fi
            dir=$(dirname "$dir")
          done
          if [ -z "$found" ]; then
            # Failing here rather than continuing. There is no benign outcome further on: the
            # walk-up does not stop at `upstream`, so it either leaves the checkout entirely and
            # lands on some unrelated `gradlew` in the runner workspace, or finds none and the CLI
            # exits with "Cannot find Gradle project root" — a message that says nothing about the
            # nested build being the reason. Neither is a Tooling-API default worth waiting for.
            echo "::error::${RENDER_DIR} is a Gradle build root but neither it nor any directory" \
                 "up to the upstream checkout has a Gradle wrapper, so the render has no" \
                 "distribution to run and would silently target some other build"
            exit 1
          fi
          mkdir -p "${RENDER_DIR}/gradle/wrapper"
          cp "$found/gradlew" "${RENDER_DIR}/gradlew"
          chmod +x "${RENDER_DIR}/gradlew"
          if [ -f "$found/gradlew.bat" ]; then
            cp "$found/gradlew.bat" "${RENDER_DIR}/gradlew.bat"
          fi
          cp "$found"/gradle/wrapper/gradle-wrapper.* "${RENDER_DIR}/gradle/wrapper/"

          # A `distributionUrl` with no scheme is resolved RELATIVE TO the directory holding
          # gradle-wrapper.properties, so copying the file further down the tree silently repoints
          # it — a repository vendoring its distribution at `gradle/wrapper/gradle-x.y-bin.zip`
          # would have the nested copy look for it under the nested build instead, and fail. Re-
          # anchor it against the wrapper's original directory so it names the same file the
          # ancestor's wrapper named. A value with a scheme (`https\://…`, the overwhelmingly common case) and
          # an absolute path are both already location-independent and are left alone.
          wrapper_properties="${RENDER_DIR}/gradle/wrapper/gradle-wrapper.properties"
          url=$(sed -n -E 's/^[[:space:]]*distributionUrl[[:space:]]*=[[:space:]]*//p' \
                  "$wrapper_properties" | head -1)
          case "$url" in
            "" | /*) ;;
            *)
              if printf '%s' "$url" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]*\\?:'; then
                :
              else
                # The base is the directory holding the PROPERTIES FILE, not the build directory,
                # so the hop is from `<found>/gradle/wrapper` to `<render>/gradle/wrapper` — one
                # `../` per level of the nesting does NOT reach it. Let the path library say it.
                prefix=$(python3 -c \
                  'import os, sys; print(os.path.relpath(sys.argv[1], sys.argv[2]) + "/")' \
                  "$found/gradle/wrapper" "${RENDER_DIR}/gradle/wrapper")
                sed -i -E "s#^([[:space:]]*distributionUrl[[:space:]]*=[[:space:]]*)#\\1${prefix}#" \
                  "$wrapper_properties"
                echo "re-anchored the relative distributionUrl '$url' as '${prefix}${url}'"
              fi
              ;;
          esac
          echo "copied $found's wrapper into ${RENDER_DIR} so the render targets that build"

      - name: Disable Isolated Projects in the upstream checkout
        if: ${{ inputs.upstream-repository != '' }}
        env:
          GRADLE_PROPERTIES: ${{ env.RENDER_DIR }}/gradle.properties
        run: |
          set -euo pipefail
          if [ -f "$GRADLE_PROPERTIES" ] &&
             grep -q '^[[:space:]]*org\.gradle\.unsafe\.isolated-projects[[:space:]]*=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^[[:space:]]*org\.gradle\.unsafe\.isolated-projects[[:space:]]*=.*/org.gradle.unsafe.isolated-projects=false/' \
              "$GRADLE_PROPERTIES"
            echo "turned Isolated Projects off in the throwaway checkout"
          else
            printf '\n# compose-preview import: auto-inject configures projects via allprojects {},\n# which Isolated Projects forbids.\norg.gradle.unsafe.isolated-projects=false\n' \
              >> "$GRADLE_PROPERTIES"
            echo "pinned Isolated Projects off in the throwaway checkout"
          fi

      - name: Relax dependency verification in the upstream checkout
        if: ${{ inputs.upstream-repository != '' }}
        env:
          METADATA: ${{ env.RENDER_DIR }}/gradle/verification-metadata.xml
          GRADLE_PROPERTIES: ${{ env.RENDER_DIR }}/gradle.properties
        run: |
          set -euo pipefail
          if [ ! -f "$METADATA" ]; then
            echo "no dependency verification in this checkout — nothing to relax"
            exit 0
          fi
          printf '%s' "$TRUST_PREVIEW_PLUGIN_PY" > "${RUNNER_TEMP}/trust-preview-plugin.py"
          python3 "${RUNNER_TEMP}/trust-preview-plugin.py" "$METADATA"

          # And then lenient, which is what actually makes a verified project render. See
          # TRUST_PREVIEW_PLUGIN_PY: trusting our own coordinates left mullvad failing on 109
          # artifacts that are the PROJECT'S OWN, resolved through a detached configuration the
          # render creates and the project therefore has no checksums for.
          #
          # Set in gradle.properties rather than as a CLI flag on purpose. The flag would have to
          # travel through the CLI, which is installed from a RELEASE — so it would not take effect
          # until the next one, exactly the lag that left --write-locks written but unreachable for
          # hours (#4992, #4994). This file is in the throwaway checkout the workflow already
          # rewrites, so it applies to the very next run.
          #
          # Replaced rather than appended when the key is already there: an upstream that pins
          # `strict` would otherwise win and the render would fail with the property set, which is
          # the most confusing possible outcome.
          if [ -f "$GRADLE_PROPERTIES" ] &&
             grep -q '^[[:space:]]*org\.gradle\.dependency\.verification[[:space:]]*=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^[[:space:]]*org\.gradle\.dependency\.verification[[:space:]]*=.*/org.gradle.dependency.verification=lenient/' \
              "$GRADLE_PROPERTIES"
            echo "rewrote org.gradle.dependency.verification=lenient in the throwaway checkout"
          else
            printf '\n# compose-preview import: verification is lenient for this throwaway render.\norg.gradle.dependency.verification=lenient\n' \
              >> "$GRADLE_PROPERTIES"
            echo "set org.gradle.dependency.verification=lenient in the throwaway checkout"
          fi


      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install compose-preview CLI
        if: ${{ inputs.cli-source == 'released' }}
        # Same trust boundary as the non-sharded install above.
        uses: yschimke/compose-ai-tools/.github/actions/install@b3faa210939f1ec59f01f63731b6b29a99c26c5c # v1.46.2
        with:
          version: ${{ inputs.cli-version }}
          catalog-key: ${{ inputs.catalog-key }}
          catalog-path: ${{ inputs.catalog-path }}
          github-token: ${{ github.token }}

      - name: Check out compose-ai-tools (export driver)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DRIVER_PIN_REPO }}
          # Never a caller-supplied ref: resolved by the step above, which admits
          # only a 40-hex commit.
          ref: ${{ needs.driver.outputs.ref }}
          path: compose-ai-tools
          persist-credentials: false


      - name: Build compose-preview CLI from source
        if: ${{ inputs.cli-source == 'build' }}
        working-directory: compose-ai-tools
        run: |
          set -euo pipefail
          ./gradlew :cli:installDist --no-daemon --quiet
          echo "$GITHUB_WORKSPACE/compose-ai-tools/cli/build/install/compose-preview/bin" >> "$GITHUB_PATH"

      # Node for the driver's partition + spec scripts only. Deliberately NO `npm ci`: the three
      # scripts this job runs (validate-catalog-spec / deferred-preview-ids / shard-preview-ids) are
      # dependency-free by design — node built-ins and their own siblings — so a shard skips the
      # ~1 min install of playwright + the design-parity export engine, which only `generate` needs.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The same build-free pre-flight `generate` runs. Duplicated on purpose rather than passed
      # down as a job output: it costs seconds, it fails a mistyped spec here instead of after a
      # 20-minute fan-out, and its `render-filter` output has to reach THIS job's render anyway.
      - name: Validate catalog spec
        id: validate-spec
        env:
          SPEC: ${{ inputs.spec }}
          MODULE: ${{ inputs.module }}
          EXTRA_MODULE: ${{ inputs.extra-module }}
          PREVIEW_ANNOTATIONS: ${{ inputs.preview-annotations }}
          WORKDIR: ${{ inputs.working-directory }}
          SOURCE_ROOT: ${{ inputs.upstream-repository != '' && 'upstream' || '' }}
          LIVE_BUNDLE: ${{ inputs.publish-live-bundle }}
          LIVE_SOURCE: ${{ inputs.live-rerender-source }}
        run: |
          set -euo pipefail
          # Module paths are resolved against the directory the sources were actually checked out
          # into — `upstream/` in import mode — because that is where the validator has to look for
          # Kotlin sources. Without the prefix it silently finds none and falls back to
          # structural-only validation, dropping the pre-render check for missing or renamed
          # previews; worse, a caller directory that happens to share the path would be scanned
          # instead. `--spec` stays caller-relative and is deliberately not prefixed.
          to_dir() { printf '%s' "${SOURCE_ROOT:+$SOURCE_ROOT/}${WORKDIR:+$WORKDIR/}${1#:}" | tr ':' '/'; }
          args=(--spec "$SPEC" --module-dir "$(to_dir "$MODULE")")
          if [ -n "$EXTRA_MODULE" ]; then args+=(--src "$(to_dir "$EXTRA_MODULE")"); fi
          for ann in $PREVIEW_ANNOTATIONS; do args+=(--preview-annotation "$ann"); done
          if [ "$LIVE_BUNDLE" = "true" ] || [ "$LIVE_SOURCE" = "true" ]; then
            args+=(--live-bundle)
          else
            args+=(--no-live-bundle)
          fi
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs "${args[@]}" \
            --render-filter-out "$GITHUB_WORKSPACE/render-filter.txt" \
            --deferred-modes-out "$GITHUB_WORKSPACE/deferred-modes.txt"
          echo "render-filter=$(cat "$GITHUB_WORKSPACE/render-filter.txt")" >> "$GITHUB_OUTPUT"
          echo "deferred-modes=$(cat "$GITHUB_WORKSPACE/deferred-modes.txt")" >> "$GITHUB_OUTPUT"

      - name: Stage fonts for rendering
        if: ${{ inputs.stage-font-globs != '' }}
        env:
          FONT_GLOBS: ${{ inputs.stage-font-globs }}
          # The globs are repo-relative, and in import mode the repo holding those fonts is the
          # upstream checkout. Expanded from the workspace root they would match nothing — and
          # `nullglob` makes that silent, so the render would quietly fall back to system fonts and
          # publish wrong glyphs and wrong line breaks. Staging is resolved from the same directory
          # the render itself runs in.
          FONT_ROOT: ${{ inputs.upstream-repository != '' && 'upstream' || '.' }}
        run: |
          set -euo pipefail
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cd "$FONT_ROOT"
          shopt -s nullglob
          staged=0
          for g in $FONT_GLOBS; do cp $g "$HOME/.local/share/fonts/"; staged=$((staged + 1)); done
          # A glob set that matches nothing is a misconfiguration, not a no-op: the render proceeds
          # with fallback fonts and the difference shows up as a pixel diff nobody can explain.
          [ "$staged" -gt 0 ] || echo "::warning title=No fonts staged::stage-font-globs matched nothing under ${FONT_ROOT}"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null

      - name: Install desktop (Skiko) render deps
        if: ${{ inputs.desktop-render }}
        run: |
          compose-ai-tools/scripts/install-linux-font-fallbacks.sh \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1

      # Same font cache as the single-job pipeline. The save key carries the shard index because
      # Actions caches are immutable: N shards saving one `…-<run_id>` key would have the first win
      # and the rest log a conflict. The restore-keys are prefixes, so every shard still starts warm
      # from whatever the last run left — including from a sibling shard's save.
      - name: Restore downloadable-font cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composeai/fonts
          key: composeai-fonts-${{ runner.os }}-${{ inputs.system }}-${{ github.run_id }}-shard-${{ matrix.shard }}
          restore-keys: |
            composeai-fonts-${{ runner.os }}-${{ inputs.system }}-
            composeai-fonts-${{ runner.os }}-

      # Discovery, in this shard, for this shard. `compose-preview list --json` runs
      # `composePreviewDiscover`; the compile it forces is shared with the render below (same Gradle
      # build, warm caches), so it costs discovery — the same arrangement the single-job pipeline
      # already relies on for `modePriority`.
      - name: Discover previews
        working-directory: ${{ env.RENDER_DIR }}
        run: |
          set -euo pipefail
          # `--variant` has to be on discovery too, not just the render. The plugin registers its
          # `composePreview*` tasks against ONE variant, so a list run without it enumerates a
          # different variant's tasks than the render uses — on a flavored module that means it
          # enumerates none.
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          compose-preview list --json "${variant[@]}" --module "$INPUT_MODULE" \
            > "$GITHUB_WORKSPACE/discovered-previews.json"

      - name: Derive per-mode render exclusions
        id: mode-filter
        if: ${{ steps.validate-spec.outputs.deferred-modes != '' }}
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/compose-ai-tools/scripts/design-artifacts/deferred-preview-ids.mjs" \
            --spec "$GITHUB_WORKSPACE/$SPEC" \
            --previews "$GITHUB_WORKSPACE/discovered-previews.json" \
            --out "$GITHUB_WORKSPACE/mode-filter.txt" \
            --rows-out "$GITHUB_WORKSPACE/mode-filter-rows.txt"
          echo "exclude-rows=$(cat "$GITHUB_WORKSPACE/mode-filter-rows.txt")" >> "$GITHUB_OUTPUT"

      # This shard's share of the render, as the ids it must NOT render. Deferred ids are dropped
      # from the partition and re-added to every shard's exclusion list, so a `modePriority` deferral
      # shrinks the work the shards divide instead of competing with the partition for slots.
      - name: Plan this shard
        id: shard-plan
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          exclude_file=()
          if [ -s "$GITHUB_WORKSPACE/mode-filter.txt" ]; then
            exclude_file=(--exclude-file "$GITHUB_WORKSPACE/mode-filter.txt")
          fi
          # The render below also applies the pre-flight's positive function-name filter, so the
          # partition must see the same preview set it will. Partitioning the unfiltered discovery
          # output would let a shard's whole share be ids of wholly-deferred functions: it would
          # report work to do, then exclude every id the name filter kept, and the render refuses a
          # selection that produces nothing.
          filter_file=()
          if [ -s "$GITHUB_WORKSPACE/render-filter.txt" ]; then
            filter_file=(--render-filter-file "$GITHUB_WORKSPACE/render-filter.txt")
          fi
          previews=$(node compose-ai-tools/scripts/design-artifacts/shard-preview-ids.mjs \
            --previews "$GITHUB_WORKSPACE/discovered-previews.json" \
            --shards "$INPUT_RENDER_SHARDS" \
            --index "$MATRIX_SHARD" \
            "${exclude_file[@]}" "${filter_file[@]}" \
            --out "$GITHUB_WORKSPACE/shard-exclude.txt" \
            --plan-out "$GITHUB_WORKSPACE/shard-plan.json")
          # The workflow and export driver are pinned independently. Verify their file-transport
          # contract before spending tens of minutes rendering: v1.60.0 wrote one comma-separated
          # line, which v1.60.1's --exclude-preview-id-file correctly treated as one impossible
          # pattern and therefore baked the full catalog in every shard (#4916).
          if ! node compose-ai-tools/scripts/design-artifacts/shard-preview-ids.mjs \
              --verify-exclusions \
              "$GITHUB_WORKSPACE/shard-plan.json" \
              "$GITHUB_WORKSPACE/shard-exclude.txt"; then
            echo "::error title=Shard exclusion format skew::The pinned export driver did not" \
              "produce the newline-delimited exclusion-file contract this workflow requires." \
              "Update the export-driver pin before retrying; refusing to render an unfiltered shard."
            exit 1
          fi
          echo "previews=$previews" >> "$GITHUB_OUTPUT"

      # Skipped when the partition handed this shard nothing — more shards than previews. Its
      # exclusion list would then name every preview, which `composePreviewRender` refuses outright,
      # so the right answer is a no-op shard, not a failed one.
      - name: Render shard ${{ matrix.shard }}
        if: ${{ steps.shard-plan.outputs.previews != '0' }}
        working-directory: ${{ env.RENDER_DIR }}
        env:
          ORG_GRADLE_PROJECT_composePreview.filter: ${{ steps.validate-spec.outputs.render-filter }}
          EXCLUDE_PREVIEW_ROWS: ${{ steps.mode-filter.outputs.exclude-rows }}
        run: |
          set -euo pipefail
          run() { if [ "$INPUT_DESKTOP_RENDER" = "true" ]; then xvfb-run -a -s "-screen 0 2000x1400x24" "$@"; else "$@"; fi; }
          embed=(); if [ "$INPUT_EMBED_DEPS" = "true" ]; then embed=(--embed-deps); fi
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          # The shard's own partition, plus the import-wide exclusions. Unreachable today — the
          # driver refuses import + render-shards > 1, because the planner does not know about
          # these ids — and kept deliberately so that teaching the planner is the only thing that
          # combination needs, rather than a second omission to rediscover. Belt to that brace.
          # IMPORT_EXCLUDE_PREVIEW_IDS is the workflow-owned comma-separated pair of glob patterns,
          # so append each as one line to the same delimiter-free transport the planner produced.
          if [ -n "${IMPORT_EXCLUDE_PREVIEW_IDS:-}" ]; then
            printf '%s\n' "$IMPORT_EXCLUDE_PREVIEW_IDS" | tr ',' '\n' \
              >> "$GITHUB_WORKSPACE/shard-exclude.txt"
          fi
          exclude=()
          if [ -s "$GITHUB_WORKSPACE/shard-exclude.txt" ]; then
            exclude=(--exclude-preview-id-file "$GITHUB_WORKSPACE/shard-exclude.txt")
          fi
          if [ -n "${EXCLUDE_PREVIEW_ROWS:-}" ]; then exclude+=(--exclude-preview-row "$EXCLUDE_PREVIEW_ROWS"); fi
          run compose-preview bundle pack --module "$INPUT_MODULE" --with-semantics --progress \
            "${variant[@]}" "${embed[@]}" "${exclude[@]}" -o "$GITHUB_WORKSPACE/bundle.png" \
            --timeout $INPUT_RENDER_TIMEOUT

      - name: Save downloadable-font cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composeai/fonts
          key: composeai-fonts-${{ runner.os }}-${{ inputs.system }}-${{ github.run_id }}-shard-${{ matrix.shard }}

      # `compression-level: 0` because a bundle is an already-compressed zip behind a PNG cover —
      # re-deflating it costs CPU on both ends and saves nothing. `retention-days: 1` because these
      # are intermediates consumed by the merge minutes later; the published artifact is the
      # delivery branch.
      - name: Upload shard ${{ matrix.shard }}
        if: ${{ steps.shard-plan.outputs.previews != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.system }}-render-shard-${{ matrix.shard }}
          path: |
            ${{ github.workspace }}/bundle.png
            ${{ github.workspace }}/shard-plan.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  generate:
    name: ${{ inputs.system }}
    # Skipped needs are the single-shard path, not a failure: with render-shards at its default the
    # two jobs above never run, and this job must still start. `!cancelled()` plus an explicit
    # failure check is the pattern that distinguishes "skipped" from "broke".
    needs: [driver, shard-matrix, render-shard]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      # The preview ids can contain an em-dash; force UTF-8 so `bundle pack --id`
      # round-trips and the generator's join stays exact.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Read-only BuildFetch cache (safe at job scope): pull task outputs instead
      # of building cold. Empty when the secret isn't provided.
      # Withheld in import mode. `secrets: inherit` is the documented way to supply this, and the
      # imported project's own build scripts and plugins run in this job — handing them a caller
      # credential would let any of them read it straight out of the environment. A remote cache
      # miss is the whole cost.
      BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN: ${{ inputs.upstream-repository == '' && secrets.buildfetch_ro_token || '' }}
    outputs:
      # The one thing the publish job cannot work out for itself. The findings emitter reports
      # whether it could READ the parity branch by exporting PARITY_FINDINGS_UNREADABLE into this
      # job's environment, and the catalog push needs it to decide whether to carry the served
      # verdict forward. Environment variables do not cross a job boundary; an output does.
      parity-findings-unreadable: ${{ steps.parity-findings-readability.outputs.unreadable }}
      # The commit the bundle was rendered from. Published here so the publish job does not have to
      # check the calling repository out merely to read one SHA — the only thing it wanted it for.
      source-sha: ${{ steps.source-sha.outputs.sha }}
    steps:
      - name: Check out the calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty ⇒ checkout's default (the triggering ref), unchanged for push/PR
          # callers; a caller can pass `ref` to render a specific branch, which a
          # scheduled run needs to reach a catalog that lives off the default branch.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # IMPORT MODE: the third-party project this run renders. Deliberately AFTER the caller's
      # checkout (which owns the workspace root) and into a subdirectory, so the caller's spec and
      # the imported sources never share a tree. `persist-credentials: false` keeps the job's token,
      # if its caller gave it one, out of the imported checkout's git config.
      # Fetched with plain git rather than `actions/checkout`, deliberately and for two reasons.
      #
      # The first is that `actions/checkout` sends a credential. Its `token:` input defaults to the
      # job's `github.token`, so pointing it at `repository:` hands that token to whatever host
      # serves the request. Nothing here should present a credential to a third-party repository:
      # imports are public, a public clone needs no authentication, and the correct number of
      # secrets to expose to an untrusted fetch is zero. `git clone` with no helper configured sends
      # nothing, which is what this does.
      #
      # The second is that a variable `repository:` on `actions/checkout` is exactly CodeQL's
      # "checkout of untrusted code in a privileged context" pattern, and here it would not be a
      # false positive — the whole feature is fetching code from a repository the caller named. The
      # honest response is to remove the credential the rule is warning about rather than to dismiss
      # the alert.
      #
      # Fetched by the SHA the driver resolved once, never the caller's moving ref: see that job.
      # `--depth 1` of one commit; nothing in the imported history is read.
      - name: Fetch the upstream project
        if: ${{ inputs.upstream-repository != '' }}
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_SHA: ${{ needs.driver.outputs.upstream-sha }}
        run: |
          set -euo pipefail
          # Belt and braces: the driver already resolved and validated this, but the value reaches a
          # command line here, so it is re-checked at the point of use.
          printf '%s' "${UPSTREAM_SHA}" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::upstream sha '${UPSTREAM_SHA}' is not a commit"; exit 1; }
          printf '%s' "${UPSTREAM_REPOSITORY}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || {
            echo "::error::'${UPSTREAM_REPOSITORY}' is not an owner/repo"; exit 1; }
          rm -rf upstream
          mkdir upstream
          cd upstream
          git init --quiet
          # -c credential.helper=: with an empty value clears any inherited helper, so this fetch
          # cannot pick up a token from the runner's git config.
          git -c credential.helper= remote add origin \
            "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -c credential.helper= fetch --depth 1 --quiet origin "${UPSTREAM_SHA}"
          git checkout --quiet FETCH_HEAD

      # An imported project may harden its build against precisely what an import does: resolve a
      # plugin it has never heard of. Where it ships dependency verification metadata, the
      # auto-injected preview plugin has no checksum in it and the render dies during configuration
      # (yschimke/compose-preview-imports#30). Two things happen to the THROWAWAY checkout here: the
      # plugin's own groups are trusted, and verification is set to lenient. The second is what
      # actually makes such a project render — see TRUST_PREVIEW_PLUGIN_PY, which records why the
      # first was thought sufficient and what disproved it.
      # An upstream that applies the Google Services plugin but does not commit
      # google-services.json cannot CONFIGURE without one — home-assistant/android's
      # AndroidApplicationConventionPlugin applies it to every application module, and contributors
      # bring their own file, so :app dies on `processMinimalDebugGoogleServices` before a preview
      # is discovered. The stub is written into the THROWAWAY checkout, never committed anywhere,
      # and carries no real project: a zeroed project number and a placeholder key.
      #
      # The packages are declared by the caller rather than derived, because they have to be the
      # EXACT applicationId of the variant being rendered, suffixes and all. Verified against a real
      # AGP build rather than assumed: a stub naming only the base package fails with
      #
      #   > No matching client found for package name 'io.example.probe.minimal.debug'
      #
      # so there is no prefix fallback to lean on, and nothing here can guess a flavour suffix a
      # convention plugin three repositories away decided on.
      - name: Stub google-services.json in the upstream checkout
        if: ${{ inputs.upstream-repository != '' && inputs.stub-google-services-packages != '' }}
        env:
          PACKAGES: ${{ inputs.stub-google-services-packages }}
        run: |
          set -euo pipefail
          # BOTH have to be checked, not just INPUT_MODULE. The generate job enters repository-wide
          # discovery on `inputs.module == '' || inputs.modules == 'all'`, so a caller passing
          # `module: ':app'` AND `modules: all` renders every module while this step, seeing a
          # non-empty INPUT_MODULE, would stub only `app` — and a second application module needing
          # Google Services would fail with no stub, from a step that had claimed to refuse exactly
          # this case.
          if [ -z "${INPUT_MODULE:-}" ] || [ "${INPUT_MODULES:-}" = "all" ]; then
            echo "::error title=stub-google-services-packages needs one module::The stub is written" \
              "into the rendered module's directory, which an all-module import does not name." \
              "Split the import so it renders one module, or drop the stub."
            exit 1
          fi
          # `:app` -> `app`, `:modules:services:compose` -> `modules/services/compose` — but ONLY
          # when the project sits where its path says. Gradle lets a settings file put it anywhere:
          #
          #     project(":app").projectDir = file("android-app")
          #
          # and compose-ai-tools' own settings.gradle.kts does this in several places, so it is not
          # a hypothetical. Deriving blindly would either reject a real module as nonexistent or —
          # worse — write the file into a directory that happens to exist and is not the project,
          # leaving the Google Services task still failing with the stub sitting somewhere it never
          # looks. So the settings file gets the first word, and the derived path is the fallback.
          derived="$(printf '%s' "${INPUT_MODULE#:}" | tr ':' '/')"
          remapped="$(
            cat "${RENDER_DIR}"/settings.gradle "${RENDER_DIR}"/settings.gradle.kts 2>/dev/null |
              sed -n "s|.*project(['\"]${INPUT_MODULE}['\"])\.projectDir[[:space:]]*=[[:space:]]*[Ff]ile(['\"]\([^'\"]*\)['\"]).*|\1|p" |
              head -1
          )" || true
          if [ -n "$remapped" ]; then
            echo "settings remaps ${INPUT_MODULE} to ${remapped} — using that, not ${derived}"
            derived="$remapped"
          fi
          module_dir="${RENDER_DIR}/${derived}"
          target="${module_dir}/google-services.json"
          if [ -f "$target" ]; then
            echo "upstream commits its own ${target#"$RENDER_DIR/"} — left as is"
            exit 0
          fi
          test -d "$module_dir" || {
            echo "::error::${module_dir} does not exist; is ${INPUT_MODULE} the module being rendered?"
            exit 1
          }
          PACKAGES="$PACKAGES" TARGET="$target" python3 - <<'PY'
          import json, os

          packages = [p for p in os.environ["PACKAGES"].split(",") if p]
          doc = {
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "compose-preview-import-stub",
                  "storage_bucket": "compose-preview-import-stub.appspot.com",
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:%032x" % i,
                          "android_client_info": {"package_name": p},
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                  }
                  for i, p in enumerate(packages)
              ],
              "configuration_version": "1",
          }
          with open(os.environ["TARGET"], "w", encoding="utf-8") as handle:
              json.dump(doc, handle, indent=2)
              handle.write("\n")
          print("stubbed google-services.json for: " + ", ".join(packages))
          PY

      # Isolated Projects and auto-inject cannot coexist, and that is not a bug to work around here
      # — AutoInject.kt says so in as many words: the init script configures every project through
      # `allprojects { buildscript { … } }`, which IP forbids outright, and there is no IP-safe
      # init-script mechanism that puts an AGP-aware plugin on each project's buildscript
      # classloader. thunderbird/thunderbird-android sets it, and the render dies during discovery
      # with 206 projects skipped:
      #
      #   Project ':' cannot access 'Project.buildscript' functionality on subprojects
      #   via 'allprojects'
      #
      # AutoInject's own warning names the remedy — turn IP off for compose-preview runs — and in
      # import mode we hold a throwaway clone, so we can simply take it. Unconditional rather than
      # conditional on the upstream setting it: writing `false` where nothing set it is a no-op,
      # and detection logic that can be wrong is worse than a line that cannot be.
      #
      # `org.gradle.configuration-cache.parallel` is deliberately left alone. It is documented as
      # needing IP, so the obvious worry is that turning IP off breaks a build carrying both — but
      # a probe with configuration-cache=true, parallel=true and IP=false runs clean; Gradle simply
      # ignores the parallel request. Touching a second property to fix a problem that does not
      # exist would be the riskier change.
      # `working-directory` names a Gradle build nested inside the upstream repository, and the CLI
      # finds "the project" by walking UP from its cwd until it sees a `gradlew`
      # (`findGradleProjectRoot`). A nested build that ships its own wrapper is therefore found
      # correctly — mullvad/mullvadvpn-app's `android/` has one. thunderbird-android's `components/`
      # does NOT: it is a complete build (its own `settings.gradle.kts`, `rootProject.name =
      # "components"`) that borrows the repository root's wrapper. The walk-up sailed past it and
      # rendered the REPOSITORY ROOT build instead, which is a different build entirely:
      #
      #   Module ':ui:bolt' not found or does not apply the compose-ai-tools plugin.
      #   206 project(s) failed to configure during discovery and were skipped
      #     :: InvalidUserCodeException: Project ':' cannot access 'Project.buildscript' …
      #     :app-k9mail: … :app-thunderbird: … :backend:imap: …
      #
      # — the root build's 206 projects, under the root build's `isolated-projects=true`, none of
      # them the three in `components`. Both symptoms are downstream of running the wrong build, so
      # neither the Isolated Projects step below nor an exclusion list could have fixed it.
      #
      # Copying the nearest ancestor's wrapper into the throwaway checkout stops the walk at the
      # build the import actually named. `gradle-wrapper.properties` is the half that matters to the
      # Tooling API (it is what pins the distribution); `gradlew` is the half that matters to the
      # CLI's search. Both are copied, so the nested build resolves the same Gradle the repository
      # would have used — this is not a version choice being made here.
      #
      # Deliberately confined to a directory that is a build root in its own right: without a
      # settings file the walk-up is the CORRECT behaviour (an ordinary subproject renders from its
      # parent build), and planting a wrapper there would break it.
      - name: Give a nested upstream build its own Gradle wrapper
        if: ${{ inputs.upstream-repository != '' && inputs.working-directory != '' }}
        run: |
          set -euo pipefail
          if [ ! -f "${RENDER_DIR}/settings.gradle" ] && [ ! -f "${RENDER_DIR}/settings.gradle.kts" ]; then
            echo "${RENDER_DIR} is not a Gradle build root — the walk-up to the enclosing build is correct"
            exit 0
          fi
          if [ -f "${RENDER_DIR}/gradlew" ]; then
            echo "${RENDER_DIR} ships its own wrapper — nothing to do"
            exit 0
          fi
          # Walk up from the nested build, stopping at the upstream checkout root. `upstream` is
          # where the fetch step put it, so this cannot wander into the calling repository.
          dir=$(dirname "${RENDER_DIR}")
          found=""
          while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
            if [ -f "$dir/gradlew" ] && [ -f "$dir/gradle/wrapper/gradle-wrapper.properties" ]; then
              found="$dir"
              break
            fi
            if [ "$dir" = "upstream" ]; then
              break
            fi
            dir=$(dirname "$dir")
          done
          if [ -z "$found" ]; then
            # Failing here rather than continuing. There is no benign outcome further on: the
            # walk-up does not stop at `upstream`, so it either leaves the checkout entirely and
            # lands on some unrelated `gradlew` in the runner workspace, or finds none and the CLI
            # exits with "Cannot find Gradle project root" — a message that says nothing about the
            # nested build being the reason. Neither is a Tooling-API default worth waiting for.
            echo "::error::${RENDER_DIR} is a Gradle build root but neither it nor any directory" \
                 "up to the upstream checkout has a Gradle wrapper, so the render has no" \
                 "distribution to run and would silently target some other build"
            exit 1
          fi
          mkdir -p "${RENDER_DIR}/gradle/wrapper"
          cp "$found/gradlew" "${RENDER_DIR}/gradlew"
          chmod +x "${RENDER_DIR}/gradlew"
          if [ -f "$found/gradlew.bat" ]; then
            cp "$found/gradlew.bat" "${RENDER_DIR}/gradlew.bat"
          fi
          cp "$found"/gradle/wrapper/gradle-wrapper.* "${RENDER_DIR}/gradle/wrapper/"

          # A `distributionUrl` with no scheme is resolved RELATIVE TO the directory holding
          # gradle-wrapper.properties, so copying the file further down the tree silently repoints
          # it — a repository vendoring its distribution at `gradle/wrapper/gradle-x.y-bin.zip`
          # would have the nested copy look for it under the nested build instead, and fail. Re-
          # anchor it against the wrapper's original directory so it names the same file the
          # ancestor's wrapper named. A value with a scheme (`https\://…`, the overwhelmingly common case) and
          # an absolute path are both already location-independent and are left alone.
          wrapper_properties="${RENDER_DIR}/gradle/wrapper/gradle-wrapper.properties"
          url=$(sed -n -E 's/^[[:space:]]*distributionUrl[[:space:]]*=[[:space:]]*//p' \
                  "$wrapper_properties" | head -1)
          case "$url" in
            "" | /*) ;;
            *)
              if printf '%s' "$url" | grep -qE '^[A-Za-z][A-Za-z0-9+.-]*\\?:'; then
                :
              else
                # The base is the directory holding the PROPERTIES FILE, not the build directory,
                # so the hop is from `<found>/gradle/wrapper` to `<render>/gradle/wrapper` — one
                # `../` per level of the nesting does NOT reach it. Let the path library say it.
                prefix=$(python3 -c \
                  'import os, sys; print(os.path.relpath(sys.argv[1], sys.argv[2]) + "/")' \
                  "$found/gradle/wrapper" "${RENDER_DIR}/gradle/wrapper")
                sed -i -E "s#^([[:space:]]*distributionUrl[[:space:]]*=[[:space:]]*)#\\1${prefix}#" \
                  "$wrapper_properties"
                echo "re-anchored the relative distributionUrl '$url' as '${prefix}${url}'"
              fi
              ;;
          esac
          echo "copied $found's wrapper into ${RENDER_DIR} so the render targets that build"

      - name: Disable Isolated Projects in the upstream checkout
        if: ${{ inputs.upstream-repository != '' }}
        env:
          GRADLE_PROPERTIES: ${{ env.RENDER_DIR }}/gradle.properties
        run: |
          set -euo pipefail
          if [ -f "$GRADLE_PROPERTIES" ] &&
             grep -q '^[[:space:]]*org\.gradle\.unsafe\.isolated-projects[[:space:]]*=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^[[:space:]]*org\.gradle\.unsafe\.isolated-projects[[:space:]]*=.*/org.gradle.unsafe.isolated-projects=false/' \
              "$GRADLE_PROPERTIES"
            echo "turned Isolated Projects off in the throwaway checkout"
          else
            printf '\n# compose-preview import: auto-inject configures projects via allprojects {},\n# which Isolated Projects forbids.\norg.gradle.unsafe.isolated-projects=false\n' \
              >> "$GRADLE_PROPERTIES"
            echo "pinned Isolated Projects off in the throwaway checkout"
          fi

      - name: Relax dependency verification in the upstream checkout
        if: ${{ inputs.upstream-repository != '' }}
        env:
          METADATA: ${{ env.RENDER_DIR }}/gradle/verification-metadata.xml
          GRADLE_PROPERTIES: ${{ env.RENDER_DIR }}/gradle.properties
        run: |
          set -euo pipefail
          if [ ! -f "$METADATA" ]; then
            echo "no dependency verification in this checkout — nothing to relax"
            exit 0
          fi
          printf '%s' "$TRUST_PREVIEW_PLUGIN_PY" > "${RUNNER_TEMP}/trust-preview-plugin.py"
          python3 "${RUNNER_TEMP}/trust-preview-plugin.py" "$METADATA"

          # And then lenient, which is what actually makes a verified project render. See
          # TRUST_PREVIEW_PLUGIN_PY: trusting our own coordinates left mullvad failing on 109
          # artifacts that are the PROJECT'S OWN, resolved through a detached configuration the
          # render creates and the project therefore has no checksums for.
          #
          # Set in gradle.properties rather than as a CLI flag on purpose. The flag would have to
          # travel through the CLI, which is installed from a RELEASE — so it would not take effect
          # until the next one, exactly the lag that left --write-locks written but unreachable for
          # hours (#4992, #4994). This file is in the throwaway checkout the workflow already
          # rewrites, so it applies to the very next run.
          #
          # Replaced rather than appended when the key is already there: an upstream that pins
          # `strict` would otherwise win and the render would fail with the property set, which is
          # the most confusing possible outcome.
          if [ -f "$GRADLE_PROPERTIES" ] &&
             grep -q '^[[:space:]]*org\.gradle\.dependency\.verification[[:space:]]*=' "$GRADLE_PROPERTIES"; then
            sed -i 's/^[[:space:]]*org\.gradle\.dependency\.verification[[:space:]]*=.*/org.gradle.dependency.verification=lenient/' \
              "$GRADLE_PROPERTIES"
            echo "rewrote org.gradle.dependency.verification=lenient in the throwaway checkout"
          else
            printf '\n# compose-preview import: verification is lenient for this throwaway render.\norg.gradle.dependency.verification=lenient\n' \
              >> "$GRADLE_PROPERTIES"
            echo "set org.gradle.dependency.verification=lenient in the throwaway checkout"
          fi


      # The imported project's OWN toolchain, when it asks for one this runner lacks. Installed
      # BEFORE JDK 21 on purpose: `setup-java` points JAVA_HOME at whichever it installed last, and
      # everything else here — the CLI, the export driver — runs on 21. Only Gradle's toolchain
      # resolution needs the other one, and it finds it through the path recorded below.
      - name: Set up the imported project's toolchain
        if: ${{ inputs.upstream-repository != '' && inputs.upstream-java-version != '' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.upstream-java-version }}

      # Gradle does not auto-detect a JDK under the runner's tool cache — its detection looks at
      # the current JVM and the usual system locations, and `setup-java` installs to neither. So
      # name the path explicitly; without this the extra JDK is installed and still not found.
      - name: Point Gradle's toolchain detection at it
        if: ${{ inputs.upstream-repository != '' && inputs.upstream-java-version != '' }}
        run: |
          set -euo pipefail
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME} ${GRADLE_OPTS:-}" \
            >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Install the released compose-preview CLI, pinned to the plugin version when
      # cli-version=catalog so the CLI and the applied plugin stay in lockstep.
      - name: Install compose-preview CLI
        if: ${{ inputs.cli-source == 'released' }}
        # Same immutable trust boundary as the other install steps above.
        uses: yschimke/compose-ai-tools/.github/actions/install@b3faa210939f1ec59f01f63731b6b29a99c26c5c # v1.46.2
        with:
          version: ${{ inputs.cli-version }}
          catalog-key: ${{ inputs.catalog-key }}
          catalog-path: ${{ inputs.catalog-path }}
          github-token: ${{ github.token }}

      # The export driver + its render helpers live in compose-ai-tools; check it
      # out (public repo) so we can run scripts/design-artifacts/.
      - name: Check out compose-ai-tools (export driver)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DRIVER_PIN_REPO }}
          # Never a caller-supplied ref: resolved by the step above, which admits
          # only a 40-hex commit.
          ref: ${{ needs.driver.outputs.ref }}
          path: compose-ai-tools
          persist-credentials: false

      # ---- The two embedded player lanes' harness, when a caller asked for them ----------------
      #
      # `:third-party-rc-embedded-player` (Robolectric, both Android columns) and
      # `:third-party-rc-embedded-player-jvm` (Compose Desktop / Skiko) live in yschimke/rc-players
      # since the player stack was extracted. The rc-compare step below used to run them out of the
      # compose-ai-tools checkout, where they have not existed for some time — so both lanes could
      # only ever log a warning and drop their column, which is what left a catalog's wall three
      # columns wide with nothing saying why (#4998).
      #
      # Pinned to the version this repository CONSUMES the players at, read out of the pinned driver
      # checkout rather than written here a second time. A harness rendering through a different
      # player build than the one the catalog's own capture went through makes every number in the
      # wall unattributable — the skew `gradle/libs.versions.toml` keeps one `rcplayers` ref for, and
      # the failure this repo already paid for once with the AndroidX alphas.
      # `RC_PLAYERS_PIN` names the tag; this decides whether it may be used. Reading the version and
      # CHECKING it, rather than reading it and checking that out, is the whole difference between a
      # constant `ref:` and an untrusted one — see the env block.
      #
      # Fail-soft, like everything else about these lanes: drift skips the columns and says so. A
      # hard failure here would take the publish down over a version mismatch in an enrichment lane,
      # and the compare pages name the players a run left out since #5004, so a skipped lane is
      # visible on the page rather than silent.
      - name: Check the rc-players pin against the consumed player version
        id: rc-players-pin
        if: ${{ inputs.rc-embedded-lane || inputs.rc-embedded-jvm-lane }}
        run: |
          set -euo pipefail
          catalog="$GITHUB_WORKSPACE/compose-ai-tools/gradle/libs.versions.toml"
          # One `sed` that quits at the first hit rather than `sed … | head -1`: this step runs
          # under `pipefail`, and `head` closing the pipe early would SIGPIPE `sed` into failing it.
          version="$(sed -n '/^rcplayers = /{s/^rcplayers = "\([^"]*\)".*/\1/p;q;}' "$catalog")"
          if [ -z "$version" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no 'rcplayers' entry in the driver checkout's gradle/libs.versions.toml; skipping the embedded player lanes"
            exit 0
          fi
          if [ "v${version}" != "$RC_PLAYERS_PIN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=rc-players pin drift::RC_PLAYERS_PIN is $RC_PLAYERS_PIN but this repo consumes the players at v${version}. Rendering a harness through a different player build than the catalog's own capture makes every column unattributable, so the embedded lanes are skipped. Bump RC_PLAYERS_PIN in this workflow."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "embedded player harnesses on rc-players $RC_PLAYERS_PIN, matching the consumed rcplayers=$version"

      - name: Check out rc-players (embedded player harnesses)
        if: ${{ steps.rc-players-pin.outputs.ok == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both literal, neither computed. See the env block for why that is load-bearing.
          repository: ${{ env.RC_PLAYERS_REPO }}
          ref: ${{ env.RC_PLAYERS_PIN }}
          path: rc-players
          persist-credentials: false

      # rc-players pins a Java 17 toolchain. Everything else in this job runs on 21 and JAVA_HOME
      # must stay there, so this is the same two-step the imported project's toolchain gets above:
      # install it, then name its path, because Gradle's toolchain detection looks at the current
      # JVM and the usual system locations and `setup-java` installs to neither.
      - name: Set up the rc-players toolchain
        if: ${{ steps.rc-players-pin.outputs.ok == 'true' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 21 (restore JAVA_HOME)
        if: ${{ steps.rc-players-pin.outputs.ok == 'true' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Point Gradle's toolchain detection at every installed JDK
        if: ${{ steps.rc-players-pin.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          # Built from every `JAVA_HOME_*` the job has — `setup-java` exports one per JDK it
          # installed, and the runner image exports its preinstalled ones — rather than appending a
          # second `-D` flag. A repeated system property does not merge: the last one wins, so
          # appending would silently drop whatever path the imported project's toolchain step
          # recorded. Comma-separated, and any earlier copy of the flag is stripped first.
          paths="$(env | sed -n 's/^JAVA_HOME_[0-9A-Za-z_]*=//p' | sort -u | paste -sd, -)"
          if [ -z "$paths" ]; then
            echo "::warning::no JAVA_HOME_* on this runner; the embedded lanes will fall back to Gradle's own toolchain detection"
            exit 0
          fi
          rest="$(printf '%s' "${GRADLE_OPTS:-}" | sed 's/-Dorg\.gradle\.java\.installations\.paths=[^ ]*//g')"
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${paths} ${rest}" >> "$GITHUB_ENV"

      # Build the CLI from the compose-ai-tools checkout instead of installing a
      # release — so compose-ai-tools' own catalogs render against HEAD's renderer.
      # Its bin/ goes on $GITHUB_PATH, shadowing nothing (the released install step
      # is skipped for cli-source=build).

      - name: Build compose-preview CLI from source
        if: ${{ inputs.cli-source == 'build' }}
        working-directory: compose-ai-tools
        run: |
          set -euo pipefail
          ./gradlew :cli:installDist --no-daemon --quiet
          echo "$GITHUB_WORKSPACE/compose-ai-tools/cli/build/install/compose-preview/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install export engine (pinned npm packages)
        working-directory: compose-ai-tools/scripts/design-artifacts
        run: npm ci --no-audit --no-fund --loglevel=warn

      - name: Validate module selector
        run: |
          set -euo pipefail
          if [ -n "$INPUT_MODULES" ] && [ "$INPUT_MODULES" != "all" ]; then
            echo "::error title=modules input::modules supports only 'all'; use module for one Gradle path."
            exit 1
          fi
          # defer-figma-svg defaults ON, so a baked-only catalog reaches here with it set without
          # having asked for it. Deferring needs a daemon to regenerate the vector on request, so
          # for those catalogs it is simply inapplicable — say so and carry on. Failing here would
          # break every caller that never opted in.
          if [ "$INPUT_DEFER_FIGMA_SVG" = "true" ] && [ "$INPUT_PUBLISH_LIVE_BUNDLE" != "true" ]; then
            echo "::notice title=defer-figma-svg::ignored — it needs publish-live-bundle: true so a trusted daemon can produce the vector on request. Static vectors will be published as before."
          fi

      # Repository-wide publication keeps one executable bundle per Gradle module. Discover the
      # module set once, order it deterministically, and prefer spec.module as the primary when the
      # authored catalog names one — that preserves the historical unqualified function-name winner
      # if two modules declare the same preview function.
      - name: Discover preview-enabled modules
        if: ${{ inputs.module == '' || inputs.modules == 'all' }}
        working-directory: ${{ env.RENDER_DIR }}
        env:
          SPEC: ${{ inputs.spec }}
          EXTRA_MODULE: ${{ inputs.extra-module }}
          RENDER_SHARDS: ${{ inputs.render-shards }}
          PUBLISH_LIVE_BUNDLE: ${{ inputs.publish-live-bundle }}
          SPLIT_PER_PREVIEW: ${{ inputs.split-per-preview }}
          SPLIT_MODE: ${{ inputs.split-mode }}
        run: |
          set -euo pipefail
          if [ -n "$EXTRA_MODULE" ]; then
            echo "::error title=all modules::extra-module is redundant with repository-wide discovery; omit it."
            exit 1
          fi
          if [ "$RENDER_SHARDS" -gt 1 ]; then
            echo "::error title=all modules::render-shards currently shards one module; use 1 when publishing all modules."
            exit 1
          fi
          if [ "$SPLIT_PER_PREVIEW" = "true" ] && [ "$SPLIT_MODE" != "view-only" ] && [ "$PUBLISH_LIVE_BUNDLE" != "true" ]; then
            echo "::error title=all modules::repository-wide live per-preview splits require publish-live-bundle: true."
            exit 1
          fi
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          compose-preview list --json "${variant[@]}" > "$GITHUB_WORKSPACE/discovered-previews.json"
          # An import renders composables only, so the synthetic activity / app-tour previews are
          # excluded at render time. A module holding NOTHING else would then have its entire set
          # excluded, and `excludePreviewIds` throws rather than render nothing — sinking the whole
          # sweep over a module nobody wanted. That shape is the common one, not a corner: an
          # Android application module with activities but no authored @Preview is what you get
          # whenever the previews live in feature or design modules.
          #
          # So such a module must never reach the render list. Done by thinning the JSON here
          # rather than by teaching preview-modules.mjs a flag, because THIS FILE reaches external
          # callers immediately while `scripts/` does not: an external caller runs the export driver
          # at the pinned commit (see .github/design-artifacts-driver-pin.txt), so a new script
          # option would not exist for it and Node's strict parseArgs would abort the run on the
          # unknown argument. Filtering the input keeps the pinned script's contract untouched, and
          # keeps `--sources-output` in lockstep for free — it is derived from the same records.
          modules_input="$GITHUB_WORKSPACE/discovered-previews.json"
          if [ -n "${IMPORT_EXCLUDE_PREVIEW_IDS:-}" ]; then
            jq '.previews |= map(select((.id // "") | (startswith("activity__") or startswith("apptour__")) | not))' \
              "$GITHUB_WORKSPACE/discovered-previews.json" \
              > "$GITHUB_WORKSPACE/discovered-previews-authored.json"
            modules_input="$GITHUB_WORKSPACE/discovered-previews-authored.json"
            echo "Import: $(jq '.previews | length' "$modules_input") authored preview(s) of" \
              "$(jq '.previews | length' "$GITHUB_WORKSPACE/discovered-previews.json") discovered;" \
              "activity/app-tour previews do not select a module."
          fi
          preferred="$(node -e 'const fs=require("fs"); try { const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(s.module ?? ""); } catch {}' "$GITHUB_WORKSPACE/$SPEC")"
          preferred_args=(); if [ -n "$preferred" ]; then preferred_args=(--preferred "$preferred"); fi
          node "$GITHUB_WORKSPACE/compose-ai-tools/scripts/design-artifacts/preview-modules.mjs" \
            --input "$modules_input" \
            --output "$GITHUB_WORKSPACE/preview-modules.txt" \
            --sources-output "$GITHUB_WORKSPACE/preview-module-sources.txt" \
            "${preferred_args[@]}"
          echo "Publishing $(wc -l < "$GITHUB_WORKSPACE/preview-modules.txt" | tr -d ' ') preview-enabled module(s):"
          sed 's/^/  /' "$GITHUB_WORKSPACE/preview-modules.txt"

      # Fast, build-free pre-flight: resolve every spec `preview` against the
      # module's @Preview functions BEFORE the (long) render, so a mistyped or
      # renamed name fails here in seconds instead of as a late "missing" entry.
      - name: Validate catalog spec
        id: validate-spec
        env:
          SPEC: ${{ inputs.spec }}
          MODULE: ${{ inputs.module }}
          EXTRA_MODULE: ${{ inputs.extra-module }}
          PREVIEW_ANNOTATIONS: ${{ inputs.preview-annotations }}
          WORKDIR: ${{ inputs.working-directory }}
          SOURCE_ROOT: ${{ inputs.upstream-repository != '' && 'upstream' || '' }}
          LIVE_BUNDLE: ${{ inputs.publish-live-bundle }}
          LIVE_SOURCE: ${{ inputs.live-rerender-source }}
          ALL_MODULES: ${{ inputs.module == '' || inputs.modules == 'all' }}
        run: |
          set -euo pipefail
          # Single-module callers predate repository-wide discovery and still use the conventional
          # Gradle-path mapping. All-module callers consume BasicGradleProject.projectDirectory
          # captured by discovery; settings.gradle can map :ui to components/ui (or anywhere else).
          # Module paths are resolved against the directory the sources were actually checked out
          # into — `upstream/` in import mode — because that is where the validator has to look for
          # Kotlin sources. Without the prefix it silently finds none and falls back to
          # structural-only validation, dropping the pre-render check for missing or renamed
          # previews; worse, a caller directory that happens to share the path would be scanned
          # instead. `--spec` stays caller-relative and is deliberately not prefixed.
          to_dir() { printf '%s' "${SOURCE_ROOT:+$SOURCE_ROOT/}${WORKDIR:+$WORKDIR/}${1#:}" | tr ':' '/'; }
          args=(--spec "$SPEC")
          if [ "$ALL_MODULES" = "true" ]; then
            while IFS= read -r discovered_source; do
              [ -n "$discovered_source" ] && args+=(--src "$discovered_source")
            done < "$GITHUB_WORKSPACE/preview-module-sources.txt"
            # One source.module cannot describe a repository-wide catalog. Keep validation honest:
            # deferred coverage needs the carried live bundles, while source modules are stamped
            # per component after export.
            LIVE_SOURCE=false
          else
            args+=(--module-dir "$(to_dir "$MODULE")")
          fi
          # A catalog whose previews span the primary + one extra module must
          # resolve names against BOTH, or the extra module's previews read as
          # "missing" and fail the pre-flight.
          if [ -n "$EXTRA_MODULE" ]; then args+=(--src "$(to_dir "$EXTRA_MODULE")"); fi
          # Multipreview annotations declared outside the scanned source (Wear's
          # @WearPreviewDevices/@WearPreviewFontScales, or an app's own shared
          # annotation module). Without them the scan finds nothing and every
          # entry fails — which reads as a broken spec, not a missing flag.
          for ann in $PREVIEW_ANNOTATIONS; do args+=(--preview-annotation "$ann"); done
          # Render priority (issue #2950): a spec may defer entries/modes to the live
          # preview server. Tell the pre-flight whether this publish HAS a live path, so
          # a deferral with no way to produce the deferred pixels fails in seconds here
          # rather than at the end of the render.
          if [ "$LIVE_BUNDLE" = "true" ] || [ "$LIVE_SOURCE" = "true" ]; then
            args+=(--live-bundle)
          else
            args+=(--no-live-bundle)
          fi
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs "${args[@]}" \
            --render-filter-out "$GITHUB_WORKSPACE/render-filter.txt" \
            --deferred-modes-out "$GITHUB_WORKSPACE/deferred-modes.txt"
          # The `--preview` patterns that render just the required entries. EMPTY for every
          # spec that defers no entry — i.e. all of them today — in which case the render
          # step below sees an empty property and renders everything, exactly as before.
          echo "render-filter=$(cat "$GITHUB_WORKSPACE/render-filter.txt")" >> "$GITHUB_OUTPUT"
          # The deferred MODE names. Only the gate for the discovery step below (issue #2966):
          # the mode axis is skipped per preview ID, and the ids only exist after discovery, so
          # the extra Gradle invocation is worth paying only when a mode is actually deferred.
          echo "deferred-modes=$(cat "$GITHUB_WORKSPACE/deferred-modes.txt")" >> "$GITHUB_OUTPUT"

      # Per-mode render filter (issue #2966). `modePriority` thins a fan-out that lives INSIDE one
      # `@Preview` function, so unlike the entry-level filter above it can't be expressed as function
      # names — it needs the discovered preview ids (`FilledButton_Dark`, a `@PreviewParameter` row).
      # `compose-preview list --json` runs `composePreviewDiscover` to get them; that compile is
      # shared with the render below (same Gradle build, warm caches), so the extra invocation costs
      # discovery, not a second compile. Skipped entirely when the spec defers no mode, which is the
      # state of every catalog that hasn't opted in.
      #
      # Skipped entirely for a sharded run: the render happens in `render-shard`, which does its own
      # discovery and its own deferral, so paying for a second Gradle configure + compile here would
      # add ~4 minutes to produce a filter nothing in this job uses.
      - name: Derive per-mode render exclusions
        id: mode-filter
        if: ${{ steps.validate-spec.outputs.deferred-modes != '' && inputs.render-shards < 2 }}
        working-directory: ${{ env.RENDER_DIR }}
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          module_args=()
          if [ -n "$INPUT_MODULE" ] && [ "$INPUT_MODULES" != "all" ]; then
            module_args=(--module "$INPUT_MODULE")
          fi
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          compose-preview list --json "${variant[@]}" "${module_args[@]}" > "$GITHUB_WORKSPACE/discovered-previews.json"
          node "$GITHUB_WORKSPACE/compose-ai-tools/scripts/design-artifacts/deferred-preview-ids.mjs" \
            --spec "$GITHUB_WORKSPACE/$SPEC" \
            --previews "$GITHUB_WORKSPACE/discovered-previews.json" \
            --out "$GITHUB_WORKSPACE/mode-filter.txt" \
            --anchored-out "$GITHUB_WORKSPACE/mode-filter-cli.txt" \
            --rows-out "$GITHUB_WORKSPACE/mode-filter-rows.txt"
          # Exclusion polarity: a pattern that matches nothing renders MORE, never less, so a spec
          # that has drifted ahead of the code wastes time instead of dropping a sticker.
          #
          # The ANCHORED file, not the plain one. `--exclude-preview-id` matches a plain pattern by
          # equality or substring, and ids are hierarchical, so deferring `Switch_Dark` unanchored
          # also defers `Switch_Dark_VARIANT_off` — which the spec never deferred, and whose absence
          # surfaces as a completeness-gate failure naming a component rather than as anything
          # pointing at the mode filter (#3559).
          echo "exclude-ids=$(cat "$GITHUB_WORKSPACE/mode-filter-cli.txt")" >> "$GITHUB_OUTPUT"
          # A CLI predating anchored matching reads `=Switch_Dark` as a literal substring, matches
          # nothing, and renders the deferred modes too. That is the safe direction — every sticker
          # is still baked, the run is just slower — but it is invisible, so say it out loud rather
          # than let a catalog quietly stop getting the saving it configured.
          if ! compose-preview bundle help 2>&1 | grep -q '=<id>'; then
            echo "::warning title=Mode deferral not applied::$(compose-preview --version | head -1) has no '=<id>' anchored --exclude-preview-id matching, so this run renders the deferred modes as well. Every preview is still baked; the render is just as slow as an undeferred one. Raise cli-version to restore the saving."
          fi
          # A mode that carries no discovered id is a @PreviewParameter row axis: discovery never
          # sees those rows (the renderer expands the provider), so they're skipped by LABEL instead.
          echo "exclude-rows=$(cat "$GITHUB_WORKSPACE/mode-filter-rows.txt")" >> "$GITHUB_OUTPUT"

      # Stage bundled fallback fonts into fontconfig before any render, so a
      # desktop (Skiko) render resolves glyphs a preview's FontFamily doesn't
      # cover (CJK/Arabic/…) from the staged face instead of a system fallback.
      - name: Stage fonts for rendering
        if: ${{ inputs.stage-font-globs != '' }}
        env:
          FONT_GLOBS: ${{ inputs.stage-font-globs }}
          # The globs are repo-relative, and in import mode the repo holding those fonts is the
          # upstream checkout. Expanded from the workspace root they would match nothing — and
          # `nullglob` makes that silent, so the render would quietly fall back to system fonts and
          # publish wrong glyphs and wrong line breaks. Staging is resolved from the same directory
          # the render itself runs in.
          FONT_ROOT: ${{ inputs.upstream-repository != '' && 'upstream' || '.' }}
        run: |
          set -euo pipefail
          command -v fc-cache >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fontconfig; }
          mkdir -p "$HOME/.local/share/fonts"
          cd "$FONT_ROOT"
          shopt -s nullglob
          staged=0
          for g in $FONT_GLOBS; do cp $g "$HOME/.local/share/fonts/"; staged=$((staged + 1)); done
          # A glob set that matches nothing is a misconfiguration, not a no-op: the render proceeds
          # with fallback fonts and the difference shows up as a pixel diff nobody can explain.
          [ "$staged" -gt 0 ] || echo "::warning title=No fonts staged::stage-font-globs matched nothing under ${FONT_ROOT}"
          fc-cache -f "$HOME/.local/share/fonts" >/dev/null

      # CMP desktop (Skiko) links libGL; install Mesa's software GL + a font stack.
      # The rc-compare cmp-jvm lane needs the same stack — its player IS this Skiko stack
      # even when the primary render is Android/Robolectric (remote-m3: desktop-render=false)
      # — but it installs its own copy just-in-time instead of firing this step, because
      # `rc-embedded-jvm-lane` now defaults to true and this step runs before the render:
      # gating on the input here would charge an apt round-trip to every caller, including
      # the catalogs (compose-m3, wear-m3) whose bundles carry no ir/*.rc and skip the lane
      # entirely. By the time rc-compare runs, the bundle is built and the answer is known.
      - name: Install desktop (Skiko) render deps
        if: ${{ inputs.desktop-render }}
        run: |
          compose-ai-tools/scripts/install-linux-font-fallbacks.sh \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1

      # Restore the downloadable-font cache (the matching save runs after the render,
      # below). The Android renderer's GoogleFont shadow and the figma-svg export fetch
      # faces (Orbitron, Space Grotesk, JetBrains Mono, Noto, Roboto, …) from Google Fonts
      # into `~/.cache/composeai/fonts` on a miss; restoring it means a face is downloaded
      # once and reused, so a branded catalog resolves deterministically (meshcore's
      # Orbitron / Space Grotesk / JetBrains Mono instead of a silent Roboto fallback) and a
      # transient Google Fonts hiccup can't degrade the bake — which, now that an unresolved
      # downloadable font is a fatal render error, would otherwise fail the whole render.
      #
      # `inputs.system` is in the key so sibling catalog jobs of ONE caller run (e.g.
      # compose-m3 / wear-m3 / remote-m3 in design-artifacts.yml) don't collide on the
      # shared `github.run_id` — Actions caches are immutable, so a shared key would let the
      # first job's post-save win and discard the others' fonts. The restore-keys fall back
      # to this catalog's prior runs, then to any catalog's (fonts are global, keyed by
      # family, so a warm start from a sibling is a bonus).
      - name: Restore downloadable-font cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composeai/fonts
          key: composeai-fonts-${{ runner.os }}-${{ inputs.system }}-${{ github.run_id }}
          restore-keys: |
            composeai-fonts-${{ runner.os }}-${{ inputs.system }}-
            composeai-fonts-${{ runner.os }}-

      - name: Render catalog bundle
        # Sharded runs render in `render-shard` and merge below instead.
        if: ${{ inputs.render-shards < 2 }}
        # compose-preview finds the Gradle root by walking up for gradlew, so a
        # monorepo of separate builds must render from the build's own dir.
        working-directory: ${{ env.RENDER_DIR }}
        env:
          # Render only the previews this catalog still needs baked, when its spec defers
          # entries to the live preview server (issue #2950). Read by the render task as the
          # `composePreview.filter` project property — Gradle sources project properties from
          # ORG_GRADLE_PROJECT_* env vars, so this reaches `composePreviewRender` through
          # `bundle pack` with no CLI flag. Empty ⇒ no filter ⇒ render everything.
          #
          # Scoped to the PRIMARY render on purpose: the patterns name preview functions from
          # this catalog's spec, and the filter fails fast when it matches nothing — an extra
          # module whose previews are all deferred would sink the render rather than skip it.
          ORG_GRADLE_PROJECT_composePreview.filter: ${{ steps.validate-spec.outputs.render-filter }}
          # Per-mode exclusions (issue #2966), as a CLI flag rather than an env var because the
          # SEMANTICS capture is driven by the CLI itself, not by Gradle: an env var would thin the
          # render and leave that pass at full width, which is half the axis saving. The flag does
          # both — it forwards `-PcomposePreview.idExclude` to the render and skips the same ids in
          # the daemon capture. Empty ⇒ the flag is omitted ⇒ render + capture everything.
          EXCLUDE_PREVIEW_IDS: ${{ steps.mode-filter.outputs.exclude-ids }}
          EXCLUDE_PREVIEW_ROWS: ${{ steps.mode-filter.outputs.exclude-rows }}
        run: |
          set -euo pipefail
          run() { if [ "$INPUT_DESKTOP_RENDER" = "true" ]; then xvfb-run -a -s "-screen 0 2000x1400x24" "$@"; else "$@"; fi; }
          run_without_filter() {
            if [ "$INPUT_DESKTOP_RENDER" = "true" ]; then
              env -u 'ORG_GRADLE_PROJECT_composePreview.filter' xvfb-run -a -s "-screen 0 2000x1400x24" "$@"
            else
              env -u 'ORG_GRADLE_PROJECT_composePreview.filter' "$@"
            fi
          }
          embed=(); if [ "$INPUT_EMBED_DEPS" = "true" ]; then embed=(--embed-deps); fi
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          # Two scopes, deliberately not one list. IMPORT_EXCLUDE_PREVIEW_IDS is import-wide and
          # must reach every module; the per-mode ids belong to the PRIMARY module only, for the
          # same reason its render filter does (see the comment in the loop below). Joined into a
          # single --exclude-preview-id value rather than passed as a repeated flag, so the
          # composition is obvious here rather than dependent on how the CLI merges repeats.
          import_exclude=()
          if [ -n "${IMPORT_EXCLUDE_PREVIEW_IDS:-}" ]; then
            import_exclude=(--exclude-preview-id "$IMPORT_EXCLUDE_PREVIEW_IDS")
          fi
          primary_ids="${IMPORT_EXCLUDE_PREVIEW_IDS:-}"
          if [ -n "${EXCLUDE_PREVIEW_IDS:-}" ]; then
            primary_ids="${primary_ids:+${primary_ids},}${EXCLUDE_PREVIEW_IDS}"
          fi
          exclude=(); if [ -n "$primary_ids" ]; then exclude=(--exclude-preview-id "$primary_ids"); fi
          if [ -n "${EXCLUDE_PREVIEW_ROWS:-}" ]; then exclude+=(--exclude-preview-row "$EXCLUDE_PREVIEW_ROWS"); fi
          if [ -f "$GITHUB_WORKSPACE/preview-modules.txt" ]; then
            mkdir -p "$GITHUB_WORKSPACE/module-bundles"
            index=0
            while IFS= read -r discovered_module; do
              [ -z "$discovered_module" ] && continue
              if [ "$index" -eq 0 ]; then
                output="$GITHUB_WORKSPACE/module-bundles/0000.png"
              else
                module_key="$(node "$GITHUB_WORKSPACE/compose-ai-tools/scripts/design-artifacts/module-artifact-key.mjs" --module "$discovered_module")"
                output="$GITHUB_WORKSPACE/module-bundles/$module_key.png"
              fi
              # The authored render filter belongs to the preferred/primary module. Every later
              # module is fallback inventory and must render in full; applying the primary's
              # function names there can fail on no match or silently thin unrelated previews.
              #
              # The IMPORT exclusions are the exception, and carry to every module: "render in
              # full" means every authored preview, not the app-launching synthetic ones. A
              # `modules: all` import sweeping a project with more than one Android application
              # module would otherwise launch the app from the second module onwards — the very
              # failure this guards, reintroduced by the fallback path.
              if [ "$index" -eq 0 ]; then
                run compose-preview bundle pack --module "$discovered_module" --with-semantics --progress \
                  "${variant[@]}" "${embed[@]}" "${exclude[@]}" -o "$output" --timeout "$INPUT_RENDER_TIMEOUT"
              else
                run_without_filter compose-preview bundle pack --module "$discovered_module" --with-semantics --progress \
                  "${variant[@]}" "${embed[@]}" "${import_exclude[@]}" -o "$output" --timeout "$INPUT_RENDER_TIMEOUT"
              fi
              index=$((index + 1))
            done < "$GITHUB_WORKSPACE/preview-modules.txt"
            cp "$GITHUB_WORKSPACE/module-bundles/0000.png" "$GITHUB_WORKSPACE/bundle.png"
          else
            run compose-preview bundle pack --module "$INPUT_MODULE" --with-semantics --progress \
              "${variant[@]}" "${embed[@]}" "${exclude[@]}" -o "$GITHUB_WORKSPACE/bundle.png" \
              --timeout "$INPUT_RENDER_TIMEOUT"
          fi

      - name: Download shard renders
        if: ${{ inputs.render-shards > 1 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.system }}-render-shard-*
          path: ${{ github.workspace }}/shards

      # Merge the shard renders into the bundle a single serial render would have produced.
      #
      # `bundle merge`, NOT `bundle repack`. Repack swaps re-renders into slots the target already
      # has, and only for `previews/<id>.png` + `previews/<id>.figma.svg` — so against a shard base
      # every other shard's previews would report "no matching baked slot" and be skipped entirely,
      # and any that did land would arrive without their `.semantics.json`, which the completeness
      # gate fails on. Merge adds the slot and carries every sidecar.
      #
      # Shard 1 is the base and contributes the manifests, the cover and the re-render classpath.
      # That is not an arbitrary pick, it is why `publish-live-bundle` needs no designated shard:
      # every shard packs the same module at the same commit, so `classes/app.jar` + `libs/` are
      # identical in all of them and the merge inherits rather than merges them.
      - name: Merge shard renders
        if: ${{ inputs.render-shards > 1 }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find "$GITHUB_WORKSPACE/shards" -name bundle.png | sort -V)
          mapfile -t plans < <(find "$GITHUB_WORKSPACE/shards" -name shard-plan.json | sort -V)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error title=No shard renders::render-shards is $INPUT_RENDER_SHARDS but no shard uploaded a bundle."
            exit 1
          fi
          # Cross-check the partitions BEFORE trusting them. Each shard derived its own from its own
          # discovery; they agree by construction, and if they ever don't, the symptom downstream is
          # a completeness-gate failure naming a component, with nothing pointing at the shards.
          node compose-ai-tools/scripts/design-artifacts/shard-preview-ids.mjs --verify "${plans[@]}"
          if [ "${#bundles[@]}" -eq 1 ]; then
            # One shard did all the work (more shards than previews). Nothing to union.
            cp "${bundles[0]}" "$GITHUB_WORKSPACE/bundle.png"
          else
            compose-preview bundle merge "${bundles[@]}" -o "$GITHUB_WORKSPACE/bundle.png"
          fi
          # And now the OUTCOME, which the plan check above cannot see. `--verify` confirms the
          # shards agreed on a disjoint cover; it passes whether or not a single preview came back.
          # m3-catalog#15 was exactly that gap: a correct partition of 1095 previews, `6 shard(s)
          # cover 1095 preview(s) exactly once` printed, 267 merged, and a green run — because each
          # shard's unanchored exclusions also deleted the `_VARIANT_` fan-out of every id it
          # excluded. Anchoring (#3561) fixed the cause; this makes any future recurrence loud,
          # naming the shard and the ids instead of thinning the published catalog in silence.
          # `--spec` only where the checked-out driver declares it. `driver-ref` is a documented pin,
          # and the verifier's `parseArgs` is strict — an older checkout would die with
          # ERR_PARSE_ARGS_UNKNOWN_OPTION before verifying anything, turning a pin into a broken
          # publish. Same capability-probe shape the CLI checks above use, for the same reason.
          # Capture the usage text first and test it separately. The probe prints usage and exits
          # 2 by design, and this step runs under `pipefail`, so `node … | grep -q` would carry
          # node's 2 through the pipeline and read as "unsupported" on EVERY driver — silently
          # disabling the exemption the flag exists to deliver.
          verifier=compose-ai-tools/scripts/design-artifacts/verify-shard-renders.mjs
          verifier_usage=$(node "$verifier" 2>&1 || true)
          spec_arg=()
          if grep -q -- '--spec' <<<"$verifier_usage"; then
            spec_arg=(--spec "$INPUT_SPEC")
          else
            echo "::notice title=Driver predates --spec::the pinned driver-ref's verify-shard-renders.mjs has no --spec; no-sticker previews will not be exempted."
          fi
          node "$verifier" --bundle "$GITHUB_WORKSPACE/bundle.png" "${spec_arg[@]}" "${plans[@]}"

      - name: Render extra module
        if: ${{ inputs.extra-module != '' }}
        working-directory: ${{ env.RENDER_DIR }}
        run: |
          set -euo pipefail
          run() { if [ "$INPUT_DESKTOP_RENDER" = "true" ]; then xvfb-run -a -s "-screen 0 2000x1400x24" "$@"; else "$@"; fi; }
          embed=(); if [ "$INPUT_EMBED_DEPS" = "true" ]; then embed=(--embed-deps); fi
          variant=(); if [ -n "${INPUT_VARIANT:-}" ]; then variant=(--variant "$INPUT_VARIANT"); fi
          # An extra module is still the imported project, so the app lanes stay excluded here too.
          import_exclude=()
          if [ -n "${IMPORT_EXCLUDE_PREVIEW_IDS:-}" ]; then
            import_exclude=(--exclude-preview-id "$IMPORT_EXCLUDE_PREVIEW_IDS")
          fi
          run compose-preview bundle pack --module "$INPUT_EXTRA_MODULE" --with-semantics --progress \
            "${variant[@]}" "${embed[@]}" "${import_exclude[@]}" -o "$GITHUB_WORKSPACE/extra-bundle.png" \
            --timeout $INPUT_RENDER_TIMEOUT

      # A failing render reports only "There were failing tests. See the results at: file:///…",
      # naming a path inside a runner that is about to be destroyed. The actual reason a preview
      # would not render — the exception and its stack — is in the JUnit XML at that path, and
      # without this step it dies with the runner and the failure is undiagnosable from CI.
      #
      # That is tolerable for a first-party catalog, whose previews a contributor can run locally.
      # It is not tolerable for an imported third-party project (`upstream-repository`), where the
      # render is the ONLY place the build has ever run and there is nothing to reproduce locally
      # without recreating the whole runner.
      #
      # Fail-soft throughout: this is diagnostics for an already-failing job, so it must never be
      # the thing that decides the job's conclusion, and it must not mask the render's own error.
      - name: Surface the failing render's test results
        if: failure()
        run: |
          set +e
          root="${GITHUB_WORKSPACE}/${RENDER_DIR:-.}"
          mkdir -p "$GITHUB_WORKSPACE/render-failure-diagnostics"

          # The renderer writes a `.error.json` beside where each PNG would have gone, on BOTH
          # lanes. Collect those first, because on the desktop lane they are the ONLY per-preview
          # evidence that exists: `composePreviewRenderAll` (Robolectric) reads its sidecars back
          # into the Gradle failure message, but `composePreviewRender` (desktop) only points at
          # them —
          #
          #   composePreviewRender: 90 capture(s) were drawn and none produced a file. … check the
          #   `Render failed for …` lines above and the `.error.json` sidecars beside the expected
          #   outputs
          #
          # — and neither the `Render failed for …` lines (they need --verbose) nor the sidecars
          # reach CI. A desktop-lane render that fails wholesale therefore leaves a log saying only
          # that it failed, which is what made DroidKaigi's :core:ui undiagnosable from a CI run.
          #
          # Printed as well as uploaded: an artifact is the wrong place for the one fact a reader
          # needs, and downloading one is not always possible from where the log is being read.
          mapfile -t sidecars < <(find "$root" -name '*.error.json' -type f 2>/dev/null | sort)
          if [ "${#sidecars[@]}" -gt 0 ]; then
            echo "::group::Per-preview render errors (${#sidecars[@]} .error.json sidecar(s))"
            for f in "${sidecars[@]}"; do
              rel="${f#"$root"/}"
              mkdir -p "$GITHUB_WORKSPACE/render-failure-diagnostics/$(dirname "$rel")"
              cp "$f" "$GITHUB_WORKSPACE/render-failure-diagnostics/$rel" 2>/dev/null
            done
            # Bounded on purpose: one wholesale failure produces one sidecar per preview, all
            # saying the same thing, and 300 copies of it buries the rest of the log. The upload
            # above keeps every one of them.
            for f in "${sidecars[@]:0:25}"; do
              echo "--- ${f#"$root"/}"
              head -c 4000 "$f"
              echo
            done
            if [ "${#sidecars[@]}" -gt 25 ]; then
              echo "… and $(( ${#sidecars[@]} - 25 )) more, in the uploaded diagnostics artifact"
            fi
            echo "::endgroup::"
          fi

          # Only the render task's own results: other test tasks in the build are not this failure.
          mapfile -t xml < <(find "$root" -path '*/build/test-results/composePreviewRender/*.xml' -type f 2>/dev/null)
          if [ "${#xml[@]}" -eq 0 ]; then
            # Two very different situations, and saying the wrong one sends the reader off in the
            # wrong direction. JUnit results exist only on the Robolectric lane, so their absence
            # beside sidecars is expected rather than evidence of anything.
            if [ "${#sidecars[@]}" -gt 0 ]; then
              echo "No composePreviewRender JUnit results under $root — expected on the desktop lane," \
                   "which writes none. The per-preview errors are the sidecars above."
            else
              echo "No composePreviewRender test results under $root — the render failed before it ran any preview."
            fi
            exit 0
          fi
          for f in "${xml[@]}"; do
            cp "$f" "$GITHUB_WORKSPACE/render-failure-diagnostics/" 2>/dev/null
          done
          echo "::group::Failing previews"
          # Print the <failure>/<error> bodies. Deliberately plain text rather than an XML parser:
          # this runs in a job that is already failing, so it must not need a tool to be installed.
          for f in "${xml[@]}"; do
            echo "--- ${f#"$root"/}"
            # Name the previews that FAILED and print each one's exception. Attribute order is not
            # guaranteed, so the name is taken from the <testcase …> tag the failure belongs to
            # rather than by position, and `classname` is excluded explicitly — a bare `name="`
            # match picks it up instead and reports every preview as the same class.
            awk '
              match($0, /<testcase[^>]*/) {
                tc = substr($0, RSTART, RLENGTH)
                name = ""
                if (match(tc, /(^|[[:space:]])name="[^"]*"/)) {
                  name = substr(tc, RSTART, RLENGTH)
                  sub(/^[[:space:]]*name="/, "", name); sub(/"$/, "", name)
                }
              }
              /<(failure|error)/ { printf "FAILED: %s\n", (name == "" ? "(unnamed)" : name); show = 1 }
              show { print }
              /<\/(failure|error)>/ { show = 0 }
            ' "$f" | head -200
          done
          echo "::endgroup::"
          exit 0

      - name: Upload the failing render's test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.system }}-render-failure-diagnostics
          path: render-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # Save the font cache even when a render step FAILED. A cold-cache run that downloaded
      # some faces before a later one failed to resolve must persist what it got, so the
      # rerun self-heals instead of starting cold again — `actions/cache` only saves on job
      # success, so restore/save are split and this runs under `if: always()`. It sits right
      # after the render steps (the only steps that fetch fonts) so a failure there still
      # captures the partial warm-up; the fresh run_id key never hits the immutable-key
      # conflict. Font downloads happen during the two render steps above only; the generate
      # / split / publish steps below process the already-rendered bundle.
      - name: Save downloadable-font cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composeai/fonts
          key: composeai-fonts-${{ runner.os }}-${{ inputs.system }}-${{ github.run_id }}

      # One executable bundle still owns exactly one Gradle module/classpath. Prefix every
      # additional module's preview ids before publication so equal ids in two modules remain
      # distinct daemon addresses. The primary stays unchanged for backwards compatibility.
      - name: Namespace live module bundles
        if: ${{ inputs.publish-live-bundle && (inputs.module == '' || inputs.modules == 'all') }}
        run: |
          set -euo pipefail
          mapfile -t modules < "$GITHUB_WORKSPACE/preview-modules.txt"
          for ((index = 1; index < ${#modules[@]}; index++)); do
            module_key="$(node compose-ai-tools/scripts/design-artifacts/module-artifact-key.mjs --module "${modules[$index]}")"
            bundle="$GITHUB_WORKSPACE/module-bundles/$module_key.png"
            namespaced="$bundle.namespaced"
            node compose-ai-tools/scripts/design-artifacts/namespace-live-bundle.mjs \
              --input "$bundle" --output "$namespaced" --module "${modules[$index]}"
            mv "$namespaced" "$bundle"
          done

      - name: Generate importable catalog
        env:
          # The ref actually rendered (see "Check out the calling repo"). Empty ⇒ the
          # triggering ref. The live-rerender source metadata and Code Connect links must
          # name the branch the catalog was rendered FROM, not the event ref — for a
          # scheduled caller that passed `ref: previews` those differ, and recording the
          # event ref (a default branch with no catalog) would point live re-render at a
          # revision the catalog doesn't exist on (issue #2963).
          RENDERED_REF: ${{ inputs.ref }}
          # In import mode the rendered SOURCE is the imported project, not the caller. Source links
          # and trusted live re-render both resolve `<repo>@<ref>` to fetch and build the module
          # again; recording the importer would point them at a repository that does not contain the
          # module at all. The ref recorded is the SHA the driver resolved, not the branch name —
          # the branch will have moved by the time anyone follows the link.
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
          UPSTREAM_SHA: ${{ needs.driver.outputs.upstream-sha }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$INPUT_EXTRA_MODULE" ]; then extra=(--extra-renders "$GITHUB_WORKSPACE/extra-bundle.png"); fi
          additional=()
          fallback=()
          if [ -d "$GITHUB_WORKSPACE/module-bundles" ]; then
            fallback=(--generate-fallbacks)
            while IFS= read -r additional_bundle; do
              additional+=(--additional-renders "$additional_bundle")
            done < <(find "$GITHUB_WORKSPACE/module-bundles" -type f -name '*.png' ! -name '0000.png' | sort -V)
          fi
          source_args=()
          # Which repository these previews actually came from: the imported project when there is
          # one, otherwise the caller.
          source_repo="${UPSTREAM_REPOSITORY:-$GITHUB_REPOSITORY}"
          if [ -n "${UPSTREAM_REPOSITORY}" ]; then
            source_ref="${UPSTREAM_SHA}"
          else
            source_ref="${RENDERED_REF:-$GITHUB_REF_NAME}"
          fi
          if [ "$INPUT_LIVE_RERENDER_SOURCE" = "true" ] && [ ! -f "$GITHUB_WORKSPACE/preview-modules.txt" ]; then
            source_args=(--source-repo "${source_repo}" --source-ref "${source_ref}" --source-module "$INPUT_MODULE")
          elif [ "$INPUT_LIVE_RERENDER_SOURCE" = "true" ]; then
            source_args=(--source-repo "${source_repo}" --source-ref "${source_ref}")
            echo "::notice title=All-module catalog::source modules are recorded per preview; trusted live rendering uses the carried module bundles."
          fi
          incomplete=()
          if [ "$INPUT_ALLOW_INCOMPLETE" = "true" ]; then incomplete=(--allow-incomplete); fi
          live=()
          if [ "$INPUT_PUBLISH_LIVE_BUNDLE" = "true" ]; then live=(--publish-live-bundle); fi
          # Gated on the live bundle as well: the driver rejects --defer-figma-svg without
          # --publish-live-bundle, and with the default now ON that would sink every baked-only
          # catalog. Matches the notice in "Validate module selector" above.
          if [ "$INPUT_DEFER_FIGMA_SVG" = "true" ] && [ "$INPUT_PUBLISH_LIVE_BUNDLE" = "true" ]; then
            live+=(--defer-figma-svg)
          fi
          if [ "$INPUT_EXTRA_SPLIT_MODE" = "full" ]; then
            # The driver checks --extra-renders / --publish-live-bundle itself; the split flag is
            # only knowable here. Without it the extra module's stickers would carry previewIds
            # pointing at per-preview bundles nobody wrote, so every one of them would 404 its
            # live render — worse than the baked-only lane this replaces.
            if [ "$INPUT_SPLIT_PER_PREVIEW" != "true" ]; then
              echo "::error title=extra-split-mode::'full' requires split-per-preview: true — the extra module's live lane IS the per-preview split."
              exit 1
            fi
            live+=(--extra-live-bundle)
          fi
          node compose-ai-tools/scripts/design-artifacts/generate-design-catalog.mjs \
            --spec "$INPUT_SPEC" \
            --renders "$GITHUB_WORKSPACE/bundle.png" \
            "${extra[@]}" \
            "${additional[@]}" \
            "${fallback[@]}" \
            --out "$GITHUB_WORKSPACE/out" \
            --renderer "$(compose-preview --version | head -1)" \
            --build-root "$INPUT_WORKING_DIRECTORY" \
            "${source_args[@]}" \
            "${live[@]}" \
            "${incomplete[@]}"

      # Split the render into one addressable bundle per preview for the serve
      # host's per-preview live lane.
      #   full      → split the externalised liveBundle the generate step wrote
      #               under out/bundle/ (fonts lifted to bundle/res/), so each
      #               per-preview bundle inherits the slimmed classpath + shared
      #               font pool and serve can re-render it. Needs publish-live-bundle.
      #   view-only → split the raw render (no live bundle), dropping the classpath
      #               but keeping the baked image + sidecars — for an Android/baked tier.
      # The extra module (if any) follows `extra-split-mode`, defaulting to --view-only.
      # Under `full` it is split from the RAW render, not from an externalised copy:
      # serve rehydrates exactly one externalResources manifest (the primary liveBundle's)
      # and shares that single materialized dir with every pooled per-preview daemon, so a
      # supplement resource the primary doesn't also declare would be published to
      # bundle/res/ and never materialized. Self-contained per-preview bundles cost
      # duplication and owe nothing to the shared pool.
      - name: Split into per-preview bundles
        if: ${{ inputs.split-per-preview }}
        env:
          # Let the split use the runner's real memory instead of the JVM's default quarter-of-RAM.
          # A FULL split writes one bundle per preview and each carries the shared re-render payload
          # (classes/app.jar, libs/, the Android resources.ap_ table), so the working set scales with
          # catalog size: `pocketcasts` (181 previews) OOM'd here on the default heap. The CLI no
          # longer holds every bundle at once, but the source bundle alone is hundreds of MB for a
          # large catalog, and a percentage scales with whatever runner this lands on rather than
          # hardcoding a size that is wrong on half of them.
          JAVA_OPTS: -XX:MaxRAMPercentage=75
        run: |
          set -euo pipefail
          # The carriage report is what the next step gates on. It is written for every mode (a
          # view-only split reports zero), so the gate reads one shape and the number is on the log
          # of a green run either way.
          carriage_report="$GITHUB_WORKSPACE/split-carriage.json"
          if [ "$INPUT_SPLIT_MODE" = "view-only" ]; then
            compose-preview bundle split "$GITHUB_WORKSPACE/bundle.png" --view-only \
              --carriage-report "$carriage_report" \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
          elif [ "$INPUT_SPLIT_MODE" = "full-shared-classpath" ]; then
            compose-preview bundle split "$GITHUB_WORKSPACE/bundle.png" \
              --shared-classpath-out "$GITHUB_WORKSPACE/out/bundle/res" \
              --carriage-report "$carriage_report" \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
          else
            # `auto` and `full` split identically; they differ only in whether the carriage bound
            # below is a failure or a recorded, deliberate cost.
            compose-preview bundle split "$GITHUB_WORKSPACE/out/bundle/bundle.png" \
              --carriage-report "$carriage_report" \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
          fi
          # Exactly which bundles the carriage report describes — recorded HERE, before the
          # additional-module and extra-module splits below, because the extra split writes into
          # this same directory. The report covers the primary split only, so a later re-measure
          # that just scans the directory would divide the primary `repeatedBytes` by a
          # primary-plus-extra denominator and understate the share — the same understatement the
          # re-measure exists to correct.
          find "$GITHUB_WORKSPACE/out/bundle/previews" -maxdepth 1 -type f -name '*.png' | sort \
            > "$GITHUB_WORKSPACE/split-primary-bundles.txt"
          if [ -d "$GITHUB_WORKSPACE/module-bundles" ]; then
            while IFS= read -r additional_bundle; do
              module_key="$(basename "$additional_bundle" .png)"
              module_previews="$GITHUB_WORKSPACE/out/bundle/modules/$module_key/previews"
              if [ "$INPUT_SPLIT_MODE" = "view-only" ]; then
                compose-preview bundle split "$additional_bundle" --view-only \
                  -o "$module_previews"
              else
                # Each module owns its classpath/resource closure. Additional-module splits remain
                # self-contained instead of borrowing the primary module's external resource pool.
                compose-preview bundle split "$additional_bundle" \
                  -o "$module_previews"
              fi
            done < <(find "$GITHUB_WORKSPACE/module-bundles" -type f -name 'module_*.png' | sort)
          fi
          if [ -n "$INPUT_EXTRA_MODULE" ] && [ -f "$GITHUB_WORKSPACE/extra-bundle.png" ]; then
            if [ "$INPUT_EXTRA_SPLIT_MODE" = "full" ]; then
              compose-preview bundle split "$GITHUB_WORKSPACE/extra-bundle.png" \
                -o "$GITHUB_WORKSPACE/out/bundle/previews"
            else
              compose-preview bundle split "$GITHUB_WORKSPACE/extra-bundle.png" --view-only \
                -o "$GITHUB_WORKSPACE/out/bundle/previews"
            fi
          fi

      # The split needs the transient SVG to crop each per-preview cover to the component bounds.
      # Strip only AFTER it has consumed those bytes; the executable daemon regenerates the same
      # data product on request, so neither the monolith nor its addressable children need to carry
      # thousands of capture-time copies.
      - name: Defer editable Figma SVGs to the live daemon
        if: ${{ inputs.defer-figma-svg && inputs.publish-live-bundle }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/strip-published-figma-svg.mjs \
            --root "$GITHUB_WORKSPACE/out/bundle"

      # The split wrote the carriage report BEFORE the strip above, because it needs the transient
      # SVGs to crop each cover — so its `totalBytes` still counts thousands of sidecar copies that
      # are no longer in the published bundles. Those bytes sit in the DENOMINATOR of `sharePercent`,
      # so leaving them there understates the share and can hold a catalog under the bound whose
      # published output is almost entirely repeated classpath. Re-measure against what was actually
      # published, before the gate reads it.
      - name: Re-measure the carriage against the published bundles
        if: ${{ inputs.split-per-preview && inputs.defer-figma-svg && inputs.publish-live-bundle }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/recompute-carriage-report.mjs \
            --report "$GITHUB_WORKSPACE/split-carriage.json" \
            --bundles-from "$GITHUB_WORKSPACE/split-primary-bundles.txt"

      # The silent half of #4211. A FULL split pays the shared carriage once per preview, so its
      # cost scales with the preview COUNT — and because any catalog edit rewrites `app.jar`, every
      # publish rewrites all N copies and lays down a fresh delta chain. The delivery branch grows
      # by the repeated size forever, while the branch tip (which git deltas near-identical
      # polyglots well within one snapshot) keeps looking fine. m3-catalog took the default for 76
      # green publishes and reached a 2.52 GiB clone.
      #
      # `auto` splits exactly as `full` always did, so no existing delivery branch changes shape
      # underneath its consumers — pooled bundles are not offline-executable from a bare download,
      # and trading that away is the catalog owner's call, not a threshold's. What the bound buys is
      # that above it the call has to be *made*: the publish fails with the measured numbers until
      # someone writes `full` or `full-shared-classpath` into the inputs. An explicit mode is never
      # failed, only reported.
      #
      # Measured on the PRIMARY split, which is the one that scales: the additional/extra-module
      # splits are self-contained by design (they owe nothing to the primary's resource pool) and
      # carry a fraction of the previews.
      - name: Check the split carriage bound
        if: ${{ inputs.split-per-preview }}
        env:
          SYSTEM: ${{ inputs.system }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/split-carriage-gate.mjs \
            --report "$GITHUB_WORKSPACE/split-carriage.json" \
            --mode "$INPUT_SPLIT_MODE" \
            --system "$SYSTEM"

      - name: Download section bundle to fold in
        if: ${{ inputs.fold-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.fold-artifact }}
          path: ${{ github.workspace }}/fold-in

      # Build a catalog from the caller-produced bundle and fold it into out/ as
      # its own top-level section (e.g. a re-themed sibling system as a tab).
      - name: Fold in extra section
        if: ${{ inputs.fold-artifact != '' }}
        env:
          FOLD_BUNDLE: ${{ inputs.fold-bundle }}
          FOLD_SPEC: ${{ inputs.fold-spec }}
          FOLD_SECTION: ${{ inputs.fold-section }}
        run: |
          set -euo pipefail
          incomplete=()
          if [ "$INPUT_ALLOW_INCOMPLETE" = "true" ]; then incomplete=(--allow-incomplete); fi
          node compose-ai-tools/scripts/design-artifacts/generate-design-catalog.mjs \
            --spec "$FOLD_SPEC" \
            --renders "$GITHUB_WORKSPACE/fold-in/$FOLD_BUNDLE" \
            --out "$GITHUB_WORKSPACE/out-fold" \
            "${incomplete[@]}"
          node compose-ai-tools/scripts/design-artifacts/merge-catalog-section.mjs \
            --into "$GITHUB_WORKSPACE/out" \
            --from "$GITHUB_WORKSPACE/out-fold" \
            --section "$FOLD_SECTION"

      # PNG ↔ Design reference: publish `references/index.json` + one normalised
      # PNG per reference, which is what turns on the serve host's **PNG ↔ Design
      # reference** lane and the Reference / Diff / Actual page behind it. The
      # server has read that manifest since ServeDesignReferences.kt landed, but
      # nothing wrote one — so `data-has-reference` was `0` on every published
      # catalog and the lane never rendered. This is the producer.
      #
      # Runs from the CALLING repo's checkout because that is where the inputs
      # live (`design-map.json` and any committed HTML mocks); a repo with no
      # design-map is a clean no-op, so every catalog can run it unconditionally.
      # Placed after the fold-in so `catalog.json` is final — the references are
      # keyed to the stickers it publishes — and before the upload/publish steps
      # so both the artifact and the delivery branch carry them.
      #
      # Fail-soft on purpose: an unrenderable reference is dropped with a warning
      # rather than costing the catalog its render.

      # ONE MAP PATH, TWO SYSTEMS. Everything below reads `design-map.json` from the caller repo
      # root, because that is the contract design-parity's action fixes (`<repoRoot>/design-map.json`)
      # and this lane follows it. That is right for one catalog per repo and wrong the moment there
      # are two: `wear-m3-catalog` publishes `wear-m3-catalog` from `:catalog` and `remote-m3` from
      # `:remote-catalog` out of one checkout, so the second system was scored against the first
      # one's map. It published `coverage.percent: 0` with all 50 gaps `dangling-mapping`, every one
      # naming a preview from the OTHER module — not a catalog that maps nothing, a catalog compared
      # against the wrong thing.
      #
      # The caller cannot fix that alone, which is the whole reason this input exists: the path is
      # deliberately not a parameter, and the escape it leaves is that each job regenerates the map
      # in its own workspace. design-parity's reusable workflow has taken `design-map-command` for
      # exactly this since the same repo started publishing two sheets — so its hourly comparison
      # was right while these artifacts were wrong, same repo, same commit.
      #
      # Placed here rather than beside the render: it must precede every consumer (design
      # references, parity activity, parity findings) and nothing before this point reads the map,
      # so a caller whose command needs a Gradle discovery pays for it only on a publishing run.
      #
      # The command is EXECUTED, by design — it is a build step the caller owns, like
      # `design-map-command` next door. It reaches the shell through the environment rather than
      # expression interpolation, so the value cannot alter the surrounding script's syntax, and it
      # runs at the caller repo root because that is where the map it writes is read from (`spec`
      # stays repo-root-relative for the same reason, even under `working-directory`).
      - name: Project this system's design map
        if: ${{ inputs.design-map-command != '' && (inputs.publish || inputs.upload-out) }}
        env:
          DESIGN_MAP_COMMAND: ${{ inputs.design-map-command }}
        run: |
          set -euo pipefail
          echo "Projecting design-map.json for '$INPUT_SYSTEM'."
          # DELETE FIRST, so the check below proves the command RECREATED the map rather than that
          # a map exists. In the two-catalog repo this input is for, the committed one at this path
          # belongs to the OTHER system — so a command that succeeds but writes somewhere else (the
          # `--out-dir` mistake, which `scripts/design-map.sh` makes easy) would leave it standing,
          # pass a mere existence check, and publish the other system's mappings under this one's
          # name. That is the exact failure this step exists to stop, and it would sail through.
          # Safe because the checkout is disposable: nothing later in the job wants the committed
          # map back, and a command that writes none fails the step anyway.
          rm -f design-map.json
          bash -c "$DESIGN_MAP_COMMAND"
          if [ ! -f design-map.json ]; then
            echo "::error title=design-map-command wrote no map::The command ran but left no design-map.json at the repo root, which is the only path the lanes below read. Check that it projects to the root rather than to an --out-dir."
            exit 1
          fi
          # Worth printing: the number is what the coverage panel will publish, and a map that is
          # suddenly a tenth of its usual size is the failure this input exists to prevent, caught
          # here rather than inferred from a 0% board a day later.
          node -e '
            const m = require("./design-map.json");
            const n = (m.components ?? []).length;
            console.log(`design-map.json: ${n} component(s) for ${process.argv[1]}`);
            if (n === 0) {
              console.log("::warning title=Empty design map::The projected map has no components, so this system will publish 0% coverage.");
            }
          ' "$INPUT_SYSTEM"

      # The design-parity reference cache, if the caller maintains one. Cloned
      # rather than fetched through the API for the same reason the parity
      # workflow does it: the branch IS the cache, so `git` is the transport and
      # no Figma credential is involved.
      #
      # Best-effort by design. A branch that does not exist (never bootstrapped,
      # or pruned) leaves the dir unset and the lane fetches structure live, as
      # it always has. That is the opposite of the parity run, where the cache is
      # authoritative and a miss is a reported gap — here it is only ever a
      # question of how many requests this run makes.
      - name: Fetch the design reference cache
        id: refcache
        if: ${{ (inputs.publish || inputs.upload-out) && inputs.reference-cache-branch != '' }}
        env:
          BRANCH: ${{ inputs.reference-cache-branch }}
          CACHE_DIR: ${{ runner.temp }}/design-reference-cache
        run: |
          set -euo pipefail
          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch "$BRANCH" "$repo" "$CACHE_DIR" 2>/dev/null; then
            rm -rf "$CACHE_DIR/.git"
            echo "dir=${CACHE_DIR}" >> "$GITHUB_OUTPUT"
            echo "Reference cache from ${BRANCH}: $(du -sh "$CACHE_DIR" | cut -f1)."
          else
            echo "::notice title=No reference cache::'${BRANCH}' does not exist yet, so node structure will be fetched live. Run the design-parity import workflow to build it."
          fi

      # Never in import mode. `upload-out` is exactly how an import runs, so this would
      # otherwise fire in the SAME job and workspace as the imported project's Gradle build,
      # holding a Figma token or a contents-write token. That build can rewrite the driver
      # scripts these steps invoke, or leave state behind for them, so keeping it out of
      # credentialed steps is the same boundary the publish refusal draws — publish was just
      # the loudest of them. Nothing is lost: an imported third-party project has no Figma
      # design map and no design-parity branch, so these lanes had nothing to say about it.
      - name: Publish design references
        if: ${{ (inputs.publish || inputs.upload-out) && inputs.upstream-repository == '' }}
        env:
          # Only needed for `figma:` entries in a design-map — the adapter-free
          # REST render this driver does itself. Absent (forks, PR runs, catalogs
          # with no Figma references) those entries are skipped with a warning and
          # the rest of the manifest still publishes.
          FIGMA_TOKEN: ${{ secrets.figma_token }}
          FIGMA_CONTENTS_ONLY: ${{ inputs.figma-contents-only }}
          REFERENCE_BACKDROP: ${{ inputs.reference-backdrop }}
          REFERENCE_CACHE: ${{ steps.refcache.outputs.dir }}
        run: |
          set -euo pipefail
          if [ ! -f "design-map.json" ]; then
            echo "No design-map.json in this repo — no design references to publish."
            exit 0
          fi
          # Chromium rasterises committed HTML mocks AND scores every published reference against
          # its sticker — the driver drives the viewer's own `format-compare.js` in a headless page
          # rather than reimplementing it, so the baked verdict on the design-spec chip and the
          # number the lane computes live cannot disagree. That is why this is no longer gated on
          # the design-map containing `.html`: a Figma-only catalog needs the browser too.
          # Idempotent: a no-op when the Remote Compose lane below already installed it in this job.
          install_log="$RUNNER_TEMP/playwright-install-references.log"
          if ! (cd compose-ai-tools/scripts/design-artifacts &&
                npx playwright install --with-deps chromium) >"$install_log" 2>&1; then
            echo "::warning title=Chromium install failed::HTML design references will be skipped and references will publish without a match score."
            tail -n 40 "$install_log" >&2
          fi
          # An unknown flag is INERT here, not an error: the emitter reads argv by name, so a driver
          # older than a flag ignores it and the run goes green having done exactly nothing the
          # caller asked for. That matters more than usual for `reference-backdrop`, because an
          # EXTERNAL caller does not execute this repo's `main` — it executes the release-pinned
          # driver in design-artifacts-driver-pin.txt, so a freshly merged flag reaches it only
          # after the next release moves the pin. wear-m3-catalog#43 hit exactly that: the input was
          # set, the step was green, and the references published unchanged.
          #
          # So say so, out loud, rather than leaving it to be inferred from a missing log line.
          # A warning and not a failure: the references published are byte-for-byte what this
          # catalog would have published with no input at all — stale against the caller's intent,
          # never wrong — and a reference lane must not cost a catalog its render.
          emitter=compose-ai-tools/scripts/design-artifacts/emit-design-references.mjs
          # Same shape, same reason: an EXTERNAL caller runs the release-pinned
          # driver, so a freshly merged flag reaches it only when the next
          # release moves design-artifacts-driver-pin.txt. Silence here would
          # look exactly like a cache that is working.
          if [ -n "${REFERENCE_CACHE:-}" ] && ! grep -q 'reference-cache' "$emitter"; then
            echo "::warning title=Driver too old for reference-cache::This run's export driver \
          predates the --reference-cache flag, so the cache was ignored and node structure was \
          fetched live. References published are unchanged — this costs requests, not coverage. \
          External callers run the driver pinned in \
          compose-ai-tools/.github/design-artifacts-driver-pin.txt; it reaches them when the next \
          release moves that pin."
          fi
          if [ -n "$REFERENCE_BACKDROP" ] && ! grep -q 'reference-backdrop' "$emitter"; then
            echo "::warning title=Driver too old for reference-backdrop::This run's export driver \
          predates the --reference-backdrop flag, so '$REFERENCE_BACKDROP' was ignored and the \
          references published exactly as they would have with no backdrop. External callers run \
          the driver pinned in compose-ai-tools/.github/design-artifacts-driver-pin.txt; it reaches \
          them when the next release moves that pin."
          fi
          # `--spec` must be the caller's configured path, not the emitter's root default:
          # this repo's own catalogs live at samples/design-catalog-*/catalog.spec.json.
          node "$emitter" \
            --out "$GITHUB_WORKSPACE/out" \
            --repo "$GITHUB_WORKSPACE" \
            --spec "$INPUT_SPEC" \
            --figma-contents-only "$FIGMA_CONTENTS_ONLY" \
            --reference-backdrop "$REFERENCE_BACKDROP" \
            --reference-cache "${REFERENCE_CACHE:-}"

      # The design-parity dashboard's feed (`parity/activity.json`) — recent
      # commits, recent Figma versions/comments, and the mapping gaps behind
      # the server's `/<system>/parity` view.
      #
      # It has to be produced HERE rather than by the server for two reasons the
      # server cannot work around: `serve` has no checkout to `git log`, and it
      # holds no Figma credential and never talks to Figma at all (see
      # `docs/public-preview-server.md`). This job has both — the same
      # `figma_token` the reference rasteriser above uses, and two extra
      # read-only GETs (`/versions`, `/comments`).
      #
      # Runs after the reference step so the catalog is final, and fail-soft
      # like it: a shallow checkout or a missing token drops that lane with a
      # warning rather than costing the catalog its publish. A repo with no
      # git history, no design-map and no token writes nothing at all, so this
      # is safe to run for every catalog unconditionally.
      # Never in import mode. `upload-out` is exactly how an import runs, so this would
      # otherwise fire in the SAME job and workspace as the imported project's Gradle build,
      # holding a Figma token or a contents-write token. That build can rewrite the driver
      # scripts these steps invoke, or leave state behind for them, so keeping it out of
      # credentialed steps is the same boundary the publish refusal draws — publish was just
      # the loudest of them. Nothing is lost: an imported third-party project has no Figma
      # design map and no design-parity branch, so these lanes had nothing to say about it.
      - name: Publish design-parity activity
        if: ${{ (inputs.publish || inputs.upload-out) && inputs.upstream-repository == '' }}
        env:
          FIGMA_TOKEN: ${{ secrets.figma_token }}
        run: |
          set -euo pipefail
          # `actions/checkout` clones at depth 1, which has no history to log. Deepen just far
          # enough for the window rather than switching the catalog checkout to `fetch-depth: 0`
          # — a full clone on every catalog render, to read one month of commits. Best-effort:
          # a private caller repo checked out with `persist-credentials: false` may not be able
          # to fetch, and the emitter then warns and publishes the other lanes.
          if [ -f .git/shallow ]; then
            git fetch --shallow-since="35 days ago" origin HEAD 2>/dev/null || \
              echo "::notice::could not deepen the checkout; the code lane may be empty"
          fi
          node compose-ai-tools/scripts/design-artifacts/emit-parity-activity.mjs \
            --out "$GITHUB_WORKSPACE/out" \
            --repo "$GITHUB_WORKSPACE" \
            --source-repo "$SOURCE_REPOSITORY" \
            --ref "$SOURCE_REF_NAME"

      # The verdict behind the server's Design parity panel (`parity/findings.json`) — the a11y,
      # i18n, token and layout findings a design-parity run concluded about each comparison, with
      # each one anchored to the region it is about.
      #
      # Like the activity feed above, this has to happen HERE. The run publishes its findings to
      # its own `design-parity/<system>` branch keyed by the ids a RUN knows — the compose preview
      # id and the design-map code handle — and the compare page routes on neither. It routes on
      # the catalog's sticker id, which is minted by the reference step a few lines up. This is the
      # one job holding both halves.
      #
      # Runs after the reference step for exactly that reason: the same `planDesignReferences`
      # records that mint `references/index.json` are what scope a verdict to the board its page
      # shows. Fail-soft like its neighbours — no parity branch, no design map, or a component with
      # no published reference each drop with a warning rather than costing the catalog its render,
      # so this is safe to run for every catalog unconditionally.
      # Never in import mode. `upload-out` is exactly how an import runs, so this would
      # otherwise fire in the SAME job and workspace as the imported project's Gradle build,
      # holding a Figma token or a contents-write token. That build can rewrite the driver
      # scripts these steps invoke, or leave state behind for them, so keeping it out of
      # credentialed steps is the same boundary the publish refusal draws — publish was just
      # the loudest of them. Nothing is lost: an imported third-party project has no Figma
      # design map and no design-parity branch, so these lanes had nothing to say about it.
      - name: Publish design-parity findings
        if: ${{ (inputs.publish || inputs.upload-out) && inputs.upstream-repository == '' }}
        env:
          # The emitter fetches the sibling `design-parity/<system>` branch. The calling repo is
          # checked out with `persist-credentials: false`, so its `origin` carries no credential
          # and that fetch fails outright on a PRIVATE caller — on a publishing run too, because
          # holding a token in the job is not the same as git having one. Hand it over explicitly,
          # under the name `push-branch.sh` already uses for the same job.
          GITHUB_TOKEN_INLINE: ${{ github.token }}
        run: |
          set -euo pipefail
          # The emitter comes from the export-driver checkout, which for an external caller is the
          # immutable release commit in .github/design-artifacts-driver-pin.txt — a revision that
          # predates any file this workflow adds. Invoking it unconditionally would abort every
          # external run with MODULE_NOT_FOUND the moment this lands, and go on doing it until the
          # next release moves the pin. Same hazard push-history.sh guards against below, and the
          # same answer: a catalog that cannot publish a verdict panel this run is not a failed
          # render. compose-ai-tools' own runs execute the commit the run is on and never see this.
          emitter=compose-ai-tools/scripts/design-artifacts/emit-parity-findings.mjs
          if [ ! -f "$emitter" ]; then
            echo "::notice::parity findings: the pinned export driver has no emit-parity-findings.mjs; skipping the verdict panel. It publishes once the driver pin advances."
            exit 0
          fi
          node "$emitter" \
            --out "$GITHUB_WORKSPACE/out" \
            --repo "$GITHUB_WORKSPACE" \
            --spec "$INPUT_SPEC" \
            --source-repo "$SOURCE_REPOSITORY"

      # Design pages: whole specimen sheets of the design file, cached as SVG, with the node id of
      # every component on them linked back to the catalog component that implements it. Feeds the
      # preview server's `/<system>/pages/` surface (`ServeDesignPages.kt`).
      #
      # NO NETWORK, and that is the design. The import is the calling repo's own job — it runs on
      # the design file's cadence rather than the catalog's, and commits `design/pages/` — so this
      # step only re-keys and copies what is already in the checkout. A fork, a token-less run and
      # an offline republish therefore all produce the same pages as a credentialled one.
      #
      # A repo that has never heard of the feature has no `design/pages/`, and the emitter is a
      # no-op for it. Fail-soft like the reference lane: a page whose export can't be copied is
      # dropped with a warning rather than costing the catalog its render.

      # The calling repo's checked-out HEAD, NOT $GITHUB_SHA: a caller that passes `ref` checks out
      # that ref while $GITHUB_SHA still names the triggering event's commit, and recording the
      # latter would make the publish's traceability actively misleading. Same reasoning the publish
      # step carried when it computed this itself.
      - name: Record the rendered source revision
        id: source-sha
        run: echo "sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      # Reads the emitter's environment export and re-publishes it as a step output, because the
      # step that consumes it now lives in another job. Deliberately unconditional: when the emitter
      # did not run (import mode, or no parity lane) the variable is unset and this yields the empty
      # string, which is exactly the "branch was readable / nothing to carry" case.
      - name: Carry the parity-findings readability across the job boundary
        id: parity-findings-readability
        run: echo "unreadable=${PARITY_FINDINGS_UNREADABLE:-}" >> "$GITHUB_OUTPUT"

      - name: Publish design pages
        if: ${{ inputs.publish || inputs.upload-out }}
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/emit-design-pages.mjs \
            --out "$GITHUB_WORKSPACE/out" \
            --repo "$GITHUB_WORKSPACE" \
            --spec "$INPUT_SPEC"

      # PNG ↔ Remote Compose parity page: for a catalog that ships `.rc`
      # documents (remote-m3), render each one client-side with the vendored
      # TypeScript player (headless Chromium) and pixel-diff it against the baked
      # PNG — the browser-render-lane counterpart of the PNG↔figma-svg compare.
      # A no-op (and no Chromium download) for catalogs without `ir/*.rc`.
      - name: PNG vs Remote Compose parity page
        id: rc-compare
        if: ${{ inputs.publish || inputs.upload-out }}
        continue-on-error: ${{ inputs.rc-cmp-wasm-lane }}
        working-directory: compose-ai-tools/scripts/design-artifacts
        env:
          RC_CMP_WASM_ALLOWLIST: ${{ inputs.rc-cmp-wasm-allowlist }}
        run: |
          set -euo pipefail
          if ! python3 - "$GITHUB_WORKSPACE/bundle.png" <<'PY'
          import sys, zipfile
          try:
              names = zipfile.ZipFile(sys.argv[1]).namelist()
              has = any(n.startswith("ir/") and n.endswith(".rc") for n in names)
          except Exception:
              has = False
          sys.exit(0 if has else 1)
          PY
          then
            echo "No ir/*.rc documents in the bundle — skipping the Remote Compose parity page."
            exit 0
          fi
          install_log="$RUNNER_TEMP/playwright-install.log"
          echo "Installing Chromium and system dependencies…"
          if ! npx playwright install --with-deps chromium >"$install_log" 2>&1; then
            echo "::error title=Chromium install failed::Playwright could not install Chromium. The final 80 log lines follow." >&2
            tail -n 80 "$install_log" >&2
            exit 1
          fi
          echo "✓ Chromium ready."

          # The vendored TypeScript player, and below the CMP/Wasm one, are published by
          # yschimke/rc-players now. Both are staged out of their published zips by the root build
          # rather than read from a path in this checkout.
          (cd "$GITHUB_WORKSPACE/compose-ai-tools" && ./gradlew stageVendoredRcPlayerJs --quiet)
          PLAYER="$GITHUB_WORKSPACE/compose-ai-tools/build/vendored-rc-player-js/bundle.js"
          EMBEDDED_ARGS=()

          # The shared machine-local Google Fonts cache, laid out exactly as `composeAiFontsCacheDir`
          # in the Gradle plugin computes it — the catalog's own render, earlier in this job, has
          # already warmed it. Both embedded lanes need it to resolve a document's `google:` family:
          # neither has a font provider (no GMS on a runner, no CSS API off the browser), so without
          # it every branded face renders in the platform default and the row shows two lanes in
          # Roboto next to three showing Orbitron (compose-ai-tools#4170). Not offline: a cold cache
          # then fetches, the same way the browser lane fetches the same families from the CSS API.
          FONTS_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/composeai/fonts"

          if [ "$INPUT_RC_CMP_WASM_LANE" = "true" ]; then
            mkdir -p "$GITHUB_WORKSPACE/out/rc-cmp-wasm-errors"
            wasm_build_log="$GITHUB_WORKSPACE/out/rc-cmp-wasm-errors/distribution-build.log"
            if (cd "$GITHUB_WORKSPACE/compose-ai-tools" && \
                ./gradlew stageVendoredRcPlayerWasm --no-daemon --quiet) >"$wasm_build_log" 2>&1; then
              EMBEDDED_ARGS+=(
                --cmp-wasm "$GITHUB_WORKSPACE/compose-ai-tools/build/vendored-rc-player-wasm"
                --require-cmp-wasm
                --cmp-wasm-max-cold-first-frame-ms "$INPUT_RC_CMP_WASM_COLD_MS"
                --cmp-wasm-max-warm-first-frame-ms "$INPUT_RC_CMP_WASM_WARM_MS"
              )
              if [ -n "$RC_CMP_WASM_ALLOWLIST" ]; then
                EMBEDDED_ARGS+=(--cmp-wasm-allowlist "$GITHUB_WORKSPACE/$RC_CMP_WASM_ALLOWLIST")
              fi
            else
              echo "::error title=CMP/Wasm distribution failed::The published player distribution could not be staged; see the uploaded distribution-build.log." >&2
              tail -n 80 "$wasm_build_log" >&2
              {
                echo '### Remote Compose CMP/Wasm'
                echo
                echo '❌ Player distribution failed to build. See `distribution-build.log` in the evidence artifact.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          # Optional embedded-player lanes. Both render the SAME staged ir/*.rc: the Robolectric
          # lane (rc-embedded-lane) through AndroidX's Compose-embedded RcPlayer, and the cmp-jvm
          # lane (rc-embedded-jvm-lane) through Compose Desktop / Skiko. Staging is shared: it runs
          # once if EITHER lane is on, then each lane's Gradle harness reads $RC_IN and writes its
          # own PNG dir, which the final driver invocation diffs into extra columns. Staging exits
          # before Chromium is touched, so the extra driver invocation is cheap.
          #
          # Deliberately tolerant: the render this job exists to publish must not be lost because a
          # harness died or the runner lacks a toolchain. Either lane logs loudly and falls through
          # to a page without its column — the lanes are enrichment, not the product.

          # Where the harnesses live, bound once for the three invocations below.
          RC_PLAYERS="$GITHUB_WORKSPACE/rc-players"

          if [ "$INPUT_RC_EMBEDDED_LANE" = "true" ] || [ "$INPUT_RC_EMBEDDED_JVM_LANE" = "true" ]; then
            if [ ! -x "$RC_PLAYERS/gradlew" ]; then
              # The checkout is guarded on the same two inputs as this block, so this is only
              # reachable if that step failed or was skipped. Loud, and still fail-soft: the lanes
              # below drop their columns rather than losing the publish this job exists for.
              echo "::warning::no rc-players checkout at $RC_PLAYERS; both embedded player lanes will be skipped"
            fi
            RC_IN="$RUNNER_TEMP/rc-embedded-in"
            rm -rf "$RC_IN"
            node rc-compare.mjs \
              --bundle "$GITHUB_WORKSPACE/bundle.png" \
              --player "$PLAYER" \
              --out "$GITHUB_WORKSPACE/out" \
              --stage-embedded "$RC_IN"
          fi

          # Robolectric (Android) embedded lanes. The first is the vendored/local-patch artifact;
          # the second imports AndroidX's implementation from the released remote-player-compose.
          # Separate Gradle invocations make the lanes fail-soft independently.
          #
          # `$RC_PLAYERS`, not this checkout: both harnesses are test tasks in yschimke/rc-players,
          # checked out and pinned by the steps of that name above. They were pointed at
          # `compose-ai-tools` until #4998 — long after the modules left it — which is why a caller
          # that switched these lanes on got a warning and no column instead of the players.
          if [ "$INPUT_RC_EMBEDDED_LANE" = "true" ]; then
            RC_OUT="$RUNNER_TEMP/rc-embedded-out"
            rm -rf "$RC_OUT"
            # `--rerun` because the harness's real output is the PNGs it writes to `RC_OUT`, and
            # Gradle cannot see them: they are addressed by a system property, not declared as task
            # outputs. On a persistent runner the second identical invocation is UP-TO-DATE, so the
            # task "succeeds" having written nothing. Verified: a third identical run reports
            # `testDebugUnitTest UP-TO-DATE` and leaves RC_OUT empty. Ephemeral GitHub runners never
            # hit it, but `runs-on` is an input, so self-hosted callers would.
            if (cd "$RC_PLAYERS" && \
                ./gradlew :third-party-rc-embedded-player:testDebugUnitTest --no-daemon --rerun --quiet \
                  --tests ee.schimke.composeai.rcembedded.RcEmbeddedRenderHarness \
                  -Prc.embedded.input="$RC_IN" -Prc.embedded.output="$RC_OUT" \
                  -Pcomposeai.fonts.cacheDir="$FONTS_CACHE") \
               && [ -n "$(find "$RC_OUT" -maxdepth 1 -name '*.png' -print -quit 2>/dev/null)" ]; then
              EMBEDDED_ARGS+=(--embedded "$RC_OUT")
            else
              # Belt and braces: the PNG check above is what actually decides, so any cause of an
              # empty RC_OUT — a skipped task, a harness that died before writing, a wiped temp dir
              # — falls back to a page without the column instead of publishing empty cells.
              echo "::warning::vendored embedded-player lane produced no renders; publishing rc-compare without its column"
            fi

            RC_ANDROIDX_OUT="$RUNNER_TEMP/rc-androidx-embedded-out"
            rm -rf "$RC_ANDROIDX_OUT"
            if (cd "$RC_PLAYERS" && \
                ./gradlew :third-party-rc-embedded-player:testDebugUnitTest --no-daemon --rerun --quiet \
                  --tests ee.schimke.composeai.rcembedded.RcAndroidxEmbeddedRenderHarness \
                  -Prc.androidx.embedded.input="$RC_IN" \
                  -Prc.androidx.embedded.output="$RC_ANDROIDX_OUT" \
                  -Pcomposeai.fonts.cacheDir="$FONTS_CACHE") \
               && [ -n "$(find "$RC_ANDROIDX_OUT" -maxdepth 1 -name '*.png' -print -quit 2>/dev/null)" ]; then
              EMBEDDED_ARGS+=(--androidx-embedded "$RC_ANDROIDX_OUT")
            else
              echo "::warning::upstream embedded-player lane produced no renders; publishing rc-compare without its column"
            fi
          fi

          # cmp-jvm (Compose Desktop / Skiko) embedded lane. Same three moves, same rc-players
          # checkout, different harness: the jvm player links libGL and draws offscreen, so its
          # Gradle test runs under xvfb-run.
          # The deps are installed here rather than by the desktop-render step above: that step runs
          # long before the bundle exists, so with this lane defaulting to true it would charge an
          # apt round-trip to every caller, including the ones whose bundles carry no ir/*.rc and
          # exit this step at its first check. Guarded on xvfb-run, so a desktop-render caller --
          # which already installed the same stack -- doesn't pay for it twice.
          if [ "$INPUT_RC_EMBEDDED_JVM_LANE" = "true" ]; then
            # Fail-soft, and it has to be spelled this way. The step runs under `set -e` and is only
            # `continue-on-error` in the cmp-wasm configuration, so a bare `apt-get` here would take
            # the whole step down — skipping the publish — on a runner where the install can't work:
            # a non-Debian `runs-on` (a caller input), or a transient apt outage. Both are exactly
            # the "runner can't host this lane" case the harness below already degrades on, so they
            # degrade the same way. Wrapped in the `if` condition, where `set -e` does not fire; if
            # xvfb-run is still missing afterwards the Gradle invocation fails and the else branch
            # drops the column, which is the intended end state either way.
            if ! command -v xvfb-run >/dev/null 2>&1 \
               && ! (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends \
                       xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1 fontconfig); then
              echo "::warning::could not install libGL/xvfb; the cmp-jvm lane will degrade to a missing column"
            fi
            RC_JVM_OUT="$RUNNER_TEMP/rc-embedded-jvm-out"
            rm -rf "$RC_JVM_OUT"
            if (cd "$RC_PLAYERS" && \
                xvfb-run -a -s "-screen 0 2000x1400x24" \
                  ./gradlew :third-party-rc-embedded-player-jvm:test --no-daemon --rerun --quiet \
                    -Prc.jvm.input="$RC_IN" -Prc.jvm.output="$RC_JVM_OUT" \
                    -Pcomposeai.fonts.cacheDir="$FONTS_CACHE") \
               && [ -n "$(find "$RC_JVM_OUT" -maxdepth 1 -name '*.png' -print -quit 2>/dev/null)" ]; then
              EMBEDDED_ARGS+=(--embedded-jvm "$RC_JVM_OUT")
            else
              echo "::warning::cmp-jvm player lane produced no renders; publishing rc-compare without the cmp-jvm column"
            fi
          fi

          node rc-compare.mjs \
            --bundle "$GITHUB_WORKSPACE/bundle.png" \
            --player "$PLAYER" \
            --out "$GITHUB_WORKSPACE/out" \
            --system "$INPUT_SYSTEM" \
            --title "$INPUT_SYSTEM" \
            ${EMBEDDED_ARGS[@]+"${EMBEDDED_ARGS[@]}"}

      - name: Upload CMP/Wasm parity evidence
        if: ${{ always() && inputs.rc-cmp-wasm-lane && (inputs.publish || inputs.upload-out) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.system }}-rc-cmp-wasm-evidence
          path: |
            ${{ github.workspace }}/out/rc-compare-summary.json
            ${{ github.workspace }}/out/rc-compare.html
            ${{ github.workspace }}/out/rc-cmp-wasm
            ${{ github.workspace }}/out/rc-cmp-wasm-diff
            ${{ github.workspace }}/out/rc-cmp-wasm-errors
          if-no-files-found: warn

      # `continue-on-error` above exists only so the evidence upload gets a chance to run. Convert
      # the recorded outcome back into a hard gate before either artifact handoff or publication.
      - name: Enforce required CMP/Wasm lane
        if: ${{ always() && inputs.rc-cmp-wasm-lane && (inputs.publish || inputs.upload-out) && steps.rc-compare.outcome == 'failure' }}
        run: |
          echo "::error title=CMP/Wasm parity gate failed::The enabled lane did not build or render every non-allowlisted Remote Compose document."
          exit 1

      - name: Upload catalog bundle
        # Also on a publishing run: this artifact is how the rendered catalog reaches the
        # publish job, which is a different job precisely so the push and the render do not
        # share a token. `upload-out` remains what a caller sets to get it for itself.
        if: ${{ inputs.publish || inputs.upload-out }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.system }}-catalog-out
          path: ${{ github.workspace }}/out
          if-no-files-found: error

  # The only job in this workflow that can write, and the only one that runs NONE of the rendered
  # project's code.
  #
  # It used to be the tail of `generate`, which both renders (running the catalog's own Gradle — and,
  # in import mode, a third-party project's) and pushed the delivery branch, so the render and a
  # contents-write token shared one job and one workspace. A build that can write the workspace could
  # rewrite `push-branch.sh` out from under the step that runs it moments later. Splitting them is
  # what lets `generate` drop to `contents: read`, and it is what makes import mode possible at all:
  # a caller can now hold `contents: read` for the whole render, because nothing it calls asks for
  # more.
  #
  # Everything the moved steps need is reconstructed here rather than inherited: the caller's
  # checkout (they read its HEAD for the commit subject, and write from `out/` beside it), the
  # export-driver checkout (`push-branch.sh`, `push-history.sh`), and the rendered catalog, which
  # arrives as the artifact `generate` uploads.
  publish-catalog:
    name: ${{ inputs.system }} · publish
    needs: [driver, generate]
    # THE SAME GUARD `generate` CARRIES, and for the same reason: this job is downstream of the same
    # skipped ones. `shard-matrix` and `render-shard` are gated on `render-shards > 1`, so on the
    # single-shard path — the default, and what a caller gets unless it opts in — both skip.
    # `generate` overrides that with `!cancelled()` and runs, but the skip propagates down the whole
    # chain: a dependent whose own `if` does not override it is skipped too, even though `generate`
    # succeeded.
    #
    # Without this, the job never ran for any single-shard caller. The render succeeded, the bundle
    # uploaded, and nothing was pushed to `design-artifacts/<system>` — silently, because a skipped
    # job is not a failed one and the run still reports green.
    if: >-
      ${{ inputs.publish && !cancelled() && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out compose-ai-tools (export driver)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DRIVER_PIN_REPO }}
          # The revision the driver job resolved once for this run, exactly as every other job that
          # checks the driver out — so the push helpers cannot come from a different driver than the
          # one that produced the bundle.
          ref: ${{ needs.driver.outputs.ref }}
          path: compose-ai-tools
          persist-credentials: false

      - name: Download the rendered catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.system }}-catalog-out
          path: ${{ github.workspace }}/out

      - name: Publish to design-artifacts/${{ inputs.system }}
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM: ${{ inputs.system }}
          SOURCE_SHA: ${{ needs.generate.outputs.source-sha }}
          PARITY_FINDINGS_UNREADABLE: ${{ needs.generate.outputs.parity-findings-unreadable }}
        run: |
          set -euo pipefail
          # The SHA the bundle was actually rendered from is the calling repo's
          # checked-out HEAD, NOT $GITHUB_SHA: a caller that passes `ref` (the
          # documented way to reach a catalog living off the default branch)
          # checks out that ref, while $GITHUB_SHA still names the triggering
          # event's commit. Recording the latter would make the traceability
          # this subject line adds actively misleading.

          cd "$GITHUB_WORKSPACE/out"
          # Append on top of the existing tip rather than force-pushing an orphan,
          # so the delivery branch keeps a per-regeneration history you can diff.
          # Snapshots dedupe by content, so unchanged renders cost nothing;
          # SKIP_IF_UNCHANGED drops the commit when the tree is byte-identical.
          #
          # CARRY_FORWARD_PATHS lists the files the BRANCH owns and `out/` does
          # not generate. The helper snapshots this directory wholesale, so a
          # branch file missing from it is a file the push deletes. That costs
          # twice over: the deletion makes the tree differ from the parent, so
          # SKIP_IF_UNCHANGED can no longer skip an otherwise-unchanged catalog
          # and every no-op run appends a commit; and whatever re-adds the file
          # afterwards leaves it 404ing for the window in between. `history.json`
          # is here for exactly that reason — the step below publishes it as its
          # own commit, so it is never in `out/`. (`preview-index.json` is the
          # same problem with a different answer: REVISION_PREVIEW_INDEX rolls it
          # forward rather than merely preserving it.)
          #
          # `parity/findings.json` is on that list CONDITIONALLY, which the helper
          # has no way to express, so the condition is computed below instead.
          #
          # It cannot be carried unconditionally: this job generates it a few steps
          # up, and `tree_for_parent` restores a carried path from the parent
          # UNCONDITIONALLY, so a static entry would freeze the panel at its first
          # published value — every later verdict discarded, and a catalog that has
          # since reached parity still serving the failures it fixed.
          #
          # It cannot be dropped unconditionally either, which is the correction to
          # what this comment claimed before. The reasoning was that only a
          # publishing run reaches this step and a publishing run has a token, so
          # the emitter's sibling-branch fetch never fails here. Holding a token in
          # the job is not the same as git having one: the calling repo is checked
          # out with `persist-credentials: false`, so `origin` carries no credential
          # and the fetch fails outright against a PRIVATE caller. The emitter now
          # gets that token explicitly (see its step above), but a fetch can still
          # fail transiently, and every such failure would delete a good verdict.
          #
          # So: carry it only when the emitter reports it could not READ the branch.
          # A branch that WAS read and reports nothing is authoritative — the
          # catalog reached parity, and retiring the stale verdict is the point.
          #
          # Identity goes through git's own GIT_AUTHOR_*/GIT_COMMITTER_* env vars
          # rather than a helper-specific input, because push-branch.sh comes from
          # the `driver-ref` checkout — which a caller may pin to a revision older
          # than any input we add. The git env vars outrank the helper's
          # `git config user.*` in every revision of it, so this workflow's
          # documented `commit-user-*` inputs keep working whatever driver-ref is.

          # Set by the emitter above when it could not READ the parity branch, as opposed to
          # reading one that reports nothing. Empty in the second case — and empty against an
          # emitter too old to set it, which is the behaviour that shipped.
          carry_findings=""
          if [ -n "${PARITY_FINDINGS_UNREADABLE:-}" ]; then
            carry_findings=" parity/findings.json"
            echo "::notice::parity findings: the branch was unreadable this run; keeping the served verdict rather than deleting it."
          fi

          TARGET_BRANCH="design-artifacts/${SYSTEM}" \
          REPO="$GITHUB_REPOSITORY" \
          GITHUB_TOKEN_INLINE="$GH_TOKEN" \
          MSG="chore(design-artifacts): regenerate ${SYSTEM} catalog ($(date -u +%F), ${SOURCE_SHA})" \
          SKIP_IF_UNCHANGED=1 \
          CARRY_FORWARD_PATHS="parity/issues.json history.json${carry_findings}" \
          REVISION_PREVIEW_INDEX=1 \
          GIT_AUTHOR_NAME="$INPUT_COMMIT_USER_NAME" \
          GIT_AUTHOR_EMAIL="$INPUT_COMMIT_USER_EMAIL" \
          GIT_COMMITTER_NAME="$INPUT_COMMIT_USER_NAME" \
          GIT_COMMITTER_EMAIL="$INPUT_COMMIT_USER_EMAIL" \
            bash "$GITHUB_WORKSPACE/compose-ai-tools/.github/actions/apply/lib/push-branch.sh"

      - name: Publish render history to design-artifacts/${{ inputs.system }}
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM: ${{ inputs.system }}
          SOURCE_SHA: ${{ needs.generate.outputs.source-sha }}
          PARITY_FINDINGS_UNREADABLE: ${{ needs.generate.outputs.parity-findings-unreadable }}
        run: |
          set -euo pipefail
          # `history.json` — the per-preview render timeline `<cp-history-menu>` reads. The viewer
          # has fetched it from this branch all along; until now the branch never published one, so
          # the menu 404'd and drew nothing on every design catalog.
          #
          # A SECOND commit, after the catalog push above, and that ordering is load-bearing: the
          # manifest describes the branch's history, so one computed before the publish could not
          # include the publish it ships with and the newest render would be missing from its own
          # timeline. The extractor filters on the `images` pathspec, so this commit is invisible to
          # the next run's history and cannot pollute it.
          #
          # Runs even when the catalog push skipped as unchanged. "No render changed" does not imply
          # "the manifest is current" on a branch that has never had one — that reading is exactly
          # what would keep a first publish waiting forever for a render to move.
          HELPER="$GITHUB_WORKSPACE/compose-ai-tools/.github/actions/apply/lib/push-history.sh"

          # The helper comes from the export-driver checkout, which for an external caller is the
          # immutable release commit in .github/design-artifacts-driver-pin.txt — a revision that
          # predates any file this workflow adds. Invoking it unconditionally would abort every
          # external `publish: true` run with "No such file or directory", and do it AFTER the
          # catalog commit above has already been pushed. Same hazard the identity comment above
          # calls out for push-branch.sh, and the same answer the rest of this lane gives: a
          # delivery branch that cannot refresh its timeline this run is not a failed publish.
          if [ ! -f "$HELPER" ]; then
            echo "::notice::render history: the pinned export driver has no push-history.sh; skipping history.json. It publishes once the driver pin advances."
            exit 0
          fi

          cd "$GITHUB_WORKSPACE"
          # Both identities, matching the catalog commit above. `git commit-tree` resolves author
          # and committer independently, so passing only the committer would leave the author to
          # whatever the helper's `git config` seeded — correct today, but only by way of an
          # indirection nothing states.
          TARGET_BRANCH="design-artifacts/${SYSTEM}" \
          REPO="$GITHUB_REPOSITORY" \
          GITHUB_TOKEN_INLINE="$GH_TOKEN" \
          OUTPUT="$GITHUB_WORKSPACE/history.json" \
          LAYOUT=images \
          MSG="chore(design-artifacts): update ${SYSTEM} render history ($(date -u +%F), ${SOURCE_SHA})" \
          GIT_AUTHOR_NAME="$INPUT_COMMIT_USER_NAME" \
          GIT_AUTHOR_EMAIL="$INPUT_COMMIT_USER_EMAIL" \
          GIT_COMMITTER_NAME="$INPUT_COMMIT_USER_NAME" \
          GIT_COMMITTER_EMAIL="$INPUT_COMMIT_USER_EMAIL" \
            bash "$HELPER"
