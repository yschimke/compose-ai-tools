name: AI PR Review (Reusable)

on:
  workflow_call:
    inputs:
      preview_status:
        description: "Result of upstream preview job/workflow (e.g. success, failure, cancelled, skipped)."
        required: true
        type: string
      preview_images_artifact:
        description: "Artifact name containing preview images from the PR/head build."
        required: false
        type: string
        default: compose-preview-images
      preview_diff_artifact:
        description: "Artifact name containing generated visual diff images."
        required: false
        type: string
        default: compose-preview-diff-images
      preview_baseline_artifact:
        description: "Artifact name containing baseline preview images and/or metadata."
        required: false
        type: string
        default: compose-preview-baseline
      preview_metadata_artifact:
        description: "Artifact name containing preview index/metadata JSON files."
        required: false
        type: string
        default: compose-preview-metadata
      strict_mode:
        description: "Fail the workflow when the selected agent reports blocking visual regressions."
        required: false
        type: boolean
        default: false
      post_review_comment:
        description: "Whether to post a PR comment with review output."
        required: false
        type: boolean
        default: true
      update_pr_branch:
        description: "Attempt to commit review artifacts back to the PR branch; skips with warning when not permitted."
        required: false
        type: boolean
        default: true
      code_diff_paths:
        description: "Optional newline-delimited path globs for code review focus."
        required: false
        type: string
        default: ""
      base_ref:
        description: "Optional base ref for diffing outside pull_request context (for example, main)."
        required: false
        type: string
        default: ""
      pr_head_repository:
        description: "Optional repository (owner/name) for the PR head checkout."
        required: false
        type: string
        default: ""
      pr_head_ref:
        description: "Optional ref (branch or SHA) for the PR head checkout."
        required: false
        type: string
        default: ""
      codex_review_command:
        description: "Override command used when Codex API key is selected."
        required: false
        type: string
        default: ""
      claude_review_command:
        description: "Override command used when Claude API key is selected."
        required: false
        type: string
        default: ""
      gemini_review_command:
        description: "Override command used when Gemini API key is selected."
        required: false
        type: string
        default: ""
    secrets:
      codex_api_key:
        description: "Optional API key used by Codex review tooling."
        required: false
      claude_api_key:
        description: "Optional API key used by Claude review tooling."
        required: false
      gemini_api_key:
        description: "Optional API key used by Gemini review tooling."
        required: false
      gh_token:
        description: "Token used to read artifacts and write PR comments/checks."
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ai-pr-review:
    name: AI PR review
    runs-on: ubuntu-latest
    outputs:
      selected_agent: ${{ steps.select-agent.outputs.agent }}
      review_status: ${{ steps.set-status.outputs.review_status }}
      blocking_findings: ${{ steps.set-status.outputs.blocking_findings }}
      review_summary_path: ${{ steps.set-status.outputs.review_summary_path }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.pr_head_repository != '' && inputs.pr_head_repository || github.repository }}
          ref: ${{ inputs.pr_head_ref != '' && inputs.pr_head_ref || github.sha }}
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Detect AI provider keys
        id: keys
        env:
          CODEX_KEY: ${{ secrets.codex_api_key }}
          CLAUDE_KEY: ${{ secrets.claude_api_key }}
          GEMINI_KEY: ${{ secrets.gemini_api_key }}
        run: |
          set -euo pipefail
          {
            echo "has_codex=$([[ -n "$CODEX_KEY" ]] && echo true || echo false)"
            echo "has_claude=$([[ -n "$CLAUDE_KEY" ]] && echo true || echo false)"
            echo "has_gemini=$([[ -n "$GEMINI_KEY" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Install compose-preview-review skill (Codex)
        if: ${{ steps.keys.outputs.has_codex == 'true' }}
        env:
          SKILL_REPO: yschimke/compose-ai-tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "codex-cli>=0.1.0"
          codex skills install --github "$SKILL_REPO" --name compose-preview-review

      - name: Resolve base ref for code diff
        id: base-ref
        run: |
          set -euo pipefail
          if [[ -n "${INPUTS_BASE_REF}" ]]; then
            base_ref="${INPUTS_BASE_REF}"
          elif [[ -n "${GITHUB_BASE_REF}" ]]; then
            base_ref="${GITHUB_BASE_REF}"
          else
            base_ref="main"
          fi
          echo "value=$base_ref" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_BASE_REF: ${{ inputs.base_ref }}

      - name: Capture PR code diff
        id: code-diff
        run: |
          set -euo pipefail
          mkdir -p review-input
          base_ref="${STEPS_BASE_REF_OUTPUTS_VALUE}"
          base_remote="origin"

          if [[ -n "${INPUTS_PR_HEAD_REPOSITORY}" && "${INPUTS_PR_HEAD_REPOSITORY}" != "$CURRENT_REPOSITORY" ]]; then
            base_remote="upstream-base"
            git remote add "$base_remote" "https://github.com/${CURRENT_REPOSITORY}.git"
          fi

          git fetch --no-tags --prune --depth=1 "$base_remote" "$base_ref"
          git diff --unified=0 "$base_remote/$base_ref...HEAD" > review-input/code.diff
          git diff --name-only "$base_remote/$base_ref...HEAD" > review-input/changed-files.txt
          {
            echo "code_diff_path=review-input/code.diff"
            echo "changed_files_path=review-input/changed-files.txt"
          } >> "$GITHUB_OUTPUT"
        env:
          STEPS_BASE_REF_OUTPUTS_VALUE: ${{ steps.base-ref.outputs.value }}
          INPUTS_PR_HEAD_REPOSITORY: ${{ inputs.pr_head_repository }}
          CURRENT_REPOSITORY: ${{ github.repository }}

      - name: Download required preview artifacts (images + metadata)
        if: ${{ inputs.preview_status == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: review-input/previews
          merge-multiple: false
          pattern: |
            ${{ inputs.preview_images_artifact }}
            ${{ inputs.preview_metadata_artifact }}

      - name: Download optional diff artifacts (may be empty when previews are identical)
        if: ${{ inputs.preview_status == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: review-input/previews
          merge-multiple: false
          pattern: |
            ${{ inputs.preview_diff_artifact }}
            ${{ inputs.preview_baseline_artifact }}

      - name: Evaluate context readiness
        id: context
        run: |
          set -euo pipefail
          reason=""
          if [[ "${INPUTS_PREVIEW_STATUS}" != "success" ]]; then
            reason="preview workflow status was '${INPUTS_PREVIEW_STATUS}'"
          elif [[ ! -d review-input/previews ]]; then
            reason="preview artifacts were not downloaded"
          elif ! find review-input/previews -type f | grep -q .; then
            reason="preview artifacts directory was empty"
          fi

          if [[ -n "$reason" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_PREVIEW_STATUS: ${{ inputs.preview_status }}

      - name: Select review agent from available keys
        id: select-agent
        run: |
          set -euo pipefail
          count=0
          agent=""
          reason=""
          if [[ -n "$CODEX_API_KEY" ]]; then agent="codex"; count=$((count+1)); fi
          if [[ -n "$CLAUDE_API_KEY" ]]; then agent="claude"; count=$((count+1)); fi
          if [[ -n "$GEMINI_API_KEY" ]]; then agent="gemini"; count=$((count+1)); fi

          if [[ "$count" -eq 0 ]]; then
            reason="no AI API key configured"
          elif [[ "$count" -gt 1 ]]; then
            reason="multiple AI API keys configured"
          fi

          if [[ -n "$reason" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "agent=" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "agent=$agent" >> "$GITHUB_OUTPUT"
          fi
        env:
          CODEX_API_KEY: ${{ secrets.codex_api_key }}
          CLAUDE_API_KEY: ${{ secrets.claude_api_key }}
          GEMINI_API_KEY: ${{ secrets.gemini_api_key }}

      - name: Run selected AI review (code + preview)
        id: ai-review
        if: ${{ steps.context.outputs.ready == 'true' && steps.select-agent.outputs.valid == 'true' }}
        env:
          CODEX_API_KEY: ${{ secrets.codex_api_key }}
          ANTHROPIC_API_KEY: ${{ secrets.claude_api_key }}
          GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
          STEPS_SELECT_AGENT_OUTPUTS_AGENT: ${{ steps.select-agent.outputs.agent }}
          INPUTS_CODEX_REVIEW_COMMAND: ${{ inputs.codex_review_command }}
          STEPS_CODE_DIFF_OUTPUTS_CODE_DIFF_PATH: ${{ steps.code-diff.outputs.code_diff_path }}
          STEPS_CODE_DIFF_OUTPUTS_CHANGED_FILES_PATH: ${{ steps.code-diff.outputs.changed_files_path }}
          INPUTS_CODE_DIFF_PATHS: ${{ inputs.code_diff_paths }}
          INPUTS_CLAUDE_REVIEW_COMMAND: ${{ inputs.claude_review_command }}
          INPUTS_GEMINI_REVIEW_COMMAND: ${{ inputs.gemini_review_command }}
        run: |
          set -euo pipefail
          mkdir -p review-output
          agent="${STEPS_SELECT_AGENT_OUTPUTS_AGENT}"
          case "$agent" in
            codex)
              if [[ -n "${INPUTS_CODEX_REVIEW_COMMAND}" ]]; then
                eval "${INPUTS_CODEX_REVIEW_COMMAND}"
              else
                codex review \
                  --skill compose-preview-review \
                  --code-diff "${STEPS_CODE_DIFF_OUTPUTS_CODE_DIFF_PATH}" \
                  --changed-files "${STEPS_CODE_DIFF_OUTPUTS_CHANGED_FILES_PATH}" \
                  --preview-dir review-input/previews \
                  --focus-paths "${INPUTS_CODE_DIFF_PATHS}" \
                  --output-json review-output/codex-review.json \
                  --output-markdown review-output/codex-review.md
              fi
              ;;
            claude)
              if [[ -z "${INPUTS_CLAUDE_REVIEW_COMMAND}" ]]; then
                echo "::error::claude_api_key is set but no claude_review_command was provided."
                exit 1
              fi
              eval "${INPUTS_CLAUDE_REVIEW_COMMAND}"
              ;;
            gemini)
              if [[ -z "${INPUTS_GEMINI_REVIEW_COMMAND}" ]]; then
                echo "::error::gemini_api_key is set but no gemini_review_command was provided."
                exit 1
              fi
              eval "${INPUTS_GEMINI_REVIEW_COMMAND}"
              ;;
          esac

      - name: Emit blocked status when context is missing
        if: ${{ steps.context.outputs.ready != 'true' || steps.select-agent.outputs.valid != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p review-output
          printf '## AI PR Review — Blocked\n\nAI review did not run because required review context was unavailable.\n\n**Reason:** %s\n\n### Missing context / blocked checks\n- Code review context: available\n- Preview review context: unavailable\n- Visual diff checks: blocked\n' \
            "$BLOCK_REASON" > review-output/codex-review.md
          python3 -c 'import json,os; json.dump({"status":"blocked","blocking_findings":0,"reason":os.environ["BLOCK_REASON"]}, open("review-output/codex-review.json", "w"))'
        env:
          BLOCK_REASON: ${{ steps.context.outputs.reason || steps.select-agent.outputs.reason }}

      - name: Optionally update PR branch with review artifacts
        if: ${{ inputs.update_pr_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "::warning::Skipping PR branch update because event is $EVENT_NAME (not pull_request)."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME}" != "$CURRENT_REPOSITORY" ]]; then
            echo "::warning::Skipping PR branch update for fork PR (no safe push permission)."
            exit 0
          fi

          branch="${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}"
          if [[ -z "$branch" ]]; then
            echo "::warning::Skipping PR branch update because PR head ref is unavailable."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .codex/review-output
          cp review-output/codex-review.md .codex/review-output/codex-review.md
          cp review-output/codex-review.json .codex/review-output/codex-review.json
          git add .codex/review-output/codex-review.md .codex/review-output/codex-review.json

          if git diff --cached --quiet; then
            echo "No PR branch update needed; review artifacts unchanged."
            exit 0
          fi

          git commit -m "chore: update AI review artifacts"
          if ! git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${CURRENT_REPOSITORY}.git" "HEAD:${branch}"; then
            echo "::warning::Unable to push AI review artifacts to PR branch (insufficient permissions or branch protection)."
          fi

      - name: Publish PR comment
        if: ${{ inputs.post_review_comment }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.gh_token }}
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('review-output/codex-review.md', 'utf8')
            const marker = '<!-- codex-pr-review -->'
            const fullBody = `${marker}\n${body}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              })
            }

      - name: Set outputs
        id: set-status
        run: |
          set -euo pipefail
          status=$(python - <<'PY'
          import json
          with open('review-output/codex-review.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('status', 'unknown'))
          PY
          )
          blocking=$(python - <<'PY'
          import json
          with open('review-output/codex-review.json', encoding='utf-8') as f:
              data = json.load(f)
          print(int(data.get('blocking_findings', 0)))
          PY
          )
          {
            echo "review_status=$status"
            echo "blocking_findings=$blocking"
            echo "review_summary_path=review-output/codex-review.md"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce strict mode
        if: ${{ inputs.strict_mode && steps.set-status.outputs.blocking_findings != '0' }}
        run: |
          echo "Strict mode enabled and blocking findings were reported."
          exit 1
