name: Design Artifacts

# Render each design-catalog module and publish its importable sticker-sheet
# bundle (catalog.json + DTCG tokens + Figma variables + PNGs + per-sticker
# editable figma-svg vectors) to a `design-artifacts/<system>` branch a designer
# can pull into Figma / Stitch / Claude Design. The render is the source of
# truth — these branches are regenerated from the committed @Preview catalogs.
#
# Runs on four triggers (see each `on:` entry below): the Monday cron, a manual
# dispatch, a push to `main` that touches a catalog or the export driver, and
# the tail of a published release.
#
# Pipeline: compose-preview bundle pack  →  @design-parity/catalog-export driver
#           →  publish out/ to design-artifacts/<system>.
#
# The publish APPENDS a commit on the branch tip rather than force-pushing a
# fresh orphan, so each delivery branch carries a per-regeneration history and a
# sticker that moved can be traced to the source commit that moved it. See
# docs/design/DESIGN_CATALOGS.md#delivery-branch-history.

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Auto-regenerate on merge: a delivery branch goes stale the moment its catalog
  # changes on `main`, and until this trigger existed that staleness lasted until
  # someone remembered to dispatch (or until Monday) — the published stickers
  # silently disagreeing with `main` in between. The `changes` job below narrows a
  # push run to only the systems whose inputs actually moved, so a one-catalog
  # merge regenerates one branch, not all three.
  #
  # DELIBERATELY NOT triggered by renderer/plugin changes (`gradle-plugin/`,
  # `renderers/`, `cli/`). They do affect the output, but they're touched by most
  # merges, and each system's render is ~90 minutes — a push trigger there would
  # run hours of render on nearly every commit to `main`. Renderer drift is picked
  # up by the Monday cron and by the release chain
  # (`post-release-design-artifacts.yml` → `workflow_call`); dispatch manually if a
  # renderer change needs to land in the delivery branches sooner.
  push:
    branches: [main]
    paths:
      - 'samples/design-catalog-*/**'
      - 'samples/cmp-wasm-catalog/**'
      - 'scripts/design-artifacts/**'
      - '.github/ci/remote-m3-cmp-wasm-allowlist.json'
      - '.github/workflows/design-artifacts.yml'
      - '.github/workflows/design-artifacts-reusable.yml'
  # Also invoked automatically after a published release (post-release-design-artifacts.yml
  # → this workflow) so the design-artifacts/<system> delivery branches regenerate with
  # the just-released preview-runtime coordinates without a manual dispatch. That caller
  # is a separate run hanging off release-please.yml's completion via `workflow_run`, so
  # ~90 minutes of render per system no longer holds the release run open; it chains via
  # workflow_call from there because the release run is authenticated with the default
  # GITHUB_TOKEN, whose events don't start new workflow runs (the same reason
  # release-please.yml calls release.yml / preview-host-image.yml this way).
  workflow_call:
    inputs:
      force-all:
        description: >-
          Regenerate every system regardless of which files changed.
          Defaults to true because the only caller (the release chain) exists to
          republish every bundle against the newly released runtime.
        type: boolean
        default: true
        required: false

permissions:
  # Reusable publish jobs append to design-artifacts/*; GitHub does not permit a
  # called workflow to elevate beyond this caller-level grant.
  contents: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which delivery branches does this run need to regenerate?
  #
  # For anything but a `push` (cron, dispatch, the release chain) the answer is
  # "all of them" — those runs exist precisely to refresh everything. For a push to
  # `main` we diff the pushed range and light up only the systems whose inputs
  # moved, so a single-catalog merge costs one ~90-minute render instead of three.
  #
  # The path→system mapping itself lives in scripts/design-artifacts/scope-systems.sh
  # so it can be unit-tested (test-scope-systems.sh, run by ci.yml) rather than
  # rotting inside a YAML heredoc — a silently-wrong mapping here would strand a
  # delivery branch on stale renders, the exact failure this trigger prevents.
  #
  # The changed-file range comes from the compare API rather than a local `git diff`,
  # so it's correct however the push was shaped — a squash merge, a multi-commit
  # push, a release-please merge — without cloning history. If the range can't be
  # resolved (branch creation, force-push, API hiccup) the script falls back to
  # every system: publishing a fresh bundle is never wrong, skipping a stale one is.
  changes:
    name: Scope
    if: ${{ github.repository == 'yschimke/compose-ai-tools' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compose-m3: ${{ steps.scope.outputs.compose-m3 }}
      wear-m3: ${{ steps.scope.outputs.wear-m3 }}
      remote-m3: ${{ steps.scope.outputs.remote-m3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          # A reusable workflow inherits the CALLER's github context, so `event_name`
          # here is the caller's event, never `workflow_call`. Event sniffing alone is
          # therefore not safe to rely on: the release chain's caller is
          # post-release-design-artifacts.yml (`on: workflow_run`) today, but when it
          # was a job in release-please.yml (`on: push`) this read as a `push` whose
          # `event.before…sha` was the release merge — CHANGELOG / gradle.properties,
          # matching no catalog — and would have silently skipped every system on
          # exactly the run that must republish them all. `inputs.force-all` is the
          # explicit signal that survives the caller moving; it is empty for push/cron
          # (the `inputs` context is only populated for workflow_call /
          # workflow_dispatch) and defaults to true for callers.
          FORCE_ALL: ${{ inputs.force-all }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Cron / dispatch / the release chain exist to refresh everything.
          if [ "$FORCE_ALL" = "true" ] || [ "$EVENT" != "push" ]; then
            # `if`, not `&&` — under `set -e` a failing AND-list exits the step.
            if [ "$FORCE_ALL" = "true" ]; then
              why="force-all (called workflow)"
            else
              why="event=$EVENT"
            fi
            echo "$why — regenerating every system" >> "$GITHUB_STEP_SUMMARY"
            scripts/design-artifacts/scope-systems.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # All-zero `before` = branch creation; there's no range to diff. An empty
          # file list makes the script fall back to every system.
          #
          # Single un-paginated call on purpose: the compare endpoint caps `files`
          # at 300 and paginates COMMITS, not files, so `--paginate` would not fetch
          # the rest — it would just hand us a silently partial list. A partial list
          # is worse than none (a catalog past the cap reads as "unchanged" and its
          # branch quietly rots), so a capped response is treated as unresolvable and
          # falls through to regenerating everything.
          files=''
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000) ;;
            *)
              compare="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" 2>/dev/null || true)"
              if [ -n "$compare" ]; then
                count="$(jq -r '(.files // []) | length' <<<"$compare")"
                if [ "$count" -ge 300 ]; then
                  echo "compare returned $count files (API cap) — treating as truncated" >> "$GITHUB_STEP_SUMMARY"
                else
                  files="$(jq -r '(.files // [])[].filename' <<<"$compare")"
                fi
              fi
              ;;
          esac

          if [ -n "$files" ]; then
            file_count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | xargs)
            {
              echo "Resolved ${file_count} changed file(s)."
              echo
              echo '<details><summary>Changed files (first 30)</summary>'
              echo
              echo '```'
              printf '%s\n' "$files" | sed -n '1,30p'
              if [ "$file_count" -gt 30 ]; then
                echo "… $((file_count - 30)) more"
              fi
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Could not resolve the changed files — regenerating every system.' >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '%s\n' "$files" | scripts/design-artifacts/scope-systems.sh | tee -a "$GITHUB_OUTPUT" \
            | sed 's/^/- `/; s/=true$/` → regenerate/; s/=false$/` → unchanged, skipped/' \
            >> "$GITHUB_STEP_SUMMARY"

  generate:
    name: ${{ matrix.system }}
    # Don't run on forks — the publish step pushes branches into this repo.
    needs: changes
    if: ${{ github.repository == 'yschimke/compose-ai-tools' && needs.changes.outputs.compose-m3 == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Published previews are always built against RELEASED preview-runtimes: substitute the
      # catalog's `:data-preview-overrides-runtime` / `:slot-preview-runtime` project deps for their
      # released Maven coordinates (at `composeaiReleasedRuntimeVersion` in gradle.properties) so
      # `bundle pack` records small coordinates instead of inlining the jars. Only
      # :samples:design-catalog-m3 acts on it; the CLI build + other rows/modules ignore it.
      ORG_GRADLE_PROJECT_composeaiUseReleasedRuntimes: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: compose-m3
            module: 'samples:design-catalog-m3'
            spec: 'samples/design-catalog-m3/catalog.spec.json'
            # The in-browser CMP tier: this system gets its `material3` catalog
            # compiled to Kotlin/Wasm and carried in the branch under web/wasm/.
            # Wear has no wasm target (androidx.wear.compose), so it's omitted.
            wasmModule: 'samples:cmp-wasm-catalog'
            wasmDist: 'samples/cmp-wasm-catalog/build/wasmDist'
            # Android-only supplement (Robolectric): renders the material3
            # 1.5.0-alpha inset focus ring, which CMP can't draw, and the generator
            # folds it in (--extra-renders) so the keyboard-focus variant keeps its
            # real ring. Its previews override same-named CMP functions.
            androidExtraModule: 'samples:design-catalog-m3-android'
          # wear-m3 and remote-m3 moved to the `wear-m3` / `remote-m3` jobs below,
          # which delegate to the reusable workflow. compose-m3 stays here: its Wasm
          # tier + released-runtime Maven-Central gate are repo-internal machinery
          # that (per DESIGN_CATALOGS.md's convention) doesn't belong in the shared
          # consumer workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK + Gradle, then build the compose-preview CLI from this checkout so the
      # render matches the in-repo plugin/renderer schema.
      - uses: ./.github/actions/setup
      # Read-only BuildFetch remote cache: pull cached task outputs instead of
      # building cold. No rw-token — the writers (ci.yml, integration.yml,
      # vscode-extension-e2e.yml, gradle-cache-seed.yml) already cover these tasks.
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - uses: ./.github/actions/install-cli

      # `compose-m3` is now a Compose Multiplatform (desktop) catalog, so its
      # render goes through the Skiko desktop daemon (CPU raster) instead of
      # Robolectric. Skiko's native lib links libGL.so.1, so Mesa's software GL
      # must be present (same deps ci.yml installs for desktop renders; the Wear /
      # Remote Android rows don't need them, but the packages are harmless there).
      - name: Install desktop (Skiko) render deps
        run: |
          scripts/install-linux-font-fallbacks.sh \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1

      # The export engine lives in the (private) design-parity repo, but its
      # building blocks are published to npm. The driver
      # (scripts/design-artifacts/) pins @design-parity/candidate +
      # @design-parity/catalog-export, so we install them from npm rather than
      # cloning design-parity: the workflow's GITHUB_TOKEN is scoped to this repo
      # only and can't read the private design-parity repo, and a public-npm
      # install needs no cross-repo secret.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install export engine (pinned npm packages)
        working-directory: scripts/design-artifacts
        run: npm ci --no-audit --no-fund --loglevel=warn

      # Fast, build-free pre-flight: resolve every spec `preview` against the
      # @Preview functions the module actually declares BEFORE the ~90-minute
      # render. A mistyped/renamed `preview` fails here in seconds instead of as a
      # late "missing" entry that trips the completeness gate at the end. Structural
      # errors (duplicate componentId, malformed variant) fail here too. Uses only
      # node built-ins (no npm deps). Coverage warnings don't fail the job.
      - name: Validate catalog spec
        id: validate-spec
        run: |
          set -euo pipefail
          node scripts/design-artifacts/validate-catalog-spec.mjs --spec "${{ matrix.spec }}" \
            --render-filter-out "$GITHUB_WORKSPACE/render-filter.txt" \
            --deferred-modes-out "$GITHUB_WORKSPACE/deferred-modes.txt"
          # Render priority (issue #2950): the `--preview` patterns that render just the
          # entries this spec still needs baked. EMPTY unless the spec marks entries
          # `priority: "deferred"` — no catalog here does today, so the render set is
          # unchanged. Consumed by the render step below.
          echo "render-filter=$(cat "$GITHUB_WORKSPACE/render-filter.txt")" >> "$GITHUB_OUTPUT"
          # Gate for the per-mode exclusion step below (issue #2966): that one needs discovered
          # preview ids, so it costs an extra Gradle invocation and only runs when a mode is
          # actually deferred.
          echo "deferred-modes=$(cat "$GITHUB_WORKSPACE/deferred-modes.txt")" >> "$GITHUB_OUTPUT"

      # Per-mode render exclusions (issue #2966). `modePriority` thins the palette fan-out INSIDE one
      # `@Preview` function, so it can't be named as function patterns like the entry-level filter
      # above — it needs the discovered ids (`FilledButton_Dark`). `compose-preview list --json` runs
      # `composePreviewDiscover` for them; the compile it does is shared with the render below, so the
      # extra invocation costs discovery rather than a second build. Skipped when nothing is deferred.
      - name: Derive per-mode render exclusions
        id: mode-filter
        if: ${{ steps.validate-spec.outputs.deferred-modes != '' }}
        run: |
          set -euo pipefail
          compose-preview list --json --module "${{ matrix.module }}" \
            > "$GITHUB_WORKSPACE/discovered-previews.json"
          node scripts/design-artifacts/deferred-preview-ids.mjs \
            --spec "${{ matrix.spec }}" \
            --previews "$GITHUB_WORKSPACE/discovered-previews.json" \
            --out "$GITHUB_WORKSPACE/mode-filter.txt" \
            --anchored-out "$GITHUB_WORKSPACE/mode-filter-cli.txt" \
            --rows-out "$GITHUB_WORKSPACE/mode-filter-rows.txt"
          # The ANCHORED file. `--exclude-preview-id` matches a plain pattern by equality OR
          # substring, and ids are hierarchical, so deferring `Switch_Dark` unanchored also defers
          # `Switch_Dark_VARIANT_off` — never deferred by the spec, and missing from the sheet with
          # nothing pointing back at this step (#3559).
          echo "exclude-ids=$(cat "$GITHUB_WORKSPACE/mode-filter-cli.txt")" >> "$GITHUB_OUTPUT"
          # Modes that carry no discovered id are a @PreviewParameter row axis — skipped by label
          # inside the render instead, since discovery never sees those rows.
          echo "exclude-rows=$(cat "$GITHUB_WORKSPACE/mode-filter-rows.txt")" >> "$GITHUB_OUTPUT"

      # Published previews pin their preview-runtimes to a RELEASED version
      # (`composeaiReleasedRuntimeVersion`, bumped by release-please on each release). Sonatype →
      # Maven Central propagation lags a release, so a regen kicked right after a release (or by the
      # release chain) could reference a version that isn't resolvable yet. Wait for it to appear on
      # Central before rendering — that's what lets "release, then regenerate the artifacts once the
      # release makes Central" work reliably. Only the CMP tier substitutes released runtimes, so
      # only it needs the gate; a bounded poll fails loudly rather than rendering an unpinned
      # (inlined) bundle.
      - name: Wait for released preview-runtimes on Maven Central
        if: ${{ matrix.wasmModule != '' }}
        run: |
          set -euo pipefail
          version="$(grep -oP '(?<=^composeaiReleasedRuntimeVersion=).*' gradle.properties || true)"
          if [ -z "$version" ]; then
            echo "::error title=Released runtime version missing::gradle.properties has no composeaiReleasedRuntimeVersion, so the catalog cannot resolve its published preview runtimes." >&2
            exit 1
          fi
          base="https://repo1.maven.org/maven2/ee/schimke/composeai"
          echo "Waiting for preview-runtimes $version on Maven Central (up to 60 minutes)…"
          last_status=""
          for i in $(seq 1 60); do
            ok=1
            statuses=()
            for a in data-preview-overrides-runtime slot-preview-runtime; do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                "$base/$a/$version/$a-$version.pom" || true)"
              statuses+=("$a=HTTP ${code:-000}")
              [ "$code" = "200" ] || ok=0
            done
            last_status=$(IFS=,; echo "${statuses[*]}")
            if [ "$ok" = 1 ]; then
              echo "✓ preview-runtimes $version available (attempt $i)."
              exit 0
            fi
            if [ "$i" -eq 1 ] || [ $((i % 5)) -eq 0 ]; then
              echo "Still waiting (attempt $i/60): $last_status"
            fi
            sleep 60
          done
          echo "::error title=Preview runtimes unavailable::Version $version did not fully appear on Maven Central after 60 minutes. Last response: $last_status" >&2
          exit 1

      - name: Render catalog bundle
        env:
          MODULE: ${{ matrix.module }}
          SYSTEM: ${{ matrix.system }}
          # Embed the real (measured) face into each `compose/figma-svg` export.
          # Without this the layered SVGs emit `font-family="<face>, sans-serif"`
          # and a browser substitutes a wider fallback, so text drifts off the
          # boxes we measured against the catalog face (the button-label centering
          # skew seen on the published stickers). Font embedding is on by default
          # (`composeai.svg.embedFonts`, off only when set to `false`); this explicit
          # `true` is belt-and-braces. The daemon is spawned as a subprocess of
          # `bundle pack`, so it inherits the flag via JAVA_TOOL_OPTIONS. It fetches
          # the catalog face (Roboto Flex) as WOFF2
          # from the same Google-Fonts source (and cache) the renderer already uses
          # for the PNGs — with bounded retries so a cold-start network blip doesn't
          # strand a preview — and degrades to `sans-serif` if the face stays
          # unreachable, so this never fails a render, only improves it.
          JAVA_TOOL_OPTIONS: -Dcomposeai.svg.embedFonts=true
          # Force Mesa's software GL path (no GPU on the runner) for the desktop
          # Skiko render; inert for the Robolectric (Android) catalog rows.
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Render only what this catalog still needs baked, when its spec defers entries
          # to the live preview server (issue #2950). Gradle sources project properties
          # from ORG_GRADLE_PROJECT_*, so this reaches `composePreviewRender` through
          # `bundle pack` with no CLI flag. Empty ⇒ no filter ⇒ render everything, which
          # is what every catalog here gets today.
          ORG_GRADLE_PROJECT_composePreview.filter: ${{ steps.validate-spec.outputs.render-filter }}
          # Per-mode exclusions (issue #2966). Passed as a CLI flag, not an env var, because it must
          # also thin the CLI-driven `--with-semantics` capture — filtering only the Gradle render
          # would leave that (per-preview daemon) pass at full width. Empty ⇒ flag omitted ⇒
          # everything renders, which is what every catalog here gets today.
          EXCLUDE_PREVIEW_IDS: ${{ steps.mode-filter.outputs.exclude-ids }}
          EXCLUDE_PREVIEW_ROWS: ${{ steps.mode-filter.outputs.exclude-rows }}
        run: |
          set -euo pipefail
          # Run under a virtual framebuffer so the Skiko desktop daemon has a
          # display (matches ci.yml's desktop-render jobs); harmless for the
          # Robolectric rows, which don't touch it.
          #
          # The job pins the catalog's preview-runtime deps to their RELEASED coordinates via the
          # `composeaiUseReleasedRuntimes` gate (job env) + `composeaiReleasedRuntimeVersion`
          # (gradle.properties, release-please-managed); the "Wait for released preview-runtimes"
          # step above guarantees that version is resolvable on Central before we render.
          exclude=(); if [ -n "${EXCLUDE_PREVIEW_IDS:-}" ]; then exclude=(--exclude-preview-id "$EXCLUDE_PREVIEW_IDS"); fi
          if [ -n "${EXCLUDE_PREVIEW_ROWS:-}" ]; then exclude+=(--exclude-preview-row "$EXCLUDE_PREVIEW_ROWS"); fi
          xvfb-run -a -s "-screen 0 2000x1400x24" \
            compose-preview bundle pack --module "$MODULE" --with-semantics --progress \
              "${exclude[@]}" -o "$GITHUB_WORKSPACE/$SYSTEM-bundle.png"

      # Android-only supplement (Robolectric): render the previews that need androidx
      # material3 APIs with no CMP equivalent (the inset focus ring). Robolectric
      # renders headless — no Skiko/xvfb/GL. The generator folds these in below,
      # overriding the CMP module's same-named (ring-less) renders.
      - name: Render Android-only supplement
        if: ${{ matrix.androidExtraModule != '' }}
        env:
          EXTRA_MODULE: ${{ matrix.androidExtraModule }}
          SYSTEM: ${{ matrix.system }}
          JAVA_TOOL_OPTIONS: -Dcomposeai.svg.embedFonts=true
        run: |
          set -euo pipefail
          compose-preview bundle pack --module "$EXTRA_MODULE" --with-semantics --progress \
            -o "$GITHUB_WORKSPACE/$SYSTEM-extra-bundle.png"

      # In-browser CMP tier: assemble the Kotlin/Wasm catalog app (webpack-free —
      # no Node/Binaryen toolchain, builds under FAIL_ON_PROJECT_REPOS). Its
      # build/wasmDist is bundled into the branch by the generator below so
      # `serve --catalogs` can fetch the live renderer from the same trusted
      # origin. Only for systems that declare a wasmModule (compose-m3, not Wear).
      - name: Assemble in-browser Wasm app
        if: ${{ matrix.wasmModule != '' }}
        env:
          WASM_MODULE: ${{ matrix.wasmModule }}
        run: ./gradlew ":${WASM_MODULE}:wasmCatalogDist" --quiet

      # The exporter gates on a complete render: `bundle pack --with-semantics`
      # is best-effort (exits 0 even if the daemon failed or captured zero
      # semantics), so the driver exits non-zero when any preview is missing or
      # lacks semantics. With `set -e` that fails the job before the publish step,
      # so a transient render failure can't force-push a degraded bundle over a
      # good delivery branch.
      - name: Generate importable catalog
        env:
          SYSTEM: ${{ matrix.system }}
          SPEC: ${{ matrix.spec }}
          # Set only for systems with an in-browser tier; the generator copies
          # this dir into out/web/wasm/ and writes the catalog.json webRender.
          WASM_DIST: ${{ matrix.wasmDist }}
          # Presence flag: fold the Android-only supplement render in (see above).
          EXTRA_RENDERS: ${{ matrix.androidExtraModule }}
          # Carry the executable bundle onto the branch so a trusted serve can launch
          # a render daemon from it (no build). The DESKTOP CMP catalog (compose-m3,
          # the wasm-tier row) runs on the Skiko daemon; an Android catalog flagged
          # `androidLiveBundle` (wear-m3) runs on the Robolectric daemon a box carrying
          # the Android sidecar provides — see deploy/image. The Android-only tiers
          # (wear-m3 / remote-m3) publish their live bundle through the reusable job
          # below, not this matrix.
          PUBLISH_LIVE_BUNDLE: ${{ (matrix.wasmModule != '' || matrix.androidLiveBundle == '1') && '1' || '' }}
          # Buildable source for trusted server-side re-render: catalog.json gets a
          # `source: {repo, ref, module}` so a `serve --allow-render-trusted` box can
          # rebuild + re-render this catalog live. Inert on the public desktop box,
          # which never sets that flag (it can't build the Android catalogs anyway).
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: main
          SOURCE_MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          node scripts/design-artifacts/generate-design-catalog.mjs \
            --spec "$SPEC" \
            --renders "$GITHUB_WORKSPACE/$SYSTEM-bundle.png" \
            --out "$GITHUB_WORKSPACE/out" \
            --renderer "$(compose-preview --version | head -1)" \
            ${WASM_DIST:+--wasm-dist "$GITHUB_WORKSPACE/$WASM_DIST"} \
            ${EXTRA_RENDERS:+--extra-renders "$GITHUB_WORKSPACE/$SYSTEM-extra-bundle.png"} \
            ${PUBLISH_LIVE_BUNDLE:+--publish-live-bundle} \
            --source-repo "$SOURCE_REPO" \
            --source-ref "$SOURCE_REF" \
            --source-module ":$SOURCE_MODULE"

      # Split the rendered sheet into one addressable, self-contained bundle per preview under
      # `bundle/previews/<id>.png`.
      #
      # The CMP tier (a `wasmModule` ⇒ a carried desktop `liveBundle`) splits **FULL**: each
      # per-preview bundle carries its re-render classpath so `serve` can re-render that preview from
      # its OWN bundle (ServePerPreviewLiveHost) — a `?knob.<key>=…` edit re-renders per preview
      # instead of routing through one monolithic catalog daemon.
      #
      # This block used to conclude that a FULL split "stays small — only `classes/app.jar` repeats
      # per preview", because the classpath is maven-coordinate (re-resolved at serve time) and
      # fonts resolve from the shared `bundle/res` pool. Both premises are true and the conclusion
      # was not: "only app.jar repeats" is ~600 KB *per preview*, so the bound is a function of the
      # PREVIEW COUNT, not of the backend. At 88 previews that is 17 MB; m3-catalog's ~1,300 made it
      # 790 MB, and since any catalog edit rewrites app.jar every publish re-wrote all of them
      # (#4211). That is why this tier splits `full-shared-classpath` — app.jar published once into
      # `bundle/res`, each manifest carrying a hash-verified `externalClasspath`, live lane intact —
      # and why the reusable workflow's `split-mode: auto` now fails a publish that would take the
      # `full` cost at scale without saying so.
      #
      # An Android tier without `androidLiveBundle` has no runnable desktop daemon, so it stays
      # `--view-only`: the re-render classpath is dropped, keeping the baked image + every captured
      # sidecar (semantics / layout / figma-svg, from the `--with-semantics` pack) at ~tens of KB.
      # The reusable wear-m3 / remote-m3 jobs publish Android live bundles and split FULL instead.
      - name: Split into per-preview bundles
        env:
          SYSTEM: ${{ matrix.system }}
          EXTRA_RENDERS: ${{ matrix.androidExtraModule }}
          # The shared-classpath live tier publishes app.jar once under bundle/res/ and lets serve
          # hydrate executable downloads. Baked-only tiers remain view-only.
          SPLIT_MODE: ${{ (matrix.wasmModule != '' || matrix.androidLiveBundle == '1') && 'full-shared-classpath' || 'view-only' }}
        run: |
          set -euo pipefail
          view_only_flag=""
          split_source="$GITHUB_WORKSPACE/$SYSTEM-bundle.png"
          if [ "$SPLIT_MODE" = "view-only" ]; then
            view_only_flag="--view-only"
          elif [ "$SPLIT_MODE" = "full-shared-classpath" ]; then
            compose-preview bundle split "$GITHUB_WORKSPACE/$SYSTEM-bundle.png" \
              --shared-classpath-out "$GITHUB_WORKSPACE/out/bundle/res" \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
            # The shared mode is complete; skip the legacy full-mode command below.
            split_source=""
          else
            # FULL: split the EXTERNALISED live bundle the generate step already produced under
            # out/bundle/ (fonts lifted to bundle/res/<sha>), not the raw sheet. Splitting the raw
            # sheet would copy its un-externalised classes/app.jar — fonts inlined — into every
            # per-preview bundle, so the delivery branch would balloon by the preview count. Reading
            # the externalised copy means each FULL per-preview bundle inherits the slimmed app.jar +
            # the shared-pool font references, so `serve` rehydrates fonts from bundle/res once.
            split_source="$GITHUB_WORKSPACE/out/bundle/$SYSTEM-bundle.png"
          fi
          if [ -n "$split_source" ]; then
            compose-preview bundle split "$split_source" $view_only_flag \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
          fi
          # For compose-m3 the catalog also folds an Android-only supplement (the material3 inset
          # focus ring CMP can't draw), whose renders/semantics override same-named CMP functions in
          # the published catalog. Split it into the same dir so those override renders are published
          # as addressable bundles too (they otherwise wouldn't appear at all). The supplement's
          # previews carry a distinct FQN, so they land beside — not on top of — the CMP bundles;
          # for an overridden function both the CMP and the (catalog-matching) Android sticker are
          # published. Collapsing to a single per-function bundle (dropping the superseded CMP one)
          # would need the export's function-name mapping and is a follow-up.
          #
          # Always --view-only: the supplement is Android-rendered, so there's no desktop daemon to
          # re-render it (ServeBundleDaemon.materialize is desktop-only) — a FULL split would just
          # carry an unusable Android classpath.
          if [ -n "${EXTRA_RENDERS:-}" ] && [ -f "$GITHUB_WORKSPACE/$SYSTEM-extra-bundle.png" ]; then
            compose-preview bundle split "$GITHUB_WORKSPACE/$SYSTEM-extra-bundle.png" --view-only \
              -o "$GITHUB_WORKSPACE/out/bundle/previews"
          fi

      - name: Publish to design-artifacts/${{ matrix.system }}
        env:
          SYSTEM: ${{ matrix.system }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read the rendered-from SHA off the checkout itself rather than
          # $GITHUB_SHA, matching design-artifacts-reusable.yml so the two publish
          # steps stamp the subject line the same way.
          SOURCE_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --short=8 HEAD)

          cd "$GITHUB_WORKSPACE/out"
          # Append on top of the existing tip rather than force-pushing an orphan,
          # so the delivery branch keeps a per-regeneration history you can diff
          # (`git log design-artifacts/$SYSTEM -- images/…`). Snapshots dedupe by
          # content, so an unchanged render costs nothing; SKIP_IF_UNCHANGED drops
          # the commit entirely when the whole tree is byte-identical.
          TARGET_BRANCH="design-artifacts/$SYSTEM" \
          REPO="$GITHUB_REPOSITORY" \
          GITHUB_TOKEN_INLINE="$GH_TOKEN" \
          MSG="chore(design-artifacts): regenerate $SYSTEM catalog ($(date -u +%F), ${SOURCE_SHA})" \
          SKIP_IF_UNCHANGED=1 \
          REVISION_PREVIEW_INDEX=1 \
          GIT_AUTHOR_NAME='Yuri Schimke' \
          GIT_AUTHOR_EMAIL='yuri@schimke.ee' \
          GIT_COMMITTER_NAME='Yuri Schimke' \
          GIT_COMMITTER_EMAIL='yuri@schimke.ee' \
            bash "$GITHUB_WORKSPACE/.github/actions/apply/lib/push-branch.sh"

  # ───────────────────────────────────────────────────────────────────────────
  # wear-m3 / remote-m3 delegate to the shared reusable workflow (same one
  # external consumers use), building the CLI from source (cli-source: build) so
  # they still publish HEAD's renderer output. They're Android (Robolectric)
  # renders with no Wasm tier, so they fit the common pipeline; both now carry a
  # live bundle (shared-classpath split) — the Robolectric daemon a serve host with
  # the Android sidecar runs re-renders either. See DESIGN_CATALOGS.md's reference-caller
  # convention.
  # ───────────────────────────────────────────────────────────────────────────
  wear-m3:
    name: wear-m3
    needs: changes
    if: ${{ github.repository == 'yschimke/compose-ai-tools' && needs.changes.outputs.wear-m3 == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/design-artifacts-reusable.yml
    with:
      system: wear-m3
      spec: samples/design-catalog-wear-m3/catalog.spec.json
      module: 'samples:design-catalog-wear-m3'
      cli-source: build
      # Android Robolectric daemon can re-render Wear, so carry a live bundle and
      # split it with a SHARED classpath: `classes/app.jar` is published once into
      # `bundle/res` and each per-preview manifest carries a hash-verified
      # `externalClasspath`, so the live re-render lane survives without repeating the
      # carriage once per preview (the growth #4211 measured on m3-catalog).
      publish-live-bundle: true
      split-per-preview: true
      split-mode: full-shared-classpath
    secrets:
      buildfetch_ro_token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}

  remote-m3:
    name: remote-m3
    needs: changes
    if: ${{ github.repository == 'yschimke/compose-ai-tools' && needs.changes.outputs.remote-m3 == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/design-artifacts-reusable.yml
    with:
      system: remote-m3
      spec: samples/design-catalog-remote-m3/catalog.spec.json
      module: 'samples:design-catalog-remote-m3'
      cli-source: build
      # Remote Compose is an Android/Robolectric catalog, so the same Android
      # daemon that re-renders wear-m3 (on a serve host carrying the Android
      # sidecar) drives it — carry a live bundle and split it with a SHARED classpath
      # (app.jar once in `bundle/res`, each manifest carrying a hash-verified
      # `externalClasspath`), so the viewer's declared Remote Compose knobs still
      # re-render live via the `rc.<name>=` override while the delivery branch stops
      # growing with the preview count (#4211).
      publish-live-bundle: true
      split-per-preview: true
      split-mode: full-shared-classpath
      # The embedded (Robolectric) and cmp-jvm (Compose Desktop / Skiko) rc-compare lanes used to be
      # spelled out here; they now default to true in the reusable workflow, so every catalog that
      # ships `ir/<id>.rc` gets them — the rationale (a divergence is only attributable when the same
      # document is scored through more than one player) never was remote-m3-specific.
      #
      # The CMP/Wasm implementation under development in #3201, rendered in the same browser
      # environment visitors use. This gives it an immediate per-document parity signal beside
      # the established JS, Android embedded, and cmp-jvm lanes. Still opt-in, and deliberately so:
      # it is a gate, not enrichment — a document it cannot draw fails the render rather than
      # dropping a column — so it stays where someone is watching the result.
      rc-cmp-wasm-lane: true
      rc-cmp-wasm-allowlist: .github/ci/remote-m3-cmp-wasm-allowlist.json
    secrets:
      buildfetch_ro_token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
