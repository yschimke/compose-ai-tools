name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Configure optional analytics
        env:
          UMAMI_ENABLED: ${{ vars.UMAMI_ENABLED }}
          UMAMI_URL: ${{ vars.UMAMI_URL }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, re
          from urllib.parse import urlsplit
          endpoint = os.environ.get("UMAMI_URL", "").rstrip("/")
          website = os.environ.get("UMAMI_WEBSITE_ID", "")
          enabled = os.environ.get("UMAMI_ENABLED") in ("1", "true")
          config = {"umami_enabled": False}
          if enabled and endpoint and website:
              parsed = urlsplit(endpoint)
              assert parsed.scheme == "https" and parsed.hostname and not parsed.username
              assert not parsed.query and not parsed.fragment
              assert re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", website)
              config = {"umami_enabled": True, "umami_url": endpoint, "umami_website_id": website}
          with open("_analytics.yml", "w") as output:
              json.dump(config, output)
          PYCONFIG
      - name: Build with Jekyll
        # Built for preview.coo.ee/start/ (the baseurl in _config.yml), not for the Pages path: the
        # preview host serves /start/ from the `site` branch (publish-branch below), and the github.io
        # copy redirects there.
        run: bundle exec jekyll build --config _config.yml,_analytics.yml
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  # preview.coo.ee serves /start/ from this branch: the box's `static-sites` service
  # (yschimke/preview-coo-ee, deploy/image/site-pull.sh) pulls it every few minutes and Caddy serves
  # the tree, so the docs no longer depend on proxying GitHub Pages. One orphan commit, replaced on
  # every build: the branch is the published artifact, not history.
  publish-branch:
    name: Publish the site branch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to the `site` branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artifact
      - name: Push the built site to the site branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir site-tree
          tar -xf artifact/artifact.tar -C site-tree
          test -f site-tree/index.html
          cd site-tree
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "site: ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # authenticate the deployment to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
