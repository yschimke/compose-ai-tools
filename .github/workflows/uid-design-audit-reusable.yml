name: UID design audit (reusable)

# Optional model critique of images from a successful workflow_run. The caller
# must live on its default branch. Never check out workflow_run.head_sha here.
# Only default-branch staging code and rules run with access to the model key.
on:
  workflow_call:
    inputs:
      enabled:
        description: Explicit opt-out; when enabled, a missing key is an incomplete audit and fails.
        type: boolean
        default: true
      pilot-directory:
        description: Trusted default-branch directory holding references.json.
        type: string
        required: true
      guidelines-url:
        description: Trusted HTTPS URL to canonical flat guidelines at an immutable revision.
        type: string
        required: true
      guidelines-sha256:
        description: SHA-256 of the canonical guideline bytes; mismatch fails before auditing.
        type: string
        required: true
      evidence-artifact:
        description: Artifact from the completed candidate workflow.
        type: string
        default: adaptive-uid-evidence
      audit-artifact:
        description: Output containing bounded captures, rules, prompt provenance and model response.
        type: string
        default: adaptive-uid-design-audit
    secrets:
      OPENROUTER_API_KEY:
        description: Required when enabled; may be omitted only when the audit is disabled.
        required: false

permissions:
  contents: read
  actions: read

env:
  PILOT_DIR: ${{ inputs.pilot-directory }}

jobs:
  audit:
    # workflow_run has base-repository secrets even when the source run is a fork PR.
    # A missing head_repository fails closed. No fork opt-in is exposed here.
    if: >-
      inputs.enabled &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # CLI 2.45.0 runs model requests in parallel (#5805) and sets the model's reasoning effort
    # (#5815), so a 100-capture plan no longer needs the 45-minute stopgap 2.40.0's one-at-a-time
    # requests did.
    timeout-minutes: 20
    steps:
      # Only trusted default-branch code runs in the job holding the model key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.evidence-artifact }}
          path: _uid_evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: 8f920cb830b42e9e5ed25eeed4aa7145896922c3
          path: _uid_tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Stage bounded image data using the trusted capture plan
        run: >-
          python _uid_tools/scripts/uid/evidence.py
          --plan "$PILOT_DIR/references.json" --root _uid_evidence
          --stage _uid_audit
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: yschimke/compose-ai-tools/.github/actions/install@d3be32ab68876b3c47ba8f9959fc6b44b00ab1c2 # v2.74.1
        with:
          version: '2.45.0'
          plugin-readiness-timeout: '0'
          require-digest: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 77e7f8ba122a79a0829006e3574ea6ae32767046
          path: _audit_engine
          persist-credentials: false
      - name: Fetch canonical guidelines with verified digest
        env:
          GUIDELINES_URL: ${{ inputs.guidelines-url }}
          GUIDELINES_SHA256: ${{ inputs.guidelines-sha256 }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          url, expected = os.environ['GUIDELINES_URL'], os.environ['GUIDELINES_SHA256']
          if not url.startswith('https://') or not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('Guidelines require an HTTPS URL and SHA-256 pin')
          with urllib.request.urlopen(url, timeout=30) as response:
              if not response.url.startswith('https://'):
                  raise SystemExit('Guidelines must remain on HTTPS')
              data = response.read(1_048_577)
          if len(data) > 1_048_576 or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Guidelines exceed size limit or do not match their SHA-256 pin')
          rules = json.loads(data)
          if rules.get('schema') != 'compose-ui-builder/catalog-guidelines/v1' or not rules.get('rules') or rules.get('includes'):
              raise SystemExit('Expected a nonempty, flat published guidelines pack')
          Path('_uid_audit/ui-builder.guidelines.json').write_bytes(data)
          Path('_uid_audit/guidelines-source.json').write_text(json.dumps({'url': url, 'sha256': expected}, indent=2) + '\n')
          PYCODE
      - name: Preserve rules, engine prompt source and run provenance
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          cp _audit_engine/guidelines/engine/src/main/kotlin/ee/schimke/composeai/guidelines/PreviewGuidelineRequests.kt _uid_audit/engine-prompt-source.kt
          printf 'source_sha=%s\nsource_run=%s\ncli=2.45.0\nprovider=OpenRouter\nmax_cost_usd=0.25\n' "$SOURCE_SHA" "$SOURCE_RUN" > _uid_audit/provenance.txt
      - name: Audit previews with the existing guidelines engine
        env:
          COMPOSE_PREVIEW_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$COMPOSE_PREVIEW_OPENROUTER_KEY" ]; then
            echo '{"status":"not_run","reason":"OPENROUTER_API_KEY is not configured"}' > _uid_audit/audit-status.json
            echo '::error::UI audit did not run: configure OPENROUTER_API_KEY, matching remote-m3-catalog.'
            exit 1
          fi
          set +e
          compose-preview guidelines --previews-json _uid_audit/previews.json --renders-dir _uid_audit --guidelines _uid_audit/ui-builder.guidelines.json --surface screen --max-cost 0.25 --concurrency 4 --reasoning-effort low --annotate > _uid_audit/audit.log 2>&1
          result=$?
          cat _uid_audit/audit.log >> "$GITHUB_STEP_SUMMARY"
          # An incomplete run whose requests OpenRouter refused with 402 (no credit, a key limit, or
          # the in-flight budget the balance sets) says nothing about the designs: skip with a
          # warning instead of failing the check. Only when every failed request is a 402 and no
          # evidence fetch failed; a run mixing in any other failure still fails.
          failed=$(grep -E '^ *problem: the (model answered|request got no answer)' _uid_audit/audit.log || true)
          if [ "$result" -eq 2 ] && [ -n "$failed" ] \
            && ! grep -vEq '(answered 402|code 402)' <<<"$failed" \
            && ! grep -q 'evidence fetch(es) failed' _uid_audit/audit.log; then
            echo '{"status":"skipped","reason":"OpenRouter refused requests for lack of credit (402)","exitCode":2}' > _uid_audit/audit-status.json
            echo '::warning::UI audit skipped: OpenRouter refused requests for lack of credit (402). Top up or raise the OPENROUTER_API_KEY limit, then re-run.'
            exit 0
          fi
          printf '{"exitCode":%s}\n' "$result" > _uid_audit/audit-status.json
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.audit-artifact }}
          path: _uid_audit/
          overwrite: true
          if-no-files-found: error
