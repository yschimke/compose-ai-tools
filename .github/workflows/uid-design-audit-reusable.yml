name: UID design audit (reusable)

# Optional model critique of images from a successful workflow_run. The caller
# must live on its default branch. Never check out workflow_run.head_sha here.
# Only default-branch staging code and rules run with access to the model key.
on:
  workflow_call:
    inputs:
      pilot-directory:
        description: Trusted default-branch directory holding ci/evidence.py, references.json and rules.
        type: string
        required: true
      evidence-artifact:
        description: Artifact from the completed candidate workflow.
        type: string
        default: adaptive-uid-evidence
      audit-artifact:
        description: Output containing bounded captures, rules, prompt provenance and model response.
        type: string
        default: adaptive-uid-design-audit
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter key, matching the catalog guidelines workflow.
        required: true

permissions:
  contents: read
  actions: read

env:
  PILOT_DIR: ${{ inputs.pilot-directory }}

jobs:
  audit:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted default-branch code runs in the job holding the model key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.evidence-artifact }}
          path: _uid_evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Stage bounded image data using the trusted capture plan
        run: >-
          python "$PILOT_DIR/ci/evidence.py"
          --plan "$PILOT_DIR/references.json" --root _uid_evidence
          --stage _uid_audit
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: yschimke/compose-ai-tools/.github/actions/install@92a06f2ea364359eb2398ff125f5d88f4f22a75a # v2.40.0
        with:
          version: '2.40.0'
          plugin-readiness-timeout: '0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 92a06f2ea364359eb2398ff125f5d88f4f22a75a
          path: _audit_engine
          persist-credentials: false
      - name: Preserve rules, engine prompt source and run provenance
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          cp "$PILOT_DIR/ui-builder.guidelines.json" _uid_audit/
          cp _audit_engine/guidelines/engine/src/main/kotlin/ee/schimke/composeai/guidelines/PreviewGuidelineRequests.kt _uid_audit/engine-prompt-source.kt
          printf 'source_sha=%s\nsource_run=%s\ncli=2.40.0\nprovider=OpenRouter\nmax_cost_usd=0.25\n' "$SOURCE_SHA" "$SOURCE_RUN" > _uid_audit/provenance.txt
      - name: Audit previews with the existing guidelines engine
        env:
          COMPOSE_PREVIEW_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$COMPOSE_PREVIEW_OPENROUTER_KEY" ]; then
            echo '{"status":"not_run","reason":"OPENROUTER_API_KEY is not configured"}' > _uid_audit/audit-status.json
            echo '::error::UI audit did not run: configure OPENROUTER_API_KEY, matching remote-m3-catalog.'
            exit 1
          fi
          set +e
          compose-preview guidelines --previews-json _uid_audit/previews.json --renders-dir _uid_audit --guidelines _uid_audit/ui-builder.guidelines.json --surface screen --max-cost 0.25 --annotate > _uid_audit/audit.log 2>&1
          result=$?
          printf '{"exitCode":%s}\n' "$result" > _uid_audit/audit-status.json
          cat _uid_audit/audit.log >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.audit-artifact }}
          path: _uid_audit/
          if-no-files-found: error
