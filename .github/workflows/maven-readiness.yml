name: Maven readiness

# Verifies that a published compose-preview plugin is fully resolvable from the
# public Maven Central consumer endpoint, then attaches the marker consumed by
# scripts/install.sh in yschimke/skills. The primary release chain calls this
# after making the GitHub Release public. workflow_dispatch is the repair path
# for manual/tag releases and transient Central or network failures.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to verify (for example v0.19.33).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (for example v0.19.33).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-readiness-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the readiness marker to the published release
      # Post the "artifacts on Maven Central" milestone on the merged release PR. release-please.yml's
      # `verify-maven-readiness` job grants the same scope — a called workflow can only narrow.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Resolve the released plugin from public Maven Central
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::unexpected release version: $V"; exit 1; }

          smoke="$RUNNER_TEMP/compose-preview-maven-readiness"
          gradle_home="$RUNNER_TEMP/compose-preview-maven-readiness-gradle-home"
          mkdir -p "$smoke" "$gradle_home"
          printf 'rootProject.name = "compose-preview-maven-readiness"\n' \
            > "$smoke/settings.gradle.kts"
          printf '%s\n' \
            'buildscript {' \
            '  repositories { mavenCentral() }' \
            "  dependencies { classpath(\"ee.schimke.composeai.preview:ee.schimke.composeai.preview.gradle.plugin:${V}\") }" \
            '}' \
            > "$smoke/build.gradle.kts"

          ready=0
          for attempt in $(seq 1 40); do
            if GRADLE_USER_HOME="$gradle_home" ./gradlew \
                -p "$smoke" help --no-daemon --refresh-dependencies \
                > "$smoke/gradle.log" 2>&1; then
              ready=1
              echo "plugin ${V} resolved from public Maven Central on attempt ${attempt}."
              # Consumed by the milestone comment below.
              {
                echo "version=${V}"
                echo "attempts=${attempt}"
                echo "plugin_coordinate=ee.schimke.composeai.preview:ee.schimke.composeai.preview.gradle.plugin:${V}"
              } >> "$GITHUB_OUTPUT"
              break
            fi
            echo "plugin ${V} not fully resolvable from public Maven Central (attempt ${attempt}/40)."
            tail -n 30 "$smoke/gradle.log"
            sleep 30
          done
          [ "$ready" -eq 1 ] \
            || { echo "::error::plugin ${V} was not resolvable after ~20 minutes"; exit 1; }

          marker="$RUNNER_TEMP/compose-preview-maven-ready-${V}.json"
          printf '{"version":"%s","verifiedAt":"%s"}\n' \
            "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker"
          gh release upload "$TAG" "$marker" --clobber
          echo "uploaded $(basename "$marker")."

      # The second of the two release milestones posted on the merged release PR (the first is the
      # server rollout, from preview-host-image.yml). This is the moment the release becomes
      # consumable by a downstream build, and it is the one the releaser waits for without being
      # told anything: Central's CDN propagation is deliberately excluded from finalization, so the
      # GitHub Release goes public 10–40 minutes before this job concludes.
      #
      # Deliberately AFTER the marker upload and outside the resolution loop, so it reports a fact
      # rather than a prediction, and adds no wait of its own. `continue-on-error` because a
      # courtesy comment must never fail a job whose real output (the readiness marker the
      # bootstrap installer gates on) is already attached.
      - name: Comment the Maven milestone on the release PR (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_KEY: maven-published
          MILESTONE_TAG: ${{ inputs.tag }}
          V: ${{ steps.resolve.outputs.version }}
          ATTEMPTS: ${{ steps.resolve.outputs.attempts }}
          COORDINATE: ${{ steps.resolve.outputs.plugin_coordinate }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # printf per line, not an indented heredoc — see the same note in preview-host-image.yml.
          md="$RUNNER_TEMP/maven-milestone.md"
          {
            printf '### 📦 Artifacts on Maven Central — `%s` is resolvable\n\n' "${V}"
            printf 'A clean Gradle project resolved the plugin classpath from `mavenCentral()` on attempt %s, so downstream builds can consume this release.\n\n' "${ATTEMPTS}"
            printf -- '- **Verified coordinate** — `%s`\n' "${COORDINATE}"
            printf -- '- **Browse** — [central.sonatype.com](https://central.sonatype.com/search?namespace=ee.schimke.composeai)\n'
            printf -- '- **Readiness marker** — `compose-preview-maven-ready-%s.json` on [the release](%s), which is what lets `compose-preview update` offer this version\n' "${V}" "${RELEASE_URL}"
            printf '\n<sub>Maven readiness · [workflow run](%s)</sub>\n' "${RUN_URL}"
          } > "$md"
          MILESTONE_BODY="$(cat "$md")" .github/scripts/comment-release-milestone.sh
