name: Serve Preview Baselines

# Mirrors the baseline path of `compose-preview.yml` but for the serve page
# captures in `preview-server/preview-harness` (every fixture × dark/light theme).
# Pushes the rendered PNGs + baselines.json to `serve-preview/main` so the branch
# is browsable on GitHub and serves as the "before" state for
# `serve-preview-comment.yml` on PRs.
#
# Named `vscode-preview-*` until the VS Code extension was split out
# (yschimke/compose-preview-vscode). It captured both harnesses then; it captures
# only the server's now, and the old name described the producer that left. The
# extension repository runs its own copy of this pipeline against its own
# baselines branch.

on:
  push:
    branches: [main]
    paths:
      - 'preview-server/preview-harness/**'
      # The serve fixture pages `<link>` the real viewer CSS/JS, which the harness server resolves
      # out of this directory — so a viewer change moves these captures. Only `format-compare.js`
      # was listed before, which left the pages themselves able to change without a rebaseline.
      - 'cli/serve/src/main/resources/ee/schimke/composeai/cli/serve/assets/**'
      - '.github/actions/serve-preview-baselines/**'
      - '.github/actions/serve-preview-comment/**'
      - '.github/actions/lib/serve-preview-diff.py'
      - '.github/workflows/serve-preview-baselines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serve-preview-baselines
  # Same reasoning as `compose-preview.yml`: this workflow only ever
  # publishes the "before" state for `serve-preview-comment.yml`, so a
  # cancelled run leaves `serve-preview/main` behind the commits it skipped
  # and every later PR inherits their diff. There is no PR trigger here at
  # all — push-to-main and dispatch only — so cancelling can never be the
  # right call. The path filter keeps this rare, but "rare" still means a
  # silently stale baseline when two `preview-server/preview-harness/**` merges land close
  # together.
  cancel-in-progress: false

jobs:
  update:
    name: Update serve-preview/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The composite action pushes via an explicit token in the
          # remote URL (see `serve-preview-baselines/action.yml`), so we
          # don't need the default git credentials persisted here.
          persist-credentials: false
      - uses: ./.github/actions/serve-preview-baselines
