# Build and publish the prebuilt preview-host Docker image to GHCR.
#
# Hosts then deploy with `docker compose pull` / `docker run` instead of an
# ~8-minute source build. The image installs the RELEASED compose-preview CLI +
# the published plugin and warm-renders a tiny standalone project (deploy/image).
#
# Triggers:
#   - manual (workflow_dispatch) with a CLI version input
#   - a published CLI release (tag `v*`) — bundles that version, tags it + `latest`
name: Publish preview-host image

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Released compose-preview version to bundle (leading v optional)
        required: true
        # No default, ON PURPOSE: a manual dispatch must name the version to
        # publish. A hardcoded default would rot — release-please can't bump it
        # because GITHUB_TOKEN may not write files under .github/workflows/,
        # which is exactly why this file is intentionally NOT a release-please
        # extra-file (listing it there made release-please fail every release
        # with "Error adding to tree"; do not re-add it). A run that accepted a
        # stale default would overwrite the GHCR `:latest` tag with an OLDER
        # server. Whatever you pass must be >= the release carrying the
        # entrypoint-defaulted flags (`--catalogs-unlisted`, 0.16.9) AND the
        # catalog knob-override render path (#2287).
  # Called from release-please.yml when a CLI release is cut. A bot-created
  # release won't fire the `release` trigger below (the GITHUB_TOKEN-doesn't-
  # trigger-workflows limitation the rest of the release chain already works
  # around), so the reliable path is this workflow_call after release.yml.
  workflow_call:
    inputs:
      cli_version:
        description: Released compose-preview version to bundle (leading v optional)
        required: true
        type: string
  # Kept as a manual escape hatch for human-published releases (which DO fire it).
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only CLI releases (tags like v0.16.1) — skip clients-v* and manual non-v tags.
    #
    # NB: gate on the INPUT, not github.event_name. Inside a reusable workflow
    # (workflow_call), github.event_name is the CALLER's triggering event — `push`
    # for release-please.yml — NOT 'workflow_call'. So a `github.event_name ==
    # 'workflow_call'` check silently SKIPS this job on the release chain (which is
    # exactly what dropped the v0.16.6 image). cli_version is a required input on
    # both workflow_dispatch and workflow_call, so it's set on both paths; the
    # `release` event carries no inputs and falls through to the tag check.
    if: >-
      inputs.cli_version != '' ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve bundled CLI version
        id: ver
        env:
          # release event → the tag; workflow_call / workflow_dispatch → the
          # input (the `inputs` context covers both). Strip a leading `v` either
          # way so a `v0.16.5` tag and a bare `0.16.5` input both work.
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.cli_version }}
        run: |
          v="${RAW_VERSION#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      # Seed Maven local from the same release run so the warm render resolves the
      # plugin + runtime modules from local jars instead of waiting on Central.
      # release.yml's publish-gradle-plugin job uploads `preview-host-maven` (the
      # published `ee` tree) within THIS run, so download-artifact finds it on the
      # release-chain path. On manual workflow_dispatch / on:release there's no such
      # upstream artifact — continue-on-error leaves the dir empty and the Dockerfile
      # falls back to Central (the warm-render retry loop rides out propagation lag).
      # The dir always exists (.keep) so the Dockerfile's `COPY m2/` never fails.
      - name: Prepare local Maven dir
        run: |
          mkdir -p deploy/image/m2
          touch deploy/image/m2/.keep
      - name: Download published modules (same-run release chain)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: preview-host-maven
          path: deploy/image/m2-dl
      - name: Unpack published modules into the build context
        run: |
          if [ -f deploy/image/m2-dl/maven-local-ee.tgz ]; then
            tar -xzf deploy/image/m2-dl/maven-local-ee.tgz -C deploy/image/m2
            echo "seeded Maven local with $(find deploy/image/m2/ee -name '*.jar' 2>/dev/null | wc -l) jars"
          else
            echo "no preview-host-maven artifact — Dockerfile will resolve from Maven Central."
          fi

      # Smooth out the release race for the CLI TARBALL (a GitHub Release asset
      # release.yml uploads after the tag — always needed, m2 or not). The plugin no
      # longer gates this poll: on the release chain it comes from the local m2 above,
      # and on the manual path the Dockerfile's warm-render retry handles Central lag.
      # 1-byte range GET, ~60 min ceiling.
      - name: Wait for the released CLI tarball to be resolvable
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -u
          tarball="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/compose-preview-${V}.tar.gz"
          # 1-byte range GET: cheap (never pulls the 180 MB tarball), no HEAD
          # dependency — 200 (range ignored) or 206 (partial) both mean "present".
          ok() { c=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$1" 2>/dev/null); [ "$c" = "200" ] || [ "$c" = "206" ]; }
          for i in $(seq 1 40); do
            if ok "$tarball"; then
              echo "CLI ${V} tarball is resolvable — building."
              exit 0
            fi
            echo "waiting for CLI ${V} tarball to publish (attempt ${i}/40)…"
            sleep 90
          done
          echo "::error::CLI ${V} tarball not resolvable after ~60 min — re-run later." >&2
          exit 1

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/compose-preview-host
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: deploy/image
          file: deploy/image/Dockerfile
          build-args: |
            CP_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Roll preview.coo.ee onto the just-published image IMMEDIATELY, instead of
      # waiting up to the box's ROLLOUT_INTERVAL (default 1200s) for its poll loop
      # to notice the new :latest. This is the RIGHT moment to fire: the image is now
      # on GHCR and is fully self-contained (CLI + plugin jars + warm caches + the
      # Android daemon are all baked in above), so the box needs ONLY GHCR to roll —
      # no Maven wait can race it (the build already absorbed Central propagation via
      # the seeded local m2 + the Dockerfile warm-render retry). Contrast a `release:
      # published` trigger, which fires BEFORE this job builds the image and would
      # roll the box onto the OLD :latest.
      #
      # Best-effort and OPTIONAL: it fires only when a DEPLOY_HOOK_TOKEN secret is set
      # (forks / other deployers have none → skipped), and a failure never fails the
      # publish — the box's poll loop is the fallback that still rolls within one
      # interval. The hook only triggers a rollout CHECK of the already-configured
      # image tag (it can't be parameterised to run anything else), so the call is a
      # bounded no-op, not an RCE lever. See deploy/image/deploy-hook.sh.
      - name: Notify preview.coo.ee to roll (best-effort)
        env:
          HOOK_URL: ${{ vars.DEPLOY_HOOK_URL || 'https://preview.coo.ee/__hooks/rollout' }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -u
          if [ -z "${HOOK_TOKEN}" ]; then
            echo "no DEPLOY_HOOK_TOKEN secret — skipping deploy notify (the box's poll loop rolls within its interval)."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -X POST -H "Authorization: Bearer ${HOOK_TOKEN}" "${HOOK_URL}" 2>/dev/null || echo 000)
          echo "deploy hook POST ${HOOK_URL} → HTTP ${code}"
          case "${code}" in
            200|202) echo "roll triggered." ;;
            *) echo "::warning::deploy hook returned ${code}; the box will still roll on its next poll." ;;
          esac
          # Advisory convergence check: poll the ungated /version until it reports the
          # new build, so this run shows the box actually rolled. Non-fatal on timeout
          # (a slow cold-start warm render can outlast this; the roll still completes).
          base="${HOOK_URL%/__hooks/rollout}"
          for i in $(seq 1 30); do
            live=$(curl -fsS -m 10 "${base}/version" 2>/dev/null \
              | tr -d ' \n' | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            if [ "${live}" = "${V}" ]; then
              echo "preview.coo.ee now serving ${V}."
              exit 0
            fi
            echo "waiting for preview.coo.ee to report ${V} (currently '${live:-?}', attempt ${i}/30)…"
            sleep 20
          done
          echo "::warning::preview.coo.ee did not report ${V} within ~10 min — it may still be warming or will roll on its next poll; not failing the publish."
