# Build and publish the prebuilt preview-host Docker image to GHCR.
#
# Hosts then deploy with `docker compose pull` / `docker run` instead of an
# ~8-minute source build. The image installs the RELEASED compose-preview CLI,
# published Maven modules, and the Android daemon used by live catalog bundles.
#
# Triggers:
#   - manual (workflow_dispatch) with a CLI version input
#   - a published CLI release (tag `v*`) — bundles that version, tags it + `latest`
name: Publish preview-host image

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Released compose-preview version to bundle (leading v optional)
        required: true
        # No default, ON PURPOSE: a manual dispatch must name the version to
        # publish. A hardcoded default would rot — release-please can't bump it
        # because GITHUB_TOKEN may not write files under .github/workflows/,
        # which is exactly why this file is intentionally NOT a release-please
        # extra-file (listing it there made release-please fail every release
        # with "Error adding to tree"; do not re-add it). A run that accepted a
        # stale default would overwrite the GHCR `:latest` tag with an OLDER
        # server. Whatever you pass must be >= the release carrying the
        # entrypoint-defaulted flags (`--catalogs-unlisted`, 0.16.9) AND the
        # catalog knob-override render path (#2287).
  # Called from release-please.yml as soon as a CLI release tag is cut. A bot-created
  # release won't fire the `release` trigger below (the GITHUB_TOKEN-doesn't-
  # trigger-workflows limitation the rest of the release chain already works
  # around), so the reliable path is this early, parallel workflow_call.
  workflow_call:
    inputs:
      cli_version:
        description: Released compose-preview version to bundle (leading v optional)
        required: true
        type: string
      build_from_source:
        description: Build release inputs from the checked-out tag instead of waiting for public assets
        required: false
        default: false
        type: boolean
      non_blocking:
        description: Report a failed image build without failing the caller's core release
        required: false
        default: false
        type: boolean
    secrets:
      DEPLOY_HOOK_TOKEN: {required: false}
      SERVE_ADMIN_TOKEN: {required: false}
      SIGNING_KEY: {required: false}
      SIGNING_KEY_ID: {required: false}
      SIGNING_KEY_PASSWORD: {required: false}
  # Kept as a manual escape hatch for human-published releases (which DO fire it).
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Post the "server deployed" milestone on the merged release PR. A called workflow can only
  # narrow what the caller granted, so release-please.yml's `preview-host-image` job grants this
  # too — dropping it there makes the milestone step 403 (tolerated, but silent).
  pull-requests: write

jobs:
  publish:
    # Only CLI releases (tags like v0.16.1) — skip clients-v* and manual non-v tags.
    #
    # NB: gate on the INPUT, not github.event_name. Inside a reusable workflow
    # (workflow_call), github.event_name is the CALLER's triggering event — `push`
    # for release-please.yml — NOT 'workflow_call'. So a `github.event_name ==
    # 'workflow_call'` check silently SKIPS this job on the release chain (which is
    # exactly what dropped the v0.16.6 image). cli_version is a required input on
    # both workflow_dispatch and workflow_call, so it's set on both paths; the
    # `release` event carries no inputs and falls through to the tag check.
    if: >-
      inputs.cli_version != '' ||
      startsWith(github.event.release.tag_name, 'v')
    continue-on-error: ${{ inputs.non_blocking }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The early release-chain path builds from the exact release tag.
          # Human release events check out their tag; manual public-asset builds
          # keep the workflow's selected ref because a bare `0.x.y` input is not
          # itself a git ref.
          ref: ${{ inputs.build_from_source && inputs.cli_version || github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Resolve bundled CLI version
        id: ver
        env:
          # release event → the tag; workflow_call / workflow_dispatch → the
          # input (the `inputs` context covers both). Strip a leading `v` either
          # way so a `v0.16.5` tag and a bare `0.16.5` input both work.
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.cli_version }}
        run: |
          v="${RAW_VERSION#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "PLUGIN_VERSION=${v}" >> "$GITHUB_ENV"

      # The release-please path starts this reusable workflow as soon as the tag
      # exists, in parallel with release.yml. Build only the inputs the server
      # image consumes: its CLI tarball, Android daemon sidecar, and published
      # `ee` Maven tree. This avoids both critical-path waits that used to delay
      # preview.coo.ee:
      #   1. the draft GitHub Release becoming public so Docker could curl assets;
      #   2. Maven Central publishing + its advisory ~20 minute visibility poll.
      #
      # Manual / human-published-release runs leave these dirs empty and use the
      # Dockerfile's public-release fallback instead.
      - name: Prepare image input dirs
        run: |
          mkdir -p deploy/image/m2
          touch deploy/image/m2/.keep
          mkdir -p deploy/image/release-assets
          touch deploy/image/release-assets/.keep
          mkdir -p deploy/image/scripts
          cp scripts/install-linux-font-fallbacks.sh deploy/image/scripts/

      - uses: ./.github/actions/setup
        if: ${{ inputs.build_from_source }}
        with:
          cache-read-only: 'true'

      - name: Build preview-host release inputs
        if: ${{ inputs.build_from_source }}
        env:
          # Non-SNAPSHOT Maven publications are signed even when the destination
          # is mavenLocal, so the same release signing material is required here.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :cli:distTar \
            :cli:packageAndroidDaemon \
            :gradle-plugin:publishToMavenLocal \
            publishToMavenLocal

      - name: Stage locally built image inputs
        if: ${{ inputs.build_from_source }}
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cp "cli/build/distributions/compose-preview-${V}.tar.gz" \
            deploy/image/release-assets/
          cp "cli/build/distributions/compose-preview-android-daemon-${V}.zip" \
            deploy/image/release-assets/
          cp -a "${HOME}/.m2/repository/ee" deploy/image/m2/
          echo "staged $(find deploy/image/m2/ee -name '*.jar' | wc -l) local Maven jars"
          ls -lh deploy/image/release-assets

      # Manual / human-published-release fallback: wait for the public CLI asset.
      # The automatic release chain skips this completely because it staged the
      # exact tag's inputs above.
      - name: Wait for the released CLI tarball to be resolvable
        if: ${{ !inputs.build_from_source }}
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -u
          tarball="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/compose-preview-${V}.tar.gz"
          # 1-byte range GET: cheap (never pulls the 180 MB tarball), no HEAD
          # dependency — 200 (range ignored) or 206 (partial) both mean "present".
          ok() { c=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$1" 2>/dev/null); [ "$c" = "200" ] || [ "$c" = "206" ]; }
          for i in $(seq 1 40); do
            if ok "$tarball"; then
              echo "CLI ${V} tarball is resolvable — building."
              exit 0
            fi
            echo "waiting for CLI ${V} tarball to publish (attempt ${i}/40)…"
            sleep 90
          done
          echo "::error::CLI ${V} tarball not resolvable after ~60 min — re-run later." >&2
          exit 1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/compose-preview-host
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/image
          file: deploy/image/Dockerfile
          build-args: |
            CP_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Roll preview.coo.ee onto the just-published image IMMEDIATELY, instead of
      # waiting up to the box's ROLLOUT_INTERVAL (default 1200s) for its poll loop
      # to notice the new :latest. This is the RIGHT moment to fire: the image is now
      # on GHCR and is fully self-contained (CLI + plugin jars + the
      # Android daemon are all baked in above), so the box needs ONLY GHCR to roll —
      # no Maven wait can race it (the release's Maven tree is baked from the same-run
      # artifact). Contrast a `release:
      # published` trigger, which fires BEFORE this job builds the image and would
      # roll the box onto the OLD :latest.
      #
      # Best-effort and OPTIONAL: it fires only when a DEPLOY_HOOK_TOKEN secret is set
      # (forks / other deployers have none → skipped), and a failure never fails the
      # publish — the box's poll loop is the fallback that still rolls within one
      # interval. The hook only triggers a rollout CHECK of the already-configured
      # image tag (it can't be parameterised to run anything else), so the call is a
      # bounded no-op, not an RCE lever. See deploy/image/deploy-hook.sh.
      - name: Notify preview.coo.ee to roll (best-effort)
        id: rollout
        env:
          HOOK_URL: ${{ vars.DEPLOY_HOOK_URL || 'https://preview.coo.ee/__hooks/rollout' }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -u
          if [ -z "${HOOK_TOKEN}" ]; then
            echo "no DEPLOY_HOOK_TOKEN secret — skipping deploy notify (the box's poll loop rolls within its interval)."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -X POST -H "Authorization: Bearer ${HOOK_TOKEN}" "${HOOK_URL}" 2>/dev/null || echo 000)
          echo "deploy hook POST ${HOOK_URL} → HTTP ${code}"
          case "${code}" in
            200|202) echo "roll triggered." ;;
            *) echo "::warning::deploy hook returned ${code}; the box will still roll on its next poll." ;;
          esac
          # Deployment convergence + catalog health reporting. The incident that motivated this
          # check ran the right version while silently omitting three configured catalogs. Catalog
          # loading stays best-effort (one external branch must not block the server rollout), but
          # the run now prints a prominent warning with every failed/stale catalog instead of
          # declaring success from /version alone.
          base="${HOOK_URL%/__hooks/rollout}"
          for i in $(seq 1 30); do
            version_json=$(curl -fsS -m 10 "${base}/version" 2>/dev/null || true)
            status_json=$(curl -fsS -m 10 "${base}/status.json" 2>/dev/null || true)
            live=$(printf '%s' "${version_json}" \
              | tr -d ' \n' | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            loaded=$(printf '%s' "${status_json}" | jq -r '.catalogs.loaded // -1' 2>/dev/null || echo -1)
            total=$(printf '%s' "${status_json}" | jq -r '.catalogs.total // -1' 2>/dev/null || echo -1)
            failed=$(printf '%s' "${status_json}" | jq -r '.catalogs.failed // -1' 2>/dev/null || echo -1)
            if [ "${live}" = "${V}" ] && [ "${total}" -ge 0 ] && [ "${loaded}" -ge 0 ] &&
               [ "${failed}" -ge 0 ]; then
              problems=$(printf '%s' "${status_json}" | jq -r \
                '[.catalogList[] | select(.loadState != "loaded") |
                  "\(.id) [\(.loadState)]: \(.loadError // "pending")"] | join("; ")')
              if [ -n "${problems}" ]; then
                echo "::warning::preview.coo.ee deployed ${V}, but catalogs are partial (${loaded}/${total} loaded, ${failed} failed): ${problems}"
              else
                echo "preview.coo.ee now serving ${V} with ${loaded}/${total} catalogs loaded."
              fi
              # Hand the converged state to the milestone comment below. `problems` is flattened
              # to one line first: a catalog's loadError can carry newlines, and an unflattened
              # value would break $GITHUB_OUTPUT's key=value framing.
              {
                echo "deployed=true"
                echo "base_url=${base}"
                echo "catalogs_loaded=${loaded}"
                echo "catalogs_total=${total}"
                echo "catalog_problems=$(printf '%s' "${problems}" | tr '\n\r' '  ')"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for preview.coo.ee: version=${live:-?}/${V}, catalogs=${loaded}/${total}, failed=${failed} (attempt ${i}/30)…"
            sleep 20
          done
          echo "::error::preview.coo.ee did not converge to ${V} with a readable catalog status within ~10 min." >&2
          exit 1

      # Tell the person who merged the release PR that the server is up, on the PR they merged.
      # This is the first of two milestones posted there (the other is Maven readiness, from
      # maven-readiness.yml) and it fires at the earliest honest moment: the step above just
      # proved the box serves this exact version and could read its catalog status.
      #
      # Costs the release nothing. It runs AFTER the convergence poll that already existed, adds
      # no waiting of its own, and `continue-on-error` keeps a GitHub API hiccup from touching a
      # publish that already succeeded. `deployed == 'true'` means the poll converged — a skipped
      # notify (no DEPLOY_HOOK_TOKEN, i.e. a fork or another deployer) or a timeout leaves the
      # output unset and posts nothing, because neither one proved a running server.
      - name: Comment the deploy milestone on the release PR (best-effort)
        if: ${{ steps.rollout.outputs.deployed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_KEY: server-deployed
          MILESTONE_TAG: v${{ steps.ver.outputs.version }}
          V: ${{ steps.ver.outputs.version }}
          BASE_URL: ${{ steps.rollout.outputs.base_url }}
          LOADED: ${{ steps.rollout.outputs.catalogs_loaded }}
          TOTAL: ${{ steps.rollout.outputs.catalogs_total }}
          PROBLEMS: ${{ steps.rollout.outputs.catalog_problems }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/compose-preview-host
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # Built line by line with printf rather than as one indented here-string: the markdown
          # must start at column 0, and a heredoc inside a YAML block scalar makes that depend on
          # indentation nobody checks — an extra level silently turns the whole comment into a
          # code block.
          md="$RUNNER_TEMP/deploy-milestone.md"
          {
            printf '### 🚀 Server deployed — `%s` is running `%s`\n\n' "${BASE_URL#https://}" "${V}"
            printf -- '- **Live version** — [`/version`](%s/version) reports `%s`\n' "${BASE_URL}" "${V}"
            printf -- '- **Catalogs** — %s/%s loaded\n' "${LOADED}" "${TOTAL}"
            printf -- '- **Image** — `%s:%s`\n' "${IMAGE}" "${V}"
            [ -n "${PROBLEMS}" ] && printf '\n> ⚠️ Catalogs are partial: %s\n' "${PROBLEMS}"
            printf '\n<sub>Preview host rollout · [workflow run](%s)</sub>\n' "${RUN_URL}"
          } > "$md"
          MILESTONE_BODY="$(cat "$md")" .github/scripts/comment-release-milestone.sh

      # Push the DEPLOYMENT's config onto the now-rolled box. /config/catalogs.json and
      # /config/producers.json are seeded on first boot and never overwritten after (deliberately,
      # so a roll can't stomp a runtime edit), which means adding a catalog or producer to a
      # committed file changed NOTHING on an already-deployed server and someone had to remember to
      # POST it by hand. This closes that gap at the one moment the box is known to be running the
      # matching image.
      #
      # Note the source is deploy/<deployment>/, NOT the image's seed: the image bakes only
      # compose-m3 and the single producer that publishes it, so an operator adopting the prebuilt
      # image doesn't inherit this deployment's catalogs or its trust relationships. Another
      # deployment sets DEPLOY_CONFIG_DIR (+ DEPLOY_BASE_URL) to its own and reuses this verbatim.
      #
      # Additive only: an id already present comes back 409 and is left alone, so anything added
      # directly on the box survives. See the script header for the retire-vs-reseed trade-off.
      #
      # Best-effort and OPTIONAL, like the rollout notify above: it needs a SERVE_ADMIN_TOKEN
      # secret matching the box's own, and does nothing without one. `continue-on-error` so this
      # can never fail a publish that already succeeded.
      #
      # The condition is `steps.push.outcome == 'success'`, NOT a bare `always()`. A bare always()
      # would also fire when the build or the GHCR push failed, pushing this tag's seed config at a
      # box still running the OLD image — publishing catalogs whose image was never deployed, which
      # inverts the whole point of doing this after the roll. Keying on the push step keeps the one
      # case always() was for (the convergence check above timed out, but the image IS on GHCR and
      # the box will roll on its next poll) while dropping the case that was never intended.
      - name: Publish deployment config to the preview box (best-effort)
        if: always() && steps.push.outcome == 'success'
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://preview.coo.ee' }}
          DEPLOY_CONFIG_DIR: ${{ vars.DEPLOY_CONFIG_DIR || 'deploy/preview.coo.ee' }}
          ADMIN_TOKEN: ${{ secrets.SERVE_ADMIN_TOKEN }}
        run: |
          set -u
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "no SERVE_ADMIN_TOKEN secret — skipping config reconcile (nothing to push)."
            exit 0
          fi
          if [ ! -d "${DEPLOY_CONFIG_DIR}" ]; then
            echo "no ${DEPLOY_CONFIG_DIR} — skipping config reconcile (no deployment config in this repo)."
            exit 0
          fi
          DEPLOY_CONFIG_DIR="$(cd "${DEPLOY_CONFIG_DIR}" && pwd)" \
            bash .github/scripts/publish-config-to-box.sh
