name: Daemon Harness

# End-to-end test harness for the preview daemon — see
# docs/daemon/TEST-HARNESS.md.
#
# Change-scoped on PRs (.github/ci/change-scope-safe-paths.json): the `changes`
# job classifies the diff first, and all three harness jobs gate on its `run`
# output. `:daemon:harness:test` depends only on :daemon:core/desktop/android +
# :common-io + the renderers, so a PR that touches only safe paths — docs, this
# repo's own samples, the VS Code extension, deploy, clients, the design-
# artifacts scripts — cannot change what the harness renders and skips all three
# legs. Unlike integration.yml these are plain (non-matrix) jobs, so a scoped
# skip still reports each check as "skipped", which branch protection counts as
# passing — no re-emit gate needed. Fail-open: pushes to main, an empty diff, a
# git failure, or an unreadable config all run the full harness.
#
# Three jobs run on every in-scope PR:
#   * `desktop-fake` — FakeDaemonMain + FakeHost; deterministic-failure
#     coverage plus the seven-scenario v1 catalogue. Does not link in
#     Compose Desktop / Skiko on the harness production classpath.
#   * `desktop-real` — the real `:daemon:desktop` `DaemonMain`
#     driven by the same scenarios via `RealDesktopHarnessLauncher`.
#     Pixel-diffs against the in-repo baselines under
#     `daemon/harness/baselines/desktop/`.
#   * `android-real` — D-harness.v2: the real `:daemon:android`
#     `DaemonMain` driven via `RealAndroidHarnessLauncher`. Slower than
#     desktop because Robolectric sandbox bootstrap dominates (~3-10s vs
#     ~600ms desktop cold). Pixel-diffs against
#     `daemon/harness/baselines/android/`. The renderer-agnostic claim
#     from DESIGN § 4 stops being aspirational when both `desktop-real` and
#     `android-real` are required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast PR-diff classifier (shared with integration.yml via
  # .github/ci/change-scope.py). Outputs `run` = true|false; all three harness
  # jobs key off it. Non-PR events and any classification error resolve to
  # `true`, so scoping only ever trims the PR critical path.
  changes:
    name: Determine harness scope
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Non-PR events (push to main) always run the full harness.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::event=$EVENT_NAME — running the full daemon harness."
            exit 0
          fi
          # Fetch the PR base so the classifier can diff against it (checkout is
          # shallow). The script is fail-open, so a failed fetch still runs.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          run="$(python3 .github/ci/change-scope.py)"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "::notice::Daemon harness will run — a changed path can affect :daemon:harness:test."
          else
            echo "::notice::Daemon harness scope-skipped — all changes are docs/samples/tooling (.github/ci/change-scope-safe-paths.json)."
          fi

  desktop-fake:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    name: Daemon Harness (desktop, fake host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run harness scenarios (desktop, fake)
        run: ./gradlew :daemon:harness:test
      - name: Upload harness test results (desktop, fake)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-fake-test-results
          path: daemon/harness/build/reports/tests/
      - name: Upload pixel-diff artefacts on failure (desktop, fake)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-fake-diffs
          path: daemon/harness/build/reports/daemon-harness/

  desktop-real:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    name: Daemon Harness (desktop, real renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Skiko ships its native bundle inside the Compose Desktop classpath,
      # so we expect no system packages to be needed on ubuntu-latest. If
      # this job ever fails with `UnsatisfiedLinkError` for libfreetype /
      # libfontconfig, install them here:
      #
      #   - name: Install Skiko native deps
      #     run: |
      #       sudo apt-get update
      #       sudo apt-get install -y libfreetype6 libfontconfig1
      #
      - name: Run harness scenarios (desktop, real)
        run: ./gradlew :daemon:harness:test -Pharness.host=real
      - name: Upload harness test results (desktop, real)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-real-test-results
          path: daemon/harness/build/reports/tests/
      - name: Upload pixel-diff artefacts on failure (desktop, real)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-desktop-real-diffs
          path: daemon/harness/build/reports/daemon-harness/

  android-real:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    name: Daemon Harness (android, real renderer)
    runs-on: ubuntu-latest
    # Slower than desktop because Robolectric sandbox bootstrap dominates
    # cold render. Generous timeout — observed ~45s end-to-end on the dev
    # box; CI runners are noisier so allow 15min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `:samples:android` already bootstraps Robolectric on ubuntu-latest
      # so we expect no extra system packages. If this job ever fails with
      # missing native libs (libfontconfig, libfreetype), install them
      # here.
      - name: Run harness scenarios (android, real)
        run: ./gradlew :daemon:harness:test -Pharness.host=real -Pharness.target=android
      - name: Upload harness test results (android, real)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-android-real-test-results
          path: daemon/harness/build/reports/tests/
      - name: Upload pixel-diff artefacts on failure (android, real)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-harness-android-real-diffs
          path: daemon/harness/build/reports/daemon-harness/
