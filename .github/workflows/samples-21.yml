name: Samples-21 (JDK 21)

# Build/render the `samples-21/*` subtree. These modules pull in tooling whose
# Gradle plugin jars are compiled to Java 21 bytecode and therefore can't
# load on this repo's default JDK 17 build daemon (see
# `gradle/gradle-daemon-jvm.properties`, pinned to `toolchainVersion=17`).
#
# Rather than bump the daemon JVM repo-wide and force every contributor onto
# JDK 21, the daemon pin stays at 17 and `settings.gradle.kts` skips the
# `samples-21:*` projects when `JavaVersion.current() < 21`. This workflow:
#
#   1. Installs JDK 21 on the runner.
#   2. Rewrites `gradle/gradle-daemon-jvm.properties` (in-place on the
#      runner's checkout — never committed) so the daemon launches on 21.
#   3. Invokes the render task, which now sees `:samples-21:*` in the
#      project tree and pulls in Metro's compiler plugin without complaint.

on:
  push:
    branches: [main]
    paths:
      - 'samples-21/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/samples-21.yml'
  pull_request:
    branches: [main]
    paths:
      - 'samples-21/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/samples-21.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render samples-21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic

      - name: Bump daemon JVM criteria to 21 (ephemeral, runner-only)
        run: echo "toolchainVersion=21" > gradle/gradle-daemon-jvm.properties

      - name: Render :samples-21:android-metro-viewmodel
        run: ./gradlew :samples-21:android-metro-viewmodel:composePreviewRenderAll

      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samples-21-android-metro-viewmodel-renders
          path: samples-21/android-metro-viewmodel/build/compose-previews/renders/
