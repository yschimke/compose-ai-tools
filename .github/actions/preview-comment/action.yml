name: 'Compose Preview Comment (deprecated shim)'
description: >
  DEPRECATED. Thin forwarder to `./.github/actions/apply` with
  `only: compose,resources` + `mode: comment`. New consumers should call
  `apply` directly so they can opt into the a11y / notifications pipelines
  too.

inputs:
  cli-version:
    # Stays 'latest', not 'auto': this shim forwards to a *pinned, released*
    # apply ref (`apply@vX` below, bumped by release-please), which may predate
    # the `auto` resolver and would pass `auto` straight to install as a literal
    # version (→ 404 on `vauto/...tar.gz`). The released apply still carries the
    # #1920 skew guardrail, so pinned-plugin consumers get a fail-fast message
    # rather than a silent break. New consumers should call `apply` directly,
    # where `auto` is the default.
    default: 'latest'
  catalog-path:
    default: 'gradle/libs.versions.toml'
  catalog-key:
    default: 'composePreviewCli'
  timeout:
    default: '600'
  base-branch:
    description: 'Ignored — apply hardcodes compose-preview/main as the baseline.'
    default: 'compose-preview/main'
  resource-base-branch:
    description: 'Ignored — apply hardcodes compose-preview/resources/main.'
    default: 'compose-preview/resources/main'
  head-branch:
    description: 'Ignored — apply hardcodes compose-preview/pr.'
    default: 'compose-preview/pr'
  resource-head-branch:
    description: 'Ignored — apply hardcodes compose-preview/resources/pr.'
    default: 'compose-preview/resources/pr'
  pr-number:
    default: ''
  comment-on-empty-diff:
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::preview-comment is deprecated; call ./.github/actions/apply with mode=comment + only=compose,resources instead. See apply/action.yml for the input mapping."

    # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
    - uses: yschimke/compose-ai-tools/.github/actions/apply@v0.16.31 # x-release-please-version
      with:
        mode: comment
        only: 'compose,resources'
        cli-version: ${{ inputs.cli-version }}
        catalog-path: ${{ inputs.catalog-path }}
        catalog-key: ${{ inputs.catalog-key }}
        timeout: ${{ inputs.timeout }}
        pr-number: ${{ inputs.pr-number }}
        comment-on-empty-diff: ${{ inputs.comment-on-empty-diff }}
