name: 'Compose A11y Report (deprecated shim)'
description: >
  DEPRECATED. Thin forwarder to `./.github/actions/apply` with
  `only: a11y` and the supplied mode. New consumers should call `apply`
  directly so they can run the a11y pipeline alongside the
  compose / resources / notifications pipelines from a single workflow.

inputs:
  mode:
    description: "'baseline' or 'comment' — forwarded to apply.mode."
    required: true
  module:
    description: 'Forwarded to apply.a11y-module.'
    default: 'samples:wear'
  baseline-branch:
    description: 'Ignored — apply hardcodes compose-preview/a11y/main.'
    default: 'compose-preview/a11y/main'
  pr-branch:
    description: 'Ignored — apply hardcodes compose-preview/a11y/pr.'
    default: 'compose-preview/a11y/pr'
  pr-number:
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::a11y-report is deprecated; call ./.github/actions/apply with only=a11y + a11y-module=<module> instead. See apply/action.yml for the input mapping."

    # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
    - uses: yschimke/compose-ai-tools/.github/actions/apply@v0.11.5 # x-release-please-version
      with:
        mode: ${{ inputs.mode }}
        only: 'a11y'
        a11y-module: ${{ inputs.module }}
        pr-number: ${{ inputs.pr-number }}
