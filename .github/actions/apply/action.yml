name: 'Compose Preview Apply'
description: >
  Unified entry point for the compose-preview CI surface. Auto-selects
  baseline vs comment mode from the triggering event, runs the four
  pipelines (compose / resources / a11y / notifications) back-to-back,
  and pushes baselines / PR renders + posts sticky PR comments. Replaces
  the per-surface preview-baselines / preview-comment / a11y-report /
  notification-previews composites.

inputs:
  cli-version:
    description: >
      compose-preview CLI version. "auto" (default), a literal (e.g. "0.8.1"),
      "latest", "catalog", "source" (build from the current checkout — internal
      CI only), or "none" (skip CLI install entirely; pair with
      `skip-render: true` and `only: compose,resources` for non-Gradle build
      systems that pre-stage `_previews.json` / `_resources.json`).

      "auto" (issue #1920) makes the common path skew-proof with no extra
      config: it sniffs the plugin version you pin in the checkout (version
      catalog `[plugins]` entry or a literal `id("…") version "…"`) and installs
      the CLI at *exactly* that version, so a new release can't float the CLI
      ahead of the applied plugin and silently break discovery. When no plugin
      pin is found — the auto-inject / zero-code path where the CLI injects a
      matching plugin via `--init-script` — it falls back to "latest". Set
      "latest" explicitly to keep the old floating behaviour, or "catalog" to
      track a specific `[versions]` key via `catalog-key`.
    default: 'auto'
  catalog-path:
    description: 'Path to the Gradle version catalog (when cli-version=catalog).'
    default: 'gradle/libs.versions.toml'
  catalog-key:
    description: '[versions] key to read (when cli-version=catalog).'
    default: 'composePreviewCli'
  skew-check:
    description: >
      Guardrail against CLI / Gradle-plugin version skew (issue #1920). After
      the CLI is installed, compare its resolved version against the plugin
      version pinned in the consumer's checkout (version catalog `[plugins]`
      entry or a literal `id("…") version "…"`). When the CLI is *newer* than
      the applied plugin — the case where the newer CLI silently fails to
      discover the older plugin and the render reports "no modules have the
      plugin applied" — surface an actionable message instead. `fail` (default)
      errors out fast; `warn` logs a `::warning::` and continues; `off` skips
      the check. Only acts when a concrete plugin version is detectable and both
      sides are clean releases, so auto-inject consumers tracking `latest` are
      never tripped.
    default: 'fail'
  timeout:
    description: 'CLI render timeout in seconds.'
    default: '600'
  development-branch:
    description: >
      Long-lived branch that drives baseline pushes. A `push` to this branch
      is what flips the action into baseline mode (a `workflow_dispatch`
      while sitting on this branch does the same). PRs targeting it run in
      comment mode.
    default: 'main'
  only:
    description: >
      Comma-separated subset of `compose,resources,a11y,notifications`. Empty
      = all pipelines. Applied before `skip`.
    default: ''
  skip:
    description: >
      Comma-separated pipelines to skip after `only` has been resolved.
    default: ''
  a11y-module:
    description: >
      Comma-separated Gradle module allowlist for the a11y pipeline
      (e.g. `samples:wear,samples:phone`). Empty (default) lets
      `compose-preview a11y` auto-detect every module the plugin knows
      about. A single value (`samples:wear`) still works for back-compat.
      Use `a11y-skip-modules` to exclude specific modules from the
      auto-detected set.
    default: ''
  a11y-skip-modules:
    description: >
      Comma-separated Gradle module denylist for the a11y pipeline.
      Applied after auto-discovery / the allowlist, so modules listed here
      are still rendered by the CLI but their findings are dropped from the
      combined report. Useful when one module's previews aren't
      a11y-ready yet.
    default: ''
  notifications-module:
    description: >
      Comma-separated Gradle module allowlist for the notifications
      pipeline (e.g. `samples:android,samples:wear`). Empty (default) runs
      the unscoped `composePreviewRenderAll` task, letting Gradle expand
      to every module that registers it. A single value still works for
      back-compat.
    default: ''
  notifications-skip-modules:
    description: >
      Comma-separated Gradle module denylist for the notifications
      pipeline. Applied after disk discovery, so modules listed here are
      built but their PNGs are dropped from the combined report.
    default: ''
  missing-renders:
    description: >
      Policy when `composePreviewRenderAll` finds previews in the manifest
      that produced no output PNG: `fail` (default — historical hard
      error), `warn` (log + keep going), or `ignore` (silent). Useful for
      multi-module runs where one module has a handful of stubborn
      previews you don't want to gate CI on. The action passes the value
      through as the `composePreview.missingRenders` Gradle property, so
      consumers don't need to wire it into their build files. Applies
      globally to every module the action invokes Gradle for (notifications
      pipeline + the compose / a11y pipelines via the CLI).
    default: 'fail'
  fonts-cache:
    description: >
      Persist the downloadable-font cache (`$XDG_CACHE_HOME/composeai/fonts`,
      else `~/.cache/composeai/fonts`) across runs with `actions/cache`.

      Without it every fresh runner re-fetches every `Font(GoogleFont(...))`
      face from the Google Fonts CSS API *during the render*, inside the
      Robolectric JVM. That is slow, but the real cost is correctness: the CSS
      API can serve a different face for the same `(family, weight, italic)` —
      a static sub-font at the exact weight vs the family's variable TTF — and
      those have different text metrics. A render that resolved the other one
      shifts its whole text layer by a fraction of a pixel, which reads as a
      spurious visual diff on a PR that changed nothing. Fetching once and
      reusing the bytes removes the per-run coin flip.

      The cache is append-only: entries are keyed by `(family, weight, italic)`
      and a given key always means the same face, so a run only ever adds to
      it. Set `false` to opt out (e.g. a consumer that vendors its own fonts,
      or an air-gapped runner with a pre-seeded directory).
    default: 'true'
  pr-number:
    description: 'Override for PR number when context is ambiguous.'
    default: ''
  comment-on-empty-diff:
    description: >
      Passthrough to the comment pipeline: post / update an empty-diff
      sticky comment instead of staying silent on no-change runs.
    default: 'false'
  mode:
    description: >
      Override the event-based mode selector: `auto` (default), `baseline`,
      `comment`, or `skip`.
    default: 'auto'
  ab-config:
    description: >
      Path (relative to the checkout) to the A/B comparison config JSON. When
      the file exists, preview variants it nominates — two `@Preview`
      annotations of one function (including multi-preview members) or two
      values of a `@PreviewParameter` — render side-by-side horizontally in
      the PR comment and baseline gallery instead of the default hero +
      "Other variants" links. Absent file = feature off (purely additive).
      See `.github/actions/apply/README.md` for the schema.
    default: '.github/preview-abtest.json'
  scope-config:
    description: >
      Path (relative to the checkout) to the change-scope config JSON. When
      the file exists and the run is a PR comment run, changed files are
      classified against it: PRs that only touch `ignorePaths` skip the
      pipelines entirely, and PRs whose changes all live inside modules
      under `scopedRoots` render only those modules plus their (transitive)
      Gradle dependents — out-of-scope baselines are carried, never
      reported as removed. Every ambiguous case (a file outside the scoped
      roots, a deleted module, a failed dependency-graph probe, no
      statically applied plugin) falls back to a full render, so scoping
      can only skip work that provably cannot change a preview. Absent
      file = feature off (purely additive). Baseline runs always render
      everything. See `.github/actions/apply/README.md` for the schema.
    default: '.github/preview-scope.json'
  scope:
    description: >
      Override for change-scoped rendering: `auto` (default — honour
      `scope-config` when present) or `full` (ignore the config and always
      render everything; useful for a manual full rerun).
    default: 'auto'
  skip-render:
    description: >
      When `true`, the compose and resources pipelines reuse pre-staged
      `_previews.json` / `_resources.json` at $GITHUB_WORKSPACE instead of
      invoking `compose-preview show` / `show-resources`. Lets non-Gradle
      build systems (Buck2, Bazel, Amper) drive the comment / baseline /
      push half of this action with envelopes produced by the Phase A
      CLIs (`preview-discovery`, `daemon-launch-builder`, `render-cli`).
      Pair with `cli-version: 'none'` if the CLI isn't needed at all;
      a11y / notifications pipelines still require it.
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Resolve mode + active pipelines
      id: resolve
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        DEV_BRANCH: ${{ inputs.development-branch }}
        MODE_OVERRIDE: ${{ inputs.mode }}
        ONLY: ${{ inputs.only }}
        SKIP: ${{ inputs.skip }}
      run: |
        set -euo pipefail
        # All four pipelines start ON, then `only` filters down, then `skip`
        # removes any pipelines explicitly turned off.
        compose=1; resources=1; a11y=1; notifications=1
        if [ -n "$ONLY" ]; then
          compose=0; resources=0; a11y=0; notifications=0
          IFS=',' read -r -a only_arr <<< "$ONLY"
          for p in "${only_arr[@]}"; do
            case "$(echo "$p" | xargs)" in
              compose) compose=1 ;;
              resources) resources=1 ;;
              a11y) a11y=1 ;;
              notifications) notifications=1 ;;
            esac
          done
        fi
        if [ -n "$SKIP" ]; then
          IFS=',' read -r -a skip_arr <<< "$SKIP"
          for p in "${skip_arr[@]}"; do
            case "$(echo "$p" | xargs)" in
              compose) compose=0 ;;
              resources) resources=0 ;;
              a11y) a11y=0 ;;
              notifications) notifications=0 ;;
            esac
          done
        fi

        # Mode selection. `auto` maps event_name → mode; explicit values pass
        # through. `skip` aborts the whole action with a notice.
        mode="$MODE_OVERRIDE"
        if [ "$mode" = "auto" ]; then
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              mode=comment ;;
            push)
              if [ "$REF_NAME" = "$DEV_BRANCH" ]; then
                mode=baseline
              else
                mode=skip
              fi ;;
            workflow_dispatch)
              if [ "$REF_NAME" = "$DEV_BRANCH" ]; then
                mode=baseline
              else
                mode=comment
              fi ;;
            *)
              mode=skip ;;
          esac
        fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "compose=$compose" >> "$GITHUB_OUTPUT"
        echo "resources=$resources" >> "$GITHUB_OUTPUT"
        echo "a11y=$a11y" >> "$GITHUB_OUTPUT"
        echo "notifications=$notifications" >> "$GITHUB_OUTPUT"
        echo "::notice::compose-preview/apply mode=$mode compose=$compose resources=$resources a11y=$a11y notifications=$notifications"
        if [ "$mode" = "skip" ]; then
          echo "::notice::No pipeline applicable for event=$EVENT_NAME ref=$REF_NAME — skipping."
        fi

    # Change-scoped rendering (see compute-scope.py). Always runs so its
    # `mode` output is the single source of truth downstream: it passes the
    # resolved mode through unchanged, except when a PR's changed files
    # provably cannot affect any preview — then mode flips to `skip` before
    # the CLI install pays any cost. Partial scopes (a module subset) flow
    # to the pipelines via the `modules` output; only the compose pipeline
    # renders scoped (the graph probe is skipped for the others), everything
    # else treats a partial scope as a full run. Fail-open throughout: any
    # doubt = full render.
    - name: Resolve change scope
      id: scope
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESOLVE_MODE: ${{ steps.resolve.outputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
        SCOPE_CONFIG: ${{ inputs.scope-config }}
        SCOPE_OVERRIDE: ${{ inputs.scope }}
        WANT_COMPOSE: ${{ steps.resolve.outputs.compose }}
        WANT_RESOURCES: ${{ steps.resolve.outputs.resources }}
        WANT_A11Y: ${{ steps.resolve.outputs.a11y }}
        WANT_NOTIFICATIONS: ${{ steps.resolve.outputs.notifications }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        MODE="$RESOLVE_MODE"
        MODULES="full"
        if [ "$MODE" = "comment" ] \
           && [ "$EVENT_NAME" = "pull_request" ] \
           && [ "$SCOPE_OVERRIDE" != "full" ] \
           && [ -n "$BASE_SHA" ] \
           && [ -f "$SCOPE_CONFIG" ]; then
          # Base must be reachable for the diff; any fetch/diff failure makes
          # compute-scope.py fall back to a full render. Token in the URL
          # because the checkout runs with persist-credentials: false.
          git fetch --no-tags --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "$BASE_SHA" 2>/dev/null || true
          # Only the compose pipeline renders scoped, so only it needs the
          # Gradle dependency-graph probe; the other pipelines just need the
          # none-vs-not-none answer.
          WANT_GRAPH=0
          [ "$WANT_COMPOSE" = "1" ] && WANT_GRAPH=1
          MODULES=$(WORKSPACE="$GITHUB_WORKSPACE" \
                    SCOPE_CONFIG="$SCOPE_CONFIG" \
                    BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" \
                    WANT_GRAPH="$WANT_GRAPH" \
                    python3 "$ACTION_PATH/compute-scope.py") || MODULES="full"
          [ -z "$MODULES" ] && MODULES="full"

          if [ "$MODULES" = "none" ]; then
            # A previous push may have posted sticky comments that now need
            # refreshing to their resolved state — in that case run full
            # rather than leaving a stale diff on the PR. Marker set is
            # limited to the pipelines this invocation owns.
            PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
            markers=()
            [ "$WANT_COMPOSE" = "1" ] && markers+=("<!-- preview-diff -->")
            [ "$WANT_RESOURCES" = "1" ] && markers+=("<!-- preview-diff-resources -->")
            [ "$WANT_A11Y" = "1" ] && markers+=("<!-- a11y-report -->")
            [ "$WANT_NOTIFICATIONS" = "1" ] && markers+=("<!-- notification-previews -->")
            if [ -z "$PR_NUMBER" ]; then
              echo "::notice::scope=none but no PR number to check for sticky comments — running full."
              MODULES="full"
            elif [ "${#markers[@]}" -gt 0 ]; then
              # Sticky comments start with their marker, so the first 120
              # chars of each body are enough to detect one.
              existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                --paginate --jq '.[].body | .[0:120]' 2>/dev/null || true)
              for mk in "${markers[@]}"; do
                if printf '%s' "$existing" | grep -qF "$mk"; then
                  echo "::notice::scope=none but a sticky comment ($mk) exists — running full so it gets refreshed."
                  MODULES="full"
                  break
                fi
              done
            fi
          fi

          if [ "$MODULES" = "none" ]; then
            MODE="skip"
            echo "::notice::compose-preview/apply: no render-affecting changes in this PR — skipping pipelines."
          elif [ "$MODULES" != "full" ]; then
            echo "::notice::compose-preview/apply: change-scoped render — modules: $MODULES"
          fi
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

    # Resolve `cli-version: auto` (the default, issue #1920) to a concrete
    # value before any install runs. `auto` pins the CLI to the plugin version
    # detected in the consumer's checkout so a new release can't float the CLI
    # ahead of the applied plugin (the silent skew this issue is about); with
    # no plugin pinned it falls back to `latest` (the auto-inject path). Every
    # other value (`latest` / `catalog` / literal / `source` / `none`) passes
    # straight through. Downstream steps gate on this resolved value, not the
    # raw input, so `auto` flows into the right install branch. Pure-Python,
    # reuses the skew guard's tested detection (single source of truth).
    - name: Resolve CLI version
      id: clivers
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI_VERSION: ${{ inputs.cli-version }}
        WORKSPACE: ${{ github.workspace }}
        CATALOG_PATH: ${{ inputs.catalog-path }}
      run: |
        set -euo pipefail
        if [ "$CLI_VERSION" = "auto" ]; then
          detected=$(python3 "$ACTION_PATH/check-skew.py" detect-plugin || true)
          if [ -n "$detected" ]; then
            eff="$detected"
            echo "::notice::compose-preview/apply: cli-version=auto pinned the CLI to the applied plugin v${eff} (skew-proof)."
          else
            eff="latest"
            echo "::notice::compose-preview/apply: cli-version=auto found no pinned plugin — using 'latest' (auto-inject path)."
          fi
        else
          eff="$CLI_VERSION"
        fi
        echo "version=$eff" >> "$GITHUB_OUTPUT"

    # See preview-baselines/action.yml history for the source-vs-release
    # rationale and for why these are full `org/repo/path@ref` references
    # rather than `./.github/actions/...` (relative `./` from inside a
    # composite resolves against the consumer's $GITHUB_WORKSPACE, breaking
    # external use). Tag bumped per release by release-please.
    - name: Install CLI from source
      if: steps.scope.outputs.mode != 'skip' && steps.clivers.outputs.version == 'source'
      # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
      uses: yschimke/compose-ai-tools/.github/actions/install-cli@v0.11.5 # x-release-please-version

    # `cli-version: 'none'` is the third install state — install is skipped
    # entirely. Compose / resources pipelines must then run with
    # `skip-render: true` and pre-staged JSON; a11y / notifications fail
    # cleanly with "command not found" when selected without a CLI.
    - name: Install CLI from release
      id: install-release
      if: steps.scope.outputs.mode != 'skip' && steps.clivers.outputs.version != 'source' && steps.clivers.outputs.version != 'none'
      # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
      uses: yschimke/compose-ai-tools/.github/actions/install@v0.11.5 # x-release-please-version
      with:
        version: ${{ steps.clivers.outputs.version }}
        catalog-path: ${{ inputs.catalog-path }}
        catalog-key: ${{ inputs.catalog-key }}

    # Guardrail against CLI / plugin version skew (issue #1920). The install
    # action resolved a concrete CLI version above; compare it against the
    # plugin version the consumer actually pins in their checkout. A CLI newer
    # than the applied plugin is the silent footgun that breaks discovery
    # repo-wide on every release — fail fast here with an actionable message
    # rather than letting the pipeline die downstream with the misleading
    # "no modules have the plugin applied". Skipped for `source` (internal CI,
    # no resolved release version) and `none` (no CLI installed). Pure-Python,
    # no Gradle cost — runs before doctor so the headline is the skew, not the
    # confusing symptom.
    - name: Check CLI / plugin version skew
      if: steps.scope.outputs.mode != 'skip' && steps.clivers.outputs.version != 'source' && steps.clivers.outputs.version != 'none'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESOLVED_CLI_VERSION: ${{ steps.install-release.outputs.version }}
        SKEW_MODE: ${{ inputs.skew-check }}
        WORKSPACE: ${{ github.workspace }}
        CATALOG_PATH: ${{ inputs.catalog-path }}
      run: python3 "$ACTION_PATH/check-skew.py"

    # Surface `compose-preview doctor`'s environment + project checks at
    # the top of the run, before any pipeline starts paying Gradle cost.
    # Mismatches the pipelines would otherwise hit deep in a render task
    # (missing JDK version for Robolectric on SDK 36+, plugin not applied
    # to any module, hamcrest-skew, etc.) show up here as a single
    # readable block. Doctor's exit code is intentionally not propagated:
    # the pipelines below will fail on their own with task-specific
    # stack traces, and double-failing on the same cause buries the
    # actionable error. A non-zero doctor surfaces as a `::warning::`
    # annotation so it's still visible in the run summary.
    - name: Run compose-preview doctor
      if: steps.scope.outputs.mode != 'skip' && steps.clivers.outputs.version != 'none'
      shell: bash
      run: |
        echo "::group::compose-preview doctor"
        rc=0
        compose-preview doctor || rc=$?
        echo "::endgroup::"
        if [ "$rc" -ne 0 ]; then
          echo "::warning::compose-preview doctor exited $rc — pipelines will still run, but expect them to fail with the same underlying cause. See the doctor block above for remediations."
        fi

    - name: Install perceptual-diff dependencies
      if: steps.scope.outputs.mode == 'comment' && (steps.resolve.outputs.compose == '1' || steps.resolve.outputs.resources == '1')
      shell: bash
      run: |
        # pixelmatch collapses sub-pixel rounded-corner noise that Compose's
        # stitched-LONG renderer can emit between runs (issue #190); the
        # resource pipeline uses the same fallback for adaptive-icon
        # composite jitter. Install failure falls back to the strict
        # sha-only comparison.
        python3 -m pip install --quiet 'pixelmatch==0.4.0' 'Pillow>=10' \
          || echo "pixelmatch install failed; falling back to strict-bytes diff" >&2

    - name: Install fallback CJK / Arabic / emoji fonts
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      run: |
        # Deterministic multilingual rendering. Skiko resolves any glyph a
        # preview's own FontFamily doesn't cover through the system fontconfig
        # set, so a `@Preview(locale = "ja" / "ar" / …)` renders tofu on a runner
        # that happens to lack CJK / Arabic / emoji faces. Install the Noto
        # fallbacks so those previews render the same on every runner.
        #
        # FALLBACK ONLY — apps keep control of their own typography, and the
        # existing Latin default is preserved unchanged:
        #   * A preview's declared FontFamily (and any face an app bundles into
        #     the font path ahead of its render — e.g. its branded .ttf copied
        #     into ~/.local/share/fonts + fc-cache, as design-parity does) wins:
        #     Compose matches those by family name and never consults the generic
        #     sans/serif/mono aliases. An app that ships its own CJK font renders
        #     in that font, exactly as on-device.
        #   * fonts-noto-core also carries Noto Sans/Serif, and fontconfig's
        #     60-latin.conf ranks Noto ahead of DejaVu for the generic families.
        #     Left alone, installing it would silently switch every default-font
        #     preview's Latin text to Noto — broad baseline churn, not just
        #     missing-glyph fill. So we pin the generics back to whatever they
        #     resolved to *before* the install, keeping Noto a pure last-resort
        #     fill for the codepoints the prior default lacks (CJK, Arabic, …).

        # 1. Record the pre-install generic defaults so we can preserve them.
        #    fc-match ships with the runner's base fontconfig; if it can't read a
        #    generic (empty), fall back to the historical DejaVu default rather
        #    than leaving the generic unpinned (and so churnable).
        prev_sans="$(fc-match -f '%{family}\n' sans-serif 2>/dev/null | head -n1 | cut -d, -f1)"
        prev_serif="$(fc-match -f '%{family}\n' serif 2>/dev/null | head -n1 | cut -d, -f1)"
        prev_mono="$(fc-match -f '%{family}\n' monospace 2>/dev/null | head -n1 | cut -d, -f1)"
        : "${prev_sans:=DejaVu Sans}"
        : "${prev_serif:=DejaVu Serif}"
        : "${prev_mono:=DejaVu Sans Mono}"

        # 2. Install the Noto fallbacks.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji

        # 3. Pin the generic families back to the recorded defaults so Noto stays
        #    fallback-only. A strong prepend beats 60-latin's Noto preference; the
        #    prior default lands first and Noto is only reached for glyphs it
        #    lacks. If a generic didn't resolve (empty), skip it rather than pin
        #    an empty family.
        {
          echo '<?xml version="1.0"?>'
          echo '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">'
          echo '<fontconfig>'
          for pair in "sans-serif:$prev_sans" "serif:$prev_serif" "monospace:$prev_mono"; do
            generic="${pair%%:*}"; family="${pair#*:}"
            [ -n "$family" ] || continue
            printf '  <match target="pattern"><test qual="any" name="family"><string>%s</string></test><edit name="family" mode="prepend" binding="strong"><string>%s</string></edit></match>\n' "$generic" "$family"
          done
          echo '</fontconfig>'
        } | sudo tee /etc/fonts/conf.d/99-preserve-generic-latin-default.conf >/dev/null

        fc-cache -f >/dev/null

        # 4. Log the resolved generics so any render shift is traceable to a font
        #    change rather than a silent default swap.
        echo "generic sans-serif → $(fc-match -f '%{family}\n' sans-serif) (was: ${prev_sans:-none})"
        echo "generic serif      → $(fc-match -f '%{family}\n' serif) (was: ${prev_serif:-none})"
        echo "generic monospace  → $(fc-match -f '%{family}\n' monospace) (was: ${prev_mono:-none})"

    # Resolve the same directory the renderer's `GoogleFontCache` uses, via the
    # same XDG rule as `composeAiFontsCacheDir` in the Gradle plugin. Computed
    # in a step (rather than hardcoded in the cache `path`) so the two can't
    # drift silently: if a runner sets XDG_CACHE_HOME, we cache what the render
    # will actually read rather than an empty `~/.cache` sibling.
    - name: Resolve downloadable-font cache dir
      id: fonts-dir
      if: inputs.fonts-cache == 'true' && steps.scope.outputs.mode != 'skip'
      shell: bash
      run: |
        set -euo pipefail
        base="${XDG_CACHE_HOME:-$HOME/.cache}"
        dir="$base/composeai/fonts"
        mkdir -p "$dir"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "downloadable-font cache: $dir"

    # Append-only cache, so the key is unique per run and `restore-keys` pulls
    # the newest prior entry. A fixed key would restore but never save, so a
    # face first seen on run N would be re-fetched on every run after it.
    # Split restore/save (rather than plain `actions/cache`) for the same reason
    # the android-all cache is split in integration.yml: a run that failed AFTER
    # paying the downloads still persists them, so the rerun starts warm.
    - name: Restore downloadable-font cache
      id: fonts-cache-restore
      if: inputs.fonts-cache == 'true' && steps.scope.outputs.mode != 'skip'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.fonts-dir.outputs.dir }}
        key: composeai-fonts-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          composeai-fonts-${{ runner.os }}-

    - name: Run pipelines
      id: pipelines
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      # Pipelines run back-to-back rather than in parallel: all four
      # invoke Gradle (directly or via the CLI) and all four `git fetch`
      # against the same `.git/`, so concurrent execution would either
      # contend on the Gradle build lock or race FETCH_HEAD. We accept the
      # latency in exchange for correctness; `set +e` lets one pipeline's
      # failure not block the next, and each pipeline writes its own rc
      # to `_<name>_rc`.
      #
      # Templated values go through env (zizmor: template-injection).
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
        MODE: ${{ steps.scope.outputs.mode }}
        RENDER_TIMEOUT: ${{ inputs.timeout }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        A11Y_MODULES: ${{ inputs.a11y-module }}
        A11Y_SKIP_MODULES: ${{ inputs.a11y-skip-modules }}
        NOTIFY_MODULES: ${{ inputs.notifications-module }}
        NOTIFY_SKIP_MODULES: ${{ inputs.notifications-skip-modules }}
        MISSING_RENDERS: ${{ inputs.missing-renders }}
        BASELINE_BRANCH: 'compose-preview/main'
        RESOURCE_BRANCH: 'compose-preview/resources/main'
        PR_HEAD_BRANCH: 'compose-preview/pr'
        RESOURCE_HEAD_BRANCH: 'compose-preview/resources/pr'
        A11Y_BASELINE_BRANCH: 'compose-preview/a11y/main'
        A11Y_PR_BRANCH: 'compose-preview/a11y/pr'
        NOTIFY_BASELINE_BRANCH: 'compose-preview/notifications/main'
        NOTIFY_PR_BRANCH: 'compose-preview/notifications/pr'
        WANT_COMPOSE: ${{ steps.resolve.outputs.compose }}
        WANT_RESOURCES: ${{ steps.resolve.outputs.resources }}
        WANT_A11Y: ${{ steps.resolve.outputs.a11y }}
        WANT_NOTIFICATIONS: ${{ steps.resolve.outputs.notifications }}
        SKIP_RENDER: ${{ inputs.skip-render }}
        AB_CONFIG: ${{ inputs.ab-config }}
        SCOPE_MODULES: ${{ steps.scope.outputs.modules }}
      run: |
        set +e
        export PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"

        # Seed rc files so the trailing "surface failures" step always
        # has something to read even if a pipeline never started.
        for p in compose resources a11y notifications; do
          echo "0" > "$GITHUB_WORKSPACE/_${p}_rc"
        done

        worst=0
        run_one() {
          local name="$1"
          echo "::group::${name} pipeline"
          bash "$ACTION_PATH/pipelines/${name}.sh"
          local rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ] && [ "$worst" -eq 0 ]; then
            worst="$rc"
          fi
        }

        [ "$WANT_COMPOSE" = "1" ] && run_one compose
        [ "$WANT_RESOURCES" = "1" ] && run_one resources
        [ "$WANT_A11Y" = "1" ] && run_one a11y
        [ "$WANT_NOTIFICATIONS" = "1" ] && run_one notifications

        echo "worst=$worst" >> "$GITHUB_OUTPUT"
        # Don't fail here — the trailing "surface failures" step decides
        # after pushes + comments have run.
        exit 0

    # `always()` so a render that failed partway still persists whatever it
    # fetched — the rerun does not re-download the same faces to fail the same
    # way. `continue-on-error` because a cache upload is never worth failing a
    # render over, and concurrent jobs (the compose and a11y jobs run as
    # separate workflow jobs on the same commit) will race to save: the loser
    # logs a "key already exists" warning, which is the expected steady state.
    - name: Save downloadable-font cache
      if: always() && inputs.fonts-cache == 'true' && steps.fonts-dir.outputs.dir != ''
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.fonts-dir.outputs.dir }}
        key: composeai-fonts-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Upload artifacts as top-level GHA steps (can't run from subshells).
    # Fires whenever the relevant pipeline flagged a non-zero render rc,
    # regardless of whether the orchestrator step itself succeeded.
    - name: Upload composePreviewRender reports
      if: always() && hashFiles('_compose_render_rc') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: composePreviewRender-reports
        path: |
          **/build/reports/tests/composePreviewRender/
          **/build/test-results/composePreviewRender/
          _previews.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload composePreviewRenderAndroidResources reports
      if: always() && hashFiles('_resources_render_rc') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: composePreviewRenderAndroidResources-reports
        path: |
          **/build/reports/tests/composePreviewRenderAndroidResources/
          **/build/test-results/composePreviewRenderAndroidResources/
          _resources.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload CLI JSON output on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: preview-cli-output
        path: |
          _previews.json
          _resources.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload notification renders artifact
      if: always() && steps.resolve.outputs.notifications == '1' && hashFiles('_notification_renders/findings.json') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: notification-previews
        path: _notification_renders/
        if-no-files-found: warn
        retention-days: 14

    # Pushes + comments run as top-level steps so artifact uploads /
    # comment upserts get named log lines in the workflow run, and so
    # GHA's `if:` can gate them per pipeline.

    - name: Push compose baseline / PR renders
      if: steps.scope.outputs.mode != 'skip' && steps.resolve.outputs.compose == '1'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ steps.scope.outputs.mode }}
      run: |
        set -euo pipefail
        if [ "$MODE" = "baseline" ]; then
          stage=_baselines
          # `_base_sha` in baseline mode tracks the freshly-pushed baseline
          # tip; not consumed by any comment step (we don't post on push).
          sha_out="$GITHUB_WORKSPACE/_baseline_pushed_sha"
        else
          stage=_pr_renders
          sha_out="$GITHUB_WORKSPACE/_head_sha"
        fi
        if [ ! -d "$stage" ] || [ ! -f "$stage/_push_branch" ]; then
          echo "compose push: nothing staged, skipping."
          : > "$sha_out"
          exit 0
        fi
        export MSG=$(cat "$stage/_push_msg")
        export TARGET_BRANCH=$(cat "$stage/_push_branch")
        export SKIP_IF_UNCHANGED=$(cat "$stage/_skip_if_unchanged")
        export SHA_OUTPUT_FILE="$sha_out"
        # Strip the metadata files before the helper does `git add -A`.
        rm -f "$stage/_push_msg" "$stage/_push_branch" "$stage/_skip_if_unchanged"
        cd "$stage"
        bash "$ACTION_PATH/lib/push-branch.sh"

    - name: Push resource baseline / PR renders
      if: steps.scope.outputs.mode != 'skip' && steps.resolve.outputs.resources == '1'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ steps.scope.outputs.mode }}
      run: |
        set -euo pipefail
        if [ "$MODE" = "baseline" ]; then
          stage=_resource_baselines
          sha_out="$GITHUB_WORKSPACE/_resource_baseline_pushed_sha"
        else
          stage=_pr_resource_renders
          sha_out="$GITHUB_WORKSPACE/_resource_head_sha"
        fi
        if [ ! -d "$stage" ] || [ ! -f "$stage/_push_branch" ]; then
          echo "resources push: nothing staged, skipping."
          : > "$sha_out"
          exit 0
        fi
        export MSG=$(cat "$stage/_push_msg")
        export TARGET_BRANCH=$(cat "$stage/_push_branch")
        export SKIP_IF_UNCHANGED=$(cat "$stage/_skip_if_unchanged")
        export SHA_OUTPUT_FILE="$sha_out"
        rm -f "$stage/_push_msg" "$stage/_push_branch" "$stage/_skip_if_unchanged"
        cd "$stage"
        bash "$ACTION_PATH/lib/push-branch.sh"

    - name: Generate compose PR comment body
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.compose == '1'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        PR_HEAD_BRANCH: 'compose-preview/pr'
        RESOURCE_HEAD_BRANCH: 'compose-preview/resources/pr'
        AB_CONFIG: ${{ inputs.ab-config }}
        SCOPE_MODULES: ${{ steps.scope.outputs.modules }}
      run: |
        set -euo pipefail
        # Compose comment is only meaningful when the compose pipeline
        # actually produced a non-empty previews.json + a baseline dir.
        # `pipelines/compose.sh` already treats an empty _previews.json as a
        # clean skip (no compose modules / zero previews), so match that here
        # with `-s` — otherwise a docs-only PR leaves an empty file that slips
        # past `-f` and errors in compare-previews.py.
        if [ ! -s _previews.json ] || [ ! -d _baselines ]; then
          echo "compose comment: nothing to compare, skipping."
          exit 0
        fi
        BASE_REF=$(cat _base_sha 2>/dev/null || echo "")
        [ -z "$BASE_REF" ] && BASE_REF="compose-preview/main"
        HEAD_REF=$(cat _head_sha 2>/dev/null || echo "")
        [ -z "$HEAD_REF" ] && HEAD_REF="$PR_HEAD_BRANCH"

        # A/B comparison config (default `.github/preview-abtest.json`). Pass
        # it through only when the file exists so the compare step degrades to
        # the historical layout for projects that don't opt in.
        AB_ARGS=()
        if [ -n "${AB_CONFIG:-}" ] && [ -f "$AB_CONFIG" ]; then
          AB_ARGS=(--ab-config "$AB_CONFIG")
        fi

        # Change-scoped runs rendered a module subset — tell the comparator
        # so out-of-scope baselines read as unchanged, not removed.
        SCOPE_ARGS=()
        if [ -n "${SCOPE_MODULES:-}" ] && [ "$SCOPE_MODULES" != "full" ]; then
          SCOPE_ARGS=(--scope-modules "$SCOPE_MODULES")
        fi

        python3 "$ACTION_PATH/../lib/compare-previews.py" compare _previews.json \
          --baselines _baselines/baselines.json \
          --baseline-renders _baselines/renders \
          --repo "$REPO" \
          --base-ref "$BASE_REF" \
          --head-ref "$HEAD_REF" \
          "${AB_ARGS[@]}" \
          "${SCOPE_ARGS[@]}" \
          > _comment_body.md

    # Sibling step for the resources comment — separately gated on
    # `resources == '1'` so `only: resources` runs still produce the
    # resource sticky comment when compose is skipped.
    - name: Generate resource PR comment body
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.resources == '1'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        BASELINE_BRANCH: 'compose-preview/main'
        RESOURCE_HEAD_BRANCH: 'compose-preview/resources/pr'
      run: |
        set -euo pipefail
        if [ ! -f _resources.json ]; then
          echo "resource comment: no _resources.json, skipping."
          exit 0
        fi
        # Fall back to BASELINE_BRANCH for the Before ref when the compose
        # pipeline didn't populate _base_sha (resources-only runs).
        BASE_REF=$(cat _base_sha 2>/dev/null || echo "")
        [ -z "$BASE_REF" ] && BASE_REF="$BASELINE_BRANCH"
        RESOURCE_BASE_REF=$(cat _resource_base_sha 2>/dev/null || echo "")
        [ -z "$RESOURCE_BASE_REF" ] && RESOURCE_BASE_REF="$BASE_REF"
        RESOURCE_HEAD_REF=$(cat _resource_head_sha 2>/dev/null || echo "")
        [ -z "$RESOURCE_HEAD_REF" ] && RESOURCE_HEAD_REF="$RESOURCE_HEAD_BRANCH"
        python3 "$ACTION_PATH/../lib/compare-previews.py" compare-resources \
          _resources.json \
          --baselines _baselines/resource-baselines.json \
          --baseline-renders _resource_baselines/renders \
          --repo "$REPO" \
          --base-ref "$RESOURCE_BASE_REF" \
          --head-ref "$RESOURCE_HEAD_REF" \
          > _comment_body_resources.md

    - name: Post or update compose PR comment
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.compose == '1' && hashFiles('_comment_body.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMENT_ON_EMPTY_DIFF: ${{ inputs.comment-on-empty-diff }}
      run: |
        set -euo pipefail
        export PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        export MARKER="<!-- preview-diff -->"
        export BODY_FILE="_comment_body.md"

        # cmd_compare's sentinel: empty diff. Skip a fresh post unless
        # comment-on-empty-diff=true; existing comments still get PATCHed
        # (PATCH doesn't notify).
        EXISTING_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          | head -1)
        if grep -qF "No visual changes detected." _comment_body.md \
           && [ "$COMMENT_ON_EMPTY_DIFF" != "true" ] \
           && [ -z "$EXISTING_ID" ]; then
          echo "No preview diff and no existing comment — skipping."
          exit 0
        fi
        bash "$ACTION_PATH/lib/post-comment.sh"

    - name: Post or update resource PR comment
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.resources == '1' && hashFiles('_comment_body_resources.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMENT_ON_EMPTY_DIFF: ${{ inputs.comment-on-empty-diff }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        MARKER="<!-- preview-diff-resources -->"

        COMMENT_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          | head -1)

        # Four-state resource comment shape (see preview-comment history):
        # diff+no-prior → post, diff+prior → PATCH, no-diff+prior → PATCH to
        # resolved body, no-diff+no-prior → only post resolved if
        # comment-on-empty-diff=true.
        RESOLVED_BODY="${MARKER}"$'\n'"## Resource Changes"$'\n\n'"_No resource changes in this PR's latest render._"
        # Route the populated-body path through post-comment.sh so a large
        # resource diff gets the same ARG_MAX streaming *and* the
        # 65,536-char truncation guard as every other comment (the helper
        # re-resolves the sticky comment by MARKER and PATCHes/posts).
        # RESOLVED_BODY is small and stays inline.
        if [ -s _comment_body_resources.md ]; then
          export PR_NUMBER MARKER
          export BODY_FILE="_comment_body_resources.md"
          bash "$ACTION_PATH/lib/post-comment.sh"
        elif [ -n "$COMMENT_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f body="$RESOLVED_BODY"
        elif [ "$COMMENT_ON_EMPTY_DIFF" = "true" ]; then
          gh pr comment "$PR_NUMBER" --body "$RESOLVED_BODY"
        fi

    - name: Push a11y baseline / PR renders
      id: push-a11y
      if: steps.scope.outputs.mode != 'skip' && steps.resolve.outputs.a11y == '1'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        stage=_a11y_renders
        if [ ! -d "$stage" ] || [ ! -f "$stage/_push_branch" ]; then
          echo "a11y push: nothing staged, skipping."
          echo "head_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        export MSG=$(cat "$stage/_push_msg")
        export TARGET_BRANCH=$(cat "$stage/_push_branch")
        export SKIP_IF_UNCHANGED=$(cat "$stage/_skip_if_unchanged")
        export SHA_OUTPUT_FILE="$GITHUB_WORKSPACE/_a11y_head_sha"
        rm -f "$stage/_push_msg" "$stage/_push_branch" "$stage/_skip_if_unchanged"
        cd "$stage"
        bash "$ACTION_PATH/lib/push-branch.sh"
        echo "head_sha=$(cat "$SHA_OUTPUT_FILE" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

    - name: Re-render a11y comment body with pushed SHA
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.a11y == '1' && hashFiles('_a11y_comment.md') != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        A11Y_PR_BRANCH: 'compose-preview/a11y/pr'
        HEAD_SHA: ${{ steps.push-a11y.outputs.head_sha }}
      run: |
        set -euo pipefail
        # Earlier comment-gen used the branch name; rewrite with the just-
        # pushed SHA so the image URLs survive PR merge.
        HEAD_REF="${HEAD_SHA:-$A11Y_PR_BRANCH}"
        python3 "$ACTION_PATH/../lib/a11y-report.py" comment \
          _a11y_renders/findings.json \
          --repo "$REPO" \
          --head-ref "$HEAD_REF" \
          > _a11y_comment.md

    - name: Upsert a11y PR comment
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.a11y == '1' && hashFiles('_a11y_comment.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        export PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        export MARKER="<!-- a11y-report -->"
        export BODY_FILE="_a11y_comment.md"
        bash "$ACTION_PATH/lib/post-comment.sh"

    - name: Push notifications baseline / PR renders
      id: push-notifications
      if: steps.scope.outputs.mode != 'skip' && steps.resolve.outputs.notifications == '1'
      shell: bash
      env:
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        stage=_notification_renders
        if [ ! -d "$stage" ] || [ ! -f "$stage/_push_branch" ]; then
          echo "notifications push: nothing staged, skipping."
          echo "head_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        export MSG=$(cat "$stage/_push_msg")
        export TARGET_BRANCH=$(cat "$stage/_push_branch")
        export SKIP_IF_UNCHANGED=$(cat "$stage/_skip_if_unchanged")
        export SHA_OUTPUT_FILE="$GITHUB_WORKSPACE/_notify_head_sha"
        rm -f "$stage/_push_msg" "$stage/_push_branch" "$stage/_skip_if_unchanged"
        cd "$stage"
        bash "$ACTION_PATH/lib/push-branch.sh"
        echo "head_sha=$(cat "$SHA_OUTPUT_FILE" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

    - name: Re-render notification comment body with pushed SHA
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.notifications == '1' && hashFiles('_notification_comment.md') != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        NOTIFY_PR_BRANCH: 'compose-preview/notifications/pr'
        NOTIFY_BASELINE_BRANCH: 'compose-preview/notifications/main'
        HEAD_SHA: ${{ steps.push-notifications.outputs.head_sha }}
      run: |
        set -euo pipefail
        HEAD_REF="${HEAD_SHA:-$NOTIFY_PR_BRANCH}"
        python3 "$ACTION_PATH/../lib/notification-previews.py" comment \
          _notification_renders/findings.json \
          --repo "$REPO" \
          --head-ref "$HEAD_REF" \
          --baseline _notification_baseline_findings.json \
          --baseline-branch "$NOTIFY_BASELINE_BRANCH" \
          > _notification_comment.md

    - name: Upsert notification PR comment
      if: steps.scope.outputs.mode == 'comment' && steps.resolve.outputs.notifications == '1'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        export PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        export MARKER="<!-- notification-previews -->"
        if [ -s _notification_comment.md ]; then
          export BODY_FILE="_notification_comment.md"
          bash "$ACTION_PATH/lib/post-comment.sh"
          exit 0
        fi
        # No-diff run. If an earlier push posted a sticky diff that no longer
        # holds, PATCH it to the resolved state instead of leaving it stale —
        # same four-state shape the resources comment uses. (PATCH doesn't
        # notify; a no-diff run with no prior comment stays silent.)
        [ -z "$PR_NUMBER" ] && exit 0
        COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          | head -1)
        if [ -n "$COMMENT_ID" ]; then
          RESOLVED_BODY="${MARKER}"$'\n'"## Notification Previews"$'\n\n'"_No notification preview changes in this PR's latest render._"
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f body="$RESOLVED_BODY" >/dev/null
        fi

    # Surface pipeline failures now that all pushes + comments have run.
    # Final exit code is the worst rc across pipelines: failed renders
    # still get their artifacts uploaded + the PR diff posted before this
    # flips the workflow red.
    - name: Surface pipeline failures
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        WORST_RC: ${{ steps.pipelines.outputs.worst }}
      run: |
        rc="${WORST_RC:-0}"
        for p in compose resources a11y notifications; do
          extra=$(cat "$GITHUB_WORKSPACE/_${p}_render_rc" 2>/dev/null || echo 0)
          if [ "$extra" -ne 0 ] && [ "$rc" -eq 0 ]; then
            rc="$extra"
          fi
        done
        if [ "$rc" -ne 0 ]; then
          echo "::error::One or more compose-preview pipelines exited non-zero (rc=$rc). Pushes + comments have been published; see uploaded reports for per-task stack traces." >&2
          exit "$rc"
        fi
