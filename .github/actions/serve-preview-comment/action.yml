name: 'Serve Preview Comment'
description: >
  Render the VS Code panel's `preview-harness` fixtures (every fixture
  × dark/light theme), compare against the baselines on
  `serve-preview/main`, and post a sticky before/after comment on the
  PR. Changed PNGs are appended as a new commit on the shared
  `serve-preview/pr` branch; the comment pins Before/After URLs to
  commit SHAs so the images keep resolving after merge. Same model as
  the composable `preview-comment` action — see that action for the
  rationale on the appended-history / shared-PR-branch design.

inputs:
  base-branch:
    description: 'Branch name for the baselines.'
    default: 'serve-preview/main'
  head-branch:
    description: 'Shared branch that accumulates per-PR render commits.'
    default: 'serve-preview/pr'
  pr-number:
    description: 'Pull request number (auto-detected from context if omitted).'
    default: ''
  comment-on-empty-diff:
    description: >
      When `false` (default), skip posting a fresh PR comment if there are
      no preview changes in this run — avoids notifying reviewers about a
      "no visual changes" comment on every push. An existing diff comment
      is still patched in place to reflect the empty state (PATCHing
      doesn't trigger notifications). Set to `true` to always post / update
      the comment.
    default: 'false'
  node-version:
    description: 'Node.js version for the harness.'
    default: '20'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          preview-server/preview-harness/package-lock.json

    - name: Install preview-server harness dependencies
      shell: bash
      working-directory: preview-server/preview-harness
      run: npm ci

    # Was installed by the extension's steps above until the extension moved to
    # yschimke/compose-preview-vscode; the server harness always needed it.
    - name: Install Playwright browser
      shell: bash
      working-directory: preview-server/preview-harness
      run: npx playwright install --with-deps chromium

    # The serve page captures. They used to run inside `harness:snapshot` above — 167 of that
    # command's 205 tests were these — and moved out with the harness. They still write
    # `<name>.<theme>.png`, and both harnesses' `out/` dirs are merged below, so the baselines on
    # `serve-preview/main` keep matching by name and nothing needs rebaselining.
    - name: Capture serve page snapshots
      shell: bash
      working-directory: preview-server/preview-harness
      run: npm run harness:pages

    - name: Test comparison scoring and annotation matching
      shell: bash
      working-directory: preview-server/preview-harness
      run: npm run harness:compare

    # One producer now that the panel's harness left with the extension. The staging
    # dir stays so re-adding a producer is a copy line rather than a rewrite.
    - name: Stage harness captures
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p _harness_out
        cp -a preview-server/preview-harness/out/. _harness_out/ 2>/dev/null || true
        echo "staged captures: $(ls _harness_out | wc -l)"

    - name: Fetch baselines
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        mkdir -p _serve_baselines
        if git ls-remote --exit-code origin "$BASE_BRANCH" >/dev/null 2>&1; then
          git fetch origin "$BASE_BRANCH"
          git show "origin/${BASE_BRANCH}:baselines.json" \
            > _serve_baselines/baselines.json 2>/dev/null || true
          # Extract the baseline `renders/` tree alongside `baselines.json`
          # so the pixelmatch-based perceptual filter in
          # `serve-preview-diff.py` has both PNGs to diff. Without this
          # the harness's ±1-channel antialiased-edge jitter (Chromium
          # rasterisation is not bitwise-deterministic between runs) trips
          # the sha comparison and surfaces a fake "changed" row in every
          # PR. `git archive` writes to stdout so the working tree is
          # untouched; failures (e.g. baseline branch has no `renders/`
          # tree yet) fall back to the strict-bytes path.
          git archive "origin/${BASE_BRANCH}" renders 2>/dev/null \
            | tar -x -C _serve_baselines/ 2>/dev/null || true
        else
          echo "No $BASE_BRANCH branch yet — treating all captures as new."
        fi

    - name: Install perceptual-diff dependencies
      shell: bash
      run: |
        # pixelmatch (Mapbox; AA-aware) collapses the antialiased-edge
        # jitter the harness emits between runs. If install fails, the
        # script falls back to strict sha-only comparison — same shape
        # as the composable preview-comment action.
        python3 -m pip install --quiet 'pixelmatch==0.4.0' 'Pillow>=10' \
          || echo "pixelmatch install failed; falling back to strict-bytes diff" >&2

    - name: Resolve Before ref
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        BASE_SHA=$(git ls-remote \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git" \
          "refs/heads/${BASE_BRANCH}" | awk '{print $1}')
        # First-ever run — fall back to the branch name; Before images will
        # 404 until the first baseline push lands, after which new comments
        # resolve to a SHA.
        if [ -z "$BASE_SHA" ]; then
          BASE_SHA="$BASE_BRANCH"
        fi
        echo "$BASE_SHA" > _serve_base_sha

    - name: Copy changed captures
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/../lib/serve-preview-diff.py" copy-changed \
          _harness_out \
          --baselines _serve_baselines/baselines.json \
          --baseline-renders _serve_baselines/renders \
          --output-dir _serve_pr_renders

    - name: Push PR captures
      shell: bash
      env:
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"

        if [ ! -d _serve_pr_renders/renders ] || \
           [ -z "$(ls -A _serve_pr_renders/renders 2>/dev/null)" ]; then
          echo "No changed captures to push."
          : > _serve_head_sha
          exit 0
        fi

        cd _serve_pr_renders
        git init -q
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git"

        git add -A
        TREE=$(git write-tree)

        MSG="Serve preview captures for PR #${PR_NUMBER} (${GITHUB_SHA::8})"

        # Retry-on-race — different PRs push to the same shared branch and
        # second-to-push hits "non-fast-forward". Same retry shape as
        # `Push PR renders` in `preview-comment/action.yml`.
        attempt=1
        while :; do
          PARENT=""
          if git fetch --depth=1 --quiet origin "$HEAD_BRANCH" 2>/dev/null; then
            PARENT=$(git rev-parse FETCH_HEAD)
          fi
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          if git push --quiet origin "${COMMIT}:refs/heads/${HEAD_BRANCH}" 2>&1; then
            echo "$COMMIT" > "$GITHUB_WORKSPACE/_serve_head_sha"
            exit 0
          fi
          if [ "$attempt" -ge 5 ]; then
            echo "Push to ${HEAD_BRANCH} failed after ${attempt} attempts." >&2
            exit 1
          fi
          delay=$((attempt * 2 + RANDOM % 3))
          echo "Push to ${HEAD_BRANCH} lost the race; retry ${attempt}/5 in ${delay}s…" >&2
          attempt=$((attempt + 1))
          sleep "$delay"
        done

    - name: Generate comment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
      run: |
        set -euo pipefail
        BASE_REF=$(cat _serve_base_sha)
        HEAD_REF=$(cat _serve_head_sha 2>/dev/null || true)
        if [ -z "$HEAD_REF" ]; then
          HEAD_REF="$HEAD_BRANCH"
        fi

        python3 "$ACTION_PATH/../lib/serve-preview-diff.py" compare \
          _harness_out \
          --baselines _serve_baselines/baselines.json \
          --baseline-renders _serve_baselines/renders \
          --repo "$REPO" \
          --base-ref "$BASE_REF" \
          --head-ref "$HEAD_REF" \
          --base-branch "$BASE_BRANCH" \
          > _serve_comment_body.md

    - name: Post or update PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMENT_ON_EMPTY_DIFF: ${{ inputs.comment-on-empty-diff }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        BODY=$(cat _serve_comment_body.md)
        MARKER="<!-- serve-preview-diff -->"
        # The marker this pipeline used before the rename. A PR opened while the old
        # name was live already carries a sticky comment stamped with it; searching
        # only for the new marker would miss that comment, post a second one, and
        # leave the first sitting there with a stale table under a heading naming a
        # component this repository no longer contains. Falling back to it patches
        # the existing comment instead, so each PR keeps exactly one current report.
        #
        # Transitional. Once no open PR predates the rename this can go — nothing
        # writes the legacy marker any more.
        LEGACY_MARKER="<!-- vscode-preview-diff -->"

        find_comment() {
          gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | startswith(\"$1\")) | .id" \
            | head -1
        }

        # `gh` isn't available on this self-hosted env in some contexts, but
        # it's preinstalled on github-hosted ubuntu-latest where this action
        # actually runs — same as the composable preview-comment action.
        COMMENT_ID=$(find_comment "$MARKER")
        if [ -z "$COMMENT_ID" ]; then
          COMMENT_ID=$(find_comment "$LEGACY_MARKER")
          if [ -n "$COMMENT_ID" ]; then
            echo "Patching the pre-rename sticky comment ${COMMENT_ID} (legacy marker)."
          fi
        fi

        if grep -qF "No visual changes detected." _serve_comment_body.md \
           && [ "$COMMENT_ON_EMPTY_DIFF" != "true" ] \
           && [ -z "$COMMENT_ID" ]; then
          echo "No serve-preview diff and no existing comment — skipping (comment-on-empty-diff=false)."
          exit 0
        fi

        if [ -n "$COMMENT_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f body="$BODY"
        else
          gh pr comment "$PR_NUMBER" --body "$BODY"
        fi
