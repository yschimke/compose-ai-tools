name: 'Notification Previews (deprecated shim)'
description: >
  DEPRECATED. Thin forwarder to `./.github/actions/apply` with
  `only: notifications` and the supplied mode. The legacy action hardcoded
  `samples:android` — the shim still defaults to that module so existing
  callers keep working; new consumers should call `apply` directly with
  the `notifications-module` input.

inputs:
  mode:
    description: "'baseline' or 'comment' — forwarded to apply.mode."
    required: true
  module:
    description: >
      Gradle module path. Forwarded to apply.notifications-module. Kept
      separate from the legacy hardcoded `samples:android` so consumers can
      generalise the shim path during the deprecation window.
    default: 'samples:android'
  baseline-branch:
    description: 'Ignored — apply hardcodes compose-preview/notifications/main.'
    default: 'compose-preview/notifications/main'
  pr-branch:
    description: 'Ignored — apply hardcodes compose-preview/notifications/pr.'
    default: 'compose-preview/notifications/pr'
  pr-number:
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::notification-previews is deprecated; call ./.github/actions/apply with only=notifications + notifications-module=<module> instead. See apply/action.yml for the input mapping."

    # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
    - uses: yschimke/compose-ai-tools/.github/actions/apply@v0.11.5 # x-release-please-version
      with:
        mode: ${{ inputs.mode }}
        only: 'notifications'
        notifications-module: ${{ inputs.module }}
        pr-number: ${{ inputs.pr-number }}
