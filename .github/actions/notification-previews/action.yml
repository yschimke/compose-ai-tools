name: 'Notification Previews'
description: >
  Render the `samples:android` notification previews (both
  `@NotificationPreview`-discovered functions and `@Preview` +
  notification-helper variants), stage the PNGs + JSON sidecars, and
  publish them to a shared branch (`compose-preview/notifications/main`
  for `push`, `compose-preview/notifications/pr` for `pull_request`).
  For PRs, also upserts a sticky comment showing added / changed /
  removed notifications vs the baseline. Mirrors the
  push-and-retry / comment-upsert recipe used by `a11y-report`, but
  scoped to the notification surface so its churn doesn't block the
  pixel-diff hot path.

inputs:
  mode:
    description: "'baseline' (push to `compose-preview/notifications/main`) or 'comment' (push to `compose-preview/notifications/pr` + upsert PR comment)"
    required: true
  baseline-branch:
    description: 'Long-lived branch holding the notification baseline'
    default: 'compose-preview/notifications/main'
  pr-branch:
    description: 'Shared branch that accumulates per-PR notification renders'
    default: 'compose-preview/notifications/pr'
  pr-number:
    description: 'Pull request number (auto-detected from context if omitted)'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Render samples:android previews
      shell: bash
      run: |
        set -euo pipefail
        # Same entry point the previous inline-workflow body used. Renders both
        # `@NotificationPreview`-discovered functions and the `@Preview` +
        # composable-helper variants that exercise `NotificationContent`.
        ./gradlew :samples:android:renderAllPreviews --no-daemon

    - name: Stage notification PNGs and JSON sidecars
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # The python helper enforces the "non-empty PNG set" guard the old
        # inline shell did, so a silent regression in discovery still hard-
        # fails CI. It also computes the per-PNG sha256 the comment uses
        # for added/changed/removed detection.
        python3 "$ACTION_PATH/../lib/notification-previews.py" stage \
          --build-dir samples/android/build/compose-previews \
          --output-dir _notification_renders

    - name: Fetch baseline findings
      if: inputs.mode == 'comment'
      shell: bash
      env:
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
      run: |
        set -euo pipefail
        # Pull `findings.json` from compose-preview/notifications/main so
        # the comment subcommand can compute the diff and stay silent when
        # nothing changed. Default to an empty entries list when the
        # branch hasn't been seeded yet — the python treats a missing
        # baseline the same as an empty one.
        if git ls-remote --exit-code origin "$BASELINE_BRANCH" >/dev/null 2>&1; then
          git fetch origin "$BASELINE_BRANCH"
          git show "origin/${BASELINE_BRANCH}:findings.json" \
            > _baseline_findings.json 2>/dev/null \
            || echo '{"entries":[]}' > _baseline_findings.json
        else
          echo '{"entries":[]}' > _baseline_findings.json
        fi

    - name: Generate PR comment body (and detect change vs baseline)
      id: comment
      if: inputs.mode == 'comment'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
      run: |
        set -euo pipefail
        # The python writes nothing when the diff vs baseline is empty, so
        # an empty file is the signal to skip both the push and the
        # upsert. `--head-ref` here is provisional (the SHA we'll push
        # isn't known yet); if we DO end up pushing, the next step
        # rewrites it.
        python3 "$ACTION_PATH/../lib/notification-previews.py" comment \
          _notification_renders/findings.json \
          --repo "$REPO" \
          --head-ref "$PR_BRANCH" \
          --baseline _baseline_findings.json \
          --baseline-branch "$BASELINE_BRANCH" \
          > _notification_comment.md
        if [ -s _notification_comment.md ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No notification changes vs ${BASELINE_BRANCH}; skipping push + comment."
        fi

    - name: Generate README for target branch
      if: inputs.mode == 'baseline' || steps.comment.outputs.changed == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        TARGET_BRANCH: ${{ inputs.mode == 'baseline' && inputs.baseline-branch || inputs.pr-branch }}
      run: |
        set -euo pipefail
        # Image URLs reference the branch name rather than a SHA — same
        # contract preview-baselines uses for the on-branch README. The PR
        # comment (regenerated below with the just-pushed SHA) is what
        # pins the URLs that need to survive the PR merge.
        python3 "$ACTION_PATH/../lib/notification-previews.py" readme \
          _notification_renders/findings.json \
          --repo "$REPO" \
          --branch "$TARGET_BRANCH" \
          --output _notification_renders/README.md

    - name: Push notification renders branch
      id: push
      if: inputs.mode == 'baseline' || steps.comment.outputs.changed == 'true'
      shell: bash
      env:
        # Route every templated value through env so a malicious branch /
        # PR-number input can't expand inside the shell body. (zizmor:
        # template-injection)
        MODE: ${{ inputs.mode }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GITHUB_TOKEN_INLINE: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$MODE" = "baseline" ]; then
          TARGET_BRANCH="$BASELINE_BRANCH"
        else
          TARGET_BRANCH="$PR_BRANCH"
        fi

        cd _notification_renders
        git init -q
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin \
          "https://x-access-token:${GITHUB_TOKEN_INLINE}@github.com/${REPO}.git"

        git add -A
        TREE=$(git write-tree)

        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        if [ "$MODE" = "baseline" ]; then
          MSG="Update notification baseline from ${GITHUB_SHA::8}"
        else
          MSG="Notification previews for PR #${PR_NUMBER} (${GITHUB_SHA::8})"
        fi

        # Append commit on top of existing tip so older PR comments pinned
        # to past SHAs stay reachable. Retry loop handles the push race
        # when two PRs finish concurrently against the shared
        # `compose-preview/notifications/pr` branch — same recipe as
        # a11y-report/action.yml.
        attempt=1
        while :; do
          PARENT=""
          if git fetch --depth=1 --quiet origin "$TARGET_BRANCH" 2>/dev/null; then
            PARENT=$(git rev-parse FETCH_HEAD)
            PARENT_TREE=$(git rev-parse "${PARENT}^{tree}")
            if [ "$MODE" = "baseline" ] && [ "$TREE" = "$PARENT_TREE" ]; then
              # Nothing changed vs the current baseline — skip the no-op
              # commit so the branch history doesn't grow on every CI run.
              echo "Notification baseline unchanged; skipping push."
              echo "head_sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi

          if git push --quiet origin "${COMMIT}:refs/heads/${TARGET_BRANCH}" 2>&1; then
            echo "head_sha=${COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$attempt" -ge 5 ]; then
            echo "Push to ${TARGET_BRANCH} failed after ${attempt} attempts." >&2
            exit 1
          fi
          delay=$((attempt * 2 + RANDOM % 3))
          echo "Push to ${TARGET_BRANCH} lost the race; retry ${attempt}/5 in ${delay}s…" >&2
          attempt=$((attempt + 1))
          sleep "$delay"
        done

    - name: Re-render PR comment body with pushed SHA
      if: inputs.mode == 'comment' && steps.comment.outputs.changed == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        HEAD_SHA: ${{ steps.push.outputs.head_sha }}
      run: |
        set -euo pipefail
        # The earlier comment-generation step used the branch name as a
        # provisional ref because the SHA wasn't known yet. Now that push
        # has run, swap in the actual SHA so the comment's image URLs stay
        # resolvable after compose-preview/notifications/pr advances or
        # the PR merges.
        HEAD_REF="${HEAD_SHA:-$PR_BRANCH}"
        python3 "$ACTION_PATH/../lib/notification-previews.py" comment \
          _notification_renders/findings.json \
          --repo "$REPO" \
          --head-ref "$HEAD_REF" \
          --baseline _baseline_findings.json \
          --baseline-branch "$BASELINE_BRANCH" \
          > _notification_comment.md

    - name: Upsert PR comment
      if: inputs.mode == 'comment' && steps.comment.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_INPUT_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        PR_NUMBER="${PR_INPUT_NUMBER:-$EVENT_PR_NUMBER}"
        BODY=$(cat _notification_comment.md)
        MARKER="<!-- notification-previews -->"

        COMMENT_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          | head -1)

        if [ -n "$COMMENT_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f body="$BODY"
        else
          gh pr comment "$PR_NUMBER" --body "$BODY"
        fi

    - name: Upload notification renders artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: notification-previews
        path: _notification_renders/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload renderPreviews reports on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: renderPreviews-reports
        path: |
          samples/android/build/reports/tests/renderPreviews/
          samples/android/build/test-results/renderPreviews/
        if-no-files-found: ignore
        retention-days: 14
