name: 'Compose Preview Baselines (deprecated shim)'
description: >
  DEPRECATED. Thin forwarder to `./.github/actions/apply` with
  `only: compose,resources` + `mode: baseline`. New consumers should call
  `apply` directly so they can opt into the a11y / notifications pipelines
  too.

inputs:
  cli-version:
    description: 'Forwarded to apply.cli-version.'
    # Stays 'latest', not 'auto': this shim forwards to a *pinned, released*
    # apply ref (`apply@vX` below, bumped by release-please), which may predate
    # the `auto` resolver and would pass `auto` straight to install as a literal
    # version (→ 404 on `vauto/...tar.gz`). The released apply still carries the
    # #1920 skew guardrail. New consumers should call `apply` directly, where
    # `auto` is the default.
    default: 'latest'
  catalog-path:
    default: 'gradle/libs.versions.toml'
  catalog-key:
    default: 'composePreviewCli'
  timeout:
    default: '600'
  branch:
    description: >
      Ignored — the unified `apply` action hardcodes
      `compose-preview/main` as the composable baseline branch. Override
      via `apply.development-branch` if you need a different trigger
      branch.
    default: 'compose-preview/main'
  resource-branch:
    description: >
      Ignored — `apply` always pushes resource baselines to
      `compose-preview/resources/main` when the resources pipeline has
      anything to push. Set `skip: resources` on `apply` to opt out.
    default: 'compose-preview/resources/main'

runs:
  using: 'composite'
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::preview-baselines is deprecated; call ./.github/actions/apply with mode=baseline + only=compose,resources instead. See apply/action.yml for the input mapping."

    # zizmor: ignore[known-vulnerable-actions] same-repo release action trips GitHub Advisories API 403 under GITHUB_TOKEN
    - uses: yschimke/compose-ai-tools/.github/actions/apply@v0.16.27 # x-release-please-version
      with:
        mode: baseline
        only: 'compose,resources'
        cli-version: ${{ inputs.cli-version }}
        catalog-path: ${{ inputs.catalog-path }}
        catalog-key: ${{ inputs.catalog-key }}
        timeout: ${{ inputs.timeout }}
