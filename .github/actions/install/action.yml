name: 'Install compose-preview CLI'
description: >
  Download a release of the compose-preview CLI and add its bin/ to
  $GITHUB_PATH. The version is a literal string (e.g. "0.8.1"), the
  word "latest" (resolved via the GitHub releases API), the word "pin"
  (the project's compose-preview version pin — the same value the CLI
  and the VS Code extension read, so one pin drives every entrypoint),
  or the word "catalog" (a specific Gradle version-catalog key).

  This is the consumer-facing install action. The sibling install-cli
  action — which builds the CLI from source — is internal to this
  repo's CI (see preview-baselines / preview-comment) and exists so
  PRs that change the CLI/plugin schema don't break against a stale
  released CLI. External consumers should use this action.

  Scope cuts vs. the yschimke/skills install.sh: no skill bundle, no JDK install,
  no Android SDK. CI consumers compose actions/setup-java and
  android-actions/setup-android themselves.

inputs:
  version:
    description: >
      Literal version (e.g. "0.8.1"), "latest", "pin", or "catalog". A
      leading "v" is stripped. "pin" reads the project's version pin —
      `composePreview.version` in gradle.properties, else the catalog
      key below — which is the same pin the CLI and the VS Code
      extension read, so CI installs the version the project chose.
      It fails (rather than falling back to "latest") when the project
      pins nothing, since a silent fallback is the skew this prevents.
    default: 'latest'
  catalog-path:
    description: >
      Path to the Gradle version catalog, used when version=catalog or
      version=pin.
    default: 'gradle/libs.versions.toml'
  catalog-key:
    description: >
      [versions] key to read, used when version=catalog or version=pin.
      Consumers pick their own key — the default matches the convention
      in the README's Renovate snippet.
    default: 'composePreviewCli'
  properties-path:
    description: >
      Path to the gradle.properties read for `composePreview.version`,
      used when version=pin.
    default: 'gradle.properties'
  github-token:
    description: >
      Token used to authenticate the releases API call (avoids the
      unauthenticated rate limit on shared GHA runners). Empty falls
      back to the workflow token (github.token) inside the steps below.
    default: ''
  plugin-readiness-timeout:
    description: >
      Seconds to wait for the resolved version's Gradle plugin to be
      resolvable from the Plugin Portal / Maven Central before failing
      with an explicit message. A release's CLI tarball is downloadable
      minutes — sometimes tens of minutes — before its plugin is, and a
      render dispatched in that window dies during configuration with an
      error that names the *consumer's* project (issue #5051). Waiting
      turns that hard failure into a delay; the failure at the end of the
      budget at least says what actually happened. Set to 0 to skip the
      probe entirely (for a job that installs the CLI without driving a
      Gradle build).
    default: '300'

outputs:
  version:
    description: 'Resolved version, no leading "v" (e.g. "0.8.1").'
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        CATALOG_PATH: ${{ inputs.catalog-path }}
        CATALOG_KEY: ${{ inputs.catalog-key }}
        PROPERTIES_PATH: ${{ inputs.properties-path }}
        # github-token override falls back to the workflow token so the
        # default path is "authenticated" without consumer ceremony.
        GITHUB_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ver=$(python3 "$ACTION_PATH/resolve-version.py")
        printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"
        printf '::notice::Resolved compose-preview version: %s\n' "$ver"

    # `version: latest` already prefers a release carrying its Maven-readiness marker
    # (resolve-version.py), so this normally passes on the first probe. It is here for every
    # other mode — a literal version, `pin`, `catalog` — where the version is whatever the
    # consumer named, and for the case where no release in the window has a marker at all.
    - name: Wait for the plugin to be published
      if: ${{ inputs.plugin-readiness-timeout != '0' }}
      shell: bash
      env:
        VER: ${{ steps.resolve.outputs.version }}
        BUDGET: ${{ inputs.plugin-readiness-timeout }}
      run: |
        set -uo pipefail

        # Digits only, before the value reaches any arithmetic expansion. Bash evaluates array
        # subscripts recursively inside $(( … )), so `x[$(cmd)]` would execute `cmd` — and this is a
        # consumer-facing input a caller could wire to a dispatch or pull-request value.
        case "$BUDGET" in
          ''|*[!0-9]*)
            printf '::error::plugin-readiness-timeout must be a whole number of seconds; got %s\n' "$BUDGET"
            exit 1
            ;;
        esac

        marker='ee.schimke.composeai.preview.gradle.plugin'
        marker_path="ee/schimke/composeai/preview/${marker}/${VER}/${marker}-${VER}.pom"
        # The marker POM is a `pom`-packaged stub whose only content is a dependency on the
        # implementation, in a different group. A 200 on it therefore does not mean the plugin
        # classpath resolves — during partial CDN propagation the marker can be up while the jar
        # the buildscript actually loads is not. Probe both.
        impl='compose-preview-plugin'
        impl_path="ee/schimke/composeai/${impl}/${VER}/${impl}-${VER}.jar"
        portal='https://plugins.gradle.org/m2'
        central='https://repo1.maven.org/maven2'

        last=""
        deadline=$(( $(date +%s) + BUDGET ))
        remaining() {
          local left=$(( deadline - $(date +%s) ))
          [ "$left" -lt 0 ] && left=0
          printf '%s' "$left"
        }

        # Each probe is bounded by what is left of the budget, so the step cannot overrun the number
        # of seconds the caller asked for by a whole probe cycle. Floors at 5s because curl treats
        # --max-time 0 as "no limit", which would be the opposite of the intent.
        probe() {
          local cap
          cap="$(remaining)"
          [ "$cap" -gt 30 ] && cap=30
          [ "$cap" -lt 5 ] && cap=5
          curl -sSL -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time "$cap" "$1" 2>/dev/null
        }

        # 0 = found on one of the mirrors, 1 = absent from all of them, 2 = no verdict (a registry
        # answered 429/5xx, which says "would not answer", not "artifact is missing"). Both
        # mirrors are always tried before a no-verdict, so a rate-limited portal cannot hide a
        # Central 200.
        check() {
          local url code inconclusive=0
          for url in "$@"; do
            code="$(probe "$url")"
            last="$code"
            if [ "$code" = "200" ]; then
              return 0
            fi
            case "$code" in
              429|5??) inconclusive=1 ;;
            esac
          done
          [ "$inconclusive" -eq 1 ] && return 2
          return 1
        }

        while :; do
          check "$portal/$marker_path" "$central/$marker_path"
          marker_state=$?
          check "$portal/$impl_path" "$central/$impl_path"
          impl_state=$?

          if [ "$marker_state" -eq 0 ] && [ "$impl_state" -eq 0 ]; then
            printf '✓ plugin %s:%s and its implementation are resolvable.\n' "$marker" "$VER"
            exit 0
          fi
          if [ "$marker_state" -eq 2 ] || [ "$impl_state" -eq 2 ]; then
            printf '::warning::compose-preview install: a registry answered %s while checking whether plugin %s is published; proceeding without a verdict.\n' "$last" "$VER"
            exit 0
          fi

          left="$(remaining)"
          if [ "$left" -le 0 ]; then
            break
          fi
          nap=15
          [ "$nap" -gt "$left" ] && nap="$left"
          printf 'plugin %s:%s not published yet (last HTTP %s); retrying in %ss (%ss of the %ss budget left).\n' "$marker" "$VER" "$last" "$nap" "$left" "$BUDGET"
          sleep "$nap"
        done

        printf '::error title=compose-preview plugin not published yet::The CLI release %s exists, but its Gradle plugin (%s:%s and its implementation ee.schimke.composeai:%s) is not resolvable from plugins.gradle.org or Maven Central after %ss (last HTTP %s). This is the publication window, not a problem with your project: a release is downloadable as a CLI before the plugin of the same version publishes. Re-run in a few minutes, or pin the previous release (version: <older>, or composePreview.version in gradle.properties).\n' "$VER" "$marker" "$VER" "$impl" "$BUDGET" "$last"
        exit 1

    - name: Download CLI
      shell: bash
      env:
        VER: ${{ steps.resolve.outputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
      run: |
        set -euo pipefail
        # Repo is hardcoded — the action ships from this repo and
        # downloads its own releases. Don't expose it as an input
        # (would invite use against forks with no integrity story).
        repo='yschimke/compose-ai-tools'
        asset="compose-preview-${VER}.tar.gz"
        url="https://github.com/${repo}/releases/download/v${VER}/${asset}"

        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT

        printf 'Downloading %s\n' "$url"
        # `--connect-timeout` and `--max-time` bound the worst case if the
        # release-asset URL redirects to a partially-uploaded blob (the
        # incomplete-release race that `resolve-version.py` defends against
        # for `version: latest`). With a literal version we can still be
        # pointed at an in-progress release; without timeouts the curl can
        # hang for minutes per retry instead of failing fast.
        curl -fL --retry 3 --retry-connrefused \
          --connect-timeout 30 --max-time 300 \
          -o "$tmp/$asset" "$url"

        # Best-effort sha256 verification via the releases API. The
        # asset's `digest` field is "sha256:<hex>". On failure (network,
        # rate limit, missing digest) we warn and continue — same
        # posture as the canonical installer (yschimke/skills), since the curl above already
        # rode HTTPS to github.com.
        api="https://api.github.com/repos/${repo}/releases/tags/v${VER}"
        if meta=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" 2>/dev/null); then
          # awk-parse to mirror yschimke/skills' scripts/install.sh (no jq on
          # macos-latest by default; avoids inline-Python heredoc
          # gymnastics inside command substitution).
          want=$(printf '%s' "$meta" | awk -v asset="$asset" '
            /"name":/ { in_asset = ($0 ~ asset) }
            in_asset && /"digest":/ {
              sub(/.*"digest":[[:space:]]*"sha256:/, "")
              sub(/".*/, "")
              print
              exit
            }
          ')
          if [ -n "${want:-}" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              got=$(sha256sum "$tmp/$asset" | awk '{print $1}')
            else
              got=$(shasum -a 256 "$tmp/$asset" | awk '{print $1}')
            fi
            if [ "$got" != "$want" ]; then
              printf '::error::sha256 mismatch for %s: expected %s, got %s\n' "$asset" "$want" "$got"
              exit 1
            fi
            printf 'Verified sha256: %s\n' "$got"
          else
            printf '::warning::No sha256 digest in release metadata for %s; skipping verification\n' "$asset"
          fi
        else
          printf '::warning::Could not fetch release metadata for v%s; skipping sha256 verification\n' "$VER"
        fi

        # Hardcoded install dir keeps the $GITHUB_PATH literal in the
        # next step a fixed string — zizmor's `github-env` rule rejects
        # expansion-backed values written to $GITHUB_PATH because any
        # attacker-influence over the expansion becomes attacker
        # influence over every later step's $PATH.
        sudo mkdir -p /opt/compose-preview
        sudo tar -xzf "$tmp/$asset" -C /opt/compose-preview --strip-components=1

    - name: Add CLI to PATH
      shell: bash
      run: echo '/opt/compose-preview/bin' >> "$GITHUB_PATH"
