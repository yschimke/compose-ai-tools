# Docker Compose stack for hosting compose-preview on a generic VPS
# (reference target: a Hetzner Cloud CAX21 — 4 Ampere/ARM vCPU, 8 GB).
#
# Identical in shape to deploy/oracle/docker-compose.yml — kept self-contained so
# each deploy target is copy-pasteable. Two services:
#   - preview: the desktop-only render server, built from the Cloud Run image
#     (deploy/cloudrun/Dockerfile). Not published — only Caddy reaches it.
#   - caddy:   reverse proxy terminating TLS. With a real DOMAIN it fetches a
#     Let's Encrypt cert automatically; the app's token stays the auth gate.
#
# Config comes from a .env file (setup.sh writes one): DOMAIN, SERVE_TOKEN.
services:
  preview:
    build:
      # Build context is the repo root (two levels up); reuse the Cloud Run image.
      context: ../..
      dockerfile: deploy/cloudrun/Dockerfile
    image: compose-preview:local
    restart: always
    environment:
      # Always-on box: keep the server warm (no idle exit).
      SERVE_MODULE: ":samples:cmp"
      SERVE_IDLE_EXIT: "0"
      # Public preview server by default (preview.coo.ee). Built from source, so
      # it has the new serve features immediately (no CLI release needed) and
      # serves the in-browser CMP tier from the image's local wasm build via
      # SERVE_WASM_DIR. For a token-gated box, set SERVE_PUBLIC=0 + SERVE_TOKEN.
      SERVE_PUBLIC: "${SERVE_PUBLIC:-1}"
      SERVE_CATALOGS: "${SERVE_CATALOGS:-compose-m3,wear-m3}"
      # App design systems published from their OWN repos, served but hidden from the
      # front-page nav — reachable at /<system>/ (and ?session=<system>). <system>@<owner>/<repo>
      # points serve at each app's design-artifacts/<system> branch; those branches are in
      # trust/producers.json so they badge Trusted(Branch).
      SERVE_CATALOGS_UNLISTED: "${SERVE_CATALOGS_UNLISTED:-meshcore-mobile@yschimke/meshcore-mobile,homeassistant-remotecompose@yschimke/homeassistant-remotecompose}"
      SERVE_TRUST_STORE: "${SERVE_TRUST_STORE:-trust/producers.json}"
      SERVE_WASM_DIR: "${SERVE_WASM_DIR:-compose-m3=samples/cmp-wasm-catalog/build/wasmDist}"
      SERVE_TOKEN: "${SERVE_TOKEN:-}"
      PORT: "8080"
    expose:
      - "8080"
    # One warm Desktop daemon fits comfortably in a few GB; this cap just keeps a
    # single render storm from eating the whole box. Default sized for a 4 GB VM;
    # raise to ~6g on an 8 GB box if renders get OOM-killed under load.
    mem_limit: 3g

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
