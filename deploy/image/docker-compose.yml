# Instant deploy: pull the prebuilt preview-host image (no build) behind Caddy.
#
# Set DOMAIN + SERVE_TOKEN in .env (setup.sh writes one), then:
#   docker compose up -d
#
# Pin a version with IMAGE_TAG=0.16.5 in .env (a bare tag); defaults to the latest tag.
#
# Auto-updates: the optional `watchtower` service (below) watches the :latest tag
# and pulls + recreates `preview` when a new release image is published. Leave
# IMAGE_TAG unset (it defaults to `latest`) for that to work. See README.md.
services:
  preview:
    image: "ghcr.io/yschimke/compose-preview-host:${IMAGE_TAG:-latest}"
    restart: always
    pull_policy: always
    environment:
      # Public preview server by default (preview.coo.ee): open, serving our
      # published design systems. The in-browser CMP Wasm tier rides --catalogs —
      # `serve` fetches each system's web/wasm/ from the trusted branch (the
      # prebuilt image has no catalog modules to build a local app from), so this
      # needs a CLI release that carries the branch-fetch + an up-to-date
      # design-artifacts/<system> branch. For a token-gated box instead, set
      # SERVE_PUBLIC=0 and SERVE_TOKEN in .env.
      SERVE_PUBLIC: "${SERVE_PUBLIC:-1}"
      SERVE_CATALOGS: "${SERVE_CATALOGS:-compose-m3,wear-m3}"
      # The image bakes a branch-trust store at /trust/producers.json and the
      # entrypoint defaults to it, so the published design-artifacts catalogs badge
      # as Trusted(Branch) out of the box — leave this unset. Set your own path to
      # pin different producers (mount it via volumes below), or the literal `none`
      # to run trustless. (Empty is NOT trustless — it falls back to the baked
      # default; use `none`.)
      SERVE_TRUST_STORE: "${SERVE_TRUST_STORE:-}"
      # Unused in public mode; required only when SERVE_PUBLIC=0.
      SERVE_TOKEN: "${SERVE_TOKEN:-}"
      SERVE_IDLE_EXIT: "0"
      PORT: "8080"
    # To pin your OWN producers, mount a trust store over the baked one and keep
    # SERVE_TRUST_STORE pointing at it:
    # volumes:
    #   - ./producers.json:/trust/producers.json:ro
    expose:
      - "8080"
    # The baked warm cache makes renders incremental; this just caps a render storm.
    mem_limit: 4g
    # Opt this service in to Watchtower auto-updates (caddy is intentionally left out).
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Auto-update: poll GHCR for a new :latest digest and recreate `preview` when the
  # release workflow publishes one. --label-enable scopes it to the labelled service
  # above; --cleanup prunes the superseded image. Comment this service out to manage
  # updates manually (docker compose pull && up -d). For a private GHCR package, mount
  # a registry config: `- ~/.docker/config.json:/config.json:ro`. See README.md.
  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
