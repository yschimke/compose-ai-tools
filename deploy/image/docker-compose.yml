# Instant deploy: pull the prebuilt preview-host image (no build) behind Caddy.
#
# Set DOMAIN + SERVE_TOKEN in .env (setup.sh writes one), then:
#   docker compose up -d
#
# Pin a version with IMAGE_TAG=0.16.33 in .env (a bare tag); defaults to the latest tag.
#
# Auto-updates are ZERO-DOWNTIME: the `rollout` service (below) polls GHCR and,
# when a new :latest is published, hands `preview` to docker-rollout — a fresh
# replica boots alongside the live one, Docker waits for its /healthz healthcheck,
# Caddy drains traffic onto it (dynamic upstreams + passive health), then the old
# replica retires. `watchtower` still rolls `caddy` (fixed 80/443 ports can't be
# scaled). Leave IMAGE_TAG unset (defaults to `latest`) for updates. See README.md.
#
# `name:` pins the Compose project name so the `rollout` container's `docker
# compose`/`docker rollout` targets the SAME project as the host regardless of the
# clone directory. Migrating a box first started without it is a one-time
# `docker compose down && up -d` (see README → Auto-updates).
name: compose-preview
services:
  preview:
    image: "ghcr.io/yschimke/compose-preview-host:${IMAGE_TAG:-latest}"
    restart: always
    pull_policy: always
    environment:
      # Public preview server by default (preview.coo.ee): open, serving our
      # published design systems. The in-browser CMP Wasm tier rides --catalogs —
      # `serve` fetches each system's web/wasm/ from the trusted branch (the
      # prebuilt image has no catalog modules to build a local app from), so this
      # needs a CLI release that carries the branch-fetch + an up-to-date
      # design-artifacts/<system> branch. For a token-gated box instead, set
      # SERVE_PUBLIC=0 and SERVE_TOKEN in .env.
      SERVE_PUBLIC: "${SERVE_PUBLIC:-1}"
      # The catalog set is BAKED INTO THE IMAGE (entrypoint): the front-page systems
      # (compose-m3,wear-m3,remote-m3) and the app systems served unlisted from their own repos
      # (meshcore-mobile, homeassistant-remotecompose, cadence). Leave these empty to inherit the
      # baked defaults — so a bare image pull self-heals without editing this compose.
      # Set your own comma list to override, or the literal `none` to serve none of that
      # kind. (Empty is NOT `none` — it falls back to the baked default.)
      SERVE_CATALOGS: "${SERVE_CATALOGS:-}"
      SERVE_CATALOGS_UNLISTED: "${SERVE_CATALOGS_UNLISTED:-}"
      # The image bakes a branch-trust store at /trust/producers.json and the
      # entrypoint defaults to it, so the published design-artifacts catalogs badge
      # as Trusted(Branch) out of the box — leave this unset. Set your own path to
      # pin different producers (mount it via volumes below), or the literal `none`
      # to run trustless. (Empty is NOT trustless — it falls back to the baked
      # default; use `none`.)
      SERVE_TRUST_STORE: "${SERVE_TRUST_STORE:-}"
      # Unused in public mode; required only when SERVE_PUBLIC=0.
      SERVE_TOKEN: "${SERVE_TOKEN:-}"
      SERVE_IDLE_EXIT: "0"
      # Live (daemon-backed) preview tier — ON by default and build-free. For a Trusted catalog that
      # carries an executable `liveBundle` (the desktop CMP `compose-m3`), serve fetches that bundle
      # from the trusted branch and launches a render daemon straight from it — no checkout, no
      # Gradle build. So a bare image pull "just works" with live CMP; the entrypoint defaults
      # SERVE_ALLOW_RENDER_TRUSTED=1 and auto-sizes SERVE_LIVE_SEATS from the box's RAM (unbounded
      # mem_limit below ⇒ physical RAM; e.g. an 8 GB host — what preview.coo.ee runs — derives 5
      # permits). Fail-closed: only Trusted catalogs execute. wear-m3 publishes an Android liveBundle
      # and this image bakes the Robolectric Android daemon + SDK, so it CAN render live (2 seat
      # permits) — but only once its stickers carry the `previewId` daemon mapping (the published
      # wear-m3 catalog doesn't yet, so the viewer serves it baked; see docs/public-preview-server.md).
      # remote-m3 carries no runnable bundle → baked PNG. Set SERVE_ALLOW_RENDER_TRUSTED=0
      # in .env to opt out (Wasm still carries CMP).
      #
      # SERVE_CATALOG_SOURCE_REPO is the OPTIONAL source-build fallback only (a catalog with a Gradle
      # `source` but no bundle): setting it makes the entrypoint clone that repo and pay a one-time
      # cold Gradle build at startup. Not needed for the published catalogs — leave it unset.
      SERVE_ALLOW_RENDER_TRUSTED: "${SERVE_ALLOW_RENDER_TRUSTED:-}"
      SERVE_REVISIONS_ALLOW: "${SERVE_REVISIONS_ALLOW:-}"
      SERVE_CATALOG_SOURCE_REPO: "${SERVE_CATALOG_SOURCE_REPO:-}"
      SERVE_CATALOG_SOURCE_REF: "${SERVE_CATALOG_SOURCE_REF:-}"
      SERVE_LIVE_SEATS: "${SERVE_LIVE_SEATS:-}"
      # Re-check each catalog's design-artifacts branch every N seconds and re-fetch on change, so a
      # regenerated branch reaches this running server without a restart (Watchtower only rolls the
      # image). Empty ⇒ the CLI default (600s); set 0 to disable and serve the boot snapshot only.
      SERVE_CATALOG_REFRESH: "${SERVE_CATALOG_REFRESH:-}"
      PORT: "8080"
    # To pin your OWN producers, mount a trust store over the baked one and keep
    # SERVE_TRUST_STORE pointing at it:
    # volumes:
    #   - ./producers.json:/trust/producers.json:ro
    expose:
      - "8080"
    # Container memory limit. Default UNBOUNDED (0 = no cgroup cap) so the box's full RAM is
    # available and the live-seat budget auto-sizes to it: the entrypoint reads the container's
    # memory limit and, finding none, falls back to physical RAM (~1 GB reserved for the host,
    # ~1.2 GB per live-seat permit, clamped [2, 8]). So a bigger dedicated box scales on its own —
    # redeploy and it uses the whole machine, no compose edit. Admission control (the live-seat
    # budget + the per-render concurrency limiter) is the memory guard here, not a hard cgroup kill.
    # Set PREVIEW_MEM_LIMIT in .env (e.g. `PREVIEW_MEM_LIMIT=4g`) to cap it on a shared host, which
    # also lowers the derived seat budget to match.
    mem_limit: "${PREVIEW_MEM_LIMIT:-0}"
    # Liveness for the rolling update. docker-rollout (driven by the `rollout`
    # service) waits for a freshly-started replica to report `healthy` BEFORE it
    # retires the old one, so this is the gate that makes updates zero-downtime.
    # `/healthz` is the app's ungated liveness route (returns "ok" once the HTTP
    # server is listening); `start_period` covers the cold-start catalog fetch +
    # warm render so a slow boot isn't counted as a failure.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    # NOT Watchtower-managed: Watchtower does an in-place stop→recreate (downtime).
    # `preview` is updated by docker-rollout instead (see the `rollout` service),
    # which needs the service to stay scalable — so no `container_name`, no
    # published host ports (only `expose` above), which is already the case.

  # Zero-downtime updater for `preview`: poll GHCR for a new :latest digest and,
  # when one lands, roll the service with docker-rollout (boot a new replica →
  # wait for its /healthz healthcheck → drain onto it → retire the old one) so
  # live traffic never sees a stop→recreate gap. Needs the Docker socket (like
  # Watchtower) and the compose project mounted read-only so it can pull + scale.
  # The docker-rollout plugin is the vendored ./docker-rollout, mounted into the
  # CLI plugins dir. For a private GHCR package the host daemon's creds are used
  # for the pull (docker login ghcr.io on the host) — no in-container config.
  # Set ROLLOUT_INTERVAL in .env to change the poll cadence (default 1200s).
  rollout:
    image: docker:27-cli
    restart: always
    depends_on:
      - preview
    environment:
      ROLLOUT_INTERVAL: "${ROLLOUT_INTERVAL:-1200}"
      ROLLOUT_HEALTH_TIMEOUT: "${ROLLOUT_HEALTH_TIMEOUT:-300}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose project (compose file + .env) so `docker compose`/`docker
      # rollout` can pull and scale `preview`. Read-only: compose never writes here.
      - ./:/workspace:ro
      # The vendored docker-rollout plugin → the CLI plugins dir (adds `docker rollout`).
      - ./docker-rollout:/usr/local/lib/docker/cli-plugins/docker-rollout:ro
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/rollout.sh", "--loop"]

  # Auto-update for `caddy` only: poll GHCR and recreate `caddy` when the
  # preview-caddy-image workflow publishes a new baked-Caddyfile image. `preview`
  # is intentionally NOT labelled here — it's rolled by the `rollout` service
  # above (zero-downtime) instead of Watchtower's in-place recreate. --label-enable
  # scopes Watchtower to the labelled services (just `caddy`); --cleanup prunes the
  # superseded image. Comment this out to manage caddy manually. For a private GHCR
  # package, mount a registry config: `- ~/.docker/config.json:/config.json:ro`.
  watchtower:
    # Maintained fork of the (now-stale) containrrr/watchtower: the upstream image's
    # baked Docker SDK negotiates API 1.25, which modern engines reject ("client
    # version 1.25 is too old. Minimum supported API version is 1.40"), so it silently
    # never updates anything. The fork is rebuilt against a current SDK. Pinned by
    # tag+digest; bump both together when adopting a newer release.
    image: ghcr.io/nicholas-fedor/watchtower:1.19.0@sha256:c1dfdf27fe805dcfefe1cf048cee6960a511c097a99aa355b0bc4be6e6bb3bdf
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 1200

  caddy:
    # The Caddyfile is BAKED into this image (preview-caddy-image.yml) instead of
    # bind-mounted, so a config change auto-deploys via Watchtower like the server
    # (Watchtower watches image digests, not files). DOMAIN is still substituted
    # from .env at runtime. Pin a config with CADDY_IMAGE_TAG=<sha> in .env; leave
    # it unset for the auto-updating :latest. (Migrating an existing box: the first
    # `docker compose up -d` after adopting this compose swaps caddy:2 + the mount
    # for this image — a one-time step; edits then ride Watchtower.)
    image: "ghcr.io/yschimke/compose-preview-caddy:${CADDY_IMAGE_TAG:-latest}"
    pull_policy: always
    restart: always
    depends_on:
      - preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Opt in to Watchtower so a new baked-Caddyfile image rolls onto this box.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  caddy_data:
  caddy_config:
