# Instant deploy: pull the prebuilt preview-host image (no build) behind Caddy.
#
# Set DOMAIN + SERVE_TOKEN in .env (setup.sh writes one), then:
#   docker compose up -d
#
# Pin a version with IMAGE_TAG=0.16.33 in .env (a bare tag); defaults to the latest tag.
#
# Auto-updates are ZERO-DOWNTIME: the `rollout` service (below) polls GHCR and,
# when a new :latest is published, hands `preview` to docker-rollout — a fresh
# replica boots alongside the live one, Docker waits for its /readyz healthcheck
# (green only once a preview actually renders — see the `preview` healthcheck),
# Caddy drains traffic onto it (dynamic upstreams + passive health), then the old
# replica retires. `watchtower` still rolls `caddy` (fixed 80/443 ports can't be
# scaled). Leave IMAGE_TAG unset (defaults to `latest`) for updates. See README.md.
#
# `name:` pins the Compose project name so the `rollout` container's `docker
# compose`/`docker rollout` targets the SAME project as the host regardless of the
# clone directory. Migrating a box first started without it needs a one-time stop
# of the OLD directory-derived project first (`docker compose -p <old> down`, e.g.
# `-p image`) THEN `up -d` — a plain `down` would target this new name and leave
# the old stack colliding on 80/443. See README → Auto-updates.
name: compose-preview
services:
  preview:
    image: "ghcr.io/yschimke/compose-preview-host:${IMAGE_TAG:-latest}"
    restart: always
    pull_policy: always
    environment:
      DOMAIN: "${DOMAIN:-}"
      # Public preview server by default (preview.coo.ee): open, serving our
      # published design systems. The in-browser CMP Wasm tier rides --catalogs —
      # `serve` fetches each system's web/wasm/ from the trusted branch (the
      # prebuilt image has no catalog modules to build a local app from), so this
      # needs a CLI release that carries the branch-fetch + an up-to-date
      # design-artifacts/<system> branch. For a token-gated box instead, set
      # SERVE_PUBLIC=0 and SERVE_TOKEN in .env.
      SERVE_PUBLIC: "${SERVE_PUBLIC:-1}"
      # The catalog set is CONFIG, not image content: it lives in catalogs.json on the
      # `preview_config` volume below (/config/catalogs.json), which the entrypoint seeds
      # from the image's default on first boot and never overwrites again. Edit that file
      # (docker compose exec preview vi /config/catalogs.json, then restart) or POST to
      # /admin/catalogs to publish a catalog — no image rebuild, no compose edit.
      SERVE_CATALOGS_FILE: "${SERVE_CATALOGS_FILE:-}"
      # Top-level sites: <host>=<system>[,…] — serve one of those catalogs on a hostname of its
      # own, where it looks like the whole server (e.g. m3.preview.coo.ee=m3-catalog). Same
      # sessions, same pixels, no extra load; the proxy in front must route + terminate TLS for
      # the hostname. catalogs.json's "sites" is the durable form of the same setting.
      SERVE_SITES: "${SERVE_SITES:-}"
      # Runtime admin, gating BOTH surfaces: the catalog set (GET/POST /admin/catalogs, DELETE
      # /admin/catalogs/<system>) and the producer-trust store (GET/POST/DELETE /admin/trust).
      # Set a strong secret in .env to enable; unset (default) means the routes don't exist.
      # It is NOT the browse token — a public box gives that one to every visitor.
      #
      # On a box with SERVE_ALLOW_RENDER_TRUSTED on (the default), this token is effectively a
      # code-execution credential: trusting a branch makes that producer's Compose eligible for
      # server-side re-render here. Treat it like a deploy key, not a read token.
      SERVE_ADMIN_TOKEN: "${SERVE_ADMIN_TOKEN:-}"
      # Privacy-minimal aggregate app/catalog + preview views, persisted on preview_config.
      SERVE_ENGAGEMENT_FILE: "${SERVE_ENGAGEMENT_FILE:-}"
      # Optional GitHub OAuth auth for code-running surfaces. Empty values keep public catalog
      # browsing unchanged. Empty SERVE_GITHUB_AUTH_USERS lets any signed-in GitHub user use live
      # preview; playground also requires access to SERVE_GITHUB_AUTH_REPO.
      SERVE_GITHUB_AUTH_CLIENT_ID: "${SERVE_GITHUB_AUTH_CLIENT_ID:-}"
      SERVE_GITHUB_AUTH_CLIENT_SECRET: "${SERVE_GITHUB_AUTH_CLIENT_SECRET:-}"
      SERVE_GITHUB_AUTH_COOKIE_SECRET: "${SERVE_GITHUB_AUTH_COOKIE_SECRET:-}"
      SERVE_GITHUB_AUTH_REPO: "${SERVE_GITHUB_AUTH_REPO:-yschimke/compose-ai-tools}"
      SERVE_GITHUB_AUTH_CALLBACK_BASE_URL: "${SERVE_GITHUB_AUTH_CALLBACK_BASE_URL:-}"
      # Scopes the auth cookies to a parent domain so ONE sign-in covers this host and every
      # SERVE_SITES hostname under it. Empty derives it from DOMAIN when sites are configured (see
      # entrypoint.sh); `none` keeps cookies host-only, which withholds sign-in on every site host.
      SERVE_GITHUB_AUTH_COOKIE_DOMAIN: "${SERVE_GITHUB_AUTH_COOKIE_DOMAIN:-}"
      SERVE_GITHUB_AUTH_USERS: "${SERVE_GITHUB_AUTH_USERS:-}"
      # Empty derives the OAuth scope from the gating repo's visibility (public ⇒ read:user,
      # private ⇒ read:user repo). Only set this when a GitHub App or org policy demands one.
      SERVE_GITHUB_AUTH_SCOPE: "${SERVE_GITHUB_AUTH_SCOPE:-}"
      # Optional ADDITIONS to that file, for one extra catalog without editing config:
      # <system>@<owner>/<repo>, comma-separated. Empty (the default) = the file decides.
      SERVE_CATALOGS: "${SERVE_CATALOGS:-}"
      SERVE_CATALOGS_UNLISTED: "${SERVE_CATALOGS_UNLISTED:-}"
      # Maximum catalog images registered by the server. Images remain lazily fetched; raise this
      # when a catalog set legitimately exceeds the CLI default.
      SERVE_CATALOG_MAX_IMAGES: "${SERVE_CATALOG_MAX_IMAGES:-}"
      # The producer-trust store is config, like catalogs.json: it lives on the
      # `preview_config` volume at /config/producers.json, seeded on first boot from the
      # store baked at /trust/producers.json and never overwritten again — so the published
      # design-artifacts catalogs badge as Trusted(Branch) out of the box, AND a producer
      # added later (by editing that file, or POSTing to /admin/trust) survives image rolls
      # without a rebuild. Leave this unset. Set your own path to pin different producers
      # (mount it via volumes below), or the literal `none` to run trustless. (Empty is NOT
      # trustless — it falls back to the default; use `none`.)
      SERVE_TRUST_STORE: "${SERVE_TRUST_STORE:-}"
      # Unused in public mode; required only when SERVE_PUBLIC=0.
      SERVE_TOKEN: "${SERVE_TOKEN:-}"
      SERVE_IDLE_EXIT: "0"
      # Per-render/build budget handed to `serve --timeout`. Empty ⇒ the image's baked 1800s,
      # generous enough that a cold first render on a slow box doesn't trip the CLI's 300s default.
      SERVE_TIMEOUT: "${SERVE_TIMEOUT:-}"
      # Optional extra/override Wasm apps (`system=/path[,system=/path…]`). The image's own
      # `/wasm/preview-ui/` app is packaged and enabled automatically; published catalog apps still
      # ride --catalogs. Most deployments should leave this empty.
      SERVE_WASM_DIR: "${SERVE_WASM_DIR:-}"
      # Live (daemon-backed) preview tier — ON by default and build-free. For a Trusted catalog that
      # carries an executable `liveBundle` (the desktop CMP `compose-m3`), serve fetches that bundle
      # from the trusted branch and launches a render daemon straight from it — no checkout, no
      # Gradle build. So a bare image pull "just works" with live CMP; the entrypoint defaults
      # SERVE_ALLOW_RENDER_TRUSTED=1 and auto-sizes SERVE_LIVE_SEATS from the box's RAM (unbounded
      # mem_limit below ⇒ physical RAM; e.g. an 8 GB host — what preview.coo.ee runs — derives 5
      # permits). Fail-closed: only Trusted catalogs execute. wear-m3 publishes an Android liveBundle
      # and this image bakes the Robolectric Android daemon + SDK, so it CAN render live (2 seat
      # permits). remote-m3 publishes an IR-backed Android liveBundle: the daemon replays its
      # carried `ir/*.rc` documents directly, enabling Java / CMP Android selection alongside the
      # browser JS and isolated CMP JVM players. Set SERVE_ALLOW_RENDER_TRUSTED=0 in .env to opt out
      # (Wasm and browser-side Remote Compose still work).
      #
      # SERVE_CATALOG_SOURCE_REPO is the OPTIONAL source-build fallback only (a catalog with a Gradle
      # `source` but no bundle): setting it makes the entrypoint clone that repo and pay a one-time
      # cold Gradle build at startup. Not needed for the published catalogs — leave it unset.
      SERVE_ALLOW_RENDER_TRUSTED: "${SERVE_ALLOW_RENDER_TRUSTED:-}"
      SERVE_REVISIONS_ALLOW: "${SERVE_REVISIONS_ALLOW:-}"
      SERVE_CATALOG_SOURCE_REPO: "${SERVE_CATALOG_SOURCE_REPO:-}"
      SERVE_CATALOG_SOURCE_REF: "${SERVE_CATALOG_SOURCE_REF:-}"
      # Where that optional clone lands inside the container. Empty ⇒ /catalog-src.
      SERVE_CATALOG_SOURCE_ROOT: "${SERVE_CATALOG_SOURCE_ROOT:-}"
      SERVE_LIVE_SEATS: "${SERVE_LIVE_SEATS:-}"
      # Background theme-optimizer renders admitted at once, server-wide. Empty leaves the server's
      # derivation from the seat budget, which clamps at 3 and reaches that at 8 seats — so raising
      # SERVE_LIVE_SEATS alone does not widen this lane.
      SERVE_BACKGROUND_RENDERS: "${SERVE_BACKGROUND_RENDERS:-}"
      # Extra JVM options, appended to the image's baked JAVA_TOOL_OPTIONS by the entrypoint.
      # Set JAVA_TOOL_OPTIONS directly and you replace the baked string instead — see the README.
      SERVE_JAVA_OPTS: "${SERVE_JAVA_OPTS:-}"
      # Playground compile lane. Off by default: it runs visitor-supplied Kotlin and needs both a
      # catalog liveBundle classpath plus a sandbox profile on public hosts. Set the bundle path(s)
      # to local files available inside the container, for example a bind mount under /config.
      #
      # SERVE_PLAYGROUND=1 turns on the RUNTIME CATALOG SELECTOR: instead of compiling every
      # snippet against one pinned bundle, the editor offers the catalogs this box already serves
      # and the chosen catalog's own liveBundle picks the renderer, the dependencies and the mode
      # set. That is what makes the Android / Remote Compose modes reachable here — this image
      # already bakes the Robolectric sidecar (/opt/lib-daemon-android) and android.jar
      # (ANDROID_HOME=/opt/android-sdk), so an Android-backed catalog like `wear-m3` compiles and
      # renders with no extra image content. Without it, `SERVE_PLAYGROUND_BUNDLE` alone pins the
      # host to that single catalog and the viewer's playground handoff is hidden for every other
      # one (see PlaygroundCompileService.compilesCatalog).
      #
      # It composes with the pin: SERVE_PLAYGROUND_BUNDLE stays the preselected "Server default"
      # entry. Enabling the selector never widens who may compile — the public-host admission gate
      # (GitHub repo access, or a sandbox that passes the preflight) is unchanged.
      SERVE_PLAYGROUND: "${SERVE_PLAYGROUND:-}"
      # How many DISTINCT catalogs the selector may hold resolved classpaths for at once. Empty ⇒
      # the CLI default (6); past the bound a run naming a new catalog is refused rather than
      # evicting a warm one.
      SERVE_PLAYGROUND_CATALOG_LIMIT: "${SERVE_PLAYGROUND_CATALOG_LIMIT:-}"
      SERVE_PLAYGROUND_BUNDLE: "${SERVE_PLAYGROUND_BUNDLE:-}"
      SERVE_PLAYGROUND_ANDROID_BUNDLE: "${SERVE_PLAYGROUND_ANDROID_BUNDLE:-}"
      # Use `bwrap` here — bubblewrap is installed in this image for exactly this. Do NOT use a
      # `custom:` argv: it is a static prefix that is handed no per-session paths, so it cannot bind
      # the work dir a compile needs, and the loose argv people write instead passes for configured
      # while containing nothing (issue #3211). `bwrap` builds its own argv from those paths.
      SERVE_PLAYGROUND_SANDBOX: "${SERVE_PLAYGROUND_SANDBOX:-}"
      SERVE_PLAYGROUND_SANDBOX_MEMORY_MB: "${SERVE_PLAYGROUND_SANDBOX_MEMORY_MB:-}"
      SERVE_PLAYGROUND_SANDBOX_CPUS: "${SERVE_PLAYGROUND_SANDBOX_CPUS:-}"
      SERVE_PLAYGROUND_SANDBOX_PIDS: "${SERVE_PLAYGROUND_SANDBOX_PIDS:-}"
      SERVE_PLAYGROUND_SANDBOX_TTL: "${SERVE_PLAYGROUND_SANDBOX_TTL:-}"
      # Extra host paths bound READ-ONLY into the jail. `bwrap` unshares the network, so a cache the
      # render would otherwise download has to be on this list AND already warm: in practice
      # /root/.m2/repository for Robolectric plus /root/.cache/composeai/fonts for prewarmed
      # downloadable fonts (a cold cache inside the networkless jail cannot fill itself).
      SERVE_PLAYGROUND_SANDBOX_RO: "${SERVE_PLAYGROUND_SANDBOX_RO:-}"
      SERVE_PLAYGROUND_COMPILE_SLOTS: "${SERVE_PLAYGROUND_COMPILE_SLOTS:-}"
      # PER-CALLER compile budget. Every other playground bound above is a whole-host one, so
      # without this one caller can hold every compile slot. Empty ⇒ the CLI defaults (10
      # compiles/minute, 1 concurrent); set SERVE_PLAYGROUND_RATE_LIMIT=0 to disable the limiter.
      SERVE_PLAYGROUND_RATE_LIMIT: "${SERVE_PLAYGROUND_RATE_LIMIT:-}"
      SERVE_PLAYGROUND_CALLER_CONCURRENCY: "${SERVE_PLAYGROUND_CALLER_CONCURRENCY:-}"
      # Experimental: one explicit GitHub-authenticated stateful editing lease for the whole host.
      SERVE_PLAYGROUND_EDITING: "${SERVE_PLAYGROUND_EDITING:-0}"
      SERVE_PLAYGROUND_EDIT_LEASE_TTL: "${SERVE_PLAYGROUND_EDIT_LEASE_TTL:-}"
      # Attribute a request to the X-Forwarded-For peer rather than the proxy's own address, so the
      # per-caller budget above counts real visitors instead of lumping them under Caddy. ONLY safe
      # behind a proxy that appends the peer address it saw — which the `caddy` service below is.
      SERVE_TRUST_FORWARDED_FOR: "${SERVE_TRUST_FORWARDED_FOR:-}"
      # Re-check each catalog's design-artifacts branch every N seconds and re-fetch on change, so a
      # regenerated branch reaches this running server without a restart (Watchtower only rolls the
      # image). Empty ⇒ the CLI default (600s); set 0 to disable and serve the boot snapshot only.
      SERVE_CATALOG_REFRESH: "${SERVE_CATALOG_REFRESH:-}"
      # RSS feed history work sleeps after this many seconds without a feed request. Empty ⇒ 7 days.
      SERVE_CATALOG_FEED_IDLE: "${SERVE_CATALOG_FEED_IDLE:-}"
      # Warmed theme renders (the per-catalog theme cache) survive container recreation, which is
      # what the rolling update below performs — so a restart no longer discards hours of background
      # warming. Points at the dedicated `preview_theme_cache` volume mounted below; set
      # SERVE_THEME_CACHE_DIR=none in .env to go back to a memory-only cache.
      #
      # **This defaulted to `none` — OFF — and that made theme optimization unable to finish.**
      # Without a disk tier the warmed renders live only in the serve process's heap, so every
      # deploy starts the whole pass again from zero. Measured on preview.coo.ee: 1,502 of 18,604
      # entries after a 40-hour uptime on 1.35.0, then 0 again an hour later on 1.36.0, and 0 again
      # on 1.37.0 — three releases in one morning, three resets. A pass that needs a day of quiet to
      # complete cannot survive a deploy cadence measured in hours, and the memory tier is by design
      # a 128 MB window onto a generation several times that size, so it was never going to hold the
      # answer on its own.
      #
      # The two original reasons for opting in are both addressed rather than dismissed. An unset
      # value would derive a directory beside catalogs.json — the durable `preview_config` volume,
      # holding the operator's own configuration — so this names the dedicated volume explicitly
      # instead. And a generation is keyed by a fingerprint of everything that decides the pixels,
      # which an input nobody thought of could still miss: that is what the startup verification
      # pass covers, re-rendering a sample of adopted entries and discarding the whole generation on
      # any mismatch (CatalogThemeCache.verifySample), so stale pixels are caught rather than
      # served.
      SERVE_THEME_CACHE_DIR: "${SERVE_THEME_CACHE_DIR:-/theme-cache}"
      # 4 GiB, not the server's own 8 GB default. A fully warmed set measures ~0.93 GiB here (1,503
      # cached renders occupied 76.8 MiB, i.e. ~52 KiB/entry, across 18,604 declared targets), so
      # this is roughly 4x headroom for superseded generations awaiting their sweep — while leaving
      # the box's disk to the catalog blob pool beside it, which really does sit at its full 8 GB.
      SERVE_THEME_CACHE_MAX_BYTES: "${SERVE_THEME_CACHE_MAX_BYTES:-4294967296}"
      # Set to 1 for ONE roll to discard every persisted generation at startup, then unset it — it
      # fires on every start while set. Only for pixels known to be wrong (a base-image change no
      # fingerprint sees); an ordinary renderer change is already covered by the load-time sample.
      SERVE_THEME_CACHE_EVICT: "${SERVE_THEME_CACHE_EVICT:-}"
      # The heavy bytes a catalog FETCHES (as opposed to the pixels it renders): each live
      # catalog's executable liveBundle — ~100 MB — its per-preview split bundles, and the
      # externalised font/resource pool. Held content-addressed, so a rolled replica reads them
      # off this volume instead of re-downloading them from raw.githubusercontent.com, and a
      # delivery-branch regeneration re-fetches only what actually moved.
      #
      # Defaulted ON here, unlike the theme cache above, because unset is not the same trade: the
      # server has always kept these in a temp dir, so pointing them at a volume only changes how
      # long they live. Nothing mutable is cached — only bytes addressed by a commit-pinned URL,
      # which name one immutable object forever. Set SERVE_CATALOG_CACHE_DIR=none in .env to keep
      # the temp-dir behaviour.
      SERVE_CATALOG_CACHE_DIR: "${SERVE_CATALOG_CACHE_DIR:-/catalog-cache}"
      SERVE_CATALOG_CACHE_MAX_BYTES: "${SERVE_CATALOG_CACHE_MAX_BYTES:-}"
      # Bundle-upload lane (POST a locally-built bundle and browse it here). Off unless asked for.
      SERVE_ACCEPT_BUNDLES: "${SERVE_ACCEPT_BUNDLES:-}"
      SERVE_ACCEPT_BUNDLES_FROM: "${SERVE_ACCEPT_BUNDLES_FROM:-}"
      # Document lane (GET/POST /docs, GET /d/<id>) — data only: a Remote Compose / Lottie document
      # is played back by a player in the visitor's browser, so nothing runs on the box. The
      # playground's REMOTE_COMPOSE mode publishes its capture into this store, so a box that wants
      # that mode needs the lane on. Off unless asked for.
      SERVE_ACCEPT_DOCS: "${SERVE_ACCEPT_DOCS:-}"
      SERVE_ACCEPT_DOCS_FROM: "${SERVE_ACCEPT_DOCS_FROM:-}"
      SERVE_DOC_TTL: "${SERVE_DOC_TTL:-}"
      # Image lane (POST /images, GET /i/<id>.png) — an agent preparing a PR uploads a rendered
      # preview and embeds the returned URL in the PR body. Unlike the document lane above,
      # uploading is never anonymous: it needs a GitHub token with access to
      # SERVE_IMAGE_UPLOAD_REPO (which falls back to SERVE_GITHUB_AUTH_REPO), and the lane refuses
      # to start without one.
      # Empty means "let the entrypoint decide": on when SERVE_IMAGE_UPLOAD_REPO below names the
      # repository uploads are gated on, off otherwise. Setting that variable is what asks for the
      # lane — naming it and still getting a 404 from POST /images is nobody's intent, and the
      # miss is silent at both ends. The derivation deliberately does NOT key on
      # SERVE_GITHUB_AUTH_*: that repo defaults to yschimke/compose-ai-tools for the playground, so
      # it would gate an adopter's upload lane on someone else's collaborators. `0` opts out
      # explicitly with the repository still named.
      SERVE_ACCEPT_IMAGES: "${SERVE_ACCEPT_IMAGES:-}"
      # Empty means "let the entrypoint decide": on when SERVE_GITHUB_AUTH_* gives it a human to
      # approve against, off otherwise (the lane refuses to start with no approver, so a flat
      # default of 1 would break every box without an OAuth app). `0` opts out explicitly.
      SERVE_AGENT_GRANTS: "${SERVE_AGENT_GRANTS:-}"
      SERVE_AGENT_GRANT_SCOPES: "${SERVE_AGENT_GRANT_SCOPES:-}"
      # Non-cumulative permissions a grant may carry beside its scope — currently `images`, which
      # lets an approved agent use the image lane above without a GitHub credential of its own.
      # Needs SERVE_ACCEPT_IMAGES; `serve` refuses to start otherwise rather than offering a
      # checkbox whose grant would 404.
      SERVE_AGENT_GRANT_CAPABILITIES: "${SERVE_AGENT_GRANT_CAPABILITIES:-}"
      SERVE_AGENT_GRANT_MAX_TTL: "${SERVE_AGENT_GRANT_MAX_TTL:-}"
      SERVE_AGENT_GRANT_MAX_ACTIVE: "${SERVE_AGENT_GRANT_MAX_ACTIVE:-}"
      SERVE_AGENT_GRANT_RATE_LIMIT: "${SERVE_AGENT_GRANT_RATE_LIMIT:-}"
      # Naming this turns the image lane on (see SERVE_ACCEPT_IMAGES above): the repository an
      # uploader's GitHub token must have access to. Write access on a public repo, any grant on a
      # private one.
      SERVE_IMAGE_UPLOAD_REPO: "${SERVE_IMAGE_UPLOAD_REPO:-}"
      SERVE_IMAGE_TTL: "${SERVE_IMAGE_TTL:-}"
      SERVE_IMAGE_RATE_LIMIT: "${SERVE_IMAGE_RATE_LIMIT:-}"
      # Extra Maven repositories the live-daemon classpath resolver may fetch from, beyond Central +
      # Google. Empty inherits the entrypoint's baked default (jitpack, apollo-snapshots, a8c-libs),
      # which is what the published catalogs need; `none` sends only Central + Google.
      SERVE_EXTRA_MAVEN_REPOS: "${SERVE_EXTRA_MAVEN_REPOS:-}"
      PORT: "8080"
    # Persist the RUNTIME download caches across image rolls. A rollout (or Watchtower
    # recreate) replaces the container, discarding its writable layer — so without this the
    # fresh replica cold-starts: it re-resolves every live catalog's bundle classpath
    # (jitpack / apollo-snapshots / extra-Central jars land in `bundle-deps`) and re-fetches
    # Google Fonts for the figma-svg export (`fonts`) on its first render. Both live under
    # `composeAiCacheDir` = `~/.cache/composeai` (container home is /root), so a single named
    # volume there carries them over. NB the heavy baked caches — the Robolectric
    # `android-all` runtime and the build `~/.m2` — live in the IMAGE layer, so they already
    # survive a roll and are deliberately NOT volume-mounted (mounting over /root/.m2 would
    # shadow the baked content and go stale across image bumps). During a zero-downtime roll
    # two replicas mount this volume at once; writes are content-addressed Maven-layout files,
    # so a concurrent re-resolve is idempotent (same bytes, last-writer-wins).
    volumes:
      - preview_cache:/root/.cache/composeai
      # The operator's catalog config (catalogs.json). On a named volume so it OUTLIVES the
      # container: an image roll replaces the writable layer, and the published catalog set
      # must not go with it. The entrypoint seeds this from the image default only when the
      # file is absent, so an edit here — or a POST to /admin/catalogs, which rewrites the
      # same file — survives every subsequent pull. Bind-mount a host path instead
      # (`- ./catalogs.json:/config/catalogs.json`) to keep it in version control.
      # The same volume carries producers.json (the trust store) for the same reasons.
      - preview_config:/config
      # Warmed theme renders, on a volume of their OWN — never on preview_config, which is where
      # the catalog set and trust store live and must not be crowded out by the render cache. This
      # is what SERVE_THEME_CACHE_DIR points at by default, and what lets a deploy keep the hours of
      # background warming it would otherwise discard.
      - preview_theme_cache:/theme-cache
      # Fetched catalog bytes, on a volume of their OWN for the same reason the theme cache got
      # one: preview_config holds the catalog set and the trust store and must not be crowded out
      # by an up-to-8-GB blob pool. Two replicas mount this at once during a rolling update, which
      # the pool is built for — writes are content-addressed and its sweeper spares anything young
      # enough to belong to the outgoing replica.
      - preview_catalog_cache:/catalog-cache
    # To also pin your OWN producers, mount a trust store over the baked one and keep
    # SERVE_TRUST_STORE pointing at it:
    #   - ./producers.json:/trust/producers.json:ro
    expose:
      - "8080"
    # Container memory limit. Default UNBOUNDED (0 = no cgroup cap) so the box's full RAM is
    # available and the live-seat budget auto-sizes to it: the entrypoint reads the container's
    # memory limit and, finding none, falls back to physical RAM (~1 GB reserved for the host,
    # ~1.2 GB per live-seat permit). It sizes from CPU as well and takes the smaller of the two —
    # 2 permits per core, from the cgroup CPU quota where one is set rather than from `nproc`,
    # which reports the host's cores inside a `--cpus`-constrained container. Clamped [2, 32].
    # So a bigger dedicated box scales on its own — redeploy and it uses the whole machine, no
    # compose edit. Admission control (the live-seat budget + the per-render concurrency limiter)
    # is the memory guard here, not a hard cgroup kill. Set PREVIEW_MEM_LIMIT in .env (e.g.
    # `PREVIEW_MEM_LIMIT=4g`) to cap it on a shared host, which also lowers the derived seat budget
    # to match; `cpus:` (or `--cpus`) now lowers it too.
    mem_limit: "${PREVIEW_MEM_LIMIT:-0}"
    # Readiness gate for the rolling update. docker-rollout (driven by the `rollout`
    # service) waits for a freshly-started replica to report `healthy` BEFORE it
    # retires the old one, so this is the gate that makes updates zero-downtime.
    # It MUST hit `/readyz`, not `/healthz`: `/healthz` returns "ok" the instant the
    # HTTP listener binds (a static string — it proves nothing rendered), so a replica
    # whose catalogs failed to load or whose render pipeline is dead would pass it and
    # get promoted into a 500-ing server. `/readyz` goes green only after a
    # representative preview has actually rendered, so the gate reflects "can serve
    # traffic". `start_period` covers the cold-start catalog fetch + first render so a
    # slow boot isn't counted as a failure (503 "warming" during the start period is
    # expected and not a failure).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    # NOT Watchtower-managed: Watchtower does an in-place stop→recreate (downtime).
    # `preview` is updated by docker-rollout instead (see the `rollout` service),
    # which needs the service to stay scalable — so no `container_name`, no
    # published host ports (only `expose` above), which is already the case.

  # Zero-downtime updater for `preview`: poll GHCR for a new :latest digest and,
  # when one lands, roll the service with docker-rollout (boot a new replica →
  # wait for its /readyz healthcheck → drain onto it → retire the old one) so
  # live traffic never sees a stop→recreate gap. Needs the Docker socket (like
  # Watchtower) and the compose project mounted read-only so it can pull + scale.
  # The docker-rollout plugin is the vendored ./docker-rollout, mounted into the
  # CLI plugins dir. For a private GHCR package the host daemon's creds are used
  # for the pull (docker login ghcr.io on the host) — no in-container config.
  # Set ROLLOUT_INTERVAL in .env to change the poll cadence (default 1200s).
  rollout:
    image: docker:29-cli
    restart: always
    depends_on:
      - preview
    environment:
      ROLLOUT_INTERVAL: "${ROLLOUT_INTERVAL:-1200}"
      ROLLOUT_HEALTH_TIMEOUT: "${ROLLOUT_HEALTH_TIMEOUT:-300}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose project (compose file + .env) so `docker compose`/`docker
      # rollout` can pull and scale `preview`. Read-only: compose never writes here.
      - ./:/workspace:ro
      # The vendored docker-rollout plugin → the CLI plugins dir (adds `docker rollout`).
      - ./docker-rollout:/usr/local/lib/docker/cli-plugins/docker-rollout:ro
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/rollout.sh", "--loop"]

  # Instant roll on publish: a token-gated webhook that rolls `preview` the moment
  # a new image is published, instead of waiting up to ROLLOUT_INTERVAL (1200s) for
  # the `rollout` poll above to notice. The image-publish CI (preview-host-image.yml)
  # POSTs https://<domain>/__hooks/rollout (Caddy routes /__hooks/rollout here) with
  # a bearer DEPLOY_HOOK_TOKEN; deploy-hook.sh checks the token and runs rollout.sh
  # ONE-SHOT (pull + roll only if the digest changed — so a duplicate/replayed call,
  # or one racing the poll, is a cheap no-op). The poll loop stays on as the fallback,
  # so a missed webhook still self-heals within one interval. Same base + mounts as
  # `rollout` (Docker socket, project ro, the docker-rollout plugin) so it reuses
  # rollout.sh verbatim; socat is apk-added at start like rollout.sh adds compose.
  # Fail-closed: with no DEPLOY_HOOK_TOKEN the service stays up but idle (never opens
  # the port) — set it in .env (setup.sh generates one) to enable. Only `expose`d on
  # the compose network, never a host port; reachable solely via Caddy's route.
  # Comment this service out (and the Caddyfile /__hooks/rollout route) to disable the
  # webhook and rely on the poll loop alone.
  hook:
    image: docker:29-cli
    restart: always
    depends_on:
      - preview
    environment:
      # The shared secret the publish CI must present. Empty ⇒ hook disabled (idle).
      DEPLOY_HOOK_TOKEN: "${DEPLOY_HOOK_TOKEN:-}"
      # Passed through to the rollout it triggers (same meaning as the `rollout` svc).
      ROLLOUT_HEALTH_TIMEOUT: "${ROLLOUT_HEALTH_TIMEOUT:-300}"
      HOOK_PORT: "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - ./docker-rollout:/usr/local/lib/docker/cli-plugins/docker-rollout:ro
    working_dir: /workspace
    expose:
      - "9000"
    entrypoint: ["/bin/sh", "/workspace/deploy-hook.sh", "--serve"]

  # Auto-update for `caddy` only: poll GHCR and recreate `caddy` when the
  # preview-caddy-image workflow publishes a new baked-Caddyfile image. `preview`
  # is intentionally NOT labelled here — it's rolled by the `rollout` service
  # above (zero-downtime) instead of Watchtower's in-place recreate. --label-enable
  # scopes Watchtower to the labelled services (just `caddy`); --cleanup prunes the
  # superseded image. Comment this out to manage caddy manually. For a private GHCR
  # package, mount a registry config: `- ~/.docker/config.json:/config.json:ro`.
  watchtower:
    # Maintained fork of the (now-stale) containrrr/watchtower: the upstream image's
    # baked Docker SDK negotiates API 1.25, which modern engines reject ("client
    # version 1.25 is too old. Minimum supported API version is 1.40"), so it silently
    # never updates anything. The fork is rebuilt against a current SDK. Pinned by
    # tag+digest; bump both together when adopting a newer release.
    image: ghcr.io/nicholas-fedor/watchtower:1.21.2@sha256:3b8d2e3f0f6ff9295a5d634e4fdb7062e5e6602f71d89baa15cd4d39d22b5743
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 1200

  caddy:
    # The Caddyfile is BAKED into this image (preview-caddy-image.yml) instead of
    # bind-mounted, so a config change auto-deploys via Watchtower like the server
    # (Watchtower watches image digests, not files). DOMAIN is still substituted
    # from .env at runtime. Pin a config with CADDY_IMAGE_TAG=<sha> in .env; leave
    # it unset for the auto-updating :latest. (Migrating an existing box: the first
    # `docker compose up -d` after adopting this compose swaps caddy:2 + the mount
    # for this image — a one-time step; edits then ride Watchtower.)
    image: "ghcr.io/yschimke/compose-preview-caddy:${CADDY_IMAGE_TAG:-latest}"
    pull_policy: always
    restart: always
    depends_on:
      - preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
      # Additional site hostnames beyond the ones catalogs.json declares. Normally empty: the
      # entrypoint reads the `sites` list out of the mounted config below and unions it with this,
      # so the committed file is what routes a site AND what gets it a certificate. Set this only
      # for a name the app doesn't serve as a site (a vanity alias, a migration).
      SITE_DOMAINS: "${SITE_DOMAINS:-}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The preview server's own config, READ-ONLY, purely to read `sites` at startup. Same volume
      # the app boots from, so a hostname published at runtime (POST /admin/sites, which writes it
      # back) is picked up by the next caddy start with nothing to keep in step by hand. Mounted at
      # /srv/preview-config, not /config — that path is caddy's own state volume above.
      - preview_config:/srv/preview-config:ro
    # Opt in to Watchtower so a new baked-Caddyfile image rolls onto this box.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  preview_theme_cache:
  # The executable bundles, split bundles and externalised resources each live catalog fetches.
  preview_catalog_cache:
  # Runtime download caches for `preview` (resolved live-bundle dep jars + fonts), kept across
  # image rolls so a freshly-rolled replica reuses them instead of re-downloading. See the
  # `preview` service's volumes block for why the baked android-all / ~/.m2 are excluded.
  preview_cache:
  # The operator's catalogs.json + producers.json — the published catalog set and the trusted
  # producers, kept outside the image so they survive image rolls and can be edited (or POSTed
  # to /admin/catalogs / /admin/trust) without a rebuild.
  preview_config:
  caddy_data:
  caddy_config:
