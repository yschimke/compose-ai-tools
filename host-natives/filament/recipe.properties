# Filament's JNI library, filament-jni, built for the host from Filament's own sources: the renderer
# headless on EGL, its Android JNI layer with host stand-ins for the window and Bitmap pieces (see
# build.sh and host/). An app's Engine.createSwapChain(surface) renders into a headless swap chain
# whose frames are drawn onto that Surface, which the simulator shows (SurfaceView, #6428).
#
# The JNI layer has to match the app's com.google.android.filament classes exactly (their native
# method signatures), so `version` is the Filament release it is built from and `commit` that
# release's tag; a build is reused across versions only through index.json, and only where the
# Java API is unchanged.
library=filament-jni
artifact=com.google.android.filament:filament-android
version=1.77.3
# 2: sRGB swap chains (feature level 0) render instead of taking the simulator down (#6436), and
# Filament's native log goes to logcat, not the control channel's stdout. 1 was published before
# either landed.
# 3: macOS (ANGLE); Linux unchanged in behaviour.
revision=3
repository=google/filament
# v1.77.3
commit=d852e34cd5629a6f3851d613dcd17aa0ffd025a2
# The whole repository at `commit` (CMake builds Filament from it); see host-natives/build.sh.
fetch=git
path=android/filament-android
platforms=linux-x86_64,macos-universal
# macOS only: ANGLE (OpenGL ES over Metal), built from google/angle at this commit (the head of
# Chromium's chromium/7151 branch, the one kivy/angle-builder builds) by host/build-angle.sh.
angle_commit=df9c59dcacff7d186d00e3263a1aa68f8059137c
