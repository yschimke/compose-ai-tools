# AndroidX's graphics-path native sources, built unchanged for the host. The commit is the last one
# to touch `src/main/cpp` (only its CMakeLists.txt was removed); the sources date from 2024-04 and
# back both 1.0.1, which every stable Compose UI up to 1.12.x pins, and 1.1.0.
#
# A recipe releases once per library version, as `host-natives-<recipe>-<version>` (see
# host-natives/build.sh): change `version` only when the library's native API or implementation
# changes. A later graphics-path with the same native API reuses this build through index.json.
# `revision` rebuilds the same library version (a build fix), as `...-<version>-r<revision>`.
library=androidx.graphics.path
artifact=androidx.graphics:graphics-path
# The graphics-path release these sources and the verification (host-natives/verify) match.
version=1.0.1
# 2: rebuilt against glibc 2.31; 1 needed GLIBC_2.43 (built on Ubuntu 26.04) and loaded nowhere older.
revision=2
repository=androidx/androidx
commit=7b1104d5e67bd061e736e8d576b539498b498be4
path=graphics/graphics-path/src/main/cpp
