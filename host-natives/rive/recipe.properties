# rive-android's JNI library, librive-android, built for the host from rive-android's own sources and
# the rive-runtime they pin. RiveAnimationView uses Rive's Canvas renderer, as on a device without the
# Rive renderer, which draws through android.graphics.Canvas; Rive's Compose API renders with its GL
# renderer on the host's own EGL and OpenGL ES (Mesa), presenting each frame to the app's TextureView
# (see build.sh and host/).
#
# The JNI layer has to match the app's app.rive classes exactly (their native method signatures), so
# `version` is the rive-android release it is built from and `commit` that release's tag; a build is
# reused across versions only through index.json, and only where the Java API is unchanged.
library=rive-android
artifact=app.rive:rive-android
version=11.17.0
# 2: the GPU render contexts (Rive's Compose API) fail with RiveRenderException instead of calling
# an EGL that was never loaded, which took the simulator down; and gettid() for glibc 2.28. 1 was
# never published: its manylinux build stopped at gettid().
# 3: the GL render context renders with the host's EGL (host/HostEgl.cpp) where there is one, and
# AndroidBitmap reads and writes pixels in Android's RGBA order.
revision=3
repository=rive-app/rive-android
# 11.17.0
commit=256ebca48a1d87c97f75c49cb38b5a09d8e8f585
# The whole repository at `commit`; build.sh adds its rive-runtime submodule.
fetch=git
path=kotlin/src/main/cpp
platforms=linux-x86_64
# rive-runtime at the commit rive-android's submodules/rive-runtime gitlink names at `commit`;
# build.sh checks they agree.
runtime_commit=6ea1b7e56661b14aeb8c85e6ec4103b82a9274c0
# The premake rive-runtime's build_rive.sh uses (its RIVE_PREMAKE_TAG), and the premake-ninja
# generator it clones from a branch, pinned here by commit.
premake_tag=v5.0.0-beta7
premake_commit=ba2c383c0456aa75d1b93faf62f4aec2691f23b2
premake_ninja_commit=14b7ca33e532a6ce35a5ac9498e8f16e64c2fa03
