<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMP catalog (Wasm)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        /*
          No scrollbar — the embedding `serve` viewer sizes this iframe pixel-exactly to the
          snapshot's rendered box and CatalogApp contain-fits the sticker to it. A scrollbar would
          steal ~15px of width from #composeApp (width:100%), shrinking that fit box and shifting the
          contain-fit scale — the visible size change when Wasm mode is enabled. Kept alongside the
          `display:block` below (which removes the root-cause overflow) as a hard guarantee.
        */
        overflow: hidden;
      }
      #composeApp {
        width: 100%;
        /* Fill the iframe's box. `100%` (of html/body height:100%) rather than `100vh`, since `vh`
           ignores scrollbars and rounds independently of the box the viewer actually sized us to. */
        height: 100%;
      }
      /*
        ComposeViewport mounts a <canvas> here. A canvas is an inline replaced element by default, so
        it rests on the text baseline and leaves a descender gap beneath it — enough to push the
        document past the viewport and raise a vertical scrollbar. Making it block removes that gap,
        so the content is exactly the iframe height and nothing overflows.
      */
      #composeApp canvas {
        display: block;
      }
    </style>
    <!--
      The Kotlin/Wasm output is loaded as plain ES modules (no webpack), so the
      bundle assembles without the Node / Binaryen download toolchain that the
      build's `FAIL_ON_PROJECT_REPOS` mode blocks. The compiler's
      `import-object.mjs` references the bare specifier `@js-joda/core` (CMP's
      datetime backing); resolve it to the **self-hosted** copy vendored beside
      this file (`js-joda.esm.js`, pinned @js-joda/core 5.7.0). Self-hosted, not
      a CDN, so the bundle works fully offline / behind an egress proxy.
    -->
    <script type="importmap">
      { "imports": { "@js-joda/core": "./js-joda.esm.js" } }
    </script>
  </head>
  <body>
    <!-- ComposeViewport mounts the catalog component named by ?id=… here. -->
    <div id="composeApp"></div>
    <!--
      Font prefetch, started at document load so it runs IN PARALLEL with the multi-second Wasm
      boot: fetch fonts.json and every file it lists, stashing the in-flight promises where the
      app's fetch bridge picks them up (Main.kt consults __cpPrefetchText/__cpPrefetchBuf before
      issuing its own fetch). This must live in the iframe, not the embedding viewer page — the
      sandbox gives this document an opaque origin with its own HTTP-cache partition, so nothing
      the parent page fetches is reusable here. A rejected prefetch deletes its entry so the app
      retries fresh; any error just means the app fetches cold, exactly as before.
    -->
    <script>
      window.__cpPrefetchText = {};
      window.__cpPrefetchBuf = {};
      (function () {
        try {
          var base = new URLSearchParams(location.search).get("fontsBase") || "./fonts/";
          if (base.indexOf(":") !== -1 && !/^https?:/.test(base)) return;
          if (base.charAt(base.length - 1) !== "/") base += "/";
          function stash(map, url, promise) {
            map[url] = promise;
            promise.catch(function () { delete map[url]; });
          }
          var manifest = fetch(base + "fonts.json").then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
          });
          stash(window.__cpPrefetchText, base + "fonts.json", manifest);
          manifest.then(function (t) {
            (JSON.parse(t).families || []).forEach(function (fam) {
              (fam.fonts || []).forEach(function (f) {
                var file = String(f.file || "");
                if (!file || file.indexOf("..") !== -1 || file.indexOf(":") !== -1) return;
                stash(window.__cpPrefetchBuf, base + file, fetch(base + file).then(function (r) {
                  if (!r.ok) throw new Error("HTTP " + r.status);
                  return r.arrayBuffer();
                }));
              });
            });
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="composeApp.mjs"></script>
    <!--
      Live overrides without an iframe reload: the embedding `serve` viewer posts a `?a=b` override
      patch (theme / font scale / locale) via postMessage; forward it to the Wasm app's exported
      `applyOverrides`, which recomposes in place. Importing the same module is a no-op re-use (ES
      modules are singletons), and the export may not exist until the Wasm instance has initialised,
      so each message re-checks it. Data is a plain string, so no structured-clone / origin surface.
    -->
    <script type="module">
      import * as catalog from "./composeApp.mjs";
      window.addEventListener("message", function (e) {
        if (typeof e.data === "string" && typeof catalog.applyOverrides === "function") {
          catalog.applyOverrides(e.data);
        }
      });
    </script>
  </body>
</html>
