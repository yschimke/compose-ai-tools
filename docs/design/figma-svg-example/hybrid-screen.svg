<svg xmlns="http://www.w3.org/2000/svg" width="392" height="552" viewBox="0 0 392 552" font-family="sans-serif">
<g transform="translate(16, 16)">
  <g id="ProfileScreen">
    <g id="TopAppBar" data-token="surface">
      <title>TopAppBar · surface</title>
      <rect x="0" y="0" width="360" height="64" fill="#FFFBFE"/>
      <g id="Title">
        <text x="20" y="37.6" font-size="22" font-family="sans-serif" font-weight="600" fill="#1C1B1F">Profile</text>
      </g>
    </g>
    <g id="HeaderCard" data-token="surface">
      <title>HeaderCard · surface</title>
      <rect x="16" y="80" width="328" height="150" rx="16" ry="16" fill="#FFFBFE" stroke="#E7E0EC" stroke-width="1"/>
      <g id="Avatar">
        <image href="figma-raster/avatar.png" x="32" y="96" width="64" height="64"/>
      </g>
      <g id="Name">
        <text x="112" y="116" font-size="20" font-family="sans-serif" font-weight="600" fill="#1C1B1F">Ada Lovelace</text>
      </g>
      <g id="Handle">
        <text x="112" y="143.19" font-size="14" font-family="sans-serif" font-weight="400" fill="#49454F">@ada · Engineer</text>
      </g>
      <g id="FollowBtn" data-token="primary">
        <title>FollowBtn · primary</title>
        <rect x="112" y="176" width="120" height="40" rx="20" ry="20" fill="#6750A4"/>
        <g id="FollowLbl">
          <text x="146" y="199.2" font-size="14" font-family="sans-serif" font-weight="500" fill="#FFFFFF">Follow</text>
        </g>
      </g>
    </g>
    <g id="StatsCard" data-token="surface">
      <title>StatsCard · surface</title>
      <rect x="16" y="246" width="328" height="120" rx="16" ry="16" fill="#FFFBFE" stroke="#E7E0EC" stroke-width="1"/>
      <g id="StatsTitle">
        <text x="32" y="273.2" font-size="14" font-family="sans-serif" font-weight="500" fill="#49454F">Activity</text>
      </g>
      <g id="ActivityChart">
        <image href="figma-raster/chart.png" x="32" y="286" width="160" height="60"/>
      </g>
      <g id="Legend">
        <text x="210" y="309.6" font-size="12" font-family="sans-serif" font-weight="400" fill="#49454F">last 7 days</text>
      </g>
    </g>
    <g id="CTASurface" data-token="surfaceVariant">
      <title>CTASurface · surfaceVariant</title>
      <rect x="16" y="382" width="328" height="56" rx="28" ry="28" fill="#E7E0EC"/>
      <g id="CTALbl">
        <text x="150" y="415.2" font-size="14" font-family="sans-serif" font-weight="500" fill="#6750A4">Message</text>
      </g>
    </g>
  </g>
</g>
</svg>
