wear-protolayout-external-protobuf = { module = "androidx.wear.protolayout:protolayout-external-protobuf", version.ref = "wear-protolayout" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Reads a class file's `@kotlin.Metadata` to recover the real Kotlin signature (parameter names,
# types, defaults) of a discovered target composable — the JVM bytecode alone drops names and
# carries Compose's synthetic Composer/changed params. Version tracks the Kotlin toolchain.
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
fontbox = { module = "org.apache.pdfbox:fontbox", version.ref = "fontbox" }
ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-qual" }
roborazzi-annotations = { module = "io.github.takahirom.roborazzi:roborazzi-annotations", version.ref = "roborazzi" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
# ASM — used by `:daemon:harness`'s `S3_5RecompileSaveLoopRealModeTest` to mint two
# `.class` files with the same FQN (`ee.schimke.composeai.daemon.MutableSquare`) but different
# bytecode at test time. The B2.0 disposable user-classloader test asserts that the daemon
# actually re-reads bytecode after a `fileChanged` notification; without two distinct `.class`
# files the test can't differentiate "stale" from "fresh".
asm = { module = "org.ow2.asm:asm", version = "9.10.1" }
asm-commons = { module = "org.ow2.asm:asm-commons", version = "9.10.1" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "material-kolor" }
# `metroViewModel()` + `LocalMetroViewModelFactory` + the `MetroViewModelFactory` /
# `ViewModelGraph` base types live here. Used by `:samples:android-metro-viewmodel`.
metro-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }

