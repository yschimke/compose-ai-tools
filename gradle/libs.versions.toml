compose-ui-prerelease = "1.11.4"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
mcp-kotlin-sdk = "0.14.0"
okio = "3.17.0"
fontbox = "3.0.8"
junit = "4.13.2"
truth = "1.4.5"
maven-publish = "0.37.0"
# Google's host-side screenshot testing plugin (Layoutlib-backed). Used only
# by `:samples:android-screenshot-test`, which exercises our co-existence
# path: our renderer discovers previews in the `screenshotTest` source set
# that Google's plugin creates, and renders them via Robolectric without
# driving Google's own `validate*ScreenshotTest` tasks. Still alpha —
# re-check compatibility when bumping AGP.
android-compose-screenshot = "0.0.1-alpha15"
# Checker Framework qualifier annotations. ATF (`accessibility-test-framework`,
# pulled in transitively by `roborazzi-accessibility-check`) annotates its
# nullable getters with `@org.checkerframework.checker.nullness.qual.Nullable`.
# When that annotation isn't on the renderer's compile classpath the Kotlin
# 2.3+ compiler emits `INACCESSIBLE_TYPE` warnings (becomes an error in
# language version 2.4 — KT-80247) on every call site that reads such a
# getter. Adding `compileOnly(libs.checker.qual)` is enough to silence the
# warning without exporting the annotation to consumers (it's marker-only;
# zero runtime impact).
checker-qual = "4.2.1"
# KMP port of Google's Material Color Utilities. Powers the wallpaper data
# extension's seed → ColorScheme derivation (HCT tonal palettes, palette
# styles, contrast level) so the result matches what Android's wallpaper-
# derived dynamic theming actually produces.
# Pinned to the 4.0.x line: `:data-wallpaper-connector` is a published
# module and its consumers live on the renderer-android Compose floor
# (`compose-bom-compat`, Compose 1.9.5). 4.1.0 rebuilt against Compose
# Multiplatform 1.10.0 + Kotlin 2.3.0 and switched from an Android library
# to a "Multiplatform Android library" — both move the transitive floor
# above what our published surface targets. Renovate is constrained to
# 4.0.x in `.github/renovate.json`; bumping the supported floor is a
# manual decision (re-check `:data-wallpaper-connector:compileKotlin`
# against `compose-bom-compat` when raising it).
material-kolor = "4.0.5"
# Metro — Zac Sweers' compile-time DI framework, used only by the JDK 21+
# `:samples:sdk21:android-metro-viewmodel` module to demonstrate that
# constructor-injected ViewModels render under the renderer's @Preview
# pipeline. The 1.x Gradle plugin jar is compiled to Java 21 bytecode, so
# the consuming module lives in the conditionally-included `samples/sdk21/`
# subtree (see `settings.gradle.kts`) — the rest of the repo can keep
# building under JDK 17. Kotlin 2.3.21 is supported per Metro's
# compatibility table (`docs/compatibility.md` upstream).
metro = "1.3.2"
# Ktor HTTP client (+ OkHttp engine) for downloading bundles given a URL. Ktor 3.x is current and
# compatible with Kotlin 2.3 / coroutines 1.11; OkHttp 5.x is the stable engine backing it.
ktor = "3.5.1"
okhttp = "5.4.0"
# Pure-Java mDNS/DNS-SD (Bonjour) responder used by `compose-preview serve --lan` to advertise the
# `_composeai._tcp` service the mobile/wear clients browse for. No slf4j dep (uses java.util.logging),
