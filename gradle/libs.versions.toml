jmdns = "3.6.3"

[libraries]
# Ktor HTTP client (OkHttp engine) — backs the `:cli` / `:bundle-viewer` bundle downloader. Same
# `ktor` version ref as the server below so the two can't skew and re-trip the strict slf4j pin in
# :cli. (The `ktor-client-websockets` entry was dropped when the session-viewer clients — its only
# consumer — moved to yschimke/compose-preview-client; see issue #2533.)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# Embedded Ktor server (CIO engine — pure-Kotlin/coroutines, no Netty) backing the
# `compose-preview serve` LAN preview server. Same `ktor` version ref as the client so the two
# can't skew and re-trip the strict slf4j pin in :cli (see cli/build.gradle.kts constraints).
