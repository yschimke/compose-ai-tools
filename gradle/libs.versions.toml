[versions]
# Held at 2.4.0: CodeQL's Kotlin extractor doesn't support 2.4.10 yet — it aborts with
# `Kotlin version too new`, which fails the `Analyze (java-kotlin)` job as a configuration error
# and leaves the repo's main language unscanned. Bump once the CodeQL bundle catches up (the
# alternative, disabling Kotlin extraction, would trade away the scan itself).
kotlin = "2.4.0"
# Kotlin language/api floor for published modules. Set lower than `kotlin`
# so consumers on an older Kotlin can still link against our artifacts —
# tapmoc enforces this and fails the build if a transitive API dep raises
# the floor. Bump only when the published surface needs a newer feature.
# 2.0.21 captures consumers on Kotlin 2.0.x (e.g. apps still on Gradle 8.x,
# whose embedded Kotlin runtime tops out around 2.0.21); we use no 2.1+
# language features in any published module so dropping to 2.0.21 has zero
# cost on our source today.
# Caveat: the 2.3.x compiler emits `Language version 2.0 is deprecated and
# its support will be removed in a future version of Kotlin`. That warning
# is silenced via `-Xsuppress-version-warnings` in the modules calling
# `configureKotlinCompatibility(...)`; remove the flag (and bump this to
# `2.1.x`) when the removal lands and we're ready to drop 2.0.x consumers.
kotlinCoreLibraries = "2.0.21"
agp = "9.3.0"
ktfmt = "0.26.0"
tapmoc = "0.4.2"
# Released versions only. Robolectric publishes `4.17-SNAPSHOT` to Sonatype, and Renovate ranks it
# above `4.17-beta-2` — but no snapshot repository is declared here (nor should one be, for a
# reproducible build), so a snapshot pin fails dependency resolution outright. The
# `org.robolectric:robolectric` rule in `.github/renovate.json` keeps that bump from coming back.
robolectric = "4.17-beta-2"
roborazzi = "1.70.0"
# androidx.tracing — atrace-level sections for the Android daemon's render phases (see
# `AndroidxTraceSections` in :daemon:android). Version-pinned (not BOM-managed) because the daemon
# ships it in the standalone lib-daemon-android sidecar where no BOM applies.
androidx-tracing = "1.3.0"
classgraph = "4.8.184"
# Stable BOM line — what samples use and what `composePreviewRender` /
# `Compare previews` is exercised against. Renovate updates this freely;
# the variant below (`compose-bom-compat`) is the older line that
# renderer-android compiles its public API against.
compose-bom-stable = "2026.06.01"
# renderer-android compiles its public API surface against this OLDER BOM so
# the emitted bytecode only references Compose 1.9.x method signatures.
# AndroidX honours binary-backward-compatibility within a major version, so
# consumer apps on any Compose 1.9+ runtime (including the current 1.10.x /
# 1.11.x BOMs) can invoke it without NoSuchMethodError. When bumping this,
# check `./gradlew :renderer-android:compileKotlin` against the new floor.
# 2025.11.01 pins compose-ui AND compose-runtime to 1.9.5 — latest 1.9.x
# release line. See https://developer.android.com/develop/ui/compose/bom/bom-mapping
# Renovate is constrained to the 2025.11.x line in `.github/renovate.json` —
# raising the supported-Compose-minimum is a manual decision.
compose-bom-compat = "2025.11.01"
compose-multiplatform = "1.10.3"
# The Compose M3 design catalog (`:samples:design-catalog-m3`) pins material3
# FORWARD of `compose-bom-stable` (which carries 1.4.0) solely for the Material 3
# **inset focus ring** APIs — `LocalRippleThemeConfiguration` +
# `RippleDefaults.InsetFocusRingRippleThemeConfiguration`, added in
# material3 1.5.0-alpha18. The catalog documents the focus indicator the design
# system now ships, so it needs the real API; the override is scoped to that one
# module (its build.gradle.kts) and nothing else in the repo rides the alpha.
# alpha19+ jump to the Compose 1.12.0-alpha line, whose AAR metadata declares
# minCompileSdk 37 (via `androidx.compose.animation:animation-core-android:1.12.0-alpha03`).
# `:samples:design-catalog-m3-android` therefore builds at `compileSdk = 37` (see its
# build.gradle.kts) rather than the repo default 36 — a scoped divergence, like
# `:samples:design-catalog-remote-m3`. Drop this pin and revert to `libs.compose.material3`
# once material3 1.5.0 is stable in `compose-bom-stable`.
compose-material3-catalog = "1.5.0-alpha24"
# JetBrains Compose Multiplatform material3 tracks its own line: the
# `org.jetbrains.compose` 1.10.3 plugin pins `compose.material3` to 1.9.0
# (material3 multiplatform 1.10.x is still alpha), so the explicit coordinate
# must use this version rather than `compose-multiplatform`. Mirrors what the
# deprecated `compose.material3` accessor resolved to.
compose-multiplatform-material3 = "1.9.0"
# Compottie — the KMP Lottie runtime that powers `:lottie-preview-runtime`. Pinned to 2.1.0
# because it is built against JetBrains Compose foundation 1.10.1 (same minor as our
# `compose-multiplatform = 1.10.3`); 2.2.x jumps to foundation 1.11.0, which would drag a
# *newer* Compose onto the renderer classpath — the failure direction `docs/RENDERER_COMPATIBILITY.md`
# warns about. Bump only in lockstep with `compose-multiplatform`.
compottie = "2.1.0"
activity-compose = "1.13.0"
# `androidx.navigation:navigation-compose` — used only by the
# `:samples:android` NavHost preview that exercises the daemon's
# `data/navigation` data product (Intent + back-pressed snapshot) and the
# `navigation.*` script-event surface end-to-end. Activity-compose 1.13's
# transitive `androidx.navigationevent` floor (see CompatRules.kt) means
# this stays compatible with the renderer's compileOnly stack.
navigation-compose = "2.9.8"
# `androidx.glance:glance-appwidget` — used only by `:samples:android`'s Glance widget
# preview (`GlanceWidgetPreview` in `AppWidgetPreviews.kt`). Renders a `GlanceAppWidget` to
# `RemoteViews` via `GlanceAppWidget.compose(...)` and inflates that into the preview surface.
# 1.1.x is the current stable line; bump when the Glance team ships a 1.2.x with the planned
# preview-DSL stabilisation.
glance-appwidget = "1.2.0-rc01"
# Held at alpha05: alpha06 redesigned `androidx.wear.compose.material3.onehandedgesture`.
# `OneHandedGestureInteraction` is gone, and both `Modifier.oneHandedGesture` and
# `OneHandedGestureIndicator` now take an `OneHandedGestureConfiguration` (action + key + priority)
# plus an explicit `OneHandedGestureIndicatorState` instead of an interaction source — which
# `:data-gestures-connector` (`GestureReporting`) and the Wear gesture-hint previews are built on.
# Migrating that seam changes rendered output, so it lands as its own PR with visual evidence;
# bump this back to the alpha line then.
wear-compose = "1.7.0-alpha05"
wear-tiles = "1.6.1"
wear-protolayout = "1.4.1"
wear-tooling-preview = "1.0.0"
# Jetpack Compose Glimmer — the Compose UI toolkit for Android XR display AI
# glasses (`androidx.xr.glimmer`). Alpha10+ requires AGP 9.2+ and
# `compileSdk = 37` (matched by `:samples:xr-glimmer`'s `compileSdk` and our
# `agp = 9.2.x` toolchain). Alpha13 was published 2026-05-19.
xr-glimmer = "1.0.0-alpha15"
# Jetpack Compose for XR (`androidx.xr.compose`) — the spatial-UI toolkit
# (`Subspace`, `SpatialPanel`, `Orbiter`, `SpatialElevation`, `SpatialDialog`).
# AAR metadata declares `minCompileSdk = 36` / `minAgp = 8.9.1`, so it builds on
# the repo's default `compileSdk = 36` + AGP 9.2.x — no need for the platform-37
# bump Glimmer requires. Used by `:samples:xr-spatial`, which renders the
# 2D Home-Space fallback of these composables through the Android Robolectric
# pipeline (see docs/design/XR_SPATIAL_PREVIEW.md). Alpha14 was published
# 2026-05-19.
xr-compose = "1.0.0-alpha16"
# XR `*-testing` fakes injected onto the offline render/test classpath (the
# Robolectric `composePreviewRenderXr` path + `:renderer-xr` / sample tests).
# Single source of truth: the plugin bakes these into a generated resource (see
# `gradle-plugin/build.gradle.kts`) so the hard injection in
# `AndroidPreviewSupport.kt` can't drift from the catalog. The runtime/scenecore
# alpha line runs one ahead of the compose/arcore line — bump together with
# `xr-compose`.
xr-runtime-testing = "1.0.0-beta01"
xr-scenecore-testing = "1.0.0-beta01"
xr-arcore-testing = "1.0.0-beta01"
# `androidx.wear:wear` carries `androidx.wear.ambient.AmbientLifecycleObserver` —
# the AOSP entry point both horologist's `AmbientAware` and direct subscribers
# wrap. Used only by `:data-ambient-connector` (the Robolectric shadow + state
# controller) so consumer code wired to `AmbientAware { ... }` can render under
# a synthetic ambient state without flashing a real watch.
wear = "1.4.0"
# Horologist's `AmbientAware` composable + `AmbientState` sealed type — the
# de-facto helper most Wear apps use to wrap their root content. Used by
# `:samples:wear` previews to demonstrate the ambient override end-to-end.
horologist = "0.7.15"
# Remote Compose — alpha artifacts, used only by `:samples:remotecompose` to
# demonstrate `RemotePreview` + `@PreviewWrapper(RemotePreviewWrapper::class)`.
# Re-check minCompileSdk / AGP requirements when bumping these — the alpha
# line has historically tightened them between releases.
#  * ui-tooling-preview 1.11.0-rc01 is the first released artifact that
#    contains `PreviewWrapper` / `PreviewWrapperProvider` — 1.10.x (the
#    current BOM) doesn't have them. Declared explicitly because the
#    sample doesn't depend on compose-bom.
#  * compose-remote is held at alpha08 because alpha09 dropped
#    `androidx.compose.remote.creation.compose.modifier.ClickActionModifierKt`,
#    which `wear-compose-remote:remote-material3:alpha02` was built against
#    and still calls into. Bumping the pair together (e.g. once a newer
#    `wear-compose-remote` rebuilt against alpha09+ ships) is fine — bumping
#    only `compose-remote` reintroduces a runtime `NoClassDefFoundError`
#    inside `RemoteButtonImpl` at preview render time.
#  * Renovate's `gradle-minorpatch` bump to the `compose-remote alpha11` /
#    `wear-compose-remote alpha04` pair broke CI (Kotlin compile + daemon-
#    harness render), so the pair was previously held at the last green
#    pre-bump versions until a mutually-rebuilt pair could be verified together.
#    alpha13 / alpha06 is that mutually-rebuilt pair: the connector + samples
#    were migrated to the new API (`HostAction` went `internal` — build actions
#    via the public `hostAction(...)` factory returning `Action`;
#    `captureSingleRemoteDocument` now takes `RemoteCreationDisplayInfo` +
#    `RemoteDensity` + `LayoutDirection`; the `RemotePreview` composable became
#    `RemoteContentPreview`), so the pair now tracks the latest
#    verified-together alpha. alpha14 / alpha07 is the next such pair:
#    `RemoteDensity.from` dropped its trailing `Context` arg and now derives
#    density solely from the `RemoteCreationDisplayInfo` it's handed.
compose-remote = "1.0.0-alpha15"
wear-compose-remote = "1.0.0-alpha07"
# Glance Wear — the Wear OS *widget* layer on top of Remote Compose. Used by
# `:samples:design-catalog-remote-m3` to sticker the widget **container** (the
# squircle the host draws around widget content) via the
# `wear-tooling-preview` artifact's `WearWidgetPreview` wrapper. alpha13 is
# built against compose-remote alpha14 (see its POM), so bump this in lockstep
# with the `compose-remote` pin above — a skewed pair risks the same
# creation/player version drift the Remote Compose comment describes.
glance-wear = "1.0.0-alpha14"
