org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true

# Build-cache salt — an extra declared input on every Kotlin compilation task, so bumping this
# number moves the whole repo to fresh build-cache keys (see ComposeAiBaseConventionsPlugin for the
# why and the cost). Bump it when a remote-cache entry is corrupt at rest and can't be evicted
# server-side: a poisoned entry fails during *load*, so the task never executes and never pushes a
# replacement, and no amount of re-running clears it. One cold main build reseeds under the new
# keys. History: 1 = orphan the truncated `:daemon:core:compileKotlin` entry cc7964dd… (2026-07).
# 2 = orphan an EMPTY `:samples:cmp:compileKotlin` entry (2026-08). Unlike a truncated entry this
# one loads cleanly — it just restores zero `.class` files, so the build stays green while
# `composePreviewDiscover` scans an empty `classDirs` and writes an asset-only 3-preview manifest
# instead of 66. Reproduction and follow-ups: issue #3600.
composeai.cacheSalt=2

# Kill switch for the BuildFetch remote build cache (issue #2824). `off` skips it entirely; the
# LOCAL cache stays on, including for pushing main runs — see settings.gradle.kts.
#
# Flip to `off` when an entry is corrupt at rest and `composeai.cacheSalt` above can't reach it. A
# truncated entry is served as HTTP 200 with a matching content-length, so the short read is
# undetectable until the gzip stream ends mid-inflate ("Unexpected end of ZLIB input stream"), which
# Gradle treats as fatal; and it can't self-heal, because the load aborts before the task executes so
# nothing repushes. The salt only orphans Kotlin-compilation keys, so it's no help when the poisoned
# entry belongs to an AGP task or an artifact transform (July 2026: `12fcc978…a05d`, `877aca9a…c1ec`).
# Prefer `scripts/repair-remote-cache.sh` — re-uploading a good copy fixes it for everyone, where
# this flag only routes the local build around it.
composeai.remoteCache=on

# Isolated Projects is deliberately NOT enabled here. It is incompatible with
# the compose-preview CLI / MCP server / VS Code workflow: those drive Gradle
# through the auto-injected init script (cli/.../AutoInject.kt,
# vscode-extension/src/initScript.ts), which applies the plugin via
# `allprojects { buildscript { … } }` — a cross-project configuration IP rejects
# ("Project ':' cannot access 'Project.buildscript' … via 'allprojects'"). The
# Tooling API daemon honours whatever a project's gradle.properties sets, so
# putting `org.gradle.unsafe.isolated-projects=true` here (or in a consumer's
# build) breaks every tooling-driven run, not just CI. Plain configuration cache
# (above) stays on and is enough to keep our config-time code lazy.
#
# Plugin code is still kept IP-CLEAN and that's verified per-invocation: the
# functional tests that self-enable IP in their synthetic projects
# (AppliedMarkerFunctionalTest, CrossProjectMetadataFunctionalTest) are the gate.
# And the plugin + init script WARN if IP is ever turned on, so re-adding it
# (here or downstream) is loud rather than silent. Do not re-enable it globally.

android.useAndroidX=true

# Workaround for Gradle 9 and Kotlin plugin compatibility issue, should be removed when fixed and won't be supported in Gradle 10
org.gradle.configuration-cache.unsafe.ignore.unsupported-build-events-listeners=true

# Compose Multiplatform auto-applies a hot-reload sub-plugin that breaks the
# configuration cache (it accesses :renderer-desktop / :samples:cmp's layout
# from the root project at configuration time — a cross-project read that also
# trips `configuration-cache.problems=fail`). We don't use hot reload, so
# disable it.
org.jetbrains.compose.hot.reload.disable=true

# The RELEASED preview-runtime version published previews pin to. When design-artifacts builds the
# published catalog bundle (it sets the gate `composeaiUseReleasedRuntimes=true`),
# `:samples:design-catalog-m3` swaps its `:data-preview-overrides-runtime` / `:slot-preview-runtime`
# project deps for `ee.schimke.composeai:*:<this version>` so `bundle pack` records small Maven
# coordinates instead of inlining ~80 KB of runtime jars. Release-please bumps this on every release
# (see release-please-config.json extra-files), so the published previews always target the current
# release's runtimes — a new runtime API must ship in a release before a published preview can use
# it (the released preview server couldn't act on an unreleased one anyway). Normal builds leave the
# gate unset and keep the `project(...)` deps, so local dev + CI still compile against HEAD.
# x-release-please-start-version
composeaiReleasedRuntimeVersion=1.14.1
# x-release-please-end

# Fail this repo's own renders when a module lands on the render/daemon JVM classpath at more than
# one version (see `RenderClasspathDuplicates`). Consumers get `warn` by default — an existing
# duplicate shouldn't break their build on a plugin upgrade — but the samples here are exactly
# where a regression in the single-graph classpath construction would first show up, so they gate
# on it. Override per-invocation with `-PcomposePreview.classpathDuplicates=warn` (or `off`).
composePreview.classpathDuplicates=fail

# Render this repo's own catalogs with the Compose runtime's rewritten SlotTable — the "link
# buffer" composer (`ComposeRuntimeFlags.isLinkBufferComposerEnabled`, see
# docs/LINK_BUFFER_COMPOSER.md). Consumers keep the plugin's OFF default, and that asymmetry is
# deliberate in both directions.
#
# On for us: the runtime team asked for correctness feedback ahead of making the new composer the
# default and removing the flag, and a repo whose whole output is committed, diffable renders is
# the cheapest place to give it. Rendering everything here through the new composer means every
# catalog render, every visual-diff bot comment and every delivery-branch regeneration is a
# continuous A/B rather than a one-off experiment someone has to remember to re-run.
#
# Off for consumers: `isLinkBufferComposerEnabled` only exists from Compose **1.11.0** (1.9.5 /
# 1.10.x ship the `ComposeRuntimeFlags` class WITHOUT the field), while the published renderer's
# compat floor is `compose-bom-compat`, so a consumer-facing default-on would change behaviour for
# every project that never asked for it.
#
# `auto`, not `true`, because ONE repo-wide value spans modules on different Compose versions.
# Ours are mostly 1.11.4 (Android) / 1.11.2 (desktop) — but `:samples:sdk-matrix` pins
# `compose-bom-compat` on purpose, to keep the renderer's own compat floor exercised, and `true`
# means "fail any render whose runtime lacks the flag". A repo-wide `true` therefore made a module
# doing its job look like a broken build: every `:samples:sdk-matrix:composePreviewRender` died,
# taking the `preview-baselines` compose pipeline and every `sdk-matrix.yml` cell with it. `auto`
# enables the new composer wherever the runtime has it and renders on the old one where it doesn't,
# announcing which it did — so the A/B still covers everything that can be A/B'd, and the modules
# that can't say so in the render log instead of failing.
#
# Use `-PcomposePreview.linkBufferComposer=true` when the new composer is the POINT of the run and
# a module silently sitting it out would invalidate the answer; `false` turns it off entirely.
composePreview.linkBufferComposer=auto
